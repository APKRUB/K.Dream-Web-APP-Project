<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เข้าสู่ระบบระบบการเรียนการสอน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc', darkbg: '#0f172a', darkbox: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-card { background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(51, 65, 85, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Login Container Card -->
    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-xl relative overflow-hidden">
        
        <!-- Decoration Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-400/20 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary text-white rounded-2xl flex items-center justify-center text-3xl font-bold mx-auto mb-4 shadow-lg shadow-blue-500/30">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">LMS Online Platform</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">เข้าสู่ระบบเพื่อเริ่มทำข้อสอบและเรียนรู้</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">อีเมล (Email)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" required placeholder="name@school.ac.th" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none transition-all text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none transition-all text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-blue-800 text-white py-3.5 rounded-xl font-bold text-base transition-all shadow-lg shadow-blue-600/20 hover:shadow-blue-600/40 transform hover:-translate-y-0.5">
                เข้าสู่ระบบ <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-400">
            ระบบบริหารจัดการการเรียนการสอนออนไลน์ &copy; 2026
        </div>
    </div>

    <!-- Theme Toggle Floating Button -->
    <button id="themeToggle" class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-white dark:bg-darkbox shadow-lg border border-gray-200 dark:border-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:scale-110 transition-transform">
        <i class="fas fa-moon text-lg" id="themeIcon"></i>
    </button>

    <script>
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            Swal.fire({ title: 'กำลังตรวจสอบข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { data, error } = await mySupabase.auth.signInWithPassword({ email, password });
            if (error) {
                Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' });
                return;
            }

            const userId = data.user.id;
            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', userId).single();
            Swal.close();

            // บันทึกข้อมูลไอดีและโปรไฟล์ลง localStorage ให้ครบทุกคีย์ที่หน้า student.html และ exam_take.html ใช้งาน
            localStorage.setItem('id', userId);
            localStorage.setItem('student_id', userId);
            localStorage.setItem('user_id', userId);
            localStorage.setItem('student_username', profile?.full_name || profile?.username || email.split('@')[0]);
            localStorage.setItem('full_name', profile?.full_name || profile?.username || email.split('@')[0]);
            localStorage.setItem('profile', JSON.stringify(profile || {}));

            if (profile && ['admin', 'teacher', 'exam_creator'].includes(profile.role)) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
