<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ | LMS</title>
    <!-- โหลด Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="อีเมล" required><br><br>
        <input type="password" id="password" placeholder="รหัสผ่าน" required><br><br>
        <button type="button" id="loginBtn">Log In</button>
    </form>
    <p id="errorMsg" style="color: red;"></p>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        
        // 🚨 เปลี่ยนชื่อตัวแปรเป็น mySupabase เพื่อหนี Error การตั้งชื่อซ้ำ
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!email || !password) {
                errorMsg.textContent = "กรุณากรอกอีเมลและรหัสผ่านให้ครบ";
                return;
            }
            
            errorMsg.textContent = "กำลังตรวจสอบ...";

            // ใช้ mySupabase ในการล็อกอิน
            const { data: authData, error: authError } = await mySupabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (authError) {
                errorMsg.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
                return;
            }

            // ใช้ mySupabase ดึงฐานข้อมูล
            const userId = authData.user.id;
            const { data: profileData, error: profileError } = await mySupabase
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            if (profileError || !profileData) {
                errorMsg.textContent = "ล็อกอินผ่านแล้ว แต่ไม่พบข้อมูล Profile ของคุณในระบบ";
                return;
            }

            const role = profileData.role;
            if (role === 'admin' || role === 'teacher' || role === 'exam_creator') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        });
    </script>
</body>
</html>
