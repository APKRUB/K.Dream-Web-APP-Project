<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์รวมชุดข้อสอบสำหรับนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#2563eb', darkbg: '#0f172a' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.98); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-extrabold text-xl flex items-center gap-2"><i class="fas fa-book-open text-primary"></i> ชุดข้อสอบของฉัน</h1>
            </div>

            <!-- Notification Bell นักเรียน -->
            <div class="relative">
                <button onclick="toggleNotif()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border relative">
                    <i class="fas fa-bell"></i>
                    <span id="studNotifBadge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center">0</span>
                </button>
                <div id="studNotifDropdown" class="hidden absolute right-0 mt-3 w-80 bg-white dark:bg-slate-800 border rounded-2xl shadow-2xl z-50 p-3 max-h-64 overflow-y-auto"></div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 pb-20 space-y-8">
        
        <!-- แท็บสลับ: ยังไม่ได้ทำ / ทำเสร็จแล้ว -->
        <div class="flex justify-center">
            <div class="bg-slate-200 dark:bg-slate-800 p-1.5 rounded-2xl flex gap-2">
                <button id="tabPendingBtn" onclick="switchStudentTab('pending')" class="px-6 py-2.5 rounded-xl font-bold text-xs bg-white dark:bg-slate-700 text-primary shadow-sm"><i class="fas fa-edit mr-1"></i> ข้อสอบที่ยังไม่ได้ทำ</button>
                <button id="tabCompletedBtn" onclick="switchStudentTab('completed')" class="px-6 py-2.5 rounded-xl font-bold text-xs text-slate-500 hover:text-primary"><i class="fas fa-check-circle mr-1"></i> ข้อสอบที่ทำเสร็จแล้ว</button>
            </div>
        </div>

        <div id="studentExamsContainer"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeTab = 'pending';
        let allExams = [];
        let completedAttemptExamIds = [];

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (session) {
                const { data: attempts } = await mySupabase.from('exam_attempts').select('exam_id').eq('student_id', session.user.id).eq('status', 'submitted');
                completedAttemptExamIds = (attempts || []).map(a => a.exam_id);
            }

            const { data: exams } = await mySupabase.from('exams').select('*, exam_categories(name), exam_questions(id)').eq('status', 'public');
            allExams = exams || [];
            renderStudentExams();
        }

        function switchStudentTab(tab) {
            activeTab = tab;
            if (tab === 'pending') {
                document.getElementById('tabPendingBtn').className = "px-6 py-2.5 rounded-xl font-bold text-xs bg-white dark:bg-slate-700 text-primary shadow-sm";
                document.getElementById('tabCompletedBtn').className = "px-6 py-2.5 rounded-xl font-bold text-xs text-slate-500 hover:text-primary";
            } else {
                document.getElementById('tabCompletedBtn').className = "px-6 py-2.5 rounded-xl font-bold text-xs bg-white dark:bg-slate-700 text-primary shadow-sm";
                document.getElementById('tabPendingBtn').className = "px-6 py-2.5 rounded-xl font-bold text-xs text-slate-500 hover:text-primary";
            }
            renderStudentExams();
        }

        function renderStudentExams() {
            const container = document.getElementById('studentExamsContainer');
            const isCompletedMode = activeTab === 'completed';

            const filtered = allExams.filter(e => isCompletedMode ? completedAttemptExamIds.includes(e.id) : !completedAttemptExamIds.includes(e.id));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400 text-sm">ไม่มีรายการข้อสอบในหมวดนี้</div>`;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${filtered.map(e => `
                <div class="glossy-card p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                    <div>
                        <div class="text-[10px] font-bold text-indigo-500 uppercase tracking-wider mb-1">${e.exam_categories?.name || 'ทั่วไป'}</div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white mb-3">${e.title}</h4>

                        <!-- 3 ข้อมูลสำคัญที่ครูกรอกแล้วนักเรียนเห็นทันที -->
                        <div class="grid grid-cols-3 gap-2 p-3 bg-slate-50 dark:bg-slate-800 rounded-2xl text-center text-[11px] mb-4 border border-slate-200 dark:border-slate-700">
                            <div><div class="text-slate-400">จำนวน</div><div class="font-bold text-primary">${e.exam_questions?.length || 0} ข้อ</div></div>
                            <div><div class="text-slate-400">เวลา</div><div class="font-bold text-emerald-600">${e.time_limit} นาที</div></div>
                            <div><div class="text-slate-400">กำหนดส่ง</div><div class="font-bold text-amber-600 truncate">${e.end_time ? new Date(e.end_time).toLocaleDateString('th-TH') : 'ไม่มี'}</div></div>
                        </div>
                    </div>

                    <button onclick="window.location.href='${isCompletedMode ? `exam_result.html?exam_id=${e.id}` : `exam_take.html?id=${e.id}`}'" class="w-full py-3 ${isCompletedMode ? 'bg-slate-200 text-slate-800' : 'bg-primary text-white'} font-bold text-xs rounded-xl shadow-md">
                        ${isCompletedMode ? 'ดูผลสอบ & AI วิเคราะห์' : 'เริ่มทำข้อสอบ'}
                    </button>
                </div>
            `).join('')}</div>`;
        }

        initPage();
    </script>
</body>
</html>
