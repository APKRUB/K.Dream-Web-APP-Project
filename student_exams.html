<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | คลังชุดข้อสอบนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', navy: '#0f172a', darkbg: '#090d16' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='student.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border text-slate-700 dark:text-slate-200"><i class="fas fa-arrow-left"></i></button>
                <h1 class="font-extrabold text-xl text-slate-900 dark:text-white">คลังข้อสอบทั้งหมด</h1>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="openBookingConsultModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xs shadow-md">
                    <i class="fas fa-comments mr-1"></i> จองคิว Consult
                </button>
                <button onclick="logoutStudent()" class="px-4 py-2.5 bg-red-50 text-red-600 rounded-2xl font-bold text-xs border border-red-200">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 pb-20 space-y-8">
        
        <div id="studentExamsFullContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ฟังก์ชันตรวจสิทธิ์การเข้าใช้งาน (Security Guard)
function checkStudentAuth() {
    // เช็กทุกความเป็นไปได้ที่หน้า Login อาจจะบันทึกไว้
    const studentId = localStorage.getItem('student_id') || 
                      localStorage.getItem('user_id') || 
                      localStorage.getItem('user') || 
                      localStorage.getItem('id') ||
                      localStorage.getItem('userId');

    const studentName = localStorage.getItem('full_name') || 
                        localStorage.getItem('user_name') || 
                        localStorage.getItem('name') || 
                        localStorage.getItem('username');

    // [สำหรับดีบุก] ช่วยปริ้นช้อนดูว่าใน localStorage มีอะไรบ้างตอนที่รัน
    console.log("Current localStorage keys:", {
        studentId: studentId,
        studentName: studentName,
        allStorage: {...localStorage}
    });

    // ถ้าไม่มีข้อมูลเลยสักอัน ค่อยเด้งกลับหน้า Login
    if (!studentId && !studentName) {
        Swal.fire({
            icon: 'error',
            title: 'ยังไม่ได้เข้าสู่ระบบ',
            text: 'กรุณาเข้าสู่ระบบก่อนใช้งานหน้านี้',
            confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
            allowOutsideClick: false
        }).then(() => {
            window.location.href = 'index.html'; 
        });
        return false;
    }
    
    return true;
}
        
        async function initPage() {
            if (!checkStudentAuth()) return;
            const { data: exams } = await mySupabase.from('exams').select('*').eq('status', 'public').order('created_at', { ascending: false });
            document.getElementById('studentExamsFullContainer').innerHTML = (exams || []).map(e => `
                <div class="glossy-card p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                    <div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white mb-2">${e.title}</h4>
                        <div class="text-xs text-slate-500 space-y-1 mb-4">
                            <div><i class="far fa-clock text-sky-600"></i> เวลาทำสอบ: ${e.time_limit} นาที</div>
                            <div><i class="fas fa-calendar-alt text-indigo-500"></i> กำหนดส่ง: ${e.end_time ? new Date(e.end_time).toLocaleString('th-TH') : 'ไม่มี'}</div>
                        </div>
                    </div>
                    <button onclick="window.location.href='exam_take.html?id=${e.id}'" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-md">เริ่มทำข้อสอบ</button>
                </div>
            `).join('');
        }

        async function logoutStudent() {
            await mySupabase.auth.signOut();
            window.location.href = 'index.html';
        }

        initPage();
    </script>
</body>
</html>
