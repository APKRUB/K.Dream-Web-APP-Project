<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ระบบจัดการหลังบ้าน (Admin)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#4f46e5', secondary: '#ec4899' } } }
        }
    </script>
    <style>
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-nav { background: rgba(17, 24, 39, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-gray-800 dark:bg-white text-white dark:text-gray-800 rounded-lg"><i class="fas fa-shield-alt"></i></div>
                    <span class="font-semibold text-xl dark:text-white">Admin Panel</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="welcomeMsg" class="hidden sm:block text-gray-600 dark:text-gray-300">กำลังโหลด...</span>
                    <button id="themeToggle" class="text-gray-500 dark:text-gray-300 hover:text-primary transition-colors"><i class="fas fa-moon text-xl" id="themeIcon"></i></button>
                    <button id="logoutBtn" class="bg-gray-800 dark:bg-gray-700 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition-colors shadow-sm"><i class="fas fa-sign-out-alt mr-2"></i>ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        <div class="mb-8 border-b border-gray-200 dark:border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">ศูนย์ควบคุมระบบ (Dashboard)</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">จัดการข้อสอบ ตรวจคำตอบ และติดตามพฤติกรรมนักเรียน</p>
        </div>

        <!-- เมนูหลัก (Grid) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <!-- เมนู 1 -->
            <div onclick="window.location.href='admin_upload.html'" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-lg hover:border-primary transition-all cursor-pointer group">
                <div class="w-14 h-14 bg-indigo-50 dark:bg-indigo-900/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-plus-circle text-2xl text-primary"></i>
                </div>
                <h3 class="font-semibold text-lg text-gray-800 dark:text-white">สร้างชุดข้อสอบ</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">อัปโหลด PDF หรือสร้างโจทย์เอง</p>
            </div>

            <!-- เมนู 2 -->
            <div onclick="devAlert('ระบบตรวจข้อสอบอัตนัย')" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-lg hover:border-pink-500 transition-all cursor-pointer group">
                <div class="w-14 h-14 bg-pink-50 dark:bg-pink-900/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-tasks text-2xl text-pink-500"></i>
                </div>
                <h3 class="font-semibold text-lg text-gray-800 dark:text-white">ตรวจข้อสอบอัตนัย</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">ให้คะแนนข้อที่ต้องตรวจด้วยตนเอง</p>
            </div>

            <!-- เมนู 3 -->
            <div onclick="devAlert('ระบบจัดการนักเรียน')" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-lg hover:border-green-500 transition-all cursor-pointer group">
                <div class="w-14 h-14 bg-green-50 dark:bg-green-900/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-users text-2xl text-green-500"></i>
                </div>
                <h3 class="font-semibold text-lg text-gray-800 dark:text-white">จัดการนักเรียน</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">ดูคะแนนและจัดการรหัสผ่าน</p>
            </div>

            <!-- เมนู 4 -->
            <div onclick="devAlert('ระบบ Audit Log')" class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-lg hover:border-red-500 transition-all cursor-pointer group">
                <div class="w-14 h-14 bg-red-50 dark:bg-red-900/50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                    <i class="fas fa-exclamation-triangle text-2xl text-red-500"></i>
                </div>
                <h3 class="font-semibold text-lg text-gray-800 dark:text-white">Audit Log (กันโกง)</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">ตรวจสอบประวัติการสลับแท็บ/ทุจริต</p>
            </div>

        </div>
    </main>

    <script>
        // ระบบ Theme
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // ระบบ Supabase
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const allowedRoles = ['admin', 'teacher', 'exam_creator'];

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await mySupabase.from('profiles').select('full_name, role').eq('id', session.user.id).single();
            if (!profile || !allowedRoles.includes(profile.role)) { 
                window.location.href = 'student.html'; 
                return; 
            }

            // แสดงชื่อและ Badge สิทธิ์ (เช่น Admin สีแดง, Teacher สีฟ้า)
            let roleBadge = '';
            if(profile.role === 'admin') roleBadge = '<span class="ml-2 text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">Admin</span>';
            else roleBadge = '<span class="ml-2 text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded">Teacher</span>';
            
            document.getElementById('welcomeMsg').innerHTML = `คุณ: <span class="font-semibold text-gray-800 dark:text-white">${profile.full_name || 'ผู้ดูแลระบบ'}</span> ${roleBadge}`;
        }

        // ปุ่มออกจากระบบ
        document.getElementById('logoutBtn').addEventListener('click', () => {
            Swal.fire({
                title: 'ออกจากระบบ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#1f2937',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'ออกจากระบบ',
                cancelButtonText: 'ยกเลิก',
                background: htmlElement.classList.contains('dark') ? '#1f2937' : '#ffffff',
                color: htmlElement.classList.contains('dark') ? '#ffffff' : '#545454'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await mySupabase.auth.signOut();
                    window.location.href = 'index.html';
                }
            });
        });

        // ฟังก์ชันจำลองคลิกปุ่มที่ยังไม่ได้ทำ (เด้ง Pop-up บอกว่ากำลังพัฒนา)
        function devAlert(featureName) {
            Swal.fire({
                icon: 'info',
                title: 'กำลังพัฒนา',
                text: `${featureName} จะถูกเพิ่มเข้ามาในเฟสถัดไปครับ!`,
                confirmButtonColor: '#4f46e5',
                background: htmlElement.classList.contains('dark') ? '#1f2937' : '#ffffff',
                color: htmlElement.classList.contains('dark') ? '#ffffff' : '#545454'
            });
        }

        initPage();
    </script>
</body>
</html>
