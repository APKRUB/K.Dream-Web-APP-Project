<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | แผงควบคุมผู้ดูแลระบบ</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.98); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-lg shadow-md"><i class="fas fa-shield-alt"></i></span>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white">Admin Dashboard</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">ระบบบริหารจัดการภาพรวมห้องเรียนออนไลน์</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                    <button onclick="logout()" class="px-4 py-2.5 bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-300 rounded-2xl font-bold text-xs hover:bg-red-100 transition-all"><i class="fas fa-sign-out-alt mr-1"></i> ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- Quick Action Cards (ลบปุ่มตรวจอัตนัยออกเรียบร้อย) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div onclick="window.location.href='admin_exams.html'" class="glossy-card p-6 rounded-3xl cursor-pointer hover:scale-[1.02] transition-all flex items-center gap-4">
                <span class="w-14 h-14 rounded-2xl bg-blue-100 text-primary dark:bg-blue-950 dark:text-blue-300 flex items-center justify-center text-2xl font-bold shadow-sm"><i class="fas fa-file-signature"></i></span>
                <div>
                    <h3 class="font-extrabold text-base text-slate-900 dark:text-white">ศูนย์จัดการชุดข้อสอบ</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง แก้ไข ตั้งเวลาเปิด และคลังโจทย์</p>
                </div>
            </div>

            <div onclick="window.location.href='student_exams.html'" class="glossy-card p-6 rounded-3xl cursor-pointer hover:scale-[1.02] transition-all flex items-center gap-4">
                <span class="w-14 h-14 rounded-2xl bg-emerald-100 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-300 flex items-center justify-center text-2xl font-bold shadow-sm"><i class="fas fa-user-graduate"></i></span>
                <div>
                    <h3 class="font-extrabold text-base text-slate-900 dark:text-white">มุมมองฝั่งนักเรียน</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">ทดสอบเข้าทำสอบในฐานะนักเรียน</p>
                </div>
            </div>

            <div onclick="Swal.fire('กำลังพัฒนานวัตกรรม', 'ระบบวิเคราะห์สถิติภาพรวมผู้เรียน', 'info')" class="glossy-card p-6 rounded-3xl cursor-pointer hover:scale-[1.02] transition-all flex items-center gap-4">
                <span class="w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-300 flex items-center justify-center text-2xl font-bold shadow-sm"><i class="fas fa-chart-pie"></i></span>
                <div>
                    <h3 class="font-extrabold text-base text-slate-900 dark:text-white">สถิติภาพรวมการเรียน</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">รายงานผลคะแนนนักเรียนรายห้อง</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function logout() {
            await mySupabase.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
