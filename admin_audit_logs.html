<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ประวัติการทำงานระบบ (Audit Logs)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-16">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-history"></i></span>
                        Audit Logs (ประวัติกิจกรรมระบบ)
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <div class="hitech-card p-5 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-4 border-l-cyan-500">
            <div>
                <h2 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fas fa-filter text-cyan-500"></i> กรองและค้นหา Audit Logs
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">ตรวจสอบประวัติการแก้ไข การสร้าง และกิจกรรมทั้งหมดในระบบจากฐานข้อมูลแบบเรียลไทม์</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto shrink-0">
                <div class="relative flex-1 md:w-64">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="logSearchInput" oninput="renderLogsTable()" placeholder="ค้นหาการกระทำ / ผู้ใช้งาน..." class="w-full pl-9 pr-3 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs outline-none focus:border-cyan-500">
                </div>

                <select id="actionTypeFilter" onchange="renderLogsTable()" class="px-3 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl font-bold text-xs text-cyan-600 dark:text-cyan-400 outline-none">
                    <option value="ALL">ทุก Action</option>
                    <option value="CREATE">CREATE (สร้าง)</option>
                    <option value="UPDATE">UPDATE (แก้ไข)</option>
                    <option value="DELETE">DELETE (ลบ)</option>
                    <option value="UPLOAD">UPLOAD (อัปโหลด)</option>
                </select>

                <button onclick="confirmClearAllLogs()" class="px-3.5 py-2 bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900 rounded-xl font-bold text-xs hover:bg-rose-100 transition-all flex items-center gap-1.5 shrink-0">
                    <i class="fas fa-trash-can"></i> ล้างประวัติทั้งหมด
                </button>
            </div>
        </div>

        <div class="hitech-card p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-sky-500/20 pb-2">
                <h3 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fas fa-list-ol text-cyan-500"></i> รายการกิจกรรมระบบในฐานข้อมูล
                </h3>
                <span id="logCountBadge" class="text-xs text-slate-400 font-bold">0 รายการ</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 font-bold border-b border-slate-200 dark:border-slate-700">
                            <th class="p-3">วันเวลา</th>
                            <th class="p-3 text-center">ประเภท</th>
                            <th class="p-3">โมดูล</th>
                            <th class="p-3">รายละเอียดการกระทำ</th>
                            <th class="p-3">ผู้ดำเนินการ</th>
                        </tr>
                    </thead>
                    <tbody id="auditLogsTableBody" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <tr><td colspan="5" class="text-center py-8 text-slate-400">กำลังโหลดประวัติกิจกรรม...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cachedLogs = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

// ฟังก์ชันตรวจสิทธิ์การเข้าใช้งาน (Security Guard)
function checkStudentAuth() {
    const studentId = localStorage.getItem('student_id') || localStorage.getItem('user_id');
    const studentName = localStorage.getItem('full_name') || localStorage.getItem('user_name');

    // ถ้าไม่มีข้อมูลการ Login ในระบบ ให้ดีดกลับหน้าแรกทันที
    if (!studentId || !studentName) {
        Swal.fire({
            icon: 'error',
            title: 'ยังไม่ได้เข้าสู่ระบบ',
            text: 'กรุณาเข้าสู่ระบบก่อนใช้งานหน้านี้',
            confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
            allowOutsideClick: false
        }).then(() => {
            window.location.href = 'index.html'; // หรือเปลี่ยนเป็นหน้า Login ของคุณ AP
        });
        return false;
    }
    return true;
}
        
        async function initPage() {
            await fetchAuditLogs();
        }

        async function fetchAuditLogs() {
            const { data } = await mySupabase.from('audit_logs').select('*').order('created_at', { ascending: false });
            cachedLogs = data || [];
            renderLogsTable();
        }

        function renderLogsTable() {
            const tbody = document.getElementById('auditLogsTableBody');
            const query = document.getElementById('logSearchInput').value.trim().toLowerCase();
            const actionFilter = document.getElementById('actionTypeFilter').value;

            const filtered = cachedLogs.filter(log => {
                const matchAction = actionFilter === 'ALL' || log.action_type === actionFilter;
                const matchText = (log.description || '').toLowerCase().includes(query) || (log.user_name || '').toLowerCase().includes(query) || (log.module || '').toLowerCase().includes(query);
                return matchAction && matchText;
            });

            document.getElementById('logCountBadge').textContent = `${filtered.length} รายการ`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">ยังไม่มีประวัติกิจกรรมในระบบ</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(log => {
                let badge = '';
                if (log.action_type === 'CREATE') badge = '<span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-600 font-bold text-[10px]">CREATE</span>';
                else if (log.action_type === 'UPDATE') badge = '<span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-600 font-bold text-[10px]">UPDATE</span>';
                else if (log.action_type === 'DELETE') badge = '<span class="px-2 py-0.5 rounded bg-rose-100 dark:bg-rose-950 text-rose-600 font-bold text-[10px]">DELETE</span>';
                else badge = '<span class="px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-950 text-purple-600 font-bold text-[10px]">UPLOAD</span>';

                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                        <td class="p-3 font-mono text-[11px] text-slate-500">${new Date(log.created_at).toLocaleString('th-TH')}</td>
                        <td class="p-3 text-center">${badge}</td>
                        <td class="p-3 font-bold text-slate-800 dark:text-slate-200">${log.module || 'ทั่วไป'}</td>
                        <td class="p-3 font-medium text-slate-700 dark:text-slate-300">${log.description}</td>
                        <td class="p-3 font-bold text-sky-600 dark:text-sky-400">${log.user_name || 'AP'}</td>
                    </tr>
                `;
            }).join('');
        }

        async function confirmClearAllLogs() {
            const res = await Swal.fire({
                title: 'ยืนยันล้างประวัติ Audit Logs ทั้งหมด?',
                text: 'ประวัติกิจกรรมทั้งหมดจะถูกลบออกจากฐานข้อมูล Supabase',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ล้างข้อมูลทั้งหมด',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                Swal.fire({ title: 'กำลังล้างข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await mySupabase.from('audit_logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                await fetchAuditLogs();
                Swal.fire({ icon: 'success', title: 'ล้างประวัติเรียบร้อยแล้ว!', timer: 1200, showConfirmButton: false });
            }
        }

        initPage();
    </script>
</body>
</html>
