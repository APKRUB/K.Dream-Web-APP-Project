<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ตรวจข้อสอบอัตนัย</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b', darkinput: '#334155' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.98); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin_exams.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all text-slate-700 dark:text-slate-200"><i class="fas fa-arrow-left text-lg"></i></button>
                    <div>
                        <h1 id="examTitleHeader" class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-purple-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-user-check"></i></span>
                            ศูนย์ตรวจข้อสอบอัตนัย
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">ตรวจให้คะแนนคำตอบเขียนตอบและให้คอมเมนต์รายบุคคล</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-6">
        
        <div class="glossy-card p-6 rounded-3xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-4">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2"><i class="fas fa-users text-purple-600"></i> รายชื่อนักเรียนที่ส่งข้อสอบอัตนัย</h3>
                <div class="text-xs text-slate-400" id="submissionCount">กำลังโหลด...</div>
            </div>

            <div id="attemptsGradingContainer" class="space-y-6">
                <div class="text-center py-12 text-slate-400 text-sm">กำลังโหลดข้อมูลการส่งสอบ...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('exam_id');

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            if (!examId) { window.location.href = 'admin_exams.html'; return; }
            
            const { data: exam } = await mySupabase.from('exams').select('title, code').eq('id', examId).single();
            if (exam) {
                document.getElementById('examTitleHeader').innerHTML = `<span class="w-8 h-8 rounded-xl bg-purple-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-user-check"></i></span> ตรวจข้อสอบ: ${exam.title}`;
            }

            loadSubmissions();
        }

        async function loadSubmissions() {
            const { data: attempts } = await mySupabase.from('exam_attempts').select('*, profiles(full_name)').eq('exam_id', examId).eq('status', 'submitted').order('submit_time', { ascending: false });
            const { data: questions } = await mySupabase.from('exam_questions').select('*').eq('exam_id', examId).eq('question_type', 'subjective');

            const container = document.getElementById('attemptsGradingContainer');

            if (!attempts || attempts.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">ยังไม่มีนักเรียนส่งข้อสอบชุดนี้</div>`;
                document.getElementById('submissionCount').textContent = '0 การส่งสอบ';
                return;
            }

            document.getElementById('submissionCount').textContent = `ส่งสอบแล้ว ${attempts.length} คน`;

            if (!questions || questions.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">ข้อสอบชุดนี้ไม่มีข้อสอบประเภทอัตนัย</div>`;
                return;
            }

            let html = '';
            for (const att of attempts) {
                const { data: answers } = await mySupabase.from('exam_answers').select('*').eq('attempt_id', att.id);

                let subQuestionsHtml = questions.map(q => {
                    const ans = (answers || []).find(a => a.question_id === q.id) || {};
                    return `
                        <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                            <div class="flex justify-between items-start">
                                <span class="font-bold text-xs text-slate-900 dark:text-white">ข้อ ${q.question_number}. ${q.question_text || '(ข้อสอบ PDF)'}</span>
                                <span class="text-xs text-amber-500 font-bold">เต็ม ${q.points} คะแนน</span>
                            </div>
                            
                            <div class="p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs space-y-1">
                                <div class="font-bold text-slate-400 text-[10px]">คำตอบของนักเรียน:</div>
                                <div class="text-slate-900 dark:text-slate-100 font-medium whitespace-pre-wrap">${ans.subjective_answer || '<span class="italic text-slate-400">(ไม่ได้พิมพ์ตอบ)</span>'}</div>
                            </div>

                            ${q.acceptable_keywords ? `<div class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold">เฉลย/คีย์เวิร์ด: ${q.acceptable_keywords}</div>` : ''}

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                <div>
                                    <label class="block font-bold text-[11px] text-slate-700 dark:text-slate-300 mb-1">คะแนนที่ให้</label>
                                    <input type="number" step="0.5" max="${q.points}" id="score_${att.id}_${q.id}" value="${ans.score !== undefined && ans.score !== null ? ans.score : 0}" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-xs text-slate-900 dark:text-slate-100 font-bold">
                                </div>
                                <div>
                                    <label class="block font-bold text-[11px] text-slate-700 dark:text-slate-300 mb-1">ข้อเสนอแนะ/คอมเมนต์</label>
                                    <input type="text" id="comment_${att.id}_${q.id}" value="${ans.teacher_comment || ''}" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-xs text-slate-900 dark:text-slate-100" placeholder="ความคิดเห็นถึงนักเรียน...">
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                html += `
                    <div class="p-6 bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 space-y-4 shadow-sm">
                        <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-700">
                            <div>
                                <h4 class="font-bold text-sm text-slate-900 dark:text-white"><i class="fas fa-user-circle mr-1.5 text-primary"></i> ${att.profiles?.full_name || 'นักเรียน'}</h4>
                                <div class="text-[11px] text-slate-400">ส่งเมื่อ: ${new Date(att.submit_time).toLocaleString('th-TH')} | คะแนนรวมปัจจุบัน: <span class="font-bold text-emerald-600">${att.score}</span> / ${att.max_score}</div>
                            </div>
                            <button onclick="saveStudentGrade('${att.id}', '${encodeURIComponent(JSON.stringify(questions))}')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all"><i class="fas fa-save mr-1"></i> บันทึกผลการตรวจ</button>
                        </div>

                        <div class="space-y-3">${subQuestionsHtml}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        async function saveStudentGrade(attemptId, encodedQuestions) {
            Swal.fire({ title: 'กำลังบันทึกคะแนน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const questions = JSON.parse(decodeURIComponent(encodedQuestions));

            for (const q of questions) {
                const scoreVal = parseFloat(document.getElementById(`score_${attemptId}_${q.id}`).value) || 0;
                const commentVal = document.getElementById(`comment_${attemptId}_${q.id}`).value;

                await mySupabase.from('exam_answers').update({
                    score: scoreVal,
                    teacher_comment: commentVal
                }).eq('attempt_id', attemptId).eq('question_id', q.id);
            }

            // คำนวณคะแนนรวมใหม่ทั้งหมด
            const { data: allAnswers } = await mySupabase.from('exam_answers').select('*, exam_questions(points, question_type, correct_option_index)').eq('attempt_id', attemptId);
            let totalScore = 0;

            (allAnswers || []).forEach(a => {
                if (a.exam_questions?.question_type === 'mcq') {
                    if (a.selected_option_index === a.exam_questions.correct_option_index) {
                        totalScore += a.exam_questions.points || 0;
                    }
                } else {
                    totalScore += a.score || 0;
                }
            });

            await mySupabase.from('exam_attempts').update({ score: totalScore }).eq('id', attemptId);
            Swal.fire({ icon: 'success', title: 'บันทึกคะแนนเรียบร้อย!', timer: 1200, showConfirmButton: false });
            loadSubmissions();
        }

        initPage();
    </script>
</body>
</html>
