<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ผลการสอบและเฉลยข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        
        .result-bubble {
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 11px; border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155;
        }
        .dark .result-bubble { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .result-bubble.student-choice {
            border-color: #0284c7 !important; color: #0284c7 !important; background-color: rgba(2, 132, 199, 0.1);
        }
        .result-bubble.correct-choice {
            background-color: #10b981 !important; color: #ffffff !important; border-color: #10b981 !important;
        }
        .result-bubble.wrong-choice {
            background-color: #ef4444 !important; color: #ffffff !important; border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-20">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='student.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                    <i class="fas fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white" id="resultTitleNav">ผลการสอบออนไลน์</h1>
                    <p class="text-[11px] text-slate-500">ระบบประเมินผลสัมฤทธิ์อัตโนมัติ Hi-Tech</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 shadow-sm">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pt-24 space-y-6">
        
        <!-- ส่วนสรุปคะแนนรวม -->
        <div class="hitech-card p-6 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6 bg-gradient-to-r from-sky-500/10 via-teal-500/5 to-transparent border-sky-500/20">
            <div class="space-y-1 text-center md:text-left">
                <span class="px-3 py-1 bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-xs rounded-full border border-sky-500/20">สถานะ: ส่งคำตอบเรียบร้อยแล้ว</span>
                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white pt-2" id="examTitleHeader">กำลังโหลดชื่อชุดข้อสอบ...</h2>
                <p class="text-xs text-slate-500" id="submissionTimeText">เวลาที่ส่งข้อสอบ: --</p>
            </div>
            <div class="flex items-center gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border shadow-sm">
                <div class="text-center px-4 border-r border-slate-200 dark:border-slate-800">
                    <span class="text-[11px] text-slate-400 block font-semibold">คะแนนที่ได้</span>
                    <span class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400" id="scoreDisplay">--</span>
                </div>
                <div class="text-center px-2">
                    <span class="text-[11px] text-slate-400 block font-semibold">เต็มทั้งหมด</span>
                    <span class="text-2xl font-extrabold text-slate-700 dark:text-slate-200" id="totalScoreDisplay">--</span>
                </div>
            </div>
        </div>

        <!-- รายละเอียดข้อสอบและเฉลย -->
        <div class="space-y-4">
            <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200 flex items-center gap-2">
                <i class="fas fa-clipboard-check text-sky-500"></i> รายละเอียดการตอบและเฉลยรายข้อ
            </h3>
            
            <div id="resultsContainer" class="space-y-4">
                <div class="text-center py-12 text-slate-400 text-xs">กำลังประมวลผลข้อมูลเฉลย...</div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id');

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initResultPage() {
            if (!attemptId) {
                Swal.fire('ไม่พบรหัสผลการสอบ (Attempt ID)', '', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            // 1. ดึงข้อมูล Attempt ของนักเรียน
            const { data: attempt, error: attErr } = await mySupabase
                .from('exam_attempts')
                .select('*')
                .eq('id', attemptId)
                .single();

            if (attErr || !attempt) {
                Swal.fire('ไม่พบข้อมูลผลการสอบ', 'ลิงก์นี้อาจไม่ถูกต้องหรือถูกลบไปแล้ว', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            // 2. ดึงข้อมูลชุดข้อสอบ (exams)
            const { data: exam } = await mySupabase
                .from('exams')
                .select('*')
                .eq('id', attempt.exam_id)
                .single();

            document.getElementById('examTitleHeader').textContent = exam ? exam.title : 'ชุดข้อสอบออนไลน์';
            document.getElementById('resultTitleNav').textContent = exam ? exam.title : 'ผลการสอบ';
            document.getElementById('submissionTimeText').textContent = `เวลาที่ส่งข้อสอบ: ${new Date(attempt.submission_time || attempt.created_at).toLocaleString('th-TH')}`;

            // 3. ดึงคำถามทั้งหมดของชุดข้อสอบนี้
            const { data: questions } = await mySupabase
                .from('questions')
                .select('*')
                .eq('exam_id', attempt.exam_id)
                .order('question_number', { ascending: true });

            // 4. ดึงคำตอบรายข้อที่นักเรียนตอบไว้ (exam_answers)
            const { data: answers } = await mySupabase
                .from('exam_answers')
                .select('*')
                .eq('attempt_id', attemptId);

            // แปลงข้อมูลคำตอบเป็น Map เพื่อให้ค้นหาง่าย (question_id -> answer record)
            const answerMap = {};
            (answers || []).forEach(ans => {
                answerMap[ans.question_id] = ans;
            });

            // คำนวณคะแนนรวมและแสดงผล
            const totalQ = questions ? questions.length : 0;
            let earnedScore = attempt.total_score !== undefined && attempt.total_score !== null ? attempt.total_score : (attempt.score || 0);

            document.getElementById('scoreDisplay').textContent = earnedScore;
            document.getElementById('totalScoreDisplay').textContent = totalQ;

            renderDetailedResults(questions || [], answerMap);
        }

        function renderDetailedResults(questions, answerMap) {
            const container = document.getElementById('resultsContainer');
            if (questions.length === 0) {
                container.innerHTML = `<div class="hitech-card p-8 rounded-3xl text-center text-slate-400 text-xs">ไม่พบรายการคำถามในชุดข้อสอบนี้</div>`;
                return;
            }

            container.innerHTML = questions.map((q, idx) => {
                const qNum = q.question_number || (idx + 1);
                const isEssay = q.question_type === 'essay';
                const opts = q.options || ['ก', 'ข', 'ค', 'ง'];
                const studentAnsRecord = answerMap[q.id] || {};
                
                const studentChoiceIdx = studentAnsRecord.selected_option_index !== undefined ? studentAnsRecord.selected_option_index : null;
                const correctChoiceIdx = q.correct_answer !== undefined && q.correct_answer !== null ? parseInt(q.correct_answer) : null;
                const isCorrect = !isEssay && studentChoiceIdx !== null && studentChoiceIdx === correctChoiceIdx;

                if (isEssay) {
                    const subjectiveText = studentAnsRecord.subjective_answer || '- ไม่ได้ตอบ -';
                    return `
                        <div class="hitech-card p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-amber-500/10 text-amber-600 font-bold text-xs rounded-full border border-amber-500/20">ข้อที่ ${qNum} (อัตนัย / เขียนตอบ)</span>
                                <span class="text-xs font-bold text-amber-500">รอตรวจให้คะแนน</span>
                            </div>
                            <div class="text-xs font-semibold text-slate-800 dark:text-slate-200 bg-slate-50 dark:bg-slate-900 p-3 rounded-2xl border">
                                ${q.question_text || q.content || ''}
                            </div>
                            <div class="p-3 bg-white dark:bg-slate-800/60 rounded-2xl border text-xs space-y-1">
                                <span class="text-[11px] font-bold text-slate-400">คำตอบที่คุณเขียน:</span>
                                <p class="text-slate-700 dark:text-slate-300 whitespace-pre-line">${subjectiveText}</p>
                            </div>
                        </div>
                    `;
                } else {
                    const bubblesHtml = opts.map((optText, optIdx) => {
                        let bubbleClass = 'result-bubble';
                        let badgeIcon = '';

                        const isStudentPicked = (studentChoiceIdx !== null && String(studentChoiceIdx) === String(optIdx));
                        const isCorrectOpt = (correctChoiceIdx !== null && String(correctChoiceIdx) === String(optIdx));

                        if (isStudentPicked && isCorrectOpt) {
                            bubbleClass += ' correct-choice';
                            badgeIcon = '<i class="fas fa-check text-[10px] ml-1"></i>';
                        } else if (isStudentPicked && !isCorrectOpt) {
                            bubbleClass += ' wrong-choice';
                            badgeIcon = '<i class="fas fa-times text-[10px] ml-1"></i>';
                        } else if (!isStudentPicked && isCorrectOpt) {
                            bubbleClass += ' correct-choice';
                            badgeIcon = '<i class="fas fa-check text-[10px] ml-1 opacity-70"></i>';
                        } else if (isStudentPicked) {
                            bubbleClass += ' student-choice';
                        }

                        return `
                            <div class="flex items-center gap-2">
                                <div class="${bubbleClass}">
                                    ${String.fromCharCode(65 + optIdx)}
                                </div>
                                <span class="text-xs text-slate-700 dark:text-slate-300">${optText}</span>
                                ${badgeIcon}
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="hitech-card p-5 rounded-3xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="px-3 py-1 bg-sky-500/10 text-sky-600 dark:text-sky-300 font-bold text-xs rounded-full border border-sky-500/20">ข้อที่ ${qNum} (${q.category_tag || 'ทั่วไป'})</span>
                                <span class="px-2.5 py-1 rounded-xl text-xs font-bold ${isCorrect ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' : 'bg-red-500/10 text-red-600 border border-red-500/20'}">
                                    ${isCorrect ? '<i class="fas fa-check-circle mr-1"></i> ตอบถูก (+1 คะแนน)' : '<i class="fas fa-times-circle mr-1"></i> ตอบผิด (0 คะแนน)'}
                                </span>
                            </div>

                            ${q.image_url ? `<div><img src="${q.image_url}" class="max-h-48 rounded-2xl border"></div>` : ''}

                            <div class="text-xs font-semibold text-slate-800 dark:text-slate-200">
                                ${q.question_text || q.content || ''}
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 bg-slate-50/50 dark:bg-slate-900/50 p-3 rounded-2xl border">
                                ${bubblesHtml}
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        initResultPage();
    </script>
</body>
</html>
