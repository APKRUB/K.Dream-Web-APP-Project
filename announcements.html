<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์รวมประกาศและข่าวสาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc', darkbg: '#0f172a', darkbox: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 1); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(30, 41, 59, 1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button id="backBtn" onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-primary hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <span class="font-bold text-xl text-gray-800 dark:text-white"><i class="fas fa-bullhorn text-primary mr-2"></i>ศูนย์รวมประกาศแจ้งเตือน</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content (Layout 2 ฝั่ง) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฝั่งซ้าย: ฟอร์มสร้าง/แก้ไขประกาศ (แสดงเฉพาะ Admin/Teacher) -->
            <div id="creatorSection" class="lg:col-span-5 bg-white dark:bg-darkbox p-8 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700 sticky top-28">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-12 h-12 bg-blue-50 dark:bg-slate-800 text-primary rounded-2xl flex items-center justify-center text-xl shadow-inner">
                        <i class="fas fa-edit" id="formIcon"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-800 dark:text-white" id="formTitle">สร้างประกาศใหม่</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400">ประกาศจะแจ้งเตือนไปยังนักเรียนทุกคนทันที</p>
                    </div>
                </div>

                <form id="announcementForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editAnnouncementId">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                        <input type="text" id="annTitle" required placeholder="เช่น กำหนดการสอบกลางภาควิชา..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">เนื้อหาประกาศ <span class="text-red-500">*</span></label>
                        <textarea id="annContent" required rows="6" placeholder="พิมพ์รายละเอียดประกาศที่นี่..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:ring-2 focus:ring-primary outline-none text-sm resize-none"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-primary hover:bg-blue-800 text-white py-3 rounded-xl font-bold shadow-md transition-all text-sm">
                            <i class="fas fa-paper-plane mr-2"></i> โพสต์ประกาศ
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-4 py-3 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-300 rounded-xl font-semibold text-sm hover:bg-gray-300">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- ฝั่งขวา: ประวัติการประกาศ (Timeline Feed) -->
            <div id="feedSection" class="lg:col-span-7 space-y-4">
                <div class="flex justify-between items-center bg-white dark:bg-darkbox p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
                    <h3 class="font-bold text-lg text-gray-800 dark:text-white"><i class="fas fa-history text-primary mr-2"></i>ประวัติประกาศทั้งหมด</h3>
                    <span id="annCount" class="text-xs bg-blue-50 text-primary dark:bg-blue-900/40 dark:text-blue-300 px-3 py-1 rounded-full font-semibold">0 รายการ</span>
                </div>

                <div id="announcementFeed" class="space-y-4">
                    <div class="bg-white dark:bg-darkbox p-8 rounded-2xl text-center text-gray-400 border border-gray-200 dark:border-gray-700">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2 text-primary"></i>
                        <p class="text-sm">กำลังโหลดประวัติประกาศ...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userRole = '';

        // Theme Setup
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
            currentUser = profile;
            userRole = profile.role;

            // ปรับแต่ง UI ตาม Role (ถ้านักเรียนเข้ามา จะซ่อนฟอร์มฝั่งซ้าย ให้ฝั่งขวาขยายเต็มจอ)
            if (userRole === 'student') {
                document.getElementById('creatorSection').style.display = 'none';
                document.getElementById('feedSection').className = 'lg:col-span-12 space-y-4';
            }

            loadAnnouncements();
        }

        function goBack() {
            if (['admin', 'teacher', 'exam_creator'].includes(userRole)) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        }

        // โหลดประวัติประกาศ
        async function loadAnnouncements() {
            // เช็คว่าตาราง announcements มีคอลัมน์ title หรือยัง ถ้ายังให้ดึงเฉพาะ content มาแสดงกัน Error
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            const feed = document.getElementById('announcementFeed');
            if (error || !anns || anns.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white dark:bg-darkbox p-8 rounded-2xl text-center text-gray-400 border border-gray-200 dark:border-gray-700">
                        <i class="fas fa-bullhorn text-3xl mb-2 text-gray-300"></i>
                        <p class="text-sm">ยังไม่มีประกาศในระบบ</p>
                    </div>
                `;
                document.getElementById('annCount').textContent = '0 รายการ';
                return;
            }

            document.getElementById('annCount').textContent = `${anns.length} รายการ`;

            const isStaff = ['admin', 'teacher', 'exam_creator'].includes(userRole);

            feed.innerHTML = anns.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { 
                    dateStyle: 'medium', 
                    timeStyle: 'short' 
                });
                
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';

                return `
                    <div class="bg-white dark:bg-darkbox p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-all relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-primary"></div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h4 class="font-bold text-lg text-gray-800 dark:text-white">${titleText}</h4>
                                <span class="text-xs text-gray-400 dark:text-gray-500"><i class="far fa-clock mr-1"></i> ${dateStr}</span>
                            </div>
                            ${isStaff ? `
                                <div class="flex gap-1">
                                    <button onclick="prepareEdit('${a.id}', \`${a.title || ''}\`, \`${a.content}\`)" class="w-8 h-8 rounded-lg bg-yellow-50 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400 hover:bg-yellow-100 flex items-center justify-center text-xs transition-colors" title="แก้ไข"><i class="fas fa-edit"></i></button>
                                    <button onclick="deleteAnnouncement('${a.id}')" class="w-8 h-8 rounded-lg bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 hover:bg-red-100 flex items-center justify-center text-xs transition-colors" title="ลบ"><i class="fas fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                        <p class="text-gray-600 dark:text-gray-300 text-sm whitespace-pre-line leading-relaxed bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-gray-100 dark:border-gray-700/50">${a.content}</p>
                    </div>
                `;
            }).join('');
        }

        // จัดการฟอร์ม (สร้างใหม่ หรือ บันทึกการแก้ไข)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnnouncementId').value;
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            if (editId) {
                // อัปเดตประกาศเก่า
                const { error } = await mySupabase.from('announcements').update({ title, content }).eq('id', editId);
                if (!error) {
                    Swal.fire({ icon: 'success', title: 'แก้ไขประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            } else {
                // สร้างประกาศใหม่
                const { error } = await mySupabase.from('announcements').insert([{ author_id: currentUser.id, title, content }]);
                if (!error) {
                    // ยิง Notification แจ้งเตือนไปที่กระดิ่ง
                    await mySupabase.from('notifications').insert([{ type: 'announcement', message: `${title}: ${content.substring(0, 50)}...` }]);
                    Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }

            resetForm();
            loadAnnouncements();
        }

        // เตรียมข้อมูลลงฟอร์มเพื่อแก้ไข
        function prepareEdit(id, title, content) {
            document.getElementById('editAnnouncementId').value = id;
            document.getElementById('annTitle').value = title;
            document.getElementById('annContent').value = content;
            
            document.getElementById('formTitle').textContent = 'แก้ไขประกาศ';
            document.getElementById('formIcon').className = 'fas fa-pen text-yellow-500';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save mr-2"></i> บันทึกการแก้ไข';
            document.getElementById('submitBtn').className = 'flex-1 bg-yellow-600 hover:bg-yellow-700 text-white py-3 rounded-xl font-bold shadow-md transition-all text-sm';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // รีเซ็ตฟอร์มกลับเป็นโหมดสร้างใหม่
        function resetForm() {
            document.getElementById('announcementForm').reset();
            document.getElementById('editAnnouncementId').value = '';
            document.getElementById('formTitle').textContent = 'สร้างประกาศใหม่';
            document.getElementById('formIcon').className = 'fas fa-edit';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paper-plane mr-2"></i> โพสต์ประกาศ';
            document.getElementById('submitBtn').className = 'flex-1 bg-primary hover:bg-blue-800 text-white py-3 rounded-xl font-bold shadow-md transition-all text-sm';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // ลบประกาศ
        async function deleteAnnouncement(id) {
            const res = await Swal.fire({
                title: 'ลบประกาศนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                await mySupabase.from('announcements').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadAnnouncements();
            }
        }

        initPage();
    </script>
</body>
</html>
