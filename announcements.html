<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์รวมประกาศและข่าวสาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { 
                        primary: '#2563eb', 
                        primaryHover: '#1d4ed8',
                        lightbg: '#f8fafc', 
                        darkbg: '#030712',    
                        darkbox: '#111827',   
                        darkinput: '#1f2937'  
                    } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(31, 41, 55, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        
        .modern-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .dark .modern-card { background: rgba(17, 24, 39, 0.95); }
        
        .btn-glow { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25); }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); }
        .btn-glow:active { transform: translateY(0); }

        /* สไตล์ปุ่ม Edit / Delete แบบโมเดิร์นใหม่ */
        .action-btn-edit {
            background-color: rgba(59, 130, 246, 0.1);
            color: #2563eb;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.2s ease;
        }
        .dark .action-btn-edit {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .action-btn-edit:hover {
            background-color: #2563eb;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .action-btn-delete {
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.2s ease;
        }
        .dark .action-btn-delete {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .action-btn-delete:hover {
            background-color: #dc2626;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300 text-gray-800 dark:text-gray-100 selection:bg-blue-500 selection:text-white">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="goBack()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 hover:bg-primary hover:text-white hover:border-primary transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-gray-900 dark:text-white flex items-center gap-2 tracking-tight">
                            <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-sm shadow-md shadow-blue-500/30"><i class="fas fa-bullhorn"></i></span>
                            ศูนย์รวมประกาศข่าวสาร
                        </h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">ประกาศและประกาศแจ้งเตือนทั้งหมดในระบบ</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all shadow-sm">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฝั่งซ้าย: ฟอร์มสร้าง/แก้ไขประกาศ -->
            <div id="creatorSection" class="lg:col-span-5 modern-card p-8 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-gray-200/80 dark:border-gray-800 sticky top-28">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100 dark:border-gray-800">
                    <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30">
                        <i class="fas fa-edit" id="formIcon"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight" id="formTitle">สร้างประกาศใหม่</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400">เนื้อหาจะถูกส่งตรงถึงหน้านักเรียนทันที</p>
                    </div>
                </div>

                <form id="announcementForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                    <input type="hidden" id="editAnnouncementId">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                        <input type="text" id="annTitle" required placeholder="เช่น กำหนดการสอบกลางภาควิชา..." class="w-full px-4 py-3.5 bg-slate-50 dark:bg-darkinput border border-gray-200 dark:border-gray-700 rounded-2xl dark:text-white focus:border-primary focus:ring-2 focus:ring-blue-500/20 outline-none text-sm transition-all shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-2">เนื้อหาประกาศ <span class="text-red-500">*</span></label>
                        <textarea id="annContent" required rows="6" placeholder="พิมพ์รายละเอียดประกาศที่นี่..." class="w-full px-4 py-3.5 bg-slate-50 dark:bg-darkinput border border-gray-200 dark:border-gray-700 rounded-2xl dark:text-white focus:border-primary focus:ring-2 focus:ring-blue-500/20 outline-none text-sm resize-none transition-all shadow-sm leading-relaxed"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-4 rounded-2xl font-bold btn-glow transition-all text-sm flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> โพสต์ประกาศ
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-6 py-4 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 rounded-2xl font-bold text-sm hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- ฝั่งขวา: ประวัติการประกาศ (Feed) -->
            <div id="feedSection" class="lg:col-span-7 space-y-5">
                <div class="flex justify-between items-center modern-card p-6 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-gray-200/80 dark:border-gray-800">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-3">
                        <span class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 text-primary flex items-center justify-center text-sm"><i class="fas fa-history"></i></span>
                        ประวัติประกาศทั้งหมด
                    </h3>
                    <span id="annCount" class="text-xs bg-blue-50 dark:bg-blue-950/80 text-primary dark:text-blue-300 px-4 py-2 rounded-xl font-bold border border-blue-100 dark:border-blue-900/50">0 รายการ</span>
                </div>

                <div id="announcementFeed" class="space-y-4">
                    <div class="modern-card p-12 rounded-3xl text-center text-gray-400 border border-gray-200/80 dark:border-gray-800 shadow-xl shadow-slate-200/50 dark:shadow-none">
                        <i class="fas fa-spinner fa-spin text-3xl mb-3 text-primary"></i>
                        <p class="text-sm font-medium">กำลังโหลดประวัติประกาศ...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userRole = '';

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
            currentUser = profile;
            userRole = profile.role;

            if (userRole === 'student') {
                document.getElementById('creatorSection').style.display = 'none';
                document.getElementById('feedSection').className = 'lg:col-span-12 space-y-5';
            }

            loadAnnouncements();
            markNotificationsAsRead();
        }

        async function markNotificationsAsRead() {
            await mySupabase.from('notifications').update({ is_read: true }).eq('is_read', false);
        }

        function goBack() {
            if (['admin', 'teacher', 'exam_creator'].includes(userRole)) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            const feed = document.getElementById('announcementFeed');
            if (error || !anns || anns.length === 0) {
                feed.innerHTML = `
                    <div class="modern-card p-12 rounded-3xl text-center text-gray-400 border border-gray-200/80 dark:border-gray-800 shadow-xl shadow-slate-200/50 dark:shadow-none">
                        <div class="w-16 h-16 bg-blue-50 dark:bg-slate-800/80 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                            <i class="fas fa-bullhorn"></i>
                        </div>
                        <h4 class="text-base font-bold text-gray-700 dark:text-gray-200 mb-1">ยังไม่มีประกาศในระบบ</h4>
                        <p class="text-xs text-gray-400">ประกาศใหม่จะแสดงขึ้นที่นี่ทันทีเมื่อมีการโพสต์</p>
                    </div>
                `;
                document.getElementById('annCount').textContent = '0 รายการ';
                return;
            }

            document.getElementById('annCount').textContent = `${anns.length} รายการ`;
            const isStaff = ['admin', 'teacher', 'exam_creator'].includes(userRole);

            feed.innerHTML = anns.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { 
                    dateStyle: 'medium', 
                    timeStyle: 'short' 
                });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';

                return `
                    <div class="modern-card p-7 rounded-3xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-gray-200/80 dark:border-gray-800 hover:border-blue-300 dark:hover:border-blue-700/50 transition-all relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2.5 h-full bg-gradient-to-b from-blue-500 to-indigo-600"></div>
                        <div class="flex justify-between items-start mb-4 pl-3">
                            <div>
                                <h4 class="font-bold text-lg text-gray-900 dark:text-white tracking-tight">${titleText}</h4>
                                <span class="text-xs font-medium text-gray-400 dark:text-gray-400 flex items-center gap-1.5 mt-0.5"><i class="far fa-clock"></i> ${dateStr}</span>
                            </div>
                            ${isStaff ? `
                                <div class="flex gap-2">
                                    <button onclick="prepareEdit('${a.id}', \`${a.title || ''}\`, \`${a.content}\`)" class="action-btn-edit px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm" title="แก้ไข">
                                        <i class="fas fa-pen-to-square"></i> แก้ไข
                                    </button>
                                    <button onclick="deleteAnnouncement('${a.id}')" class="action-btn-delete px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm" title="ลบ">
                                        <i class="fas fa-trash-can"></i> ลบ
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="pl-3">
                            <div class="text-gray-700 dark:text-gray-200 text-sm whitespace-pre-line leading-relaxed bg-slate-50/80 dark:bg-darkinput/60 p-5 rounded-2xl border border-gray-200/50 dark:border-gray-800/80 shadow-inner">${a.content}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnnouncementId').value;
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            if (editId) {
                const { error } = await mySupabase.from('announcements').update({ title, content }).eq('id', editId);
                if (!error) {
                    Swal.fire({ icon: 'success', title: 'แก้ไขประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            } else {
                const { error } = await mySupabase.from('announcements').insert([{ author_id: currentUser.id, title, content }]);
                if (!error) {
                    await mySupabase.from('notifications').insert([{ type: 'announcement', message: `${title}: ${content.substring(0, 50)}...` }]);
                    Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }

            resetForm();
            loadAnnouncements();
        }

        function prepareEdit(id, title, content) {
            document.getElementById('editAnnouncementId').value = id;
            document.getElementById('annTitle').value = title;
            document.getElementById('annContent').value = content;
            
            document.getElementById('formTitle').textContent = 'แก้ไขประกาศ';
            document.getElementById('formIcon').className = 'fas fa-pen text-amber-500';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> บันทึกการแก้ไข';
            document.getElementById('submitBtn').className = 'flex-1 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white py-4 rounded-2xl font-bold btn-glow transition-all text-sm flex items-center justify-center gap-2';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('announcementForm').reset();
            document.getElementById('editAnnouncementId').value = '';
            document.getElementById('formTitle').textContent = 'สร้างประกาศใหม่';
            document.getElementById('formIcon').className = 'fas fa-edit';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paperplane"></i> โพสต์ประกาศ';
            document.getElementById('submitBtn').className = 'flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white py-4 rounded-2xl font-bold btn-glow transition-all text-sm flex items-center justify-center gap-2';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteAnnouncement(id) {
            const res = await Swal.fire({
                title: 'ลบประกาศนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                await mySupabase.from('announcements').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadAnnouncements();
            }
        }

        initPage();
    </script>
</body>
</html>
