<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์รวมประกาศและข่าวสาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { 
                        primary: '#2563eb', 
                        secondary: '#3b82f6', 
                        lightbg: '#f1f5f9', 
                        darkbg: '#090d16',    /* ดำกรมท่าเข้มตัดกับกล่องชัดเจนขึ้น */
                        darkbox: '#111827',   /* สีกล่องการ์ดในโหมดมืด (Gray 900) */
                        darkinput: '#1f2937'  /* สีช่องกรอกข้อมูลในโหมดมืด (Gray 800) */
                    } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(203, 213, 225, 0.8); }
        .dark .glass-nav { background: rgba(17, 24, 39, 0.92); border-bottom: 1px solid rgba(31, 41, 55, 1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        
        .btn-modern { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-modern:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .btn-modern:active { transform: translateY(0); }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300 text-gray-800 dark:text-gray-100">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-700 hover:bg-primary hover:text-white hover:border-primary transition-all shadow-sm">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <span class="font-bold text-xl text-gray-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-bullhorn text-primary"></i> ศูนย์รวมประกาศและข่าวสาร
                    </span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- ฝั่งซ้าย: ฟอร์มสร้าง/แก้ไขประกาศ -->
            <div id="creatorSection" class="lg:col-span-5 bg-white dark:bg-darkbox p-8 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-800 sticky top-28">
                <div class="flex items-center gap-4 mb-6 pb-4 border-b border-gray-100 dark:border-gray-800">
                    <div class="w-12 h-12 bg-blue-100 dark:bg-blue-950 text-primary rounded-2xl flex items-center justify-center text-xl shadow-inner border border-blue-200 dark:border-blue-900">
                        <i class="fas fa-edit" id="formIcon"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white" id="formTitle">สร้างประกาศใหม่</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400">ประกาศจะส่งตรงถึงหน้านักเรียนทันที</p>
                    </div>
                </div>

                <form id="announcementForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editAnnouncementId">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">หัวข้อประกาศ <span class="text-red-500">*</span></label>
                        <input type="text" id="annTitle" required placeholder="เช่น กำหนดการสอบกลางภาควิชา..." class="w-full px-4 py-3 bg-white dark:bg-darkinput border-2 border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:border-primary outline-none text-sm transition-colors shadow-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1.5">เนื้อหาประกาศ <span class="text-red-500">*</span></label>
                        <textarea id="annContent" required rows="6" placeholder="พิมพ์รายละเอียดประกาศที่นี่..." class="w-full px-4 py-3 bg-white dark:bg-darkinput border-2 border-gray-200 dark:border-gray-700 rounded-xl dark:text-white focus:border-primary outline-none text-sm resize-none transition-colors shadow-sm"></textarea>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-primary hover:bg-blue-600 text-white py-3.5 rounded-xl font-bold btn-modern transition-all text-sm flex items-center justify-center gap-2">
                            <i class="fas fa-paperplane"></i> โพสต์ประกาศ
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden px-5 py-3.5 bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 rounded-xl font-bold text-sm hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                            ยกเลิก
                        </button>
                    </div>
                </form>
            </div>

            <!-- ฝั่งขวา: ประวัติการประกาศ (Feed) -->
            <div id="feedSection" class="lg:col-span-7 space-y-4">
                <div class="flex justify-between items-center bg-white dark:bg-darkbox p-6 rounded-2xl shadow-md border border-gray-200 dark:border-gray-800">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-history text-primary"></i> ประวัติประกาศทั้งหมด
                    </h3>
                    <span id="annCount" class="text-xs bg-blue-100 text-primary dark:bg-blue-950 dark:text-blue-300 px-3.5 py-1.5 rounded-full font-bold border border-blue-200 dark:border-blue-900">0 รายการ</span>
                </div>

                <div id="announcementFeed" class="space-y-4">
                    <div class="bg-white dark:bg-darkbox p-8 rounded-2xl text-center text-gray-400 border border-gray-200 dark:border-gray-800 shadow-md">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2 text-primary"></i>
                        <p class="text-sm">กำลังโหลดประวัติประกาศ...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let userRole = '';

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
            currentUser = profile;
            userRole = profile.role;

            if (userRole === 'student') {
                document.getElementById('creatorSection').style.display = 'none';
                document.getElementById('feedSection').className = 'lg:col-span-12 space-y-4';
            }

            loadAnnouncements();
            markNotificationsAsRead();
        }

        async function markNotificationsAsRead() {
            await mySupabase.from('notifications').update({ is_read: true }).eq('is_read', false);
        }

        function goBack() {
            if (['admin', 'teacher', 'exam_creator'].includes(userRole)) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'student.html';
            }
        }

        async function loadAnnouncements() {
            const { data: anns, error } = await mySupabase.from('announcements').select('*').order('created_at', { ascending: false });
            
            const feed = document.getElementById('announcementFeed');
            if (error || !anns || anns.length === 0) {
                feed.innerHTML = `
                    <div class="bg-white dark:bg-darkbox p-8 rounded-2xl text-center text-gray-400 border border-gray-200 dark:border-gray-800 shadow-md">
                        <i class="fas fa-bullhorn text-3xl mb-2 text-gray-300 dark:text-gray-600"></i>
                        <p class="text-sm">ยังไม่มีประกาศในระบบ</p>
                    </div>
                `;
                document.getElementById('annCount').textContent = '0 รายการ';
                return;
            }

            document.getElementById('annCount').textContent = `${anns.length} รายการ`;
            const isStaff = ['admin', 'teacher', 'exam_creator'].includes(userRole);

            feed.innerHTML = anns.map(a => {
                const dateStr = new Date(a.created_at).toLocaleString('th-TH', { 
                    dateStyle: 'medium', 
                    timeStyle: 'short' 
                });
                const titleText = a.title || 'ประกาศจากทางโรงเรียน';

                return `
                    <div class="bg-white dark:bg-darkbox p-6 rounded-2xl shadow-md border border-gray-200 dark:border-gray-800 hover:shadow-lg transition-all relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2 h-full bg-primary"></div>
                        <div class="flex justify-between items-start mb-3 pl-2">
                            <div>
                                <h4 class="font-bold text-lg text-gray-900 dark:text-white">${titleText}</h4>
                                <span class="text-xs text-gray-400 dark:text-gray-400"><i class="far fa-clock mr-1"></i> ${dateStr}</span>
                            </div>
                            ${isStaff ? `
                                <div class="flex gap-1.5">
                                    <button onclick="prepareEdit('${a.id}', \`${a.title || ''}\`, \`${a.content}\`)" class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400 hover:bg-amber-100 flex items-center justify-center text-xs transition-colors shadow-sm border border-amber-200/50 dark:border-amber-900/50" title="แก้ไข"><i class="fas fa-edit"></i></button>
                                    <button onclick="deleteAnnouncement('${a.id}')" class="w-9 h-9 rounded-xl bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-400 hover:bg-red-100 flex items-center justify-center text-xs transition-colors shadow-sm border border-red-200/50 dark:border-red-900/50" title="ลบ"><i class="fas fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="pl-2">
                            <p class="text-gray-700 dark:text-gray-200 text-sm whitespace-pre-line leading-relaxed bg-slate-50 dark:bg-darkinput p-4 rounded-xl border border-gray-200/60 dark:border-gray-700">${a.content}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editAnnouncementId').value;
            const title = document.getElementById('annTitle').value;
            const content = document.getElementById('annContent').value;

            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            if (editId) {
                const { error } = await mySupabase.from('announcements').update({ title, content }).eq('id', editId);
                if (!error) {
                    Swal.fire({ icon: 'success', title: 'แก้ไขประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            } else {
                const { error } = await mySupabase.from('announcements').insert([{ author_id: currentUser.id, title, content }]);
                if (!error) {
                    await mySupabase.from('notifications').insert([{ type: 'announcement', message: `${title}: ${content.substring(0, 50)}...` }]);
                    Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }

            resetForm();
            loadAnnouncements();
        }

        function prepareEdit(id, title, content) {
            document.getElementById('editAnnouncementId').value = id;
            document.getElementById('annTitle').value = title;
            document.getElementById('annContent').value = content;
            
            document.getElementById('formTitle').textContent = 'แก้ไขประกาศ';
            document.getElementById('formIcon').className = 'fas fa-pen text-amber-500';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> บันทึกการแก้ไข';
            document.getElementById('submitBtn').className = 'flex-1 bg-amber-600 hover:bg-amber-700 text-white py-3.5 rounded-xl font-bold btn-modern transition-all text-sm flex items-center justify-center gap-2';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('announcementForm').reset();
            document.getElementById('editAnnouncementId').value = '';
            document.getElementById('formTitle').textContent = 'สร้างประกาศใหม่';
            document.getElementById('formIcon').className = 'fas fa-edit';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paperplane"></i> โพสต์ประกาศ';
            document.getElementById('submitBtn').className = 'flex-1 bg-primary hover:bg-blue-600 text-white py-3.5 rounded-xl font-bold btn-modern transition-all text-sm flex items-center justify-center gap-2';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteAnnouncement(id) {
            const res = await Swal.fire({
                title: 'ลบประกาศนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบเลย',
                cancelButtonText: 'ยกเลิก'
            });

            if (res.isConfirmed) {
                await mySupabase.from('announcements').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadAnnouncements();
            }
        }

        initPage();
    </script>
</body>
</html>
