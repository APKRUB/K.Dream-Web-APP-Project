<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | จัดการรายวิชาและคอร์สทั้งหมด</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .course-card {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.02) 0%, rgba(147, 51, 234, 0.04) 100%);
            border: 1px solid rgba(186, 230, 253, 0.6);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .course-card {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.05) 0%, rgba(147, 51, 234, 0.08) 100%);
            border: 1px solid rgba(30, 58, 138, 0.6);
        }
        .course-card:hover {
            transform: translateY(-4px);
            border-color: rgba(147, 51, 234, 0.6);
            box-shadow: 0 20px 40px -15px rgba(147, 51, 234, 0.15);
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin_dashboard.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-purple-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-book"></i></span>
                        ศูนย์จัดการรายวิชาและคอร์ส
                    </h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin_videos.html'" class="px-3.5 py-1.5 bg-indigo-500/10 text-indigo-600 hover:bg-indigo-500 hover:text-white font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 border border-indigo-500/20">
                        <i class="fas fa-video"></i> ศูนย์วิดีโอกลาง
                    </button>
                    <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Header Controls & Search Bar -->
        <div class="hitech-card p-6 sm:p-8 rounded-3xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-8 border-l-purple-500">
            <div class="space-y-1">
                <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">จัดการคอร์สเรียนทั้งหมด</h2>
                <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400">สร้าง จัดการเนื้อหา กำหนดข้อสอบ และเชื่อมโยงวิดีโอรายวิชา</p>
            </div>
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-search text-xs"></i></span>
                    <input type="text" id="courseSearchInput" oninput="renderCourseList()" placeholder="ค้นหาชื่อคอร์ส หรือรหัส..." class="w-full pl-9 pr-3 py-2 bg-slate-100 dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-2xl text-xs outline-none font-bold">
                </div>
                <button onclick="openCreateCourseModal()" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-2xl text-xs shadow transition-all flex items-center gap-1.5 shrink-0">
                    <i class="fas fa-plus"></i> สร้างคอร์สใหม่
                </button>
            </div>
        </div>

        <!-- Course Cards Grid Container -->
        <div id="coursesGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Rendered dynamically -->
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCourses = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initAdminCourses() {
            Swal.fire({ title: 'กำลังโหลดคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const { data, error } = await mySupabase.from('courses').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allCourses = data || [];
            } catch (err) {
                console.error("Error loading courses:", err);
            } finally {
                Swal.close();
            }

            renderCourseList();
        }

        function renderCourseList() {
            const container = document.getElementById('coursesGridContainer');
            if (!container) return;

            const keyword = (document.getElementById('courseSearchInput')?.value || '').trim().toLowerCase();
            let filtered = allCourses.filter(c => {
                if (!keyword) return true;
                const title = String(c.title || '').toLowerCase();
                const code = String(c.course_code || '').toLowerCase();
                const desc = String(c.description || '').toLowerCase();
                return title.includes(keyword) || code.includes(keyword) || desc.includes(keyword);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs">
                        <i class="fas fa-folder-open text-3xl mb-2 text-slate-300 dark:text-slate-700"></i>
                        <p>ไม่พบรายการคอร์สเรียนในระบบ</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(c => {
                return `
                    <div class="course-card p-6 rounded-3xl flex flex-col justify-between space-y-4 relative overflow-hidden">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-mono text-xs font-bold px-3 py-1 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20">
                                    ${c.course_code || 'COURSE'}
                                </span>
                                <button onclick="deleteCourse('${c.id}')" class="w-8 h-8 flex items-center justify-center rounded-xl bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white transition-all" title="ลบคอร์ส">
                                    <i class="fas fa-trash text-xs"></i>
                                </button>
                            </div>
                            <h3 class="font-extrabold text-base text-slate-900 dark:text-white line-clamp-1">${c.title}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${c.description || 'ไม่มีคำอธิบายคอร์ส'}</p>
                        </div>
                        
                        <div class="pt-4 border-t border-purple-500/20 flex flex-wrap items-center gap-2">
                            <!-- ปุ่มจัดการคอร์ส -->
                            <button onclick="window.location.href='admin_course_detail.html?id=${c.id}'" class="flex-1 px-3 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs transition-all shadow flex items-center justify-center gap-1.5">
                                <i class="fas fa-cog"></i> จัดการคอร์ส
                            </button>
                            
                            <!-- ปุ่มลัดไปข้อสอบ -->
                            <button onclick="window.location.href='admin_exams.html?course_id=${c.id}'" class="px-3 py-2 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white font-bold rounded-xl text-xs transition-all flex items-center gap-1" title="ชุดข้อสอบ">
                                <i class="fas fa-file-signature"></i> ข้อสอบ
                            </button>

                            <!-- 🌟 ปุ่มลัดไปวิดีโอ -->
                            <button onclick="window.location.href='admin_videos.html?course_id=${c.id}'" class="px-3 py-2 bg-indigo-500/10 text-indigo-600 hover:bg-indigo-500 hover:text-white font-bold rounded-xl text-xs transition-all flex items-center gap-1" title="จัดการวิดีโอ">
                                <i class="fas fa-video"></i> วิดีโอ
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function openCreateCourseModal() {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: formValues } = await Swal.fire({
                title: '📚 สร้างคอร์สเรียนใหม่',
                width: '500px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">รหัสคอร์ส (Course Code) <span class="text-red-500">*</span></label>
                            <input id="swalCourseCode" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono font-bold" placeholder="เช่น CS101">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ชื่อคอร์สเรียน <span class="text-red-500">*</span></label>
                            <input id="swalCourseTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold" placeholder="เช่น พื้นฐานการเขียนโปรแกรม C++">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">รายละเอียดคอร์ส</label>
                            <textarea id="swalCourseDesc" rows="3" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="อธิบายเนื้อหาโดยย่อ..."></textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างคอร์ส',
                confirmButtonColor: '#9333ea',
                cancelButtonColor: '#ef4444',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => {
                    const code = document.getElementById('swalCourseCode').value.trim();
                    const title = document.getElementById('swalCourseTitle').value.trim();
                    if (!code || !title) {
                        Swal.showValidationMessage('กรุณากรอกรหัสคอร์สและชื่อคอร์สให้ครบถ้วน');
                        return false;
                    }
                    return {
                        course_code: code,
                        title: title,
                        description: document.getElementById('swalCourseDesc').value.trim()
                    };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังสร้าง...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error } = await mySupabase.from('courses').insert([formValues]);
                if (error) {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                } else {
                    Swal.fire({ icon: 'success', title: 'สร้างคอร์สสำเร็จ!', timer: 1200, showConfirmButton: false });
                    initAdminCourses();
                }
            }
        }

        async function deleteCourse(courseId) {
            const { isConfirmed } = await Swal.fire({
                title: 'ลบคอร์สนี้?',
                text: 'การลบคอร์สอาจส่งผลต่อข้อมูลบทเรียนและข้อสอบภายในคอร์ส',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ยืนยันลบ',
                cancelButtonText: 'ยกเลิก'
            });

            if (isConfirmed) {
                await mySupabase.from('courses').delete().eq('id', courseId);
                initAdminCourses();
                Swal.fire({ icon: 'success', title: 'ลบคอร์สเรียบร้อย', timer: 1000, showConfirmButton: false });
            }
        }

        initAdminCourses();
    </script>
</body>
</html>
