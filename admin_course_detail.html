<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | จัดการรายละเอียดคอร์สเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glow-badge-sky { background: rgba(2, 132, 199, 0.1); color: #0284c7; border: 1px solid rgba(56, 189, 248, 0.3); }
        .dark .glow-badge-sky { background: rgba(2, 132, 199, 0.2); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 id="navTitle" class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard-user"></i></span>
                        จัดการรายละเอียดคอร์สเรียน
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Course Header Banner -->
        <div class="hitech-card p-6 sm:p-8 rounded-3xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-l-8 border-l-purple-500">
            <div class="space-y-2">
                <div id="courseCodeBadge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 font-mono font-bold text-xs border border-purple-500/20">
                    COURSE CODE
                </div>
                <h2 id="headerCourseTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">กำลังโหลดคอร์สเรียน...</h2>
                <p id="headerCourseDesc" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-2xl">กำลังดึงข้อมูลเนื้อหาและไฟล์ประกอบ...</p>
            </div>
            <div class="flex items-center gap-2 shrink-0 flex-wrap">
                <button onclick="openAddLessonModal('video')" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-sky-500/25 transition-all flex items-center gap-1.5">
                    <i class="fas fa-video"></i> เพิ่มวิดีโอย้อนหลัง
                </button>
                <button onclick="openAddLessonModal('pdf')" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-500/25 transition-all flex items-center gap-1.5">
                    <i class="fas fa-file-arrow-up"></i> อัปโหลดไฟล์/เอกสาร
                </button>
                <button onclick="window.location.href=`admin_exams.html?course_id=${courseId}`" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition-all flex items-center gap-1.5">
                    <i class="fas fa-file-signature"></i> ข้อสอบในคอร์ส
                </button>
            </div>
        </div>

        <!-- Content Grid: Videos & Files -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Videos Section -->
            <div class="lg:col-span-7 hitech-card p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center pb-3 border-b border-sky-500/20">
                    <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-play-circle text-sky-500"></i> วิดีโอบทเรียนย้อนหลัง (<span id="videoCount">0</span>)
                    </h3>
                </div>
                <div id="videosContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <div class="text-center py-8 text-slate-400 text-xs">กำลังโหลดวิดีโอ...</div>
                </div>
            </div>

            <!-- Files & Materials Section -->
            <div class="lg:col-span-5 hitech-card p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center pb-3 border-b border-indigo-500/20">
                    <h3 class="font-extrabold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-folder-open text-indigo-500"></i> เอกสาร & ไฟล์ประกอบ (<span id="fileCount">0</span>)
                    </h3>
                </div>
                <div id="filesContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <div class="text-center py-8 text-slate-400 text-xs">กำลังโหลดไฟล์เอกสาร...</div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        let currentCourse = null;
        let courseLessons = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initCourseDetail() {
            if (!courseId) {
                Swal.fire('ไม่พบรหัสคอร์สเรียน', 'กรุณากลับไปเลือกคอร์สใหม่', 'error').then(() => window.location.replace('admin.html'));
                return;
            }

            Swal.fire({ title: 'กำลังโหลดข้อมูลคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const { data: courseData, error: courseErr } = await mySupabase.from('courses').select('*').eq('id', courseId).single();
                if (courseErr || !courseData) {
                    Swal.fire('ไม่พบคอร์สเรียน', 'คอร์สนี้อาจถูกลบไปแล้ว', 'error').then(() => window.location.replace('admin.html'));
                    return;
                }
                currentCourse = courseData;

                document.getElementById('courseCodeBadge').textContent = currentCourse.course_code || 'COURSE';
                document.getElementById('headerCourseTitle').textContent = currentCourse.title;
                document.getElementById('headerCourseDesc').textContent = currentCourse.description || 'ไม่มีรายละเอียดคำอธิบายคอร์ส';

                await loadLessons();

            } catch (err) {
                console.error("Init Error:", err);
            } finally {
                Swal.close();
            }
        }

        async function loadLessons() {
            const { data, error } = await mySupabase.from('course_lessons').select('*').eq('course_id', courseId).order('created_at', { ascending: false });
            courseLessons = data || [];
            
            const videos = courseLessons.filter(l => l.video_url || l.video || l.url || (!l.pdf_url && !l.file_url));
            const files = courseLessons.filter(l => l.pdf_url || l.file_url);

            document.getElementById('videoCount').textContent = videos.length;
            document.getElementById('fileCount').textContent = files.length;

            renderVideos(videos);
            renderFiles(files);
        }

        function renderVideos(videos) {
            const container = document.getElementById('videosContainer');
            if (videos.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ยังไม่มีวิดีโอย้อนหลังในคอร์สนี้ กดปุ่ม "เพิ่มวิดีโอย้อนหลัง" ด้านบนได้เลย</div>`;
                return;
            }

            container.innerHTML = videos.map((v) => `
                <div class="p-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center font-bold shrink-0"><i class="fas fa-play"></i></div>
                        <div>
                            <h4 class="font-bold text-xs text-slate-900 dark:text-white">${v.title}</h4>
                            <p class="text-[10px] text-slate-400">เพิ่มเมื่อ: ${new Date(v.created_at).toLocaleDateString('th-TH')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <a href="${v.video_url || v.video || v.url || '#'}" target="_blank" class="px-3 py-1.5 bg-sky-500/10 hover:bg-sky-500 hover:text-white text-sky-600 rounded-xl font-bold text-[11px] transition-all"><i class="fas fa-external-link-alt mr-1"></i> ดูวิดีโอ</a>
                        <button onclick="deleteLesson('${v.id}')" class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center"><i class="fas fa-trash-can text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderFiles(files) {
            const container = document.getElementById('filesContainer');
            if (files.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ยังไม่มีไฟล์เอกสารประกอบ กดปุ่ม "อัปโหลดไฟล์/เอกสาร" ด้านบนได้เลย</div>`;
                return;
            }

            container.innerHTML = files.map((f) => `
                <div class="p-3.5 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center gap-3">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center font-bold shrink-0"><i class="fas fa-file-lines"></i></div>
                        <div>
                            <h4 class="font-bold text-xs text-slate-900 dark:text-white">${f.title}</h4>
                            <p class="text-[10px] text-slate-400">อัปโหลดเมื่อ: ${new Date(f.created_at).toLocaleDateString('th-TH')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <a href="${f.pdf_url || f.file_url || '#'}" target="_blank" class="px-3 py-1.5 bg-indigo-500/10 hover:bg-indigo-500 hover:text-white text-indigo-600 rounded-xl font-bold text-[11px] transition-all"><i class="fas fa-download mr-1"></i> ดาวน์โหลด</a>
                        <button onclick="deleteLesson('${f.id}')" class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-500 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center"><i class="fas fa-trash-can text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // ฟังก์ชันดึงหรือสร้างโมดูลเริ่มต้นให้อัตโนมัติ เพื่อแก้ปัญหา Foreign Key Constraint
        async function getOrCreateDefaultModule(cId) {
            const { data: mods } = await mySupabase.from('modules').select('id').eq('course_id', cId).limit(1);
            if (mods && mods.length > 0) {
                return mods[0].id;
            }
            const { data: newMod, error } = await mySupabase.from('modules').insert([{
                course_id: cId,
                title: 'บทเรียนทั่วไป',
                created_at: new Date().toISOString()
            }]).select().single();

            if (error || !newMod) {
                throw new Error('ไม่สามารถสร้างโมดูลเริ่มต้นได้: ' + (error ? error.message : 'Unknown error'));
            }
            return newMod.id;
        }

        async function openAddLessonModal(type) {
            const isVideo = type === 'video';
            const { value: formValues } = await Swal.fire({
                title: isVideo ? '📹 เพิ่มวิดีโอย้อนหลัง' : '📁 เพิ่มเอกสาร / ไฟล์ประกอบ',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ชื่อ${isVideo ? 'หัวข้อวิดีโอ' : 'เอกสาร / ไฟล์'} <span class="text-red-500">*</span></label>
                            <input id="swalLessonTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="${isVideo ? 'เช่น ครั้งที่ 1: ตะลุยโจทย์อัลกอริทึม' : 'เช่น สไลด์บรรยายบทที่ 1.pdf'}">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ลิงก์${isVideo ? 'วิดีโอ (YouTube / URL)' : 'ดาวน์โหลดไฟล์ (Google Drive / URL)'} <span class="text-red-500">*</span></label>
                            <input id="swalLessonUrl" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="${isVideo ? 'https://youtube.com/...' : 'https://drive.google.com/...'}">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('swalLessonTitle').value.trim();
                    const url = document.getElementById('swalLessonUrl').value.trim();
                    if (!title || !url) {
                        Swal.showValidationMessage('กรุณากรอกชื่อและลิงก์ให้ครบถ้วน');
                        return false;
                    }
                    return { title, url };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                try {
                    // ดึงหรือสร้าง module_id อัตโนมัติ
                    const moduleId = await getOrCreateDefaultModule(courseId);

                    const payload = {
                        course_id: courseId,
                        module_id: moduleId,
                        title: formValues.title,
                        video_url: isVideo ? formValues.url : null,
                        pdf_url: !isVideo ? formValues.url : null,
                        created_at: new Date().toISOString()
                    };

                    const { error } = await mySupabase.from('course_lessons').insert([payload]);

                    if (!error) {
                        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1200, showConfirmButton: false });
                        loadLessons();
                    } else {
                        Swal.fire('บันทึกล้มเหลว', `เกิดข้อผิดพลาดจาก Supabase:<br><code class="text-xs text-red-400 font-mono mt-2 block">${error.message}</code>`, 'error');
                    }
                } catch (err) {
                    Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
                }
            }
        }

        async function deleteLesson(id) {
            const res = await Swal.fire({ title: 'ยืนยันลบรายการนี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
            if (res.isConfirmed) {
                await mySupabase.from('course_lessons').delete().eq('id', id);
                loadLessons();
                Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', timer: 1000, showConfirmButton: false });
            }
        }

        initCourseDetail();
    </script>
</body>
</html>
