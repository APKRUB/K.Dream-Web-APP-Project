<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ควบคุมเนื้อหาภายในคอร์ส</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin_courses.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-purple-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 id="navCourseTitle" class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard"></i></span>
                        ศูนย์ควบคุมภายในคอร์ส
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Course Header Info Banner -->
        <div class="hitech-card p-6 sm:p-8 rounded-3xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-l-8 border-l-purple-500">
            <div class="space-y-2">
                <div id="courseBadgeCode" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 font-mono font-bold text-xs border border-purple-500/20">
                    COURSE
                </div>
                <h2 id="headerCourseTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">กำลังโหลด...</h2>
                <p id="headerCourseDesc" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-2xl">กำลังดึงรายละเอียด...</p>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <div class="p-4 bg-purple-500/10 border border-purple-500/20 rounded-2xl text-center">
                    <div id="statEnrolledStudents" class="text-xl font-extrabold text-purple-600 dark:text-purple-400">0</div>
                    <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">นักเรียนในคอร์ส</div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs Inside Course -->
        <div class="flex gap-2 overflow-x-auto pb-2 border-b border-purple-500/20">
            <button onclick="switchCourseTab('curriculum')" id="tab-btn-curriculum" class="course-tab-btn px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs shrink-0 transition-all shadow">
                <i class="fas fa-book-open mr-1.5"></i> บทเรียน & เนื้อหา (Curriculum)
            </button>
            <button onclick="switchCourseTab('students')" id="tab-btn-students" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-users mr-1.5"></i> นักเรียนในคอร์ส
            </button>
            <button onclick="switchCourseTab('exams')" id="tab-btn-exams" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-file-signature mr-1.5"></i> ชุดข้อสอบประจำคอร์ส
            </button>
            <button onclick="switchCourseTab('announcements')" id="tab-btn-announcements" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-bullhorn mr-1.5"></i> ประกาศเฉพาะคอร์ส
            </button>
        </div>

        <!-- Tab Content Container -->
        <div id="tabContentContainer" class="space-y-4"></div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        let currentCourse = null;
        let allStudents = [];
        let enrolledStudentIds = [];
        let courseModules = [];
        let courseLessons = [];
        let courseExams = [];
        let courseAnnouncements = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function isUserAdmin(profileObj) {
            if (!profileObj) return false;
            const role = String(profileObj.role || profileObj.user_role || '').toLowerCase();
            const email = String(profileObj.email || '').toLowerCase();
            if (role === 'admin' || role === 'teacher' || role === 'instructor') return true;
            if (email.includes('admin') || email.includes('teacher')) return true;
            return false;
        }

        async function initCourseDetail() {
            if (!courseId) { window.location.replace('admin_courses.html'); return; }

            Swal.fire({ title: 'กำลังโหลดคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // โหลดทีละส่วนอย่างปลอดภัย ป้องกันปัญหารอค้าง
            const courseRes = await mySupabase.from('courses').select('*').eq('id', courseId).single();
            if (courseRes.error || !courseRes.data) {
                Swal.fire('ไม่พบคอร์ส', 'คอร์สนี้อาจถูกลบไปแล้ว', 'error').then(() => window.location.replace('admin_courses.html'));
                return;
            }
            currentCourse = courseRes.data;

            // โหลดข้อมูลประกอบแบบอิสระ
            const studentsRes = await mySupabase.from('profiles').select('*');
            if (studentsRes.data) allStudents = studentsRes.data.filter(function(p) { return !isUserAdmin(p); });

            const enrollRes = await mySupabase.from('course_enrollments').select('*').eq('course_id', courseId);
            enrolledStudentIds = (enrollRes.data || []).map(function(e) { return String(e.student_id); });

            const modulesRes = await mySupabase.from('course_modules').select('*').eq('course_id', courseId).order('sequence_order', { ascending: true });
            courseModules = modulesRes.data || [];

            const lessonsRes = await mySupabase.from('course_lessons').select('*').order('sequence_order', { ascending: true });
            courseLessons = lessonsRes.data || [];

            const examsRes = await mySupabase.from('exams').select('*').eq('course_id', courseId);
            courseExams = examsRes.data || [];

            const annRes = await mySupabase.from('announcements').select('*').eq('course_id', courseId);
            courseAnnouncements = annRes.data || [];

            Swal.close();

            document.getElementById('navCourseTitle').innerHTML = '<span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard"></i></span> ' + currentCourse.title;
            document.getElementById('courseBadgeCode').textContent = currentCourse.course_code || 'COURSE';
            document.getElementById('headerCourseTitle').textContent = currentCourse.title;
            document.getElementById('headerCourseDesc').textContent = currentCourse.description || 'ไม่มีรายละเอียดคอร์ส';
            document.getElementById('statEnrolledStudents').textContent = enrolledStudentIds.length;

            switchCourseTab('curriculum');
        }

        function switchCourseTab(tabName) {
            document.querySelectorAll('.course-tab-btn').forEach(btn => {
                btn.className = 'course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all';
            });
            const activeBtn = document.getElementById('tab-btn-' + tabName);
            if (activeBtn) activeBtn.className = 'course-tab-btn px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs shrink-0 transition-all shadow';

            const container = document.getElementById('tabContentContainer');
            if (tabName === 'curriculum') renderCurriculumTab(container);
            else if (tabName === 'students') renderStudentsTab(container);
            else if (tabName === 'exams') renderExamsTab(container);
            else if (tabName === 'announcements') renderAnnouncementsTab(container);
        }

        function renderCurriculumTab(container) {
            let modulesHtml = '';
            if (courseModules.length > 0) {
                modulesHtml = courseModules.map(function(m, idx) {
                    const lessons = courseLessons.filter(function(l) { return String(l.module_id) === String(m.id); });
                    let lessonsHtml = '';
                    if (lessons.length > 0) {
                        lessonsHtml = lessons.map(function(l) {
                            return '<div class="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl flex justify-between items-center border dark:border-slate-700">' +
                                   '<div class="flex items-center gap-2"><i class="fas fa-play-circle text-purple-500"></i><span class="font-bold text-xs">' + l.title + '</span></div>' +
                                   '<button onclick="deleteLesson(\'' + l.id + '\')" class="text-slate-400 hover:text-rose-500 text-xs"><i class="fas fa-trash"></i></button>' +
                                   '</div>';
                        }).join('');
                    } else {
                        lessonsHtml = '<div class="text-xs text-slate-400 italic py-2">ยังไม่มีเนื้อหาย่อยในบทนี้</div>';
                    }

                    return '<div class="hitech-card p-6 rounded-3xl space-y-4 border-l-4 border-l-purple-500">' +
                           '<div class="flex justify-between items-center">' +
                           '<div class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-600 font-bold flex items-center justify-center text-xs">' + (idx + 1) + '</span>' +
                           '<h4 class="font-extrabold text-base text-slate-900 dark:text-white">' + m.title + '</h4></div>' +
                           '<div class="flex items-center gap-2">' +
                           '<button onclick="openLessonModal(\'' + m.id + '\')" class="px-3 py-1.5 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white rounded-xl text-xs font-bold transition-all"><i class="fas fa-plus mr-1"></i> เพิ่มเนื้อหาย่อย</button>' +
                           '<button onclick="deleteModule(\'' + m.id + '\')" class="w-8 h-8 flex items-center justify-center rounded-xl bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white transition-all"><i class="fas fa-trash text-xs"></i></button>' +
                           '</div></div>' +
                           '<div class="space-y-2 pl-4 border-l-2 border-purple-500/20">' + lessonsHtml + '</div></div>';
                }).join('');
            } else {
                modulesHtml = '<div class="hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs">ยังไม่มีบทเรียนในคอร์สนี้</div>';
            }

            container.innerHTML = '<div class="space-y-4">' +
                '<div class="hitech-card p-6 rounded-3xl flex justify-between items-center">' +
                '<div><h3 class="font-extrabold text-sm text-slate-900 dark:text-white">โครงสร้างบทเรียนในคอร์ส</h3>' +
                '<p class="text-xs text-slate-500">จัดการเพิ่มบทเรียน (Modules) และบทเรียนย่อย (Lessons) พร้อมวิดีโอและเอกสาร</p></div>' +
                '<button onclick="openModuleModal()" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow transition-all flex items-center gap-1.5"><i class="fas fa-plus"></i> เพิ่มบทเรียนใหม่</button>' +
                '</div><div class="space-y-4">' + modulesHtml + '</div></div>';
        }

        async function openModuleModal() {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: title } = await Swal.fire({
                title: '📚 เพิ่มบทเรียนหลัก (Module)',
                input: 'text',
                inputPlaceholder: 'เช่น บทที่ 1: พื้นฐานการเขียนโปรแกรม',
                showCancelButton: true,
                confirmButtonText: 'สร้างบทเรียน',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });

            if (title) {
                await mySupabase.from('course_modules').insert([{ course_id: courseId, title: title.trim(), sequence_order: courseModules.length + 1 }]);
                initCourseDetail();
            }
        }

        async function deleteModule(modId) {
            const { isConfirmed } = await Swal.fire({ title: 'ลบบทเรียนนี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
            if (isConfirmed) {
                await mySupabase.from('course_modules').delete().eq('id', modId);
                initCourseDetail();
            }
        }

        async function openLessonModal(moduleId) {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: formValues } = await Swal.fire({
                title: '🎬 เพิ่มเนื้อหาย่อย (Lesson / Video)',
                width: '550px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ชื่อหัวข้อเนื้อหา/วิดีโอ <span class="text-red-500">*</span></label>
                            <input id="swalLessonTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ลิงก์วิดีโอ (YouTube / Video URL)</label>
                            <input id="swalLessonVideo" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกเนื้อหา',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => {
                    const title = document.getElementById('swalLessonTitle').value.trim();
                    if (!title) { Swal.showValidationMessage('กรุณากรอกชื่อหัวข้อ'); return false; }
                    return {
                        module_id: moduleId,
                        title: title,
                        video_url: document.getElementById('swalLessonVideo').value.trim()
                    };
                }
            });

            if (formValues) {
                await mySupabase.from('course_lessons').insert([formValues]);
                initCourseDetail();
            }
        }

        async function deleteLesson(lessonId) {
            await mySupabase.from('course_lessons').delete().eq('id', lessonId);
            initCourseDetail();
        }

        function renderStudentsTab(container) {
            const enrolledStudents = allStudents.filter(function(s) { return enrolledStudentIds.includes(String(s.id || s.user_id)); });
            let rowsHtml = '';
            if (enrolledStudents.length > 0) {
                rowsHtml = enrolledStudents.map(function(s, idx) {
                    return '<tr><td class="p-3 font-mono font-bold">' + (idx + 1) + '</td>' +
                           '<td class="p-3 font-mono text-purple-600">' + (s.student_id || '-') + '</td>' +
                           '<td class="p-3 font-bold">' + (s.first_name || '-') + ' ' + (s.last_name || '') + '</td>' +
                           '<td class="p-3">' + (s.nickname || '-') + '</td>' +
                           '<td class="p-3">' + (s.grade_level || '-') + ' (' + (s.school || '-') + ')</td></tr>';
                }).join('');
            } else {
                rowsHtml = '<tr><td colspan="5" class="text-center py-8 text-slate-400">ยังไม่มีนักเรียนในคอร์สนี้</td></tr>';
            }

            container.innerHTML = '<div class="hitech-card p-6 rounded-3xl space-y-4">' +
                '<div class="flex justify-between items-center pb-3 border-b border-purple-500/20">' +
                '<span class="text-xs font-bold text-slate-400">รายชื่อนักเรียนในคอร์ส (' + enrolledStudents.length + ' คน)</span>' +
                '<button onclick="openManageEnrollmentsModal()" class="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow transition-all flex items-center gap-1.5"><i class="fas fa-user-plus"></i> จัดการรายชื่อนักเรียน</button>' +
                '</div><div class="overflow-x-auto"><table class="w-full text-left text-xs border-collapse">' +
                '<thead><tr class="bg-slate-100 dark:bg-slate-800/80 font-bold border-b dark:border-slate-700"><th class="p-3">ลำดับ</th><th class="p-3">รหัส</th><th class="p-3">ชื่อ-นามสกุล</th><th class="p-3">ชื่อเล่น</th><th class="p-3">ระดับชั้น / โรงเรียน</th></tr></thead>' +
                '<tbody class="divide-y divide-slate-100 dark:divide-slate-800">' + rowsHtml + '</tbody></table></div></div>';
        }

        async function openManageEnrollmentsModal() {
            let studentCheckboxes = allStudents.map(function(s) {
                const sId = s.id || s.user_id;
                const isChecked = enrolledStudentIds.includes(String(sId)) ? 'checked' : '';
                return '<label class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/80 rounded-xl border dark:border-slate-700 cursor-pointer hover:border-purple-500">' +
                       '<div class="flex items-center gap-2.5"><input type="checkbox" name="courseStudent" value="' + sId + '" ' + isChecked + ' class="w-4 h-4 accent-purple-600 rounded">' +
                       '<div><div class="font-bold">' + (s.first_name || '-') + ' ' + (s.last_name || '') + '</div>' +
                       '<div class="text-[10px] text-slate-400 font-mono">รหัส: ' + (s.student_id || '-') + ' | ชั้น: ' + (s.grade_level || '-') + '</div></div></div></label>';
            }).join('');

            const isDark = document.documentElement.classList.contains('dark');
            const { isConfirmed } = await Swal.fire({
                title: '👥 จัดการรายชื่อนักเรียนในคอร์ส',
                width: '600px',
                html: '<div class="space-y-2 max-h-72 overflow-y-auto pr-1 text-left">' + studentCheckboxes + '</div>',
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });

            if (isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const checkboxes = document.querySelectorAll('input[name="courseStudent"]:checked');
                const selectedIds = Array.from(checkboxes).map(function(cb) { return cb.value; });

                await mySupabase.from('course_enrollments').delete().eq('course_id', courseId);
                if (selectedIds.length > 0) {
                    const rows = selectedIds.map(function(sId) { return { student_id: sId, course_id: courseId }; });
                    await mySupabase.from('course_enrollments').insert(rows);
                }
                initCourseDetail();
                Swal.fire({ icon: 'success', title: 'สำเร็จ!', timer: 1000, showConfirmButton: false });
            }
        }

        function renderExamsTab(container) {
            let examsHtml = '';
            if (courseExams.length > 0) {
                examsHtml = courseExams.map(function(ex) {
                    return '<div class="p-4 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border dark:border-slate-700 space-y-1">' +
                           '<div class="font-extrabold text-slate-900 dark:text-white">' + (ex.title || ex.exam_name || 'ชุดข้อสอบ') + '</div>' +
                           '<div class="text-xs text-slate-500">' + (ex.description || 'ไม่มีคำอธิบาย') + '</div></div>';
                }).join('');
            } else {
                examsHtml = '<div class="col-span-full text-center py-8 text-slate-400">ยังไม่มีชุดข้อสอบที่ผูกกับคอร์สนี้</div>';
            }

            container.innerHTML = '<div class="hitech-card p-6 rounded-3xl space-y-4">' +
                '<div class="flex justify-between items-center pb-3 border-b border-purple-500/20">' +
                '<span class="text-xs font-bold text-slate-400">ชุดข้อสอบที่ผูกกับคอร์สนี้ (' + courseExams.length + ' ชุด)</span>' +
                '<button onclick="window.location.href=\'admin_exams.html\'" class="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-xs shadow transition-all"><i class="fas fa-file-signature mr-1"></i> ไปที่ศูนย์จัดการชุดข้อสอบ</button>' +
                '</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">' + examsHtml + '</div></div>';
        }

        function renderAnnouncementsTab(container) {
            let annHtml = '';
            if (courseAnnouncements.length > 0) {
                annHtml = courseAnnouncements.map(function(an) {
                    return '<div class="p-4 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border dark:border-slate-700 space-y-1">' +
                           '<div class="font-extrabold text-amber-600">' + an.title + '</div>' +
                           '<div class="text-xs text-slate-600 dark:text-slate-300">' + an.content + '</div></div>';
                }).join('');
            } else {
                annHtml = '<div class="text-center py-8 text-slate-400">ยังไม่มีประกาศในคอร์สนี้</div>';
            }

            container.innerHTML = '<div class="hitech-card p-6 rounded-3xl space-y-4">' +
                '<div class="flex justify-between items-center pb-3 border-b border-purple-500/20">' +
                '<span class="text-xs font-bold text-slate-400">ประกาศข่าวสารในคอร์ส (' + courseAnnouncements.length + ' ประกาศ)</span>' +
                '<button onclick="openAddAnnouncementModal()" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow transition-all"><i class="fas fa-bullhorn mr-1"></i> สร้างประกาศใหม่</button>' +
                '</div><div class="space-y-3">' + annHtml + '</div></div>';
        }

        async function openAddAnnouncementModal() {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: formValues } = await Swal.fire({
                title: '📢 สร้างประกาศใหม่ในคอร์ส',
                width: '500px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div><label class="block font-bold mb-1">หัวข้อประกาศ</label><input id="swalAnTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold"></div>
                        <div><label class="block font-bold mb-1">เนื้อหาประกาศ</label><textarea id="swalAnContent" rows="3" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none"></textarea></div>
                    </div>
                `,
                showCancelButton: true, confirmButtonText: 'โพสต์ประกาศ', confirmButtonColor: '#d97706',
                background: isDark ? '#090d16' : '#ffffff', color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => ({ title: document.getElementById('swalAnTitle').value.trim(), content: document.getElementById('swalAnContent').value.trim(), course_id: courseId })
            });

            if (formValues && formValues.title) {
                await mySupabase.from('announcements').insert([formValues]);
                initCourseDetail();
                Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ!', timer: 1000, showConfirmButton: false });
            }
        }

        initCourseDetail();
    </script>
</body>
</html>
