    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        let currentCourse = null;
        let allStudents = [];
        let enrolledStudentIds = [];
        let courseModules = [];
        let courseLessons = [];
        let courseExams = [];
        let courseAttemptsMap = {};
        let allAttemptsRaw = [];
        let examQuestionsMap = {};
        let categoriesMap = {};
        let chart1 = null, chart2 = null, chart3 = null;
        let currentTab = 'curriculum';

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function isUserAdmin(profileObj) {
            if (!profileObj) return false;
            const role = String(profileObj.role || profileObj.user_role || '').toLowerCase();
            const email = String(profileObj.email || '').toLowerCase();
            if (role === 'admin' || role === 'teacher' || role === 'instructor') return true;
            if (email.includes('admin') || email.includes('teacher')) return true;
            return false;
        }

        async function initCourseDetail() {
            if (!courseId) {
                Swal.fire('แจ้งเตือน', 'ไม่พบรหัสคอร์สในลิงก์', 'warning').then(() => window.location.replace('admin_courses.html'));
                return;
            }

            Swal.fire({ title: 'กำลังโหลดข้อมูลคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const courseRes = await mySupabase.from('courses').select('*').eq('id', courseId).maybeSingle();
                if (!courseRes.data) {
                    Swal.fire('ไม่พบคอร์ส', 'คอร์สนี้อาจถูกลบไปแล้ว', 'error').then(() => window.location.replace('admin_courses.html'));
                    return;
                }
                currentCourse = courseRes.data;

                let rawProfiles = [];
                const studentsRes = await mySupabase.from('profiles').select('*');
                if (studentsRes.data) {
                    rawProfiles = studentsRes.data;
                } else {
                    const fallbackStudents = await mySupabase.from('students').select('*');
                    if (fallbackStudents.data) rawProfiles = fallbackStudents.data;
                }

                allStudents = rawProfiles.map(p => ({
                    ...p,
                    uid: String(p.id || p.user_id || p.student_id || '')
                })).filter(p => !isUserAdmin(p));

                const enrollRes = await mySupabase.from('course_enrollments').select('*').eq('course_id', courseId);
                enrolledStudentIds = (enrollRes.data || []).map(e => String(e.student_id || e.user_id || ''));

                const modulesRes = await mySupabase.from('course_modules').select('*').eq('course_id', courseId).order('sequence_order', { ascending: true });
                courseModules = modulesRes.data || [];

                const lessonsRes = await mySupabase.from('course_lessons').select('*').order('sequence_order', { ascending: true });
                courseLessons = lessonsRes.data || [];

                const catsRes = await mySupabase.from('exam_categories').select('*');
                if (catsRes.data) {
                    catsRes.data.forEach(c => { categoriesMap[c.id] = c.name; });
                }

                const examsRes = await mySupabase.from('exams').select('*');
                if (examsRes.data) {
                    courseExams = examsRes.data.filter(ex => {
                        if (!ex.course_id) return false;
                        if (Array.isArray(ex.course_id)) return ex.course_id.includes(courseId);
                        return String(ex.course_id) === String(courseId);
                    });
                }

                const activeExamIds = new Set(courseExams.map(e => String(e.id)));
                const attemptsRes = await mySupabase.from('exam_attempts').select('*');
                allAttemptsRaw = (attemptsRes.data || []).filter(a => activeExamIds.has(String(a.exam_id)));

                courseAttemptsMap = {};
                allAttemptsRaw.forEach(att => {
                    const eId = String(att.exam_id);
                    if (!courseAttemptsMap[eId]) courseAttemptsMap[eId] = [];
                    const score = att.total_score !== undefined && att.total_score !== null ? Number(att.total_score) : (Number(att.score) || 0);
                    courseAttemptsMap[eId].push(score);
                });

                const qRes = await mySupabase.from('questions').select('id, exam_id');
                if (qRes.data) {
                    qRes.data.forEach(q => {
                        const eId = String(q.exam_id);
                        examQuestionsMap[eId] = (examQuestionsMap[eId] || 0) + 1;
                    });
                }

            } catch (err) {
                console.error("Initialization error:", err);
            } finally {
                Swal.close();
            }

            document.getElementById('navCourseTitle').innerHTML = '<span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard"></i></span> ' + (currentCourse?.title || 'คอร์สเรียน');
            document.getElementById('courseBadgeCode').textContent = currentCourse?.course_code || 'COURSE';
            document.getElementById('headerCourseTitle').textContent = currentCourse?.title || 'ไม่พบชื่อคอร์ส';
            document.getElementById('headerCourseDesc').textContent = currentCourse?.description || 'ไม่มีรายละเอียดคอร์ส';
            document.getElementById('statEnrolledStudents').textContent = enrolledStudentIds.length;

            switchCourseTab(currentTab);
        }

        function getSecureStreamUrl(url) {
            if (!url) return '';
            let videoUrl = url.trim();
            if (videoUrl.includes('drive.google.com')) {
                let fileId = '';
                if (videoUrl.includes('/file/d/')) {
                    const parts = videoUrl.split('/file/d/');
                    if (parts[1]) fileId = parts[1].split('/')[0];
                } else if (videoUrl.includes('id=')) {
                    const urlParamsObj = new URLSearchParams(videoUrl.split('?')[1]);
                    fileId = urlParamsObj.get('id');
                }
                if (fileId) {
                    return `https://docs.google.com/uc?export=download&id=${fileId}`;
                }
            }
            return videoUrl;
        }

        function openPreviewVideoModal() {
            const previewLessons = courseLessons.filter(l => l.video_url || l.video || l.url);
            if (previewLessons.length === 0) {
                Swal.fire('แจ้งเตือน', 'คอร์สนี้ยังไม่มีวิดีโอตัวอย่างหรือบทเรียนวิดีโอที่เพิ่มเข้ามา', 'warning');
                return;
            }

            let optionsHtml = previewLessons.map((l, idx) => `<option value="${l.video_url || l.video || l.url}">บทที่ ${idx + 1}: ${l.title}</option>`).join('');
            let initialStreamUrl = getSecureStreamUrl(previewLessons[0].video_url || previewLessons[0].video || previewLessons[0].url);
            const isDark = document.documentElement.classList.contains('dark');

            Swal.fire({
                title: '🎓 ตัวอย่างคลิปวิดีโอ (มุมมองนักเรียน)',
                width: '750px',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">เลือกบทเรียนวิดีโอตัวอย่าง:</label>
                            <select id="previewSelectLesson" onchange="changePreviewVideo(this)" class="w-full px-3 py-2 bg-slate-100 dark:bg-darkinput border border-slate-300 dark:border-slate-700 rounded-xl font-bold outline-none cursor-pointer">
                                ${optionsHtml}
                            </select>
                        </div>
                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-inner border border-slate-700 bg-black">
                            <video id="secureVideoPlayer" src="${initialStreamUrl}" controls controlsList="nodownload" oncontextmenu="return false;" class="w-full h-full object-contain"></video>
                        </div>
                        <div class="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/25 flex items-center gap-2">
                            <i class="fas fa-shield-check text-sm"></i> ล็อกปุ่มดาวน์โหลดเด็ดขาด (ห้ามคลิกขวา/ไม่มีปุ่มเซฟ) แต่ยังกดเล่น กรอ และปรับสปีดได้ปกติ
                        </div>
                    </div>
                `,
                showConfirmButton: true,
                confirmButtonText: 'ปิดหน้าต่างตัวอย่าง',
                confirmButtonColor: '#0284c7',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });
        }

        function changePreviewVideo(selectEl) {
            let streamUrl = getSecureStreamUrl(selectEl.value);
            const player = document.getElementById('secureVideoPlayer');
            if (player) {
                player.src = streamUrl;
                player.load();
                player.play();
            }
        }

        function switchCourseTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.course-tab-btn').forEach(btn => {
                btn.className = 'course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all';
            });
            const activeBtn = document.getElementById('tab-btn-' + tabName);
            if (activeBtn) activeBtn.className = 'course-tab-btn px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs shrink-0 transition-all shadow';

            const container = document.getElementById('tabContentContainer');
            if (tabName === 'curriculum') renderCurriculumTab(container);
            else if (tabName === 'students') renderStudentsTab(container);
            else if (tabName === 'exams') renderExamsTab(container);
            else if (tabName === 'analytics') renderAnalyticsTab(container);
        }

        function renderCurriculumTab(container) {
            let modulesHtml = '';
            if (courseModules.length > 0) {
                modulesHtml = courseModules.map((m, idx) => {
                    const lessons = courseLessons.filter(l => String(l.module_id) === String(m.id));
                    let lessonsHtml = lessons.length > 0 ? lessons.map(l => {
                        const type = l.content_type || l.type || (l.video_url ? 'video' : (l.pdf_url ? 'pdf' : 'description'));
                        let icon = 'fa-play-circle text-purple-500';
                        if (type === 'pdf') icon = 'fa-file-pdf text-rose-500';
                        else if (type === 'description') icon = 'fa-align-left text-sky-500';

                        return `
                            <div class="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl flex justify-between items-center border dark:border-slate-700">
                                <div class="flex items-center gap-2"><i class="fas ${icon}"></i><span class="font-bold text-xs">${l.title}</span></div>
                                <div class="flex items-center gap-1.5">
                                    <button onclick="openLessonModal('${m.id}', '${l.id}')" class="px-2.5 py-1 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white rounded-lg text-[11px] font-bold transition-all"><i class="fas fa-edit mr-1"></i> แก้ไข</button>
                                    <button onclick="deleteLesson('${l.id}')" class="px-2 py-1 bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white rounded-lg text-[11px] transition-all"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('') : '<div class="text-xs text-slate-400 italic py-2">ยังไม่มีเนื้อหาในบทนี้</div>';

                    return `
                        <div class="hitech-card p-6 rounded-3xl space-y-4 border-l-4 border-l-purple-500">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-600 font-bold flex items-center justify-center text-xs">${idx + 1}</span>
                                    <h4 class="font-extrabold text-base text-slate-900 dark:text-white">${m.title}</h4>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="openLessonModal('${m.id}')" class="px-3 py-1.5 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white rounded-xl text-xs font-bold transition-all"><i class="fas fa-plus mr-1"></i> เพิ่มเนื้อหา / ไฟล์ / คลิป</button>
                                    <button onclick="deleteModule('${m.id}')" class="w-8 h-8 flex items-center justify-center rounded-xl bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white transition-all"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                            <div class="space-y-2 pl-4 border-l-2 border-purple-500/20">${lessonsHtml}</div>
                        </div>
                    `;
                }).join('');
            } else {
                modulesHtml = '<div class="hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs">ยังไม่มีบทเรียนในคอร์สนี้</div>';
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="hitech-card p-6 rounded-3xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-900 dark:text-white">โครงสร้างบทเรียนในคอร์ส</h3>
                            <p class="text-xs text-slate-500">จัดการเพิ่มบทเรียน วิดีโอ (โหลดไม่ได้) ไฟล์ PDF (ดาวน์โหลดได้) และรายละเอียด (Description)</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openModuleModal()" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow transition-all flex items-center gap-1.5"><i class="fas fa-plus"></i> เพิ่มบทเรียนใหม่</button>
                        </div>
                    </div>
                    <div class="space-y-4">${modulesHtml}</div>

        function filterAndRenderCourseStudents() {
            const tbody = document.getElementById('courseStudentsTableBody');
            if (!tbody) return;

            const keyword = (document.getElementById('courseStudentSearch')?.value || '').trim().toLowerCase();
            const sortMode = document.getElementById('courseStudentSort')?.value || 'default';

            let enrolledStudents = allStudents.filter(s => enrolledStudentIds.includes(s.uid) || enrolledStudentIds.includes(String(s.id)) || enrolledStudentIds.includes(String(s.user_id)));

            let filtered = enrolledStudents.filter(s => {
                if (!keyword) return true;
                const fullName = `${s.first_name || ''} ${s.last_name || ''} ${s.full_name || ''}`.toLowerCase();
                const sIdCode = String(s.student_id || '').toLowerCase();
                return fullName.includes(keyword) || sIdCode.includes(keyword);
            });

            filtered.sort((a, b) => {
                if (sortMode === 'id_asc') return String(a.student_id || '').localeCompare(String(b.student_id || ''));
                else if (sortMode === 'name_asc') return String(a.first_name || '').localeCompare(String(b.first_name || ''));
                return 0;
            });

            const countLbl = document.getElementById('courseStudentCountLabel');
            if (countLbl) countLbl.textContent = `แสดง ${filtered.length} รายการ (จากทั้งหมด ${enrolledStudents.length} คน)`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">ไม่พบรายชื่อนักเรียนที่ค้นหา</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((s, idx) => {
                const sId = s.id || s.user_id;
                const fullName = `${s.first_name || '-'} ${s.last_name || ''}`.trim() || s.full_name || '-';
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-mono font-bold">${idx + 1}</td>
                        <td class="p-3 font-mono text-purple-600">${s.student_id || '-'}</td>
                        <td class="p-3 font-bold">${fullName}</td>
                        <td class="p-3">${s.nickname || '-'}</td>
                        <td class="p-3">${s.grade_level || '-'} (${s.school || '-'})</td>

                                <i class="fas fa-eye"></i> ดูภาพรวม
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

                        <div class="hitech-card p-5 rounded-2xl flex items-center gap-4 border-l-4 border-l-indigo-500"><div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-paper-plane"></i></div><div><span class="text-xs text-slate-400 font-bold block">จำนวนการส่งข้อสอบรวม</span><span id="anTotalSubmissions" class="text-xl font-extrabold text-indigo-600 dark:text-indigo-400">0 ครั้ง</span></div></div>
                        <div class="hitech-card p-5 rounded-2xl flex items-center gap-4 border-l-4 border-l-emerald-500"><div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-users"></i></div><div><span class="text-xs text-slate-400 font-bold block">นักเรียนในคอร์สนี้</span><span id="anTotalStudentsCount" class="text-xl font-extrabold text-emerald-600 dark:text-emerald-400">0 คน</span></div></div>
                        <div class="hitech-card p-5 rounded-2xl flex items-center gap-4 border-l-4 border-l-amber-500"><div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-chart-line"></i></div><div><span class="text-xs text-slate-400 font-bold block">ค่าเฉลี่ย Percentile คลาส</span><span id="anAvgPercentile" class="text-xl font-extrabold text-amber-500">--%</span></div></div>
                    </div>
                </div>
            `;
        }

        function getExamAverageScore(examId) {
            const scores = courseAttemptsMap[String(examId)] || [];
            if (scores.length === 0) return '-';
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
        }

        initCourseDetail();
    </script>
