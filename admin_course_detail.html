<head>

    <title>LMS | ควบคุมเนื้อหาและสถิติภายในคอร์ส</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .glow-badge-sky { background: rgba(2, 132, 199, 0.1); color: #0284c7; border: 1px solid rgba(56, 189, 248, 0.3); }
        .dark .glow-badge-sky { background: rgba(2, 132, 199, 0.2); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
        
        .exam-catalog-card {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.03) 0%, rgba(99, 102, 241, 0.05) 100%);
            border: 1px solid rgba(2, 132, 199, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

        .dark .exam-catalog-card {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.08) 0%, rgba(99, 102, 241, 0.12) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .exam-catalog-card:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: rgba(2, 132, 199, 0.8);
            box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.25);
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin_courses.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-purple-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 id="navCourseTitle" class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard"></i></span>

                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Course Header Info Banner -->
        <div class="hitech-card p-6 sm:p-8 rounded-3xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-l-8 border-l-purple-500">
            <div class="space-y-2">
                <div id="courseBadgeCode" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 font-mono font-bold text-xs border border-purple-500/20">
                    COURSE
                </div>
                <h2 id="headerCourseTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">กำลังโหลด...</h2>
                <p id="headerCourseDesc" class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-2xl">กำลังดึงรายละเอียด...</p>

            <div class="flex items-center gap-3 shrink-0">
                <div class="p-4 bg-purple-500/10 border border-purple-500/20 rounded-2xl text-center">
                    <div id="statEnrolledStudents" class="text-xl font-extrabold text-purple-600 dark:text-purple-400">0</div>
                    <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">นักเรียนในคอร์ส</div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs Inside Course -->
        <div class="flex gap-2 overflow-x-auto pb-2 border-b border-purple-500/20">
            <button onclick="switchCourseTab('curriculum')" id="tab-btn-curriculum" class="course-tab-btn px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs shrink-0 transition-all shadow">
                <i class="fas fa-book-open mr-1.5"></i> บทเรียน & เนื้อหา
            </button>
            <button onclick="switchCourseTab('students')" id="tab-btn-students" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-users mr-1.5"></i> นักเรียนในคอร์ส
            </button>
            <button onclick="switchCourseTab('exams')" id="tab-btn-exams" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-file-signature mr-1.5"></i> ชุดข้อสอบทั้งหมดในคอร์ส (แยกตามหมวดหมู่)
            </button>
            <button onclick="switchCourseTab('analytics')" id="tab-btn-analytics" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-chart-pie mr-1.5"></i> สถิติ & ผลคะแนน
            </button>
            <button onclick="switchCourseTab('announcements')" id="tab-btn-announcements" class="course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all">
                <i class="fas fa-bullhorn mr-1.5"></i> ประกาศในคอร์ส
            </button>
        </div>

        <!-- Tab Content Container -->
        <div id="tabContentContainer" class="space-y-4"></div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        let currentCourse = null;
        let allStudents = [];
        let enrolledStudentIds = [];
        let courseModules = [];
        let courseLessons = [];
        let courseExams = [];
        let courseAttemptsMap = {};
        let courseAnnouncements = [];
        let allAttemptsRaw = [];
        let examQuestionsMap = {};
        let categoriesMap = {};
        let chart1 = null, chart2 = null, chart3 = null;
        let currentTab = 'curriculum';

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function isUserAdmin(profileObj) {
            if (!profileObj) return false;
            const role = String(profileObj.role || profileObj.user_role || '').toLowerCase();
            const email = String(profileObj.email || '').toLowerCase();
            if (role === 'admin' || role === 'teacher' || role === 'instructor') return true;
            if (email.includes('admin') || email.includes('teacher')) return true;
            return false;
        }

        async function initCourseDetail() {
            if (!courseId) { window.location.replace('admin_courses.html'); return; }

            Swal.fire({ title: 'กำลังโหลดคอร์ส...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const courseRes = await mySupabase.from('courses').select('*').eq('id', courseId).single();
                if (courseRes.error || !courseRes.data) {
                    Swal.fire('ไม่พบคอร์ส', 'คอร์สนี้อาจถูกลบไปแล้ว', 'error').then(() => window.location.replace('admin_courses.html'));
                    return;
                }
                currentCourse = courseRes.data;

                const studentsRes = await mySupabase.from('profiles').select('*');
                if (studentsRes.data) {
                    allStudents = studentsRes.data.filter(p => !isUserAdmin(p));
                }

                const enrollRes = await mySupabase.from('course_enrollments').select('*').eq('course_id', courseId);
                enrolledStudentIds = (enrollRes.data || []).map(e => String(e.student_id));

                const modulesRes = await mySupabase.from('course_modules').select('*').eq('course_id', courseId).order('sequence_order', { ascending: true });
                courseModules = modulesRes.data || [];

                const lessonsRes = await mySupabase.from('course_lessons').select('*').order('sequence_order', { ascending: true });
                courseLessons = lessonsRes.data || [];

                const catsRes = await mySupabase.from('exam_categories').select('*');
                if (catsRes.data) {
                    catsRes.data.forEach(c => { categoriesMap[c.id] = c.name; });
                }

                const examsRes = await mySupabase.from('exams').select('*');
                if (examsRes.data) {
                    courseExams = examsRes.data.filter(ex => {
                        if (!ex.course_id) return false;
                        if (Array.isArray(ex.course_id)) return ex.course_id.includes(courseId);
                        return String(ex.course_id) === String(courseId);
                    });
                }

                const activeExamIds = new Set(courseExams.map(e => String(e.id)));
                const attemptsRes = await mySupabase.from('exam_attempts').select('*');
                allAttemptsRaw = (attemptsRes.data || []).filter(a => activeExamIds.has(String(a.exam_id)));

                courseAttemptsMap = {};
                allAttemptsRaw.forEach(att => {
                    const eId = String(att.exam_id);
                    if (!courseAttemptsMap[eId]) courseAttemptsMap[eId] = [];
                    const score = att.total_score !== undefined && att.total_score !== null ? Number(att.total_score) : (Number(att.score) || 0);
                    courseAttemptsMap[eId].push(score);
                });

                const qRes = await mySupabase.from('questions').select('id, exam_id');
                if (qRes.data) {
                    qRes.data.forEach(q => {
                        const eId = String(q.exam_id);
                        examQuestionsMap[eId] = (examQuestionsMap[eId] || 0) + 1;
                    });
                }

                const annRes = await mySupabase.from('announcements').select('*').eq('course_id', courseId);
                courseAnnouncements = annRes.data || [];

            } catch (err) {
                console.error("Initialization error:", err);
            } finally {
                Swal.close();
            }

            document.getElementById('navCourseTitle').innerHTML = '<span class="w-7 h-7 rounded-lg bg-gradient-to-r from-purple-500 to-indigo-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chalkboard"></i></span> ' + currentCourse.title;
            document.getElementById('courseBadgeCode').textContent = currentCourse.course_code || 'COURSE';
            document.getElementById('headerCourseTitle').textContent = currentCourse.title;
            document.getElementById('headerCourseDesc').textContent = currentCourse.description || 'ไม่มีรายละเอียดคอร์ส';
            document.getElementById('statEnrolledStudents').textContent = enrolledStudentIds.length;

            switchCourseTab(currentTab);
        }

        function switchCourseTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.course-tab-btn').forEach(btn => {
                btn.className = 'course-tab-btn px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-xs shrink-0 transition-all';
            });
            const activeBtn = document.getElementById('tab-btn-' + tabName);
            if (activeBtn) activeBtn.className = 'course-tab-btn px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs shrink-0 transition-all shadow';

            const container = document.getElementById('tabContentContainer');
            if (tabName === 'curriculum') renderCurriculumTab(container);
            else if (tabName === 'students') renderStudentsTab(container);
            else if (tabName === 'exams') renderExamsTab(container);
            else if (tabName === 'analytics') renderAnalyticsTab(container);
            else if (tabName === 'announcements') renderAnnouncementsTab(container);
        }

        function renderCurriculumTab(container) {
            let modulesHtml = '';
            if (courseModules.length > 0) {
                modulesHtml = courseModules.map((m, idx) => {
                    const lessons = courseLessons.filter(l => String(l.module_id) === String(m.id));
                    let lessonsHtml = lessons.length > 0 ? lessons.map(l => `
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl flex justify-between items-center border dark:border-slate-700">
                            <div class="flex items-center gap-2"><i class="fas fa-play-circle text-purple-500"></i><span class="font-bold text-xs">${l.title}</span></div>
                            <button onclick="deleteLesson('${l.id}')" class="text-slate-400 hover:text-rose-500 text-xs"><i class="fas fa-trash"></i></button>
                        </div>
                    `).join('') : '<div class="text-xs text-slate-400 italic py-2">ยังไม่มีเนื้อหาย่อยในบทนี้</div>';

                    return `
                        <div class="hitech-card p-6 rounded-3xl space-y-4 border-l-4 border-l-purple-500">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <span class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-600 font-bold flex items-center justify-center text-xs">${idx + 1}</span>
                                    <h4 class="font-extrabold text-base text-slate-900 dark:text-white">${m.title}</h4>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="openLessonModal('${m.id}')" class="px-3 py-1.5 bg-sky-500/10 text-sky-600 hover:bg-sky-500 hover:text-white rounded-xl text-xs font-bold transition-all"><i class="fas fa-plus mr-1"></i> เพิ่มเนื้อหาย่อย</button>
                                    <button onclick="deleteModule('${m.id}')" class="w-8 h-8 flex items-center justify-center rounded-xl bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white transition-all"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </div>
                            <div class="space-y-2 pl-4 border-l-2 border-purple-500/20">${lessonsHtml}</div>
                        </div>
                    `;
                }).join('');
            } else {
                modulesHtml = '<div class="hitech-card p-12 rounded-3xl text-center text-slate-400 text-xs">ยังไม่มีบทเรียนในคอร์สนี้</div>';
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="hitech-card p-6 rounded-3xl flex justify-between items-center">
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-900 dark:text-white">โครงสร้างบทเรียนในคอร์ส</h3>
                            <p class="text-xs text-slate-500">จัดการเพิ่มบทเรียน (Modules) และบทเรียนย่อย (Lessons)</p>
                        </div>
                        <button onclick="openModuleModal()" class="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl text-xs shadow transition-all flex items-center gap-1.5"><i class="fas fa-plus"></i> เพิ่มบทเรียนใหม่</button>
                    </div>
                    <div class="space-y-4">${modulesHtml}</div>
                </div>
            `;
        }

        async function openModuleModal() {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: title } = await Swal.fire({
                title: '📚 เพิ่มบทเรียนหลัก (Module)',
                input: 'text',
                inputPlaceholder: 'เช่น บทที่ 1: พื้นฐานการเขียนโปรแกรม',
                showCancelButton: true,
                confirmButtonText: 'สร้างบทเรียน',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });

            if (title) {
                await mySupabase.from('course_modules').insert([{ course_id: courseId, title: title.trim(), sequence_order: courseModules.length + 1 }]);
                initCourseDetail();
            }
        }

        async function deleteModule(modId) {
            const { isConfirmed } = await Swal.fire({ title: 'ลบบทเรียนนี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
            if (isConfirmed) {
                await mySupabase.from('course_modules').delete().eq('id', modId);
                initCourseDetail();
            }
        }

        async function openLessonModal(moduleId) {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: formValues } = await Swal.fire({
                title: '🎬 เพิ่มเนื้อหาย่อย (Lesson / Video)',
                width: '550px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ชื่อหัวข้อเนื้อหา/วิดีโอ <span class="text-red-500">*</span></label>
                            <input id="swalLessonTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ลิงก์วิดีโอ (YouTube / Video URL)</label>
                            <input id="swalLessonVideo" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-mono">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกเนื้อหา',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => {
                    const title = document.getElementById('swalLessonTitle').value.trim();
                    if (!title) { Swal.showValidationMessage('กรุณากรอกชื่อหัวข้อ'); return false; }
                    return {
                        module_id: moduleId,
                        title: title,
                        video_url: document.getElementById('swalLessonVideo').value.trim()
                    };
                }
            });

            if (formValues) {
                await mySupabase.from('course_lessons').insert([formValues]);
                initCourseDetail();
            }
        }

        async function deleteLesson(lessonId) {
            await mySupabase.from('course_lessons').delete().eq('id', lessonId);
            initCourseDetail();
        }

        function renderStudentsTab(container) {
            const enrolledStudents = allStudents.filter(s => enrolledStudentIds.includes(String(s.id || s.user_id)));
            
            container.innerHTML = `
                <div class="hitech-card p-6 rounded-3xl space-y-4">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 pb-4 border-b border-purple-500/20">
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-900 dark:text-white">รายชื่อนักเรียนในคอร์ส</h3>
                            <span id="courseStudentCountLabel" class="text-xs text-slate-400">แสดง ${enrolledStudents.length} รายการ</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            <select id="courseStudentSort" onchange="filterAndRenderCourseStudents()" class="px-3 py-1.5 bg-slate-100 dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-xl text-xs font-bold outline-none">
                                <option value="default">-- เรียงลำดับ --</option>
                                <option value="id_asc">รหัสนักเรียน น้อย -> มาก</option>
                                <option value="name_asc">ชื่อ ก -> ฮ</option>
                            </select>
                            <div class="relative flex-1 md:w-60">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-search text-xs"></i></span>
                                <input type="text" id="courseStudentSearch" oninput="filterAndRenderCourseStudents()" placeholder="ค้นหาชื่อ หรือ รหัส..." class="w-full pl-9 pr-3 py-1.5 bg-slate-100 dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-xl text-xs">
                            </div>

        function filterAndRenderCourseStudents() {
            const tbody = document.getElementById('courseStudentsTableBody');
            if (!tbody) return;

            const keyword = (document.getElementById('courseStudentSearch')?.value || '').trim().toLowerCase();
            const sortMode = document.getElementById('courseStudentSort')?.value || 'default';

            let enrolledStudents = allStudents.filter(s => enrolledStudentIds.includes(String(s.id || s.user_id)));

            let filtered = enrolledStudents.filter(s => {
                if (!keyword) return true;
                const fullName = `${s.first_name || ''} ${s.last_name || ''} ${s.full_name || ''}`.toLowerCase();
                const sIdCode = String(s.student_id || '').toLowerCase();
                return fullName.includes(keyword) || sIdCode.includes(keyword);
            });

            filtered.sort((a, b) => {
                if (sortMode === 'id_asc') {
                    return String(a.student_id || '').localeCompare(String(b.student_id || ''));
                } else if (sortMode === 'name_asc') {
                    return String(a.first_name || '').localeCompare(String(b.first_name || ''));
                }
                return 0;
            });

            const countLbl = document.getElementById('courseStudentCountLabel');
            if (countLbl) countLbl.textContent = `แสดง ${filtered.length} รายการ (จากทั้งหมด ${enrolledStudents.length} คน)`;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">ไม่พบรายชื่อนักเรียนที่ค้นหา</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((s, idx) => {
                const sId = s.id || s.user_id;
                const fullName = `${s.first_name || '-'} ${s.last_name || ''}`.trim() || s.full_name || '-';
                return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-mono font-bold">${idx + 1}</td>
                        <td class="p-3 font-mono text-purple-600">${s.student_id || '-'}</td>
                        <td class="p-3 font-bold">${fullName}</td>
                        <td class="p-3">${s.nickname || '-'}</td>
                        <td class="p-3">${s.grade_level || '-'} (${s.school || '-'})</td>
                        <td class="p-3 text-center">
                            <button onclick="viewIndividualStudentProfile('${sId}')" class="px-3 py-1 bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold text-[11px] rounded-xl shadow hover:opacity-90 transition-all flex items-center gap-1 mx-auto">
                                <i class="fas fa-eye"></i> ดูภาพรวม
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function openManageEnrollmentsModal() {
            let studentCheckboxes = allStudents.map(s => {
                const sId = s.id || s.user_id;
                const isChecked = enrolledStudentIds.includes(String(sId)) ? 'checked' : '';
                return `
                    <label class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/80 rounded-xl border dark:border-slate-700 cursor-pointer hover:border-purple-500">
                        <div class="flex items-center gap-2.5">
                            <input type="checkbox" name="courseStudent" value="${sId}" ${isChecked} class="w-4 h-4 accent-purple-600 rounded">
                            <div>
                                <div class="font-bold">${s.first_name || '-'} ${s.last_name || ''}</div>
                                <div class="text-[10px] text-slate-400 font-mono">รหัส: ${s.student_id || '-'} | ชั้น: ${s.grade_level || '-'}</div>
                            </div>
                        </div>
                    </label>
                `;
            }).join('');

            const isDark = document.documentElement.classList.contains('dark');
            const { isConfirmed } = await Swal.fire({
                title: '👥 จัดการรายชื่อนักเรียนในคอร์ส',
                width: '600px',
                html: `<div class="space-y-2 max-h-72 overflow-y-auto pr-1 text-left">${studentCheckboxes}</div>`,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                confirmButtonColor: '#9333ea',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });

            if (isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const checkboxes = document.querySelectorAll('input[name="courseStudent"]:checked');
                const selectedIds = Array.from(checkboxes).map(cb => cb.value);

                await mySupabase.from('course_enrollments').delete().eq('course_id', courseId);
                if (selectedIds.length > 0) {
                    const rows = selectedIds.map(sId => ({ student_id: sId, course_id: courseId }));
                    await mySupabase.from('course_enrollments').insert(rows);
                }
                initCourseDetail();
                Swal.fire({ icon: 'success', title: 'สำเร็จ!', timer: 1000, showConfirmButton: false });
            }
        }

        function populateAnalyticsData() {
            const activeExams = courseExams.filter(e => e.status !== 'draft');
            const totalExamsEl = document.getElementById('anTotalExams');
            const totalSubsEl = document.getElementById('anTotalSubmissions');
            const totalStuEl = document.getElementById('anTotalStudentsCount');
            const avgPctEl = document.getElementById('anAvgPercentile');

            if (!totalExamsEl) return;

            totalExamsEl.textContent = `${activeExams.length} ชุด`;
            totalSubsEl.textContent = `${allAttemptsRaw.length} ครั้ง`;
            totalStuEl.textContent = `${enrolledStudentIds.length} คน`;

            let studentStats = {};
            let enrolledProfiles = allStudents.filter(s => enrolledStudentIds.includes(String(s.id || s.user_id)));

            enrolledProfiles.forEach(s => {
                const sId = s.id || s.user_id || s.student_id;
                studentStats[sId] = { totalScore: 0, count: 0, totalMax: 0, name: `${s.first_name || ''} ${s.last_name || ''}`.trim() || s.username || 'นักเรียน' };
            });

            allAttemptsRaw.forEach(a => {
                const sId = a.student_id || a.user_id;
                if (!studentStats[sId]) {
                    const prof = allStudents.find(p => String(p.id || p.user_id) === String(sId));
                    studentStats[sId] = { totalScore: 0, count: 0, totalMax: 0, name: prof ? `${prof.first_name || ''} ${prof.last_name || ''}`.trim() : 'นักเรียน' };
                }
                const score = a.total_score !== undefined && a.total_score !== null ? Number(a.total_score) : (Number(a.score) || 0);
                const max = examQuestionsMap[String(a.exam_id)] || 10;
                studentStats[sId].totalScore += score;
                studentStats[sId].totalMax += max;
                studentStats[sId].count += 1;
            });

            let studentList = Object.keys(studentStats).map(id => {
                const st = studentStats[id];
                const avgPct = st.totalMax > 0 ? (st.totalScore / st.totalMax) * 100 : 0;
                return { id, name: st.name, total: st.totalScore, avgPct: avgPct.toFixed(1), count: st.count };
            });

            const totalCount = studentList.length || 1;
            studentList.forEach(s => {
                const lower = studentList.filter(o => o.total < s.total).length;
                s.percentile = Math.round((lower / totalCount) * 100);
            });

            if (studentList.length > 0) {
                const sumPct = studentList.reduce((acc, curr) => acc + curr.percentile, 0);
                avgPctEl.textContent = `${Math.round(sumPct / studentList.length)}%`;
            }

            let topList = [...studentList].sort((a, b) => b.total - a.total).slice(0, 5);
            const topEl = document.getElementById('anTopPerformers');
            if (topEl) {
                topEl.innerHTML = topList.length === 0 ? '<div class="text-center py-4 text-slate-400 text-xs">ยังไม่มีข้อมูลคะแนน</div>' : topList.map((s, idx) => `
                    <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl flex justify-between items-center text-xs border border-slate-200 dark:border-slate-800">
                        <div class="flex items-center gap-2.5">
                            <span class="w-6 h-6 rounded-full bg-amber-100 text-amber-600 font-bold flex items-center justify-center text-xs">${idx + 1}</span>
                            <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>
                        </div>
                        <span class="font-extrabold text-indigo-600 dark:text-indigo-400">${s.total} คะแนน</span>
                    </div>
                `).join('');
            }

            let riskList = studentList.filter(s => Number(s.avgPct) < 50 && s.count > 0);
            const riskEl = document.getElementById('anAtRiskStudents');
            if (riskEl) {
                riskEl.innerHTML = riskList.length === 0 ? '<div class="p-3 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 rounded-xl text-xs font-bold text-center">🎉 ไม่มีนักเรียนกลุ่มเสี่ยง</div>' : riskList.map(s => `
                    <div class="p-3 bg-rose-50 dark:bg-rose-950/20 rounded-xl flex justify-between items-center text-xs border border-rose-200">
                        <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>
                        <span class="px-2.5 py-1 bg-rose-100 text-rose-600 font-bold rounded-lg text-xs">เฉลี่ย ${s.avgPct}%</span>
                    </div>
                `).join('');
            }

            const labels = activeExams.map(e => e.title);
            const avgPercentages = activeExams.map(e => {
                const matched = allAttemptsRaw.filter(a => String(a.exam_id) === String(e.id));
                if (matched.length === 0) return 0;
                const max = examQuestionsMap[String(e.id)] || 10;
                const sum = matched.reduce((acc, curr) => acc + (curr.total_score !== undefined ? Number(curr.total_score) : Number(curr.score) || 0), 0);
                return Number(((sum / matched.length / max) * 100).toFixed(1));
            });

            const subCounts = activeExams.map(e => allAttemptsRaw.filter(a => String(a.exam_id) === String(e.id)).length);

            const ctx1 = document.getElementById('anTrendChart');
            if (ctx1) {
                if (chart1) chart1.destroy();
                chart1 = new Chart(ctx1.getContext('2d'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'ร้อยละคะแนนเฉลี่ย (%)', data: avgPercentages, backgroundColor: '#0284c7', borderRadius: 8 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            }

            const ctx2 = document.getElementById('anSubRateChart');
            if (ctx2) {
                if (chart2) chart2.destroy();
                chart2 = new Chart(ctx2.getContext('2d'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'จำนวนคนส่ง', data: subCounts, backgroundColor: '#6366f1', borderRadius: 8 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, suggestedMax: enrolledStudentIds.length || 10 } } }
                });
            }

            let gradeRanges = [0, 0, 0, 0];
            allAttemptsRaw.forEach(a => {
                const score = a.total_score !== undefined && a.total_score !== null ? Number(a.total_score) : (Number(a.score) || 0);
                const max = examQuestionsMap[String(a.exam_id)] || 10;
                const pct = max > 0 ? (score / max) * 100 : 0;
                if (pct < 50) gradeRanges[0]++;
                else if (pct < 70) gradeRanges[1]++;
                else if (pct < 85) gradeRanges[2]++;
                else gradeRanges[3]++;
            });

            const ctx3 = document.getElementById('anGradeDistChart');
            if (ctx3) {
                if (chart3) chart3.destroy();
                chart3 = new Chart(ctx3.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: ['ต่ำกว่า 50%', '50%-69%', '70%-84%', '85%-100%'],
                        datasets: [{ data: gradeRanges, backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'], borderWidth: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                });
            }
        }

        // --- ดูภาพรวมผลการเรียนรายบุคคล (Individual Student Profile Modal) ---
        function viewIndividualStudentProfile(studentId) {
            const profile = allStudents.find(s => String(s.id || s.user_id) === String(studentId));
            const name = profile ? `${profile.first_name || '-'} ${profile.last_name || ''}`.trim() : 'นักเรียน';
            const studentIdCode = profile?.student_id || '-';
            const studentAttempts = allAttemptsRaw.filter(a => String(a.student_id || a.user_id) === String(studentId));

            const totalScore = studentAttempts.reduce((acc, curr) => acc + (curr.total_score !== undefined ? Number(curr.total_score) : Number(curr.score) || 0), 0);
            const avg = studentAttempts.length > 0 ? (totalScore / studentAttempts.length).toFixed(1) : '0.0';

            let attemptsHtml = studentAttempts.length === 0 ? `<tr><td colspan="5" class="text-center py-6 text-slate-400">ยังไม่มีประวัติการทำข้อสอบ</td></tr>` : studentAttempts.map((att, idx) => {
                const exam = courseExams.find(e => String(e.id) === String(att.exam_id));
                const examTitle = exam ? exam.title : `ข้อสอบรหัส: ${att.exam_id}`;
                const score = att.total_score !== undefined ? Number(att.total_score) : Number(att.score) || 0;
                const dateStr = att.submission_time || att.submitted_at || att.created_at ? new Date(att.submission_time || att.submitted_at || att.created_at).toLocaleDateString('th-TH') : '-';

                return `
                    <tr class="border-b border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-mono font-bold">${idx + 1}</td>
                        <td class="p-3 font-bold text-slate-800 dark:text-slate-200">${examTitle}</td>
                        <td class="p-3 text-center font-mono font-extrabold text-indigo-600 dark:text-indigo-400">${score} คะแนน</td>
                        <td class="p-3 text-center text-slate-400 text-[11px]">${dateStr}</td>
                        <td class="p-3 text-center">
                            <button onclick="viewStudentExamDetailInModal('${studentId}', '${att.exam_id}')" class="px-2.5 py-1 bg-sky-500/10 text-sky-600 dark:text-sky-400 hover:bg-sky-500 hover:text-white font-bold rounded-lg transition-all text-[11px]">
                                <i class="fas fa-search-plus mr-1"></i> เช็คข้อสอบชุดนี้
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            const isDark = document.documentElement.classList.contains('dark');

            Swal.fire({
                title: '👤 ภาพรวมผลการเรียนรายบุคคล',
                html: `
                    <div class="text-left space-y-4 max-h-[70vh] overflow-y-auto pr-1 text-xs">
                        <div class="flex justify-between items-center p-4 rounded-2xl bg-sky-500/10 border border-sky-500/30">
                            <div class="space-y-1">
                                <div class="text-sm font-extrabold text-sky-600 dark:text-sky-400">${name}</div>
                                <div class="text-slate-500 dark:text-slate-400">รหัสนักเรียน: <span class="font-mono font-bold text-slate-800 dark:text-slate-200">${studentIdCode}</span></div>
                                <div class="flex gap-4 pt-1 font-semibold text-slate-700 dark:text-slate-300">
                                    <span>ทำแล้ว: <strong>${studentAttempts.length} ชุด</strong></span>
                                    <span>คะแนนรวม: <strong class="text-indigo-600 dark:text-indigo-400">${totalScore}</strong></span>
                                    <span>เฉลี่ย: <strong class="text-amber-500">${avg}</strong></span>
                                </div>
                            </div>
                            <button onclick="printStudentSummaryReport('${studentId}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold rounded-xl shadow transition-all flex items-center gap-1.5 shrink-0">
                                <i class="fas fa-print"></i> ปริ้นท์ใบสรุป
                            </button>
                        </div>
                        <div class="space-y-2">
                            <h4 class="font-extrabold text-slate-800 dark:text-slate-200">ประวัติการทำข้อสอบรายชุด</h4>
                            <div class="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-xl">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold border-b border-slate-200 dark:border-slate-800">
                                            <th class="p-3">ลำดับ</th><th class="p-3">ชุดข้อสอบ</th><th class="p-3 text-center">คะแนน</th><th class="p-3 text-center">วันที่ทำ</th><th class="p-3 text-center">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody>${attemptsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `,
                width: '750px',
                confirmButtonColor: '#0284c7',
                confirmButtonText: 'ปิดหน้าต่าง',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            });
        }

        async function viewStudentExamDetailInModal(studentId, examId) {
            Swal.fire({ title: 'กำลังโหลดรายละเอียดข้อสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const att = allAttemptsRaw.find(a => String(a.student_id || a.user_id) === String(studentId) && String(a.exam_id) === String(examId));
            const exam = courseExams.find(e => String(e.id) === String(examId));
            const profile = allStudents.find(s => String(s.id || s.user_id) === String(studentId));
            const name = profile ? `${profile.first_name || '-'} ${profile.last_name || ''}`.trim() : 'นักเรียน';

            const { data: questions } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            Swal.close();

            if (!questions || questions.length === 0) {
                Swal.fire('แจ้งเตือน', 'ไม่พบรายการคำถามในชุดข้อสอบนี้', 'warning');
                return;
            }

            const score = att ? (att.total_score !== undefined ? Number(att.total_score) : Number(att.score) || 0) : 0;

            let questionsHtml = questions.map((q, index) => {
                let rawAns = att ? (att.answer_saved || att.answers || att.user_answers) : null;
                if (typeof rawAns === 'string') { try { rawAns = JSON.parse(rawAns); } catch(e){} }
                let userAns = '-';
                if (rawAns && typeof rawAns === 'object') {
                    userAns = rawAns[q.id] || rawAns[String(q.id)] || rawAns[q.question_number] || '-';
                }
                const correctAns = q.correct_answer || q.answer || q.solution || '-';
                const isCorrect = String(userAns).trim().toLowerCase() === String(correctAns).trim().toLowerCase();

                return `
                    <div class="p-3.5 rounded-xl bg-slate-100 dark:bg-slate-900 border ${isCorrect ? 'border-emerald-500/40' : 'border-rose-500/40'} space-y-1.5 text-xs text-left">
                        <div class="flex justify-between font-extrabold">
                            <span class="text-slate-800 dark:text-slate-100">ข้อที่ ${q.question_number}: ${q.question_text || q.content || 'โจทย์คำถาม'}</span>
                            <span class="${isCorrect ? 'text-emerald-500' : 'text-rose-500'}">${isCorrect ? '✅ ถูกต้อง' : '❌ ตอบผิด'}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400">
                            นักเรียนตอบ: <span class="font-bold text-slate-800 dark:text-slate-200">${userAns}</span> | เฉลย: <span class="font-bold text-emerald-600">${correctAns}</span>
                        </div>
                    </div>
                `;
            }).join('');

            const isDark = document.documentElement.classList.contains('dark');
            Swal.fire({
                title: '📋 ตรวจสอบผลการตอบรายข้อ',
                html: `
                    <div class="space-y-4 max-h-[70vh] overflow-y-auto pr-1 text-xs">
                        <div class="p-3.5 rounded-xl bg-sky-500/10 border border-sky-500/30 flex justify-between items-center">
                            <div>
                                <div class="font-extrabold text-sky-600 dark:text-sky-400">${exam ? exam.title : 'ชุดข้อสอบ'}</div>
                                <div class="text-slate-500">นักเรียน: <strong>${name}</strong></div>
                            </div>
                            <div class="text-right font-extrabold text-indigo-600 dark:text-indigo-400 text-sm">
                                ${score} / ${questions.length} คะแนน
                            </div>
                        </div>
                        <div class="space-y-2">${questionsHtml}</div>
                    </div>
                `,
                width: '700px',
                showCancelButton: true,
                confirmButtonText: 'กลับหน้าโปรไฟล์',
                cancelButtonText: 'ปิด',
                confirmButtonColor: '#0284c7',
                background: isDark ? '#090d16' : '#ffffff',
                color: isDark ? '#f1f5f9' : '#1e293b'
            }).then((res) => {
                if (res.isConfirmed) viewIndividualStudentProfile(studentId);
            });
        }

        function printStudentSummaryReport(studentId) {
            const profile = allStudents.find(s => String(s.id || s.user_id) === String(studentId));
            const name = profile ? `${profile.first_name || '-'} ${profile.last_name || ''}`.trim() : 'นักเรียน';
            const studentIdCode = profile?.student_id || '-';
            const studentAttempts = allAttemptsRaw.filter(a => String(a.student_id || a.user_id) === String(studentId));
            const totalScore = studentAttempts.reduce((acc, curr) => acc + (curr.total_score !== undefined ? Number(curr.total_score) : Number(curr.score) || 0), 0);
            const avg = studentAttempts.length > 0 ? (totalScore / studentAttempts.length).toFixed(1) : '0.0';

            let printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>รายงานสรุปผลการเรียน - ${name}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Prompt', sans-serif; padding: 40px; color: #1e293b; }
                        h2 { color: #0284c7; margin-bottom: 5px; }
                        .box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
                        th, td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; }
                        th { background: #f1f5f9; }
                    </style>
                </head>
                <body>
                    <h2>ใบรายงานสรุปผลการเรียนรายบุคคล</h2>
                    <p>ระบบศูนย์ควบคุมภายในคอร์ส LMS</p>
                    <div class="box">
                        <p>ชื่อ-นามสกุล: <strong>${name}</strong> (รหัส: ${studentIdCode})</p>
                        <p>จำนวนชุดข้อสอบที่ทำแล้ว: <strong>${studentAttempts.length} ชุด</strong></p>
                        <p>คะแนนรวม: <strong>${totalScore} คะแนน</strong> | คะแนนเฉลี่ย: <strong>${avg}</strong></p>
                    </div>
                    <h3>ประวัติการทำข้อสอบ</h3>
                    <table>
                        <tr><th>ลำดับ</th><th>ชุดข้อสอบ</th><th>คะแนน</th><th>วันที่ทำ</th></tr>
            `);

            studentAttempts.forEach((att, idx) => {
                const exam = courseExams.find(e => String(e.id) === String(att.exam_id));
                const examTitle = exam ? exam.title : `ข้อสอบรหัส: ${att.exam_id}`;
                const score = att.total_score !== undefined ? Number(att.total_score) : Number(att.score) || 0;
                const dateStr = att.submission_time || att.submitted_at || att.created_at ? new Date(att.submission_time || att.submitted_at || att.created_at).toLocaleDateString('th-TH') : '-';

                printWindow.document.write(`<tr><td>${idx + 1}</td><td>${examTitle}</td><td><strong>${score} คะแนน</strong></td><td>${dateStr}</td></tr>`);
            });

            printWindow.document.write(`</table><script>window.print();<\/script></body></html>`);
            printWindow.document.close();
        }

        function renderAnnouncementsTab(container) {
            let annHtml = courseAnnouncements.length > 0 ? courseAnnouncements.map(an => `
                <div class="p-4 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border dark:border-slate-700 space-y-1">
                    <div class="font-extrabold text-amber-600">${an.title}</div>
                    <div class="text-xs text-slate-600 dark:text-slate-300">${an.content}</div>
                </div>
            `).join('') : '<div class="text-center py-8 text-slate-400">ยังไม่มีประกาศในคอร์สนี้</div>';

            container.innerHTML = `
                <div class="hitech-card p-6 rounded-3xl space-y-4">
                    <div class="flex justify-between items-center pb-3 border-b border-purple-500/20">
                        <span class="text-xs font-bold text-slate-400">ประกาศข่าวสารในคอร์ส (${courseAnnouncements.length} ประกาศ)</span>
                        <button onclick="openAddAnnouncementModal()" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl text-xs shadow transition-all"><i class="fas fa-bullhorn mr-1"></i> สร้างประกาศใหม่</button>
                    </div>
                    <div class="space-y-3">${annHtml}</div>
                </div>
            `;
        }

        async function openAddAnnouncementModal() {
            const isDark = document.documentElement.classList.contains('dark');
            const { value: formValues } = await Swal.fire({
                title: '📢 สร้างประกาศใหม่ในคอร์ส',
                width: '500px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div><label class="block font-bold mb-1">หัวข้อประกาศ</label><input id="swalAnTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-bold"></div>
                        <div><label class="block font-bold mb-1">เนื้อหาประกาศ</label><textarea id="swalAnContent" rows="3" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none"></textarea></div>
                    </div>
                `,
                showCancelButton: true, confirmButtonText: 'โพสต์ประกาศ', confirmButtonColor: '#d97706',
                background: isDark ? '#090d16' : '#ffffff', color: isDark ? '#f1f5f9' : '#1e293b',
                preConfirm: () => ({ title: document.getElementById('swalAnTitle').value.trim(), content: document.getElementById('swalAnContent').value.trim(), course_id: courseId })
            });

            if (formValues && formValues.title) {
                await mySupabase.from('announcements').insert([formValues]);
                initCourseDetail();
                Swal.fire({ icon: 'success', title: 'โพสต์ประกาศสำเร็จ!', timer: 1000, showConfirmButton: false });
            }
        }

        function getStatusBadge(st) {
            if (st === 'public') return '<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 font-bold text-[10px]">เปิดบริการ</span>';
            if (st === 'countdown') return '<span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-600 font-bold text-[10px]">ตั้งเวลา</span>';
            return '<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-bold text-[10px]">ซ่อน</span>';
        }
        function getDeliveryBadge(dt) {
            if (dt === 'online') return '<span class="px-2 py-0.5 rounded-md bg-purple-50 text-purple-600 text-[10px] font-bold"><i class="fas fa-keyboard mr-1"></i>ออนไลน์</span>';
            return '<span class="px-2 py-0.5 rounded-md bg-red-50 text-red-600 text-[10px] font-bold"><i class="fas fa-file-pdf mr-1"></i>ไฟล์ PDF</span>';
        }
        function getChoiceFormatLabel(fmt) {
            if (fmt === 'th_num') return 'ก, ข, ค, ง';
            if (fmt === 'upper') return 'A, B, C, D';
            if (fmt === 'lower') return 'a, b, c, d';
            return '1, 2, 3, 4';
        }
        function getExamAverageScore(examId) {
            const scores = courseAttemptsMap[String(examId)] || [];
            if (scores.length === 0) return '-';
            const sum = scores.reduce((a, b) => a + b, 0);
            return (sum / scores.length).toFixed(1);
        }

        initCourseDetail();
    </script>
</body>
</html>
