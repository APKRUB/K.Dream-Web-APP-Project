<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เทปเรียนย้อนหลัง (Video Vault)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- STUDENT AUTH GUARD -->
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) {
                        hasSession = true;
                        break;
                    }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) {
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; -webkit-user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { 
            background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); 
            box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .dark .hitech-card { 
            background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); 
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        
        /* ปิดการใช้งานปุ่มเปิดหน้าต่างภายนอก (Pop-out) ที่มุมขวาบนของ Google Drive iframe */
        .popout-blocker {
            position: absolute; top: 0; right: 0; width: 80px; height: 60px; z-index: 30; background: transparent; cursor: not-allowed;
        }
        .hide-scrollbar::-webkit-scrollbar { width: 6px; }
        .hide-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 9999px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.4); border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-12" oncontextmenu="return false;">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <!-- แก้ไขปุ่มย้อนกลับให้กลับไป student.html -->
                    <button onclick="window.location.href='student.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm" title="กลับหน้าหลักนักเรียน">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 text-white flex items-center justify-center text-lg shadow-lg shadow-sky-500/30">
                        <i class="fas fa-video"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white leading-none">Student Video Vault</h1>
                        <span class="text-[10px] text-sky-600 dark:text-sky-400 font-bold tracking-wider uppercase">คลังเทปเรียนย้อนหลัง</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:border-sky-500">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Split View Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- ฝั่งซ้าย: รายการบทเรียน (List View) พร้อมช่องค้นหา -->
            <div class="lg:col-span-5 hitech-card p-5 rounded-3xl space-y-4 flex flex-col h-[calc(100vh-140px)] sticky top-24">
                <div class="space-y-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between items-center">
                        <h3 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fas fa-list text-sky-500"></i> รายการบทเรียน (<span id="videoCountDisplay">0</span>)
                        </h3>
                    </div>
                    <!-- ช่องค้นหาแบบ Live Search -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="fas fa-search text-xs"></i>
                        </span>
                        <input type="text" id="videoSearchInput" oninput="handleLiveSearch()" class="w-full pl-9 pr-4 py-2 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-xl text-xs focus:outline-none focus:border-sky-500 shadow-sm" placeholder="ค้นหาชื่อบทเรียน...">
                    </div>
                </div>

                <!-- รายการวิดีโอแบบเลื่อนได้ -->
                <div id="videoListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 hide-scrollbar">
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fas fa-spinner fa-spin text-lg mb-2"></i> กำลังโหลดรายการเทปเรียน...
                    </div>
                </div>
            </div>

            <!-- ฝั่งขวา: หน้าจอเล่นวิดีโอขนาดใหญ่ (Large Player View) -->
            <div class="lg:col-span-7 hitech-card p-6 rounded-3xl space-y-4 flex flex-col">
                <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                    <h3 id="currentPlayingTitle" class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-play-circle text-sky-500"></i> กรุณาเลือกบทเรียนจากรายการด้านซ้าย
                    </h3>
                </div>

                <!-- ตัวเล่นวิดีโอ Google Drive ขนาดใหญ่ -->
                <div class="w-full aspect-video bg-black rounded-2xl relative overflow-hidden shadow-inner flex items-center justify-center">
                    <div id="iframePlayerWrapper" class="w-full h-full relative flex items-center justify-center text-slate-500 text-xs bg-slate-900">
                        <div class="text-center space-y-2">
                            <i class="fas fa-film text-3xl text-slate-600 animate-pulse"></i>
                            <p>ยังไม่ได้เลือกวิดีโอ</p>
                        </div>
                    </div>
                    <div class="popout-blocker" onclick="alertPopoutBlocked()" title="ระบบป้องกันการเปิดหน้าต่างภายนอก"></div>
                </div>

                <div class="flex justify-between items-center pt-2 text-[11px] text-slate-400">
                    <span><i class="fas fa-shield-alt text-emerald-500 mr-1"></i> ป้องกันการดาวน์โหลด • รองรับการกรอและปรับความเร็ว</span>
                    <span id="videoPublishDate">--</span>
                </div>
            </div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cachedVideos = [];
        let searchQuery = '';
        let activeVideoId = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // ป้องกันคีย์ลัดอันตรายและคลิกขวา
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'c' || e.key === 'i')) {
                e.preventDefault();
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') e.preventDefault();
        });

        async function loadVideos() {
            try {
                const { data, error } = await mySupabase.from('videos').select('*').order('display_order', { ascending: true, nullsFirst: false }).order('created_at', { ascending: false });
                if (error) throw error;
                cachedVideos = data || [];
                renderVideoList();

                // ถ้ามีวิดีโอ ให้เลือกเล่นวิดีโอแรกโดยอัตโนมัติ
                if (cachedVideos.length > 0) {
                    playVideo(cachedVideos[0].id, cachedVideos[0].youtube_id, cachedVideos[0].title, cachedVideos[0].created_at);
                }
            } catch (err) {
                const container = document.getElementById('videoListContainer');
                container.innerHTML = `
                    <div class="text-center py-12 text-amber-500 text-xs">
                        <i class="fas fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>ไม่สามารถโหลดรายการเทปเรียนได้ในขณะนี้</p>
                    </div>
                `;
            }
        }

        function handleLiveSearch() {
            searchQuery = document.getElementById('videoSearchInput').value.trim().toLowerCase();
            renderVideoList();
        }

        function renderVideoList() {
            const container = document.getElementById('videoListContainer');
            const filtered = cachedVideos.filter(v => v.title.toLowerCase().includes(searchQuery));
            document.getElementById('videoCountDisplay').textContent = cachedVideos.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fas fa-search text-2xl mb-2"></i>
                        <p>ไม่พบบทเรียนที่ค้นหา</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(v => {
                const isActive = activeVideoId === v.id;
                return `
                    <div onclick="playVideo('${v.id}', '${v.youtube_id}', '${encodeURIComponent(v.title)}', '${v.created_at}')" class="p-3.5 rounded-2xl cursor-pointer transition-all border ${isActive ? 'bg-sky-500/10 border-sky-500 shadow-sm' : 'bg-white dark:bg-darkinput border-slate-200 dark:border-slate-800 hover:border-sky-400'} flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-9 h-9 rounded-xl ${isActive ? 'bg-sky-600 text-white shadow-md' : 'bg-sky-500/10 text-sky-500'} flex items-center justify-center font-bold text-xs shrink-0 transition-colors">
                                <i class="fas ${isActive ? 'fa-play' : 'fa-video'}"></i>
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white truncate">${v.title}</h4>
                                <p class="text-[10px] text-slate-400">${new Date(v.created_at).toLocaleDateString('th-TH')}</p>
                            </div>
                        </div>
                        ${isActive ? '<span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse shrink-0"></span>' : ''}
                    </div>
                `;
            }).join('');
        }

        function playVideo(id, fileId, encodedTitle, createdAt) {
            activeVideoId = id;
            const title = decodeURIComponent(encodedTitle);
            document.getElementById('currentPlayingTitle').innerHTML = `<i class="fas fa-play-circle text-sky-500"></i> ${title}`;
            document.getElementById('videoPublishDate').textContent = `เผยแพร่เมื่อ: ${new Date(createdAt).toLocaleString('th-TH')}`;

            const wrapper = document.getElementById('iframePlayerWrapper');
            wrapper.innerHTML = `
                <iframe class="w-full h-full" src="https://drive.google.com/file/d/${fileId}/preview" title="Google Drive Video Player" frameborder="0" allow="autoplay" allowfullscreen></iframe>
            `;

            renderVideoList();
        }

        function alertPopoutBlocked() {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: '🔒 ปิดการใช้งานปุ่มเปิดหน้าต่างภายนอก (Pop-out)',
                showConfirmButton: false,
                timer: 2000
            });
        }

        loadVideos();
    </script>
</body>
</html>
