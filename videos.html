<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เทปเรียนย้อนหลัง (Video Vault)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; -webkit-user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { 
            background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); 
            box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .dark .hitech-card { 
            background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); 
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        
        .popout-blocker {
            position: absolute; top: 0; right: 0; width: 80px; height: 60px; z-index: 30; background: transparent; cursor: not-allowed;
        }
        .hide-scrollbar::-webkit-scrollbar { width: 6px; }
        .hide-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 9999px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(2, 132, 199, 0.4); border-radius: 9999px; }
        
        #sidebarPanel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-12" oncontextmenu="return false;">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='student.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm" title="กลับหน้าหลักนักเรียน">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 text-white flex items-center justify-center text-lg shadow-lg shadow-sky-500/30">
                        <i class="fas fa-video"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white leading-none">Student Video Vault</h1>
                        <span class="text-[10px] text-sky-600 dark:text-sky-400 font-bold tracking-wider uppercase">คลังเทปเรียนย้อนหลัง</span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" id="sidebarToggleBtn" class="px-3 py-1.5 bg-sky-50 dark:bg-sky-950/40 text-sky-600 dark:text-sky-400 border border-sky-200 dark:border-sky-900 hover:bg-sky-100 font-bold text-xs rounded-xl transition-all flex items-center gap-1.5" title="ซ่อน/แสดงรายการบทเรียน">
                        <i class="fas fa-columns"></i> <span class="hidden sm:inline">ซ่อน/แสดงรายการ</span>
                    </button>

                    <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 shadow-sm transition-all hover:border-sky-500">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Split View Layout -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-6">
        
        <!-- Course Selection Bar -->
        <div class="hitech-card p-4 sm:p-5 rounded-3xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-l-8 border-l-sky-500">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="w-10 h-10 rounded-xl bg-sky-500/10 text-sky-500 flex items-center justify-center text-base shrink-0 font-bold">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <h2 class="text-xs text-slate-400 font-bold">เลือกคอร์สเรียนของคุณ</h2>
                    <span id="activeCourseTitleDisplay" class="text-sm font-extrabold text-slate-900 dark:text-white">กำลังโหลดคอร์ส...</span>
                </div>
            </div>
            <div class="w-full sm:w-72">
                <select id="courseSelector" onchange="onCourseChanged()" class="w-full px-3 py-2 bg-slate-100 dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-2xl text-xs font-bold text-slate-800 dark:text-slate-200 outline-none cursor-pointer">
                    <option value="">-- กำลังโหลดคอร์ส --</option>
                </select>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-5 items-start">
            
            <!-- ฝั่งซ้าย: รายการบทเรียน -->
            <div id="sidebarPanel" class="w-full lg:w-80 hitech-card p-4 rounded-3xl space-y-3 flex flex-col h-[calc(100vh-210px)] lg:sticky lg:top-24 shrink-0 overflow-hidden">
                <div class="space-y-2.5 pb-2.5 border-b border-slate-200 dark:border-slate-800">
                    <div class="flex justify-between items-center">
                        <h3 class="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fas fa-list text-sky-500"></i> รายการบทเรียน (<span id="videoCountDisplay">0</span>)
                        </h3>
                    </div>
                    <!-- ช่องค้นหาแบบ Live Search -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i class="fas fa-search text-[10px]"></i>
                        </span>
                        <input type="text" id="videoSearchInput" oninput="handleLiveSearch()" class="w-full pl-8 pr-3 py-1.5 bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 rounded-xl text-xs focus:outline-none focus:border-sky-500 shadow-sm" placeholder="ค้นหาบทเรียน...">
                    </div>
                </div>

                <!-- รายการวิดีโอแบบเลื่อนได้ -->
                <div id="videoListContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 hide-scrollbar">
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fas fa-spinner fa-spin text-lg mb-2"></i> กำลังโหลดข้อมูล...
                    </div>
                </div>
            </div>

            <!-- ฝั่งขวา: หน้าจอเล่นวิดีโอขนาดใหญ่ -->
            <div id="mainPlayerPanel" class="flex-1 w-full hitech-card p-5 sm:p-6 rounded-3xl space-y-4 flex flex-col">
                <div class="flex justify-between items-center pb-2.5 border-b border-slate-200 dark:border-slate-800">
                    <h3 id="currentPlayingTitle" class="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white flex items-center gap-2 truncate pr-2">
                        <i class="fas fa-play-circle text-sky-500"></i> กรุณาเลือกบทเรียนจากรายการด้านซ้าย
                    </h3>
                </div>

                <div class="w-full aspect-video bg-black rounded-2xl relative overflow-hidden shadow-inner flex items-center justify-center">
                    <div id="iframePlayerWrapper" class="w-full h-full relative flex items-center justify-center text-slate-500 text-xs bg-slate-900">
                        <div class="text-center space-y-2">
                            <i class="fas fa-film text-3xl text-slate-600 animate-pulse"></i>
                            <p>ยังไม่ได้เลือกวิดีโอ</p>
                        </div>
                    </div>
                    <div class="popout-blocker" onclick="alertPopoutBlocked()" title="ระบบป้องกันการเปิดหน้าต่างภายนอก"></div>
                </div>

                <div class="flex justify-between items-center pt-1 text-[11px] text-slate-400">
                    <span><i class="fas fa-shield-alt text-emerald-500 mr-1"></i> ป้องกันการดาวน์โหลด • รองรับการกรอและปรับความเร็ว</span>
                    <span id="videoPublishDate">--</span>
                </div>
            </div>

        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCourses = [];
        let allVideos = [];
        let currentCourseId = null;
        let searchQuery = '';
        let activeVideoId = null;
        let isSidebarOpen = true;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            const sidebar = document.getElementById('sidebarPanel');
            if (isSidebarOpen) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            } else {
                sidebar.classList.remove('flex');
                sidebar.classList.add('hidden');
            }
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'u' || e.key === 'c' || e.key === 'i')) {
                e.preventDefault();
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') e.preventDefault();
        });

        async function verifyStudentAccess() {
            const studentId = localStorage.getItem('student_id') || localStorage.getItem('id');
            if (!studentId) {
                await Swal.fire({
                    icon: 'error',
                    title: 'ไม่อนุญาตให้เข้าถึง',
                    text: 'กรุณาเข้าสู่ระบบผ่านหน้าพอร์ทัลนักเรียนให้ถูกต้อง',
                    confirmButtonColor: '#0284c7'
                });
                window.location.replace('index.html');
                return false;
            }

            const { data: profile } = await mySupabase.from('profiles').select('id').eq('id', studentId).single();
            if (profile) return true;

            const { data: student } = await mySupabase.from('students').select('id').eq('id', studentId).single();
            if (student) return true;

            localStorage.removeItem('student_id');
            localStorage.removeItem('id');
            await Swal.fire({
                icon: 'error',
                title: 'เซสชันไม่ถูกต้อง',
                text: 'ไม่พบข้อมูลบัญชีนักเรียนในระบบ กรุณาเข้าสู่ระบบใหม่อีกครั้ง',
                confirmButtonColor: '#0284c7'
            });
            window.location.replace('index.html');
            return false;
        }

        async function initVideoVault() {
            const isValid = await verifyStudentAccess();
            if (!isValid) return;

            try {
                // 1. โหลดข้อมูลคอร์สทั้งหมด
                const courseRes = await mySupabase.from('courses').select('id, title, course_code').order('title');
                allCourses = courseRes.data || [];

                // 2. โหลดวิดีโอจากทั้ง course_lessons และ videos
                let fetchedVideos = [];
                const lessonRes = await mySupabase.from('course_lessons').select('*');
                if (lessonRes.data) {
                    fetchedVideos = lessonRes.data.filter(l => l.video_url || l.video || l.url || l.youtube_id);
                }

                if (fetchedVideos.length === 0) {
                    const videoRes = await mySupabase.from('videos').select('*');
                    if (videoRes.data) {
                        fetchedVideos = videoRes.data;
                    }
                }

                // จัดรูปแบบข้อมูลวิดีโอ
                allVideos = fetchedVideos.map(v => ({
                    id: v.id,
                    title: v.title || v.name || 'ไม่มีชื่อบทเรียน',
                    course_id: v.course_id || v.courseid || v.course || null,
                    video_url: v.video_url || v.video || v.url || '',
                    created_at: v.created_at || new Date().toISOString()
                }));

                populateCourseDropdown();

            } catch (err) {
                console.error("Error loading video vault:", err);
                document.getElementById('videoListContainer').innerHTML = `
                    <div class="text-center py-12 text-amber-500 text-xs">
                        <i class="fas fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>ไม่สามารถโหลดรายการเทปเรียนได้ในขณะนี้</p>
                    </div>
                `;
            }
        }

        function extractDrivePreviewUrl(url) {
            if (!url) return '';
            // แปลงลิงก์ Google Drive ทุกรูปแบบให้เป็น /preview อัตโนมัติ
            const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return url;
        }

        function extractYoutubeId(url) {
            if (!url) return '';
            if (!url.includes('http') && url.length === 11) return url;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : '';
        }

        function populateCourseDropdown() {
            const selector = document.getElementById('courseSelector');
            if (!selector) return;

            if (allCourses.length === 0) {
                selector.innerHTML = '<option value="">-- ไม่พบคอร์สในระบบ --</option>';
                document.getElementById('activeCourseTitleDisplay').textContent = 'ไม่มีคอร์สเรียน';
                return;
            }

            selector.innerHTML = allCourses.map(c => `
                <option value="${c.id}">[${c.course_code || 'CRS'}] ${c.title}</option>
            `).join('');

            currentCourseId = allCourses[0].id;
            selector.value = currentCourseId;
            updateActiveCourseHeader();
            renderVideoList();
        }

        function onCourseChanged() {
            const selector = document.getElementById('courseSelector');
            currentCourseId = selector.value;
            updateActiveCourseHeader();
            renderVideoList();
        }

        function updateActiveCourseHeader() {
            const courseObj = allCourses.find(c => String(c.id) === String(currentCourseId));
            const titleSpan = document.getElementById('activeCourseTitleDisplay');
            if (courseObj) {
                titleSpan.textContent = courseObj.title;
            } else {
                titleSpan.textContent = 'เลือกคอร์สเรียน';
            }
        }

        function handleLiveSearch() {
            searchQuery = document.getElementById('videoSearchInput').value.trim().toLowerCase();
            renderVideoList();
        }

        function renderVideoList() {
            const container = document.getElementById('videoListContainer');
            
            // กรองเฉพาะวิดีโอที่เป็นของคอร์สปัจจุบันเท่านั้น
            let courseVideos = allVideos.filter(v => String(v.course_id) === String(currentCourseId));

            if (searchQuery) {
                courseVideos = courseVideos.filter(v => v.title.toLowerCase().includes(searchQuery));
            }

            document.getElementById('videoCountDisplay').textContent = courseVideos.length;

            if (courseVideos.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        <i class="fas fa-film text-xl mb-2"></i>
                        <p>ยังไม่มีวิดีโอในคอร์สนี้</p>
                    </div>
                `;
                resetPlayerToEmpty();
                return;
            }

            container.innerHTML = courseVideos.map(v => {
                const isActive = activeVideoId === v.id;
                return `
                    <div onclick="playVideo('${v.id}', '${encodeURIComponent(v.title)}', '${v.created_at}', '${v.video_url}')" class="p-3 rounded-2xl cursor-pointer transition-all border ${isActive ? 'bg-sky-500/10 border-sky-500 shadow-sm' : 'bg-white dark:bg-darkinput border-slate-200 dark:border-slate-800 hover:border-sky-400'} flex items-center justify-between gap-2.5">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-xl ${isActive ? 'bg-sky-600 text-white shadow-md' : 'bg-sky-500/10 text-sky-500'} flex items-center justify-center font-bold text-xs shrink-0 transition-colors">
                                <i class="fas ${isActive ? 'fa-play' : 'fa-video'} text-[10px]"></i>
                            </div>
                            <div class="min-w-0">
                                <h4 class="font-bold text-xs text-slate-900 dark:text-white truncate">${v.title}</h4>
                                <p class="text-[10px] text-slate-400">${new Date(v.created_at).toLocaleDateString('th-TH')}</p>
                            </div>
                        </div>
                        ${isActive ? '<span class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse shrink-0"></span>' : ''}
                    </div>
                `;
            }).join('');

            // เลือกเล่นคลิปแรกอัตโนมัติหากยังไม่ได้เลือก หรือคลิปเดิมไม่อยู่ในคอร์สนี้
            const activeInThisCourse = courseVideos.some(v => v.id === activeVideoId);
            if (!activeInThisCourse && courseVideos.length > 0) {
                playVideo(courseVideos[0].id, encodeURIComponent(courseVideos[0].title), courseVideos[0].created_at, courseVideos[0].video_url);
            }
        }

        function playVideo(id, encodedTitle, createdAt, rawUrl) {
            activeVideoId = id;
            const title = decodeURIComponent(encodedTitle);
            document.getElementById('currentPlayingTitle').innerHTML = `<i class="fas fa-play-circle text-sky-500"></i> ${title}`;
            document.getElementById('videoPublishDate').textContent = `เผยแพร่เมื่อ: ${new Date(createdAt).toLocaleString('th-TH')}`;

            const wrapper = document.getElementById('iframePlayerWrapper');
            let embedHtml = '';

            if (rawUrl && rawUrl.includes('drive.google.com')) {
                const previewUrl = extractDrivePreviewUrl(rawUrl);
                embedHtml = `<iframe class="w-full h-full" src="${previewUrl}" title="Google Drive Video Player" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
            } else if (rawUrl && (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be'))) {
                const ytId = extractYoutubeId(rawUrl);
                embedHtml = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                embedHtml = `<iframe class="w-full h-full" src="${rawUrl || '#'}" title="Video Player" frameborder="0" allow="autoplay" allowfullscreen></iframe>`;
            }

            wrapper.innerHTML = embedHtml;
            renderVideoList();
        }

        function resetPlayerToEmpty() {
            activeVideoId = null;
            document.getElementById('currentPlayingTitle').innerHTML = `<i class="fas fa-play-circle text-sky-500"></i> กรุณาเลือกบทเรียนจากรายการด้านซ้าย`;
            document.getElementById('videoPublishDate').textContent = `--`;
            document.getElementById('iframePlayerWrapper').innerHTML = `
                <div class="text-center space-y-2">
                    <i class="fas fa-film text-3xl text-slate-600 animate-pulse"></i>
                    <p>ไม่มีวิดีโอในคอร์สนี้</p>
                </div>
            `;
        }

        function alertPopoutBlocked() {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: '🔒 ปิดการใช้งานปุ่มเปิดหน้าต่างภายนอก (Pop-out)',
                showConfirmButton: false,
                timer: 2000
            });
        }

        initVideoVault();
    </script>
</body>
</html>
