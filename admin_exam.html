<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#090d16', darkbox: '#0f172a', darkinput: '#1e293b' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.9); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.05); }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
        
        /* สไตล์สำหรับป๊อปอัป SweetAlert2 และ Modal ตัวหนังสือเด่นชัดไม่กลืนพื้นหลัง */
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #0f172a !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
        .dark select option { background-color: #0f172a !important; color: #f8fafc !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <!-- Header / Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-sky-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง แก้ไข กำหนดเวลา และจัดการไฟล์โจทย์ข้อสอบทั้งหมด</p>
                    </div>
                </div>
                
                <!-- ปุ่มสร้างหมวดหมู่มุมขวาบน + สลับธีม -->
                <div class="flex items-center gap-3">
                    <button onclick="openCategoryManagerModal()" class="px-4 py-2.5 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-300 rounded-2xl font-bold text-xs border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100 transition-all shadow-sm flex items-center gap-2">
                        <i class="fas fa-tags text-indigo-500"></i> จัดการหมวดหมู่
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- Action Bar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 glossy-card p-6 rounded-3xl">
            <div>
                <h2 class="font-bold text-lg text-slate-900 dark:text-white">รายการชุดข้อสอบทั้งหมด</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">เลือกจัดการโจทย์ ตั้งค่าสถานะเปิด-ปิด หรือแก้ไขรายละเอียด</p>
            </div>
            <button onclick="openExamModal()" class="px-5 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-sky-500/20 transition-all flex items-center gap-2">
                <i class="fas fa-plus"></i> สร้างชุดข้อสอบใหม่
            </button>
        </div>

        <!-- Exam Cards Grid -->
        <div id="examsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 text-sm">กำลังโหลดชุดข้อสอบ...</div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriesList = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await loadCategories();
            await loadExams();
        }

        async function loadCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            categoriesList = data || [];
        }

        async function loadExams() {
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false });
            const grid = document.getElementById('examsGrid');

            if (error || !exams || exams.length === 0) {
                grid.innerHTML = `<div class="col-span-full glossy-card p-12 rounded-3xl text-center text-slate-400 text-sm">ยังไม่มีชุดข้อสอบในระบบ กรุณากดปุ่ม "สร้างชุดข้อสอบใหม่"</div>`;
                return;
            }

            grid.innerHTML = exams.map(e => {
                const categoryName = e.exam_categories?.name || 'ทั่วไป';
                const statusBadge = e.status === 'public' 
                    ? '<span class="px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold text-[11px] border border-emerald-200 dark:border-emerald-800">เปิดให้ทำ</span>' 
                    : (e.status === 'countdown' 
                        ? '<span class="px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-bold text-[11px] border border-amber-200 dark:border-amber-800">ตั้งเวลาเปิด</span>' 
                        : '<span class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-[11px]">ซ่อนอยู่</span>');

                return `
                    <div class="glossy-card p-6 rounded-3xl flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="px-3 py-1 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-300 font-bold text-xs">${categoryName}</span>
                                ${statusBadge}
                            </div>
                            <h3 class="font-bold text-lg text-slate-900 dark:text-white leading-snug mb-2">${e.title}</h3>
                            <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1">
                                <div><i class="far fa-clock mr-1 text-sky-500"></i> เวลาทำ: ${e.time_limit || 60} นาที</div>
                                ${e.start_time ? `<div><i class="far fa-calendar-alt mr-1 text-indigo-500"></i> เปิด: ${new Date(e.start_time).toLocaleString('th-TH')}</div>` : ''}
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
                            <!-- ปุ่มส่งต่อไปยังหน้า admin_exam_editor.html -->
                            <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                <i class="fas fa-list-check"></i> จัดการโจทย์และไฟล์ PDF
                            </button>
                            <div class="flex gap-2">
                                <button onclick='openExamModal(${JSON.stringify(e)})' class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-colors">
                                    <i class="fas fa-pen mr-1"></i> แก้ไข
                                </button>
                                <button onclick="deleteExam('${e.id}')" class="px-3 py-2 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-xl text-xs font-bold hover:bg-red-100 transition-colors">
                                    <i class="fas fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Modal สร้าง/แก้ไขชุดข้อสอบ (ปรับแต่งสีให้ชัดเจน ไม่กลืนพื้นหลัง)
        async function openExamModal(examData = null) {
            const isEdit = !!examData;
            const categoryOptions = categoriesList.map(c => `<option value="${c.id}" ${examData?.category_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

            const { value: formValues } = await Swal.fire({
                title: isEdit ? 'แก้ไขชุดข้อสอบ' : 'สร้างชุดข้อสอบใหม่',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div>
                            <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">ชื่อชุดข้อสอบ <span class="text-red-500">*</span></label>
                            <input id="swalTitle" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:border-sky-500" value="${examData?.title || ''}" placeholder="ระบุชื่อชุดข้อสอบ...">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">หมวดหมู่</label>
                                <select id="swalCategory" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none">
                                    <option value="">-- ไม่ระบุ --</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">เวลาทำ (นาที)</label>
                                <input type="number" id="swalTimeLimit" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.time_limit || 60}">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">สถานะเปิดข้อสอบ</label>
                            <select id="swalStatus" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none">
                                <option value="draft" ${examData?.status === 'draft' ? 'selected' : ''}>ซ่อนอยู่ (Draft)</option>
                                <option value="public" ${examData?.status === 'public' ? 'selected' : ''}>เปิดให้ทำทันที (Public)</option>
                                <option value="countdown" ${examData?.status === 'countdown' ? 'selected' : ''}>ตั้งเวลาเปิดอัตโนมัติ (Countdown)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">เวลาเริ่มเปิด (Start Time)</label>
                                <input type="datetime-local" id="swalStartTime" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.start_time ? new Date(new Date(examData.start_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">เวลาปิดรับ (End Time)</label>
                                <input type="datetime-local" id="swalEndTime" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.end_time ? new Date(new Date(examData.end_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('swalTitle').value;
                    if (!title) { Swal.showValidationMessage('กรุณาระบุชื่อชุดข้อสอบ'); return false; }
                    return {
                        title,
                        category_id: document.getElementById('swalCategory').value || null,
                        time_limit: parseInt(document.getElementById('swalTimeLimit').value) || 60,
                        status: document.getElementById('swalStatus').value,
                        start_time: document.getElementById('swalStartTime').value ? new Date(document.getElementById('swalStartTime').value).toISOString() : null,
                        end_time: document.getElementById('swalEndTime').value ? new Date(document.getElementById('swalEndTime').value).toISOString() : null
                    }
                }
            });

            if (formValues) {
                if (isEdit) {
                    await mySupabase.from('exams').update(formValues).eq('id', examData.id);
                } else {
                    await mySupabase.from('exams').insert([formValues]);
                }
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1200, showConfirmButton: false });
                loadExams();
            }
        }

        // Modal จัดการหมวดหมู่ข้อสอบ
        async function openCategoryManagerModal() {
            let catHtml = categoriesList.map(c => `
                <div class="flex justify-between items-center p-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs">
                    <span class="font-bold text-slate-800 dark:text-slate-200">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:text-red-700 px-2 py-1"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            const { value: newCatName } = await Swal.fire({
                title: 'จัดการหมวดหมู่ชุดข้อสอบ',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            ${catHtml || '<div class="text-center text-slate-400">ยังไม่มีหมวดหมู่</div>'}
                        </div>
                        <div class="pt-3 border-t border-slate-200 dark:border-slate-700">
                            <label class="block font-bold text-slate-700 dark:text-slate-200 mb-1">เพิ่มหมวดหมู่ใหม่</label>
                            <input id="newCatInput" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none" placeholder="พิมพ์ชื่อหมวดหมู่...">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'เพิ่มหมวดหมู่',
                cancelButtonText: 'ปิดหน้าต่าง',
                preConfirm: () => document.getElementById('newCatInput').value
            });

            if (newCatName) {
                await mySupabase.from('exam_categories').insert([{ name: newCatName }]);
                Swal.fire({ icon: 'success', title: 'เพิ่มหมวดหมู่สำเร็จ', timer: 1200, showConfirmButton: false });
                await loadCategories();
                openCategoryManagerModal();
            }
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await loadCategories();
            openCategoryManagerModal();
        }

        async function deleteExam(id) {
            const res = await Swal.fire({
                title: 'ยืนยันลบชุดข้อสอบนี้?',
                text: 'การกระทำนี้จะลบโจทย์ทั้งหมดในชุดข้อสอบนี้ด้วย',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบข้อมูล'
            });

            if (res.isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadExams();
            }
        }

        initPage();
    </script>
</body>
</html>
