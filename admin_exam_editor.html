<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เครื่องมือจัดการโจทย์และกระดาษคำตอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b', darkinput: '#334155' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin_exams.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all text-slate-700 dark:text-slate-200"><i class="fas fa-arrow-left text-lg"></i></button>
                    <div>
                        <h1 id="examTitleHeader" class="font-extrabold text-xl text-slate-900 dark:text-white">เครื่องมือจัดการข้อสอบ</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้างกระดาษคำตอบ OMR, พิมพ์โจทย์ และจัดการหมวดวิชาย่อย</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openPreviewModal()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-xs shadow-md flex items-center gap-1.5"><i class="fas fa-eye"></i> Preview ตัวอย่าง</button>
                    <button onclick="addSectionModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xs shadow-md flex items-center gap-1.5"><i class="fas fa-folder-plus"></i> เพิ่มหมวดวิชา</button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- แผง PDF + ตัวสร้างกระดาษคำตอบอัตโนมัติ -->
        <div id="pdfUploadCard" class="hidden glossy-card p-6 rounded-3xl space-y-4 border-l-4 border-l-red-500">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2"><i class="fas fa-file-pdf text-red-500"></i> ไฟล์โจทย์ PDF & กระดาษฝนเฉลย OMR</h3>
                <button onclick="bulkGeneratePdfAnswerSheet()" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs rounded-xl shadow-md"><i class="fas fa-magic mr-1"></i> สร้างกระดาษคำตอบตามช่วงข้อ (Bulk Range)</button>
            </div>
            <div class="flex gap-3">
                <input type="text" id="pdfUrlInput" class="flex-1 px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-xs text-slate-900 dark:text-slate-100 outline-none" placeholder="วาง URL ไฟล์ PDF โจทย์ข้อสอบ...">
                <button onclick="savePdfUrl()" class="px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs">บันทึก URL PDF</button>
            </div>
        </div>

        <!-- แผงฝนเฉลยแบบ OMR Bubble Sheet สด (สำหรับ PDF) -->
        <div id="omrInteractiveCard" class="hidden glossy-card p-6 rounded-3xl space-y-4 border-l-4 border-l-emerald-500">
            <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2"><i class="fas fa-check-circle text-emerald-500"></i> ฝนเฉลยกระดาษคำตอบ OMR (คลิกเพื่อตั้งเฉลยทันที)</h3>
            <div id="omrGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-80 overflow-y-auto p-2"></div>
        </div>

        <!-- รายการข้อสอบทั้งหมด -->
        <div class="glossy-card p-8 rounded-3xl space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-700">
                <h3 class="font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2"><i class="fas fa-list-ol text-primary"></i> รายการข้อสอบทั้งหมด</h3>
                <button onclick="addNewQuestionModal()" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-blue-500/20"><i class="fas fa-plus mr-1"></i> เพิ่มโจทย์รายข้อ</button>
            </div>

            <div id="questionsListContainer" class="space-y-4">
                <div class="text-center py-12 text-slate-400 text-sm">กำลังโหลดข้อมูลข้อสอบ...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        let currentExam = null;
        let currentSections = [];
        let currentQuestions = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            if (!examId) { window.location.href = 'admin_exams.html'; return; }
            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            currentExam = exam;
            document.getElementById('examTitleHeader').textContent = `แก้ไขข้อสอบ: ${exam.title} (${exam.code})`;

            if (exam.exam_type === 'pdf') {
                document.getElementById('pdfUploadCard').classList.remove('hidden');
                document.getElementById('omrInteractiveCard').classList.remove('hidden');
                document.getElementById('pdfUrlInput').value = exam.pdf_url || '';
            }

            await loadData();
        }

        async function savePdfUrl() {
            const pdf_url = document.getElementById('pdfUrlInput').value;
            await mySupabase.from('exams').update({ pdf_url }).eq('id', examId);
            Swal.fire({ icon: 'success', title: 'บันทึก URL PDF สำเร็จ', timer: 1000, showConfirmButton: false });
        }

        async function loadData() {
            const { data: sections } = await mySupabase.from('exam_sections').select('*').eq('exam_id', examId).order('order_index');
            const { data: questions } = await mySupabase.from('exam_questions').select('*, exam_options(*)').eq('exam_id', examId).order('question_number');
            
            currentSections = sections || [];
            currentQuestions = questions || [];
            
            renderQuestions();
            if (currentExam.exam_type === 'pdf') renderOmrGrid();
        }

        // แสดงกระดาษฝนเฉลย OMR Interactive ให้คุณครูกดเฉลยสด
        function renderOmrGrid() {
            const container = document.getElementById('omrGridContainer');
            if (currentQuestions.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-slate-400 text-xs py-4">กรุณากด "สร้างกระดาษคำตอบตามช่วงข้อ" ด้านบนก่อนครับ</div>`;
                return;
            }

            container.innerHTML = currentQuestions.map(q => {
                if (q.question_type !== 'mcq') return '';
                const opts = q.exam_options || [];
                const bubbles = opts.map((opt, i) => {
                    const isCorrect = q.correct_option_index === i;
                    return `
                        <button onclick="setQuickAnswerKey('${q.id}', ${i})" class="w-6 h-6 rounded-full text-[10px] font-bold border transition-all ${isCorrect ? 'bg-emerald-500 text-white border-emerald-600 scale-110 shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-600 hover:border-emerald-400'}">
                            ${String.fromCharCode(65 + i)}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-900 dark:text-slate-100">ข้อ ${q.question_number}</span>
                        <div class="flex gap-1">${bubbles}</div>
                    </div>
                `;
            }).join('');
        }

        async function setQuickAnswerKey(questionId, correctIdx) {
            await mySupabase.from('exam_questions').update({ correct_option_index: correctIdx }).eq('id', questionId);
            loadData();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsListContainer');
            if (currentQuestions.length === 0) {
                container.innerHTML = `<div class="p-12 text-center text-slate-400 text-sm">ยังไม่มีข้อสอบในชุดนี้ กดปุ่ม "เพิ่มโจทย์รายข้อ" หรือ "สร้างกระดาษคำตอบตามช่วงข้อ" ด้านบนได้เลยครับ</div>`;
                return;
            }

            container.innerHTML = currentQuestions.map(q => {
                const section = currentSections.find(s => s.id === q.section_id);
                const secBadge = section ? `<span class="bg-indigo-100 text-indigo-600 dark:bg-indigo-950/80 dark:text-indigo-300 px-2.5 py-1 rounded-lg font-bold text-[10px]"><i class="fas fa-folder mr-1"></i>${section.title}</span>` : '';

                return `
                    <div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-3">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="w-8 h-8 rounded-xl bg-primary text-white font-bold flex items-center justify-center text-xs">ข้อ ${q.question_number}</span>
                                ${secBadge}
                                <span class="text-xs bg-slate-200 dark:bg-slate-700 px-2.5 py-1 rounded-lg font-semibold text-slate-800 dark:text-slate-200">${q.question_type === 'mcq' ? 'ปรนัย' : 'อัตนัย'}</span>
                                <span class="text-xs text-amber-500 font-bold">${q.points} คะแนน</span>
                            </div>
                            <button onclick="deleteQuestion('${q.id}')" class="text-red-500 hover:underline text-xs font-bold"><i class="fas fa-trash"></i> ลบ</button>
                        </div>

                        <div class="text-sm font-semibold text-slate-900 dark:text-white">${q.question_text || '(ไม่มีข้อความโจทย์ - ตอบในกระดาษคำตอบ PDF)'}</div>
                        ${q.question_image ? `<img src="${q.question_image}" class="max-h-40 rounded-xl border border-slate-300">` : ''}

                        ${q.question_type === 'mcq' ? `
                            <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                                ${(q.exam_options || []).map((opt, i) => `
                                    <div class="p-2.5 rounded-xl border ${q.correct_option_index === i ? 'bg-emerald-50 border-emerald-400 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-300 font-bold' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200'}">
                                        <div class="flex justify-between items-center">
                                            <span>${String.fromCharCode(65 + i)}. ${opt.option_text || ''} ${q.correct_option_index === i ? '✓ (เฉลย)' : ''}</span>
                                            ${opt.option_image ? `<i class="fas fa-image text-slate-400" title="มีรูปภาพตัวเลือก"></i>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // สร้างกระดาษคำตอบตามช่วงข้อ (Bulk Range Generator)
        async function bulkGeneratePdfAnswerSheet() {
            let sectionOpts = currentSections.map(s => `<option value="${s.id}">${s.title}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: 'สร้างกระดาษคำตอบตามช่วงข้อ',
                html: `
                    <div class="space-y-3 text-left text-xs text-slate-900 dark:text-slate-100">
                        <div>
                            <label class="block font-bold mb-1">หมวดวิชาย่อย (Section)</label>
                            <select id="bulkSection" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100"><option value="">-- ไม่ระบุ --</option>${sectionOpts}</select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-bold mb-1">เริ่มจากข้อที่</label>
                                <input type="number" id="bulkStart" value="${currentQuestions.length + 1}" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">ถึงข้อที่</label>
                                <input type="number" id="bulkEnd" value="${currentQuestions.length + 10}" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ประเภทข้อสอบ</label>
                            <select id="bulkType" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                                <option value="mcq_4">ปรนัย (4 ตัวเลือก: A, B, C, D)</option>
                                <option value="mcq_5">ปรนัย (5 ตัวเลือก: A, B, C, D, E)</option>
                                <option value="subjective">อัตนัย (เขียนตอบ)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">คะแนนประจำแต่ละข้อ</label>
                            <input type="number" id="bulkPoints" value="1.0" step="0.5" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างรวดเดียว',
                preConfirm: () => ({
                    sectionId: document.getElementById('bulkSection').value || null,
                    start: parseInt(document.getElementById('bulkStart').value) || 1,
                    end: parseInt(document.getElementById('bulkEnd').value) || 10,
                    type: document.getElementById('bulkType').value,
                    points: parseFloat(document.getElementById('bulkPoints').value) || 1.0
                })
            });

            if (form) {
                Swal.fire({ title: 'กำลังสร้างกระดาษคำตอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                const totalToCreate = (form.end - form.start) + 1;
                const optionLetters = form.type === 'mcq_5' ? ['A', 'B', 'C', 'D', 'E'] : ['A', 'B', 'C', 'D'];

                for (let i = 0; i < totalToCreate; i++) {
                    const qNum = form.start + i;
                    const isMcq = form.type !== 'subjective';

                    const { data: qData } = await mySupabase.from('exam_questions').insert([{
                        exam_id: examId,
                        section_id: form.sectionId,
                        question_number: qNum,
                        question_type: isMcq ? 'mcq' : 'subjective',
                        points: form.points,
                        correct_option_index: 0
                    }]).select().single();

                    if (qData && isMcq) {
                        const optInserts = optionLetters.map((txt, idx) => ({
                            question_id: qData.id,
                            option_text: txt,
                            option_index: idx
                        }));
                        await mySupabase.from('exam_options').insert(optInserts);
                    }
                }
                Swal.fire({ icon: 'success', title: `สร้างกระดาษคำตอบข้อ ${form.start} ถึง ${form.end} สำเร็จ!`, timer: 1200, showConfirmButton: false });
                loadData();
            }
        }

        async function addSectionModal() {
            const { value: form } = await Swal.fire({
                title: 'เพิ่มหมวดวิชาย่อย (Section)',
                html: `
                    <div class="space-y-3 text-left text-xs text-slate-900 dark:text-slate-100">
                        <div>
                            <label class="block font-bold mb-1">ชื่อหมวดวิชาย่อย *</label>
                            <input id="secTitle" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100" placeholder="เช่น ฟิสิกส์ - บทที่ 1">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึก Section',
                preConfirm: () => document.getElementById('secTitle').value
            });

            if (form) {
                await mySupabase.from('exam_sections').insert([{ exam_id: examId, title: form }]);
                loadData();
            }
        }

        async function addNewQuestionModal() {
            let sectionOpts = currentSections.map(s => `<option value="${s.id}">${s.title}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: 'เพิ่มโจทย์ข้อสอบใหม่',
                width: '650px',
                html: `
                    <div class="space-y-3 text-left text-xs text-slate-900 dark:text-slate-100">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-bold mb-1">หมวดวิชาย่อย (Section)</label>
                                <select id="qSection" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100"><option value="">-- ไม่ระบุ --</option>${sectionOpts}</select>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">จำนวนตัวเลือก (ปรนัย)</label>
                                <select id="qOptCount" onchange="renderChoiceInputsModal()" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                                    <option value="4">4 ตัวเลือก (A, B, C, D)</option>
                                    <option value="5">5 ตัวเลือก (A, B, C, D, E)</option>
                                    <option value="2">2 ตัวเลือก (ถูก/ผิด)</option>
                                    <option value="subjective">อัตนัย (พิมพ์เขียนตอบ)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold mb-1">ข้อความโจทย์คำถาม</label>
                            <textarea id="qText" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl h-16 text-slate-900 dark:text-slate-100"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">URL รูปภาพโจทย์ (ถ้ามี)</label>
                            <input id="qImg" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100" placeholder="https://...">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">คะแนนประจำข้อ</label>
                            <input type="number" id="qPoints" value="1.0" step="0.5" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                        </div>

                        <div id="modalChoicesContainer" class="space-y-2 border-t dark:border-slate-700 pt-3"></div>
                    </div>
                `,
                didOpen: () => renderChoiceInputsModal(),
                showCancelButton: true,
                confirmButtonText: 'บันทึกโจทย์',
                preConfirm: () => {
                    const optType = document.getElementById('qOptCount').value;
                    const isMcq = optType !== 'subjective';
                    const count = isMcq ? parseInt(optType) : 0;
                    const selectedRadio = document.querySelector('input[name="correctOpt"]:checked');

                    let options = [];
                    if (isMcq) {
                        for (let i = 0; i < count; i++) {
                            options.push({
                                text: document.getElementById(`optTxt_${i}`).value,
                                img: document.getElementById(`optImg_${i}`).value
                            });
                        }
                    }

                    return {
                        section_id: document.getElementById('qSection').value || null,
                        qType: isMcq ? 'mcq' : 'subjective',
                        qText: document.getElementById('qText').value,
                        qImg: document.getElementById('qImg').value,
                        qPoints: parseFloat(document.getElementById('qPoints').value) || 1.0,
                        correctIdx: selectedRadio ? parseInt(selectedRadio.value) : 0,
                        options
                    }
                }
            });

            if (form) {
                const nextNum = currentQuestions.length + 1;
                const { data: qData } = await mySupabase.from('exam_questions').insert([{
                    exam_id: examId,
                    section_id: form.section_id,
                    question_number: nextNum,
                    question_text: form.qText,
                    question_image: form.qImg || null,
                    question_type: form.qType,
                    points: form.qPoints,
                    correct_option_index: form.correctIdx
                }]).select().single();

                if (qData && form.qType === 'mcq') {
                    const optInserts = form.options.map((opt, i) => ({
                        question_id: qData.id,
                        option_text: opt.text,
                        option_image: opt.img || null,
                        option_index: i
                    }));
                    await mySupabase.from('exam_options').insert(optInserts);
                }
                loadData();
            }
        }

        function renderChoiceInputsModal() {
            const val = document.getElementById('qOptCount').value;
            const container = document.getElementById('modalChoicesContainer');
            if (val === 'subjective') {
                container.innerHTML = `<div class="italic text-slate-400 text-center py-2">[ ข้อสอบอัตนัย: นักเรียนจะพิมพ์ตอบข้อความ ]</div>`;
                return;
            }

            const count = parseInt(val);
            const letters = ['A', 'B', 'C', 'D', 'E'];
            let html = '<label class="block font-bold text-primary">ตัวเลือกและรูปภาพตัวเลือก</label>';

            for (let i = 0; i < count; i++) {
                html += `
                    <div class="p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 space-y-1.5">
                        <div class="flex items-center gap-2 font-bold text-slate-900 dark:text-slate-100">
                            <input type="radio" name="correctOpt" value="${i}" ${i === 0 ? 'checked' : ''}>
                            <span>ตัวเลือก ${letters[i]}</span>
                        </div>
                        <input id="optTxt_${i}" class="w-full px-2.5 py-1.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-slate-100" placeholder="ข้อความตัวเลือก ${letters[i]}">
                        <input id="optImg_${i}" class="w-full px-2.5 py-1.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-[11px] text-slate-900 dark:text-slate-100" placeholder="URL รูปภาพตัวเลือก ${letters[i]} (ถ้ามี)">
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        async function deleteQuestion(id) {
            await mySupabase.from('exam_questions').delete().eq('id', id);
            loadData();
        }

        function openPreviewModal() {
            if (currentQuestions.length === 0) { Swal.fire('ไม่มีข้อมูล', 'กรุณาเพิ่มข้อสอบก่อนกด Preview', 'warning'); return; }

            let previewHtml = currentQuestions.map(q => `
                <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 text-left text-xs space-y-2">
                    <div class="font-bold text-slate-900 dark:text-white">ข้อที่ ${q.question_number}. ${q.question_text || ''}</div>
                    ${q.question_image ? `<img src="${q.question_image}" class="max-h-36 rounded-lg">` : ''}
                    ${q.question_type === 'mcq' ? `
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            ${(q.exam_options || []).map((opt, i) => `
                                <div class="p-2 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100">
                                    <div>${String.fromCharCode(65 + i)}. ${opt.option_text || ''}</div>
                                    ${opt.option_image ? `<img src="${opt.option_image}" class="max-h-20 rounded mt-1">` : ''}
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="italic text-slate-400">[ ช่องสำหรับให้นักเรียนพิมพ์เขียนตอบ ]</div>'}
                </div>
            `).join('');

            Swal.fire({
                title: `<i class="fas fa-eye text-emerald-500"></i> Preview ตัวอย่างข้อสอบ: ${currentExam.title}`,
                width: '750px',
                html: `<div class="max-h-96 overflow-y-auto space-y-3 pr-1">${previewHtml}</div>`,
                confirmButtonText: 'ปิดตัวอย่าง'
            });
        }

        initPage();
    </script>
</body>
</html>
