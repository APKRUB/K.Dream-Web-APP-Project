<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เครื่องมือจัดการโจทย์และกระดาษคำตอบ OMR</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { 
                        primary: '#0284c7', 
                        darkbg: '#020617', 
                        darkbox: '#090d16', 
                        darkinput: '#0f172a' 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.92); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
        
        /* OMR Bubble Style */
        .omr-bubble {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #cbd5e1;
        }
        .dark .omr-bubble { border-color: #334155; }
        .omr-bubble.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
        }

        .fab-save-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
        }
        .fab-save-btn:hover { transform: translateY(-4px) scale(1.03); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-32">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='admin_exams.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 hover:bg-primary hover:text-white transition-all"><i class="fas fa-arrow-left"></i></button>
                <div>
                    <h1 id="examTitleHeader" class="font-extrabold text-xl text-slate-900 dark:text-white">จัดการโจทย์และเฉลย OMR</h1>
                    <p id="examSubHeader" class="text-xs text-slate-500 dark:text-slate-400">กำลังโหลดข้อมูลข้อสอบ...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="openPreviewStudentModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition-all flex items-center gap-2">
                    <i class="fas fa-eye"></i> Preview หน้าสอบนักเรียน
                </button>
                <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800"><i class="fas fa-moon" id="themeIcon"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 space-y-8">
        
        <!-- เครื่องมือสร้างกระดาษคำตอบคอมพิวเตอร์ (OMR Sheet Generator) -->
        <div class="glossy-card p-6 rounded-3xl space-y-4 border-l-4 border-l-sky-500 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h3 class="font-bold text-base flex items-center gap-2 text-sky-600 dark:text-sky-400">
                    <i class="fas fa-grip-vertical"></i> สร้างกระดาษคำตอบคอมพิวเตอร์ (OMR Bubble Sheet)
                </h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">เจนกระดาษคำตอบฝนวงกลม ก-ง อัตโนมัติ ปรับแก้เฉลยง่ายเพียงคลิกฝนวงกลมที่ต้องการ</p>
            </div>
            <button onclick="openAutoAnswerSheetModal()" class="px-5 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-sky-500/20 transition-all shrink-0">
                <i class="fas fa-plus-circle mr-1"></i> เจนกระดาษคำตอบ OMR
            </button>
        </div>

        <!-- แผงจัดการ PDF โจทย์ -->
        <div id="pdfUploadCard" class="glossy-card p-6 rounded-3xl space-y-4 border-l-4 border-l-red-500">
            <h3 class="font-bold text-base flex items-center gap-2"><i class="fas fa-file-pdf text-red-500"></i> ไฟล์โจทย์ PDF ข้อสอบ</h3>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <input type="text" id="pdfUrlInput" class="md:col-span-8 px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl text-xs" placeholder="วาง URL ลิงก์ PDF หรืออัปโหลดไฟล์จากเครื่องด้านขวา...">
                <label class="md:col-span-2 px-4 py-2.5 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 font-bold text-xs rounded-xl cursor-pointer flex items-center justify-center gap-2">
                    <i class="fas fa-upload"></i> อัปโหลด PDF
                    <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden" onchange="uploadPdfFile(this)">
                </label>
                <button onclick="savePdfUrl()" class="md:col-span-2 px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition-all">บันทึก URL PDF</button>
            </div>
        </div>

        <!-- รายการเฉลยกระดาษคำตอบ OMR ทั้งหมด -->
        <div class="glossy-card p-8 rounded-3xl space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-800">
                <h3 class="font-bold text-lg"><i class="fas fa-check-double text-sky-500 mr-2"></i>กระดาษทำเฉลย OMR (คลิกวงกลมเพื่อตั้งเฉลย)</h3>
                <button onclick="openQuestionModal()" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-md transition-all"><i class="fas fa-plus mr-1"></i> เพิ่มข้อใหม่</button>
            </div>
            <div id="questionsListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-8 text-slate-400 text-sm">กำลังโหลดกระดาษคำตอบ...</div>
            </div>
        </div>
    </main>

    <!-- Floating Save Button -->
    <button onclick="saveAllChangesSticky()" class="fab-save-btn px-6 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-full shadow-2xl flex items-center gap-2.5 border border-emerald-400/30">
        <i class="fas fa-save text-base"></i>
        <span>บันทึกการเปลี่ยนแปลงทั้งหมด</span>
    </button>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');

        let currentExamObj = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            if (!examId) {
                Swal.fire('ไม่พบ ID ข้อสอบ', 'กำลังนำคุณกลับหน้าคลังข้อสอบ', 'warning').then(() => {
                    window.location.href = 'admin_exams.html';
                });
                return;
            }
            await loadExamHeader();
            await loadQuestions();
        }

        async function loadExamHeader() {
            const { data } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (data) {
                currentExamObj = data;
                document.getElementById('examTitleHeader').textContent = `จัดการโจทย์และเฉลย OMR: ${data.title}`;
                document.getElementById('examSubHeader').textContent = `CODE: ${data.exam_code || 'ไม่มี'} | เวลา: ${data.time_limit} นาที`;
                if (data.pdf_url) document.getElementById('pdfUrlInput').value = data.pdf_url;
            }
        }

        async function loadQuestions() {
            const { data: questions } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            const container = document.getElementById('questionsListContainer');

            if (!questions || questions.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-sm">ยังไม่มีกระดาษคำตอบในชุดข้อสอบนี้ กดปุ่ม "เจนกระดาษคำตอบ OMR" ด้านบนเพื่อเริ่มสร้าง</div>`;
                return;
            }

            container.innerHTML = questions.map((q, idx) => {
                const choices = ['ก', 'ข', 'ค', 'ง'];
                const bubblesHtml = choices.map((cLabel, cIdx) => {
                    const isSelected = String(q.correct_answer) === String(cIdx) || q.correct_answer === cLabel;
                    return `
                        <div onclick="updateQuickCorrectAnswer('${q.id}', '${cIdx}')" class="omr-bubble ${isSelected ? 'active' : ''}" title="คลิกตั้งเป็นเฉลยข้อ ${cLabel}">
                            ${cLabel}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-between items-center gap-3">
                        <div class="space-y-1">
                            <span class="font-extrabold text-sm text-slate-900 dark:text-white">ข้อ ${q.question_number || (idx + 1)}</span>
                            <div class="flex gap-2 pt-1">${bubblesHtml}</div>
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <button onclick='openQuestionModal(${JSON.stringify(q)})' class="w-8 h-8 flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold hover:bg-sky-600 hover:text-white transition-colors" title="แก้ไขข้อความโจทย์"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteQuestion('${q.id}')" class="w-8 h-8 flex items-center justify-center bg-red-100 text-red-600 dark:bg-red-950/50 dark:text-red-400 rounded-xl text-xs font-bold hover:bg-red-600 hover:text-white transition-colors" title="ลบข้อนี้"><i class="fas fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ฝนวงกลมเปลี่ยนเฉลยรวดเร็ว (Quick OMR Answer Setting)
        async function updateQuickCorrectAnswer(qId, cIdx) {
            await mySupabase.from('questions').update({ correct_answer: String(cIdx) }).eq('id', qId);
            loadQuestions();
        }

        // เจนกระดาษคำตอบ OMR พร้อมจัดการ Schema ป้องกันการล้มเหลว
        async function openAutoAnswerSheetModal() {
            const { value: formValues } = await Swal.fire({
                title: '⚡ เจนกระดาษคำตอบ OMR',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <p class="text-slate-400">ระบุช่วงข้อที่ต้องการสร้าง ระบบจะสร้างกระดาษคำตอบฝนวงกลม ก-ง ให้ทันที:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold mb-1">เริ่มจากข้อที่</label>
                                <input type="number" id="genStartNum" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="1">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">ถึงข้อที่</label>
                                <input type="number" id="genEndNum" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="20">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ชื่อหมวดหมู่ย่อย (ถ้ามี)</label>
                            <input id="genCategoryTag" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700" placeholder="เช่น หมวดหมู่ A">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างกระดาษคำตอบ OMR',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const start = parseInt(document.getElementById('genStartNum').value) || 1;
                    const end = parseInt(document.getElementById('genEndNum').value) || 20;
                    const tag = document.getElementById('genCategoryTag').value || '';
                    if (start > end) { Swal.showValidationMessage('ข้อเริ่มต้นต้องน้อยกว่าข้อสุดท้าย'); return false; }
                    return { start, end, tag };
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังสร้างกระดาษคำตอบ OMR...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                const newQuestions = [];
                for (let i = formValues.start; i <= formValues.end; i++) {
                    newQuestions.push({
                        exam_id: examId,
                        question_number: i,
                        question_text: formValues.tag ? `[${formValues.tag}] ข้อที่ ${i}` : `ข้อที่ ${i}`,
                        options: ['ก', 'ข', 'ค', 'ง'],
                        correct_answer: '0'
                    });
                }

                const { error } = await mySupabase.from('questions').insert(newQuestions);

                if (!error) {
                    Swal.fire({ icon: 'success', title: `สร้างกระดาษคำตอบ OMR ${newQuestions.length} ข้อ เรียบร้อย!`, timer: 1200, showConfirmButton: false });
                    loadQuestions();
                } else {
                    Swal.fire('สร้างล้มเหลว', `กรุณารัน SQL Script ใน Supabase SQL Editor ก่อนครับ<br><br><code class="text-xs text-red-400">${error.message}</code>`, 'error');
                }
            }
        }

        function openPreviewStudentModal() {
            window.open(`exam_take.html?id=${examId}&preview=true`, '_blank');
        }

        async function openQuestionModal(qData = null) {
            const isEdit = !!qData;
            const options = qData?.options || ['ก', 'ข', 'ค', 'ง'];

            const { value: formValues } = await Swal.fire({
                title: isEdit ? 'แก้ไขรายละเอียดโจทย์' : 'เพิ่มข้อสอบใหม่',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="col-span-1">
                                <label class="block font-bold mb-1">ข้อที่</label>
                                <input type="number" id="qNum" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="${qData?.question_number || 1}">
                            </div>
                            <div class="col-span-2">
                                <label class="block font-bold mb-1">เฉลยตัวเลือกที่ถูกต้อง</label>
                                <select id="qCorrect" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700">
                                    <option value="0" ${String(qData?.correct_answer) === '0' ? 'selected' : ''}>ก. (ตัวเลือก 1)</option>
                                    <option value="1" ${String(qData?.correct_answer) === '1' ? 'selected' : ''}>ข. (ตัวเลือก 2)</option>
                                    <option value="2" ${String(qData?.correct_answer) === '2' ? 'selected' : ''}>ค. (ตัวเลือก 3)</option>
                                    <option value="3" ${String(qData?.correct_answer) === '3' ? 'selected' : ''}>ง. (ตัวเลือก 4)</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">คำถาม / ข้อความโจทย์ (ถ้ามี)</label>
                            <textarea id="qText" rows="2" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-800 dark:border-slate-700">${qData?.question_text || ''}</textarea>
                        </div>
                        <div class="space-y-2">
                            <label class="block font-bold">ตัวเลือกคำตอบ (ก - ง)</label>
                            <input id="opt0" class="w-full px-3 py-1.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="${options[0] || 'ก'}">
                            <input id="opt1" class="w-full px-3 py-1.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="${options[1] || 'ข'}">
                            <input id="opt2" class="w-full px-3 py-1.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="${options[2] || 'ค'}">
                            <input id="opt3" class="w-full px-3 py-1.5 border rounded-xl dark:bg-slate-800 dark:border-slate-700" value="${options[3] || 'ง'}">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกโจทย์',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    return {
                        exam_id: examId,
                        question_number: parseInt(document.getElementById('qNum').value) || 1,
                        question_text: document.getElementById('qText').value,
                        options: [
                            document.getElementById('opt0').value,
                            document.getElementById('opt1').value,
                            document.getElementById('opt2').value,
                            document.getElementById('opt3').value
                        ],
                        correct_answer: document.getElementById('qCorrect').value
                    }
                }
            });

            if (formValues) {
                if (isEdit) {
                    await mySupabase.from('questions').update(formValues).eq('id', qData.id);
                } else {
                    await mySupabase.from('questions').insert([formValues]);
                }
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1000, showConfirmButton: false });
                loadQuestions();
            }
        }

        async function deleteQuestion(id) {
            await mySupabase.from('questions').delete().eq('id', id);
            loadQuestions();
        }

        async function uploadPdfFile(input) {
            const file = input.files[0];
            if (!file) return;

            Swal.fire({ title: 'กำลังอัปโหลด PDF...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const fileName = `exam_pdf_${Date.now()}_${file.name}`;
            const { error } = await mySupabase.storage.from('announcement_files').upload(fileName, file);

            if (!error) {
                const { data } = mySupabase.storage.from('announcement_files').getPublicUrl(fileName);
                if (data) {
                    document.getElementById('pdfUrlInput').value = data.publicUrl;
                    await savePdfUrl();
                    Swal.fire({ icon: 'success', title: 'อัปโหลดและบันทึก URL PDF สำเร็จ!', timer: 1200, showConfirmButton: false });
                }
            } else { Swal.fire('อัปโหลดล้มเหลว', error.message, 'error'); }
        }

        async function savePdfUrl() {
            const pdf_url = document.getElementById('pdfUrlInput').value;
            await mySupabase.from('exams').update({ pdf_url }).eq('id', examId);
        }

        async function saveAllChangesSticky() {
            await savePdfUrl();
            Swal.fire({ icon: 'success', title: 'บันทึกการเปลี่ยนแปลงทั้งหมดแล้ว!', timer: 1200, showConfirmButton: false });
        }

        initPage();
    </script>
</body>
</html>
