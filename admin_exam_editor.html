<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | เครื่องมือจัดการโจทย์และกระดาษคำตอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.98); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #334155 !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-28">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='admin_exams.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all"><i class="fas fa-arrow-left"></i></button>
                <h1 id="examTitleHeader" class="font-extrabold text-xl">จัดการโจทย์ข้อสอบ</h1>
            </div>
            <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border"><i class="fas fa-moon" id="themeIcon"></i></button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 space-y-8">
        
        <!-- แผงอัปโหลด PDF รองรับทั้ง URL Direct Link และไฟล์จากเครื่อง -->
        <div id="pdfUploadCard" class="glossy-card p-6 rounded-3xl space-y-4 border-l-4 border-l-red-500">
            <h3 class="font-bold text-base flex items-center gap-2"><i class="fas fa-file-pdf text-red-500"></i> ไฟล์โจทย์ PDF ข้อสอบ</h3>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <input type="text" id="pdfUrlInput" class="md:col-span-8 px-4 py-2.5 bg-white dark:bg-slate-800 border rounded-xl text-xs" placeholder="วาง URL ลิงก์ PDF หรืออัปโหลดไฟล์จากเครื่องด้านขวา...">
                <label class="md:col-span-2 px-4 py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 font-bold text-xs rounded-xl cursor-pointer flex items-center justify-center gap-2">
                    <i class="fas fa-upload"></i> อัปโหลดไฟล์ PDF
                    <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden" onchange="uploadPdfFile(this)">
                </label>
                <button onclick="savePdfUrl()" class="md:col-span-2 px-4 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs">บันทึก URL PDF</button>
            </div>
        </div>

        <div class="glossy-card p-8 rounded-3xl space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-700">
                <h3 class="font-bold text-lg"><i class="fas fa-list-ol text-primary mr-2"></i>รายการโจทย์ทั้งหมด</h3>
                <button onclick="addNewQuestionModal()" class="px-5 py-2.5 bg-primary text-white font-bold text-xs rounded-2xl"><i class="fas fa-plus mr-1"></i> เพิ่มโจทย์</button>
            </div>
            <div id="questionsListContainer" class="space-y-4"></div>
        </div>
    </main>

    <!-- Sticky Floating Save Bar ด้านล่างจอเสมอ -->
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-md border-t border-slate-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="text-xs text-slate-300 font-bold flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>แก้ไขล่าสุด: พร้อมบันทึกการเปลี่ยนแปลงทั้งหมด</span>
            </div>
            <button onclick="saveAllChangesSticky()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-2xl shadow-xl transition-all flex items-center gap-2">
                <i class="fas fa-save text-sm"></i> บันทึกการเปลี่ยนแปลงทั้งหมด
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');

        async function uploadPdfFile(input) {
            const file = input.files[0];
            if (!file) return;

            Swal.fire({ title: 'กำลังอัปโหลด PDF เข้า Supabase...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await mySupabase.storage.from('exam-pdfs').upload(fileName, file);

            if (!error) {
                const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/exam-pdfs/${fileName}`;
                document.getElementById('pdfUrlInput').value = publicUrl;
                await savePdfUrl();
                Swal.fire({ icon: 'success', title: 'อัปโหลดและสร้างลิงก์สำเร็จ!', timer: 1200, showConfirmButton: false });
            } else { Swal.fire('อัปโหลดล้มเหลว', error.message, 'error'); }
        }

        async function savePdfUrl() {
            const pdf_url = document.getElementById('pdfUrlInput').value;
            await mySupabase.from('exams').update({ pdf_url }).eq('id', examId);
        }

        async function saveAllChangesSticky() {
            Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลเรียบร้อยแล้ว!', timer: 1000, showConfirmButton: false });
        }
    </script>
</body>
</html>
