<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ Hi-Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        
        .upcoming-banner-card {
            background: linear-gradient(135deg, rgba(254, 243, 199, 0.9) 0%, rgba(253, 230, 138, 0.6) 100%);
            border: 1px solid rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
        }
        .dark .upcoming-banner-card {
            background: linear-gradient(135deg, rgba(69, 26, 3, 0.6) 0%, rgba(120, 53, 15, 0.4) 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.2);
        }

        .glow-badge-sky { background: rgba(2, 132, 199, 0.1); color: #0284c7; border: 1px solid rgba(56, 189, 248, 0.3); }
        .dark .glow-badge-sky { background: rgba(2, 132, 199, 0.2); color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-sky-500 to-blue-600 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-file-signature"></i></span>
                        ศูนย์จัดการชุดข้อสอบ Hi-Tech
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 pb-16 space-y-6">
        
        <!-- Section ลอยด้านบนสุด: แสดงข้อสอบที่จะเปิดบริการภายใน 24–48 ชั่วโมงข้างหน้า -->
        <div id="upcomingExamSection" class="hidden space-y-3">
            <div class="flex items-center gap-2 text-amber-600 dark:text-amber-400 font-extrabold text-xs uppercase tracking-wider">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                <i class="fas fa-hourglass-start text-sm"></i> ข้อสอบกำลังจะเปิดบริการ (ภายใน 24 - 48 ชั่วโมงนี้)
            </div>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- Section หลัก: จัดกลุ่มชุดข้อสอบสไตล์ Google Classroom -->
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hitech-card p-5 rounded-2xl">
                <div>
                    <h2 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-layer-group text-sky-500"></i> คลังชุดข้อสอบ (Google Classroom Layout)
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">แบ่งกลุ่มหมวดหมู่รายวิชา รองรับทั้งโหมด PDF และโจทย์พิมพ์ลงระบบออนไลน์</p>
                </div>
                
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="openCategoryManagerModal()" class="px-3.5 py-2 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-300 rounded-xl font-bold text-xs border border-indigo-200 dark:border-indigo-900 hover:bg-indigo-100 transition-all flex items-center gap-1.5">
                        <i class="fas fa-tags text-indigo-500"></i> จัดการหมวดหมู่
                    </button>
                    <button onclick="openExamModal()" class="px-4 py-2 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-sky-500/25 transition-all flex items-center gap-1.5">
                        <i class="fas fa-plus"></i> สร้างชุดข้อสอบใหม่
                    </button>
                </div>
            </div>

            <div id="classroomExamsContainer" class="space-y-8">
                <div class="text-center py-10 text-slate-400 text-xs">กำลังโหลดคลังข้อสอบ...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriesList = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await loadCategories();
            await loadExams();
        }

        async function loadCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            categoriesList = data || [];
        }

        async function loadExams() {
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(id, name)').order('created_at', { ascending: false });
            
            if (error || !exams || exams.length === 0) {
                document.getElementById('classroomExamsContainer').innerHTML = `<div class="hitech-card p-8 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีชุดข้อสอบในระบบ</div>`;
                return;
            }

            const now = new Date();
            const in48Hours = new Date(now.getTime() + 48 * 60 * 60 * 1000);
            
            const upcomingExams = exams.filter(e => {
                if (e.status === 'countdown' && e.start_time) {
                    const st = new Date(e.start_time);
                    return st > now && st <= in48Hours;
                }
                return false;
            });

            const upcomingSec = document.getElementById('upcomingExamSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');

            if (upcomingExams.length > 0) {
                upcomingSec.classList.remove('hidden');
                upcomingGrid.innerHTML = upcomingExams.map(e => {
                    const st = new Date(e.start_time);
                    const diffHours = Math.round((st - now) / (1000 * 60 * 60));
                    return `
                        <div class="upcoming-banner-card p-4 rounded-2xl space-y-2 border-l-4 border-l-amber-500">
                            <div class="flex justify-between items-start">
                                <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-700 dark:text-amber-300 font-bold text-[10px]">
                                    <i class="fas fa-clock mr-1"></i> อีก ~${diffHours} ชม. จะเปิดบริการ
                                </span>
                                <span class="font-mono text-xs text-amber-600 dark:text-amber-400 font-bold">${e.exam_code || 'CODE'}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 dark:text-white text-sm">${e.title}</h4>
                            <div class="text-[11px] text-slate-600 dark:text-slate-300">
                                📅 เปิดสอบ: ${st.toLocaleString('th-TH')}
                            </div>
                            <div class="pt-2">
                                <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all shadow-sm">
                                    เตรียมโจทย์ & เฉลย OMR
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                upcomingSec.classList.add('hidden');
            }

            const { data: essayQuestions } = await mySupabase.from('questions').select('exam_id').eq('question_type', 'essay');
            const examsWithEssay = new Set((essayQuestions || []).map(q => q.exam_id));

            const grouped = {};
            exams.forEach(e => {
                const catName = e.exam_categories?.name || 'ข้อสอบทั่วไป';
                if (!grouped[catName]) grouped[catName] = [];
                grouped[catName].push(e);
            });

            const container = document.getElementById('classroomExamsContainer');
            container.innerHTML = Object.keys(grouped).map(catName => {
                const catExams = grouped[catName];
                const cardsHtml = catExams.map(e => {
                    const statusBadge = e.status === 'public' 
                        ? '<span class="px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold text-[10px] border border-emerald-200 dark:border-emerald-800">เปิดบริการ</span>' 
                        : (e.status === 'countdown' 
                            ? '<span class="px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-bold text-[10px] border border-amber-200 dark:border-amber-800">ตั้งเวลา</span>' 
                            : '<span class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-[10px]">ซ่อน</span>');

                    const dType = e.delivery_type || e.exam_type || 'pdf';
                    const deliveryBadge = dType === 'online'
                        ? '<span class="px-2 py-0.5 rounded-md bg-purple-50 dark:bg-purple-950/50 text-purple-600 dark:text-purple-300 text-[10px] font-bold"><i class="fas fa-keyboard mr-1"></i>โจทย์ออนไลน์</span>'
                        : '<span class="px-2 py-0.5 rounded-md bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-300 text-[10px] font-bold"><i class="fas fa-file-pdf mr-1"></i>ไฟล์ PDF</span>';

                    const hasEssay = examsWithEssay.has(e.id);

                    return `
                        <div class="hitech-card p-4 rounded-2xl flex flex-col justify-between space-y-3">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center gap-1">
                                    <span class="font-mono text-[11px] font-bold glow-badge-sky px-2 py-0.5 rounded-md">${e.exam_code || 'CODE'}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="font-bold text-sm text-slate-900 dark:text-white leading-snug line-clamp-1">${e.title}</h3>
                                <div class="flex items-center gap-2 pt-0.5 text-[11px] text-slate-500">
                                    ${deliveryBadge}
                                    <span><i class="far fa-clock text-sky-500 mr-1"></i>${e.time_limit || 60} นาที</span>
                                </div>
                                ${e.due_date ? `<div class="text-[10px] text-amber-500 font-bold"><i class="far fa-calendar-xmark mr-1"></i>Due Date: ${new Date(e.due_date).toLocaleString('th-TH')}</div>` : ''}
                            </div>

                            <div class="pt-2 border-t border-slate-100 dark:border-slate-800/80 space-y-1.5">
                                <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 shadow-sm">
                                    <i class="fas fa-list-check"></i> จัดการโจทย์ & เฉลย OMR
                                </button>
                                
                                <div class="flex gap-1.5">
                                    ${hasEssay ? `
                                        <button onclick="window.location.href='admin_exam_grading.html?exam_id=${e.id}'" class="flex-1 py-1.5 bg-amber-500/10 hover:bg-amber-500 hover:text-white text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-lg text-[11px] font-bold transition-all flex items-center justify-center gap-1">
                                            <i class="fas fa-pen-nib"></i> ตรวจอัตนัย
                                        </button>
                                    ` : ''}
                                    <button onclick='openExamModal(${JSON.stringify(e)})' class="flex-1 py-1.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 rounded-lg text-[11px] font-bold hover:bg-slate-200 transition-colors">แก้ไข</button>
                                    <button onclick="deleteExam('${e.id}')" class="px-2.5 py-1.5 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-lg text-[11px] font-bold hover:bg-red-100 transition-colors"><i class="fas fa-trash-can"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-3">
                        <div class="flex items-center gap-2 border-b border-sky-500/20 pb-2">
                            <span class="w-3 h-6 bg-gradient-to-b from-sky-400 to-blue-600 rounded-full shadow-sm"></span>
                            <h3 class="font-extrabold text-base text-slate-900 dark:text-white">${catName}</h3>
                            <span class="px-2.5 py-0.5 rounded-full bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 text-xs font-bold">${catExams.length} ชุด</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cardsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        async function openExamModal(examData = null) {
            const isEdit = !!examData;
            const categoryOptions = categoriesList.map(c => `<option value="${c.id}" ${examData?.category_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
            const currentDelivery = examData?.delivery_type || examData?.exam_type || 'pdf';

            const { value: formValues } = await Swal.fire({
                title: isEdit ? 'แก้ไขชุดข้อสอบ' : 'สร้างชุดข้อสอบใหม่',
                width: '600px',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ประเภทรูปแบบข้อสอบ <span class="text-red-500">*</span></label>
                            <div class="grid grid-cols-2 gap-2">
                                <label class="p-2.5 border rounded-xl dark:border-slate-700 flex items-center gap-2 cursor-pointer hover:border-sky-500">
                                    <input type="radio" name="swalDeliveryType" value="pdf" ${(!examData || currentDelivery === 'pdf') ? 'checked' : ''}>
                                    <div>
                                        <div class="font-bold"><i class="fas fa-file-pdf text-red-500 mr-1"></i>ใช้ไฟล์ PDF</div>
                                        <div class="text-[10px] text-slate-400">อ่านโจทย์จาก PDF + OMR</div>
                                    </div>
                                </label>
                                <label class="p-2.5 border rounded-xl dark:border-slate-700 flex items-center gap-2 cursor-pointer hover:border-sky-500">
                                    <input type="radio" name="swalDeliveryType" value="online" ${currentDelivery === 'online' ? 'checked' : ''}>
                                    <div>
                                        <div class="font-bold"><i class="fas fa-keyboard text-purple-500 mr-1"></i>พิมพ์ลงระบบ</div>
                                        <div class="text-[10px] text-slate-400">พิมพ์โจทย์ลงระบบออนไลน์</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div class="col-span-2">
                                <label class="block font-bold mb-1">ชื่อชุดข้อสอบ <span class="text-red-500">*</span></label>
                                <input id="swalTitle" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.title || ''}">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">รหัสข้อสอบ (Code)</label>
                                <input id="swalExamCode" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono uppercase outline-none" value="${examData?.exam_code || ''}">
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="block font-bold mb-1">หมวดหมู่</label>
                                <select id="swalCategory" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none">
                                    <option value="">-- ไม่ระบุ --</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">เวลาทำ (นาที) <span class="text-red-500">*</span></label>
                                <input type="number" id="swalTimeLimit" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.time_limit || 60}">
                            </div>
                            <div>
                                <label class="block font-bold mb-1">จำนวนครั้ง (Attempt)</label>
                                <input type="number" id="swalMaxAttempts" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="0 = ไม่จำกัด" value="${examData?.max_attempts ?? 1}">
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold mb-1">สถานะเปิดข้อสอบ</label>
                            <select id="swalStatus" onchange="toggleCountdownInput(this.value)" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none">
                                <option value="draft" ${examData?.status === 'draft' ? 'selected' : ''}>ซ่อนอยู่ (Draft)</option>
                                <option value="public" ${examData?.status === 'public' ? 'selected' : ''}>เปิดบริการทันที (Public)</option>
                                <option value="countdown" ${examData?.status === 'countdown' ? 'selected' : ''}>ตั้งเวลาเปิดบริการ (Countdown)</option>
                            </select>
                        </div>

                        <div id="countdownTimeBox" class="${examData?.status === 'countdown' ? '' : 'hidden'}">
                            <label class="block font-bold mb-1 text-amber-500"><i class="fas fa-clock mr-1"></i> วันเวลาเริ่มเปิดบริการ (Start Time)</label>
                            <input type="datetime-local" id="swalStartTime" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.start_time ? new Date(new Date(examData.start_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                        </div>

                        <div class="pt-2 border-t dark:border-slate-800 space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer font-bold text-slate-800 dark:text-slate-200">
                                <input type="checkbox" id="hasDueDateCheck" onchange="toggleDueDateInput(this.checked)" ${examData?.due_date ? 'checked' : ''} class="w-4 h-4 rounded text-sky-600">
                                <span>กำหนดวันเวลาสิ้นสุดการทำข้อสอบ (Due Date)</span>
                            </label>
                            
                            <div id="dueDateBox" class="${examData?.due_date ? '' : 'hidden'} space-y-2">
                                <input type="datetime-local" id="swalDueDate" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" value="${examData?.due_date ? new Date(new Date(examData.due_date).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('swalTitle').value.trim();
                    const exam_code = document.getElementById('swalExamCode').value.trim().toUpperCase();
                    const delivery_type = document.querySelector('input[name="swalDeliveryType"]:checked')?.value || 'pdf';
                    const status = document.getElementById('swalStatus').value;
                    const hasDueDate = document.getElementById('hasDueDateCheck').checked;
                    const catVal = document.getElementById('swalCategory').value;

                    if (!title) { Swal.showValidationMessage('กรุณากรอกชื่อชุดข้อสอบ'); return false; }

                    // ส่งทั้ง delivery_type และ exam_type ป้องกัน Not-Null Constraint 100%
                    const payload = {
                        title,
                        exam_code: exam_code || `EXAM-${Math.floor(Math.random()*9000+1000)}`,
                        delivery_type,
                        exam_type: delivery_type,
                        category_id: catVal ? catVal : null,
                        time_limit: parseInt(document.getElementById('swalTimeLimit').value) || 60,
                        max_attempts: parseInt(document.getElementById('swalMaxAttempts').value) || 0,
                        status: status,
                        start_time: (status === 'countdown' && document.getElementById('swalStartTime').value) ? new Date(document.getElementById('swalStartTime').value).toISOString() : null,
                        due_date: (hasDueDate && document.getElementById('swalDueDate').value) ? new Date(document.getElementById('swalDueDate').value).toISOString() : null
                    };

                    return payload;
                }
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                let resError = null;
                if (isEdit) {
                    const { error } = await mySupabase.from('exams').update(formValues).eq('id', examData.id);
                    resError = error;
                } else {
                    const { error } = await mySupabase.from('exams').insert([formValues]);
                    resError = error;
                }

                if (!resError) {
                    Swal.fire({ icon: 'success', title: 'บันทึกชุดข้อสอบสำเร็จ!', timer: 1200, showConfirmButton: false });
                    loadExams();
                } else {
                    Swal.fire('บันทึกล้มเหลว', `เกิดข้อผิดพลาดจาก Supabase Database:<br><code class="text-xs text-red-400 font-mono mt-2 block">${resError.message}</code>`, 'error');
                }
            }
        }

        window.toggleCountdownInput = function(val) {
            document.getElementById('countdownTimeBox').className = val === 'countdown' ? '' : 'hidden';
        }

        window.toggleDueDateInput = function(checked) {
            document.getElementById('dueDateBox').className = checked ? 'space-y-2' : 'hidden';
        }

        async function openCategoryManagerModal() {
            let catHtml = categoriesList.map(c => `
                <div class="flex justify-between items-center p-2 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs">
                    <span class="font-bold">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 px-2 py-1"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            const { value: newCatName } = await Swal.fire({
                title: 'จัดการหมวดหมู่',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div class="space-y-1.5 max-h-40 overflow-y-auto">${catHtml || '<div class="text-center text-slate-400">ยังไม่มีหมวดหมู่</div>'}</div>
                        <input id="newCatInput" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" placeholder="พิมพ์ชื่อหมวดหมู่ใหม่...">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'เพิ่มหมวดหมู่',
                preConfirm: () => document.getElementById('newCatInput').value
            });

            if (newCatName) {
                await mySupabase.from('exam_categories').insert([{ name: newCatName }]);
                await loadCategories();
                openCategoryManagerModal();
            }
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await loadCategories();
            openCategoryManagerModal();
        }

        async function deleteExam(id) {
            if ((await Swal.fire({ title: 'ยืนยันลบชุดข้อสอบนี้?', icon: 'warning', showCancelButton: true })).isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', id);
                loadExams();
            }
        }

        initPage();
    </script>
</body>
</html>
