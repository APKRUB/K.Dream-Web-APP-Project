<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b', darkinput: '#334155' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.98); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #334155 !important; border-radius: 1.5rem !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
        .dark .swal2-input, .dark .swal2-select, .dark .swal2-textarea { background-color: #0f172a !important; color: #f8fafc !important; border-color: #475569 !important; }

        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideDown 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Top Toast Alert Banner (7 วิ) -->
    <div id="topToastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md hidden toast-animate">
        <div id="topToastContent" class="p-4 rounded-2xl shadow-2xl border flex items-center justify-between gap-3 text-xs font-bold bg-red-600 text-white border-red-500">
            <div class="flex items-center gap-2.5">
                <i class="fas fa-exclamation-circle text-lg"></i>
                <span id="topToastText">เกิดข้อผิดพลาดในการทำรายการ</span>
            </div>
            <button onclick="hideTopToast()" class="text-white/80 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all text-slate-700 dark:text-slate-200 shadow-sm"><i class="fas fa-arrow-left text-lg"></i></button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง ตั้งค่ากำหนดส่ง และวิเคราะห์สถิติประเมินผล</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Notification Bell dropdown -->
                    <div class="relative">
                        <button onclick="toggleNotificationDropdown()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 relative">
                            <i class="fas fa-bell text-lg"></i>
                            <span id="notifBadge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center border-2 border-white dark:border-darkbg">0</span>
                        </button>
                        <div id="notifDropdown" class="hidden absolute right-0 mt-3 w-80 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl z-50 overflow-hidden">
                            <div class="p-3 bg-slate-50 dark:bg-slate-900 border-b dark:border-slate-700 font-bold text-xs flex justify-between items-center">
                                <span><i class="fas fa-bell text-primary mr-1"></i> แจ้งเตือนสำหรับคุณครู</span>
                                <button onclick="markAllNotificationsRead()" class="text-[10px] text-primary hover:underline">อ่านทั้งหมด</button>
                            </div>
                            <div id="notifList" class="max-h-64 overflow-y-auto divide-y dark:divide-slate-700"></div>
                        </div>
                    </div>

                    <button onclick="openCategoryModal()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-darkinput dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-2xl font-bold text-xs transition-all flex items-center gap-2 border border-slate-300 dark:border-slate-600">
                        <i class="fas fa-folder text-indigo-500"></i> จัดการหมวดหมู่หลัก
                    </button>
                    <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-2xl font-bold text-xs shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                        <i class="fas fa-plus"></i> เพิ่มชุดข้อสอบ
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <div id="upcomingExamsSection" class="hidden space-y-4">
            <h3 class="font-bold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-hourglass-half animate-spin"></i> ชุดข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง</h3>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div class="glossy-card p-6 rounded-3xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-200 dark:border-slate-700">
                <div class="flex bg-slate-200 dark:bg-darkinput p-1.5 rounded-2xl gap-1">
                    <button id="viewAllBtn" onclick="switchViewMode('all')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm"><i class="fas fa-th-large mr-1.5"></i> ชุดข้อสอบทั้งหมด</button>
                    <button id="viewCatBtn" onclick="switchViewMode('category')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary"><i class="fas fa-folder mr-1.5"></i> มุมมองหมวดหมู่ (Classroom)</button>
                </div>
                <input type="text" id="searchExam" oninput="renderExams()" placeholder="ค้นหาตามชื่อหรือรหัสวิชา..." class="px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-2xl text-xs w-full sm:w-64 text-slate-900 dark:text-slate-100 outline-none focus:border-primary">
            </div>

            <div id="examsDisplayContainer"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allExams = [];
        let allCategories = [];
        let currentViewMode = 'all';
        let toastTimer = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function showTopToast(msg, duration = 7000) {
            const container = document.getElementById('topToastContainer');
            document.getElementById('topToastText').textContent = msg;
            container.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => hideTopToast(), duration);
        }

        function hideTopToast() {
            document.getElementById('topToastContainer').classList.add('hidden');
        }

        async function initPage() {
            await fetchCategories();
            await fetchExams();
            await fetchNotifications();
        }

        async function fetchNotifications() {
            const { data } = await mySupabase.from('system_notifications').select('*').or('role_target.eq.teacher,role_target.eq.all').order('created_at', { ascending: false }).limit(10);
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifBadge');
            
            const unread = (data || []).filter(n => !n.is_read).length;
            if (unread > 0) { badge.textContent = unread; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }

            if (!data || data.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">ไม่มีการแจ้งเตือนใหม่</div>`;
                return;
            }

            list.innerHTML = data.map(n => `
                <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer ${n.is_read ? 'opacity-60' : 'font-bold'}" onclick="window.location.href='${n.link_url || '#'}'">
                    <div class="text-xs text-slate-900 dark:text-white mb-0.5">${n.title}</div>
                    <div class="text-[11px] text-slate-500 dark:text-slate-400 font-normal">${n.message}</div>
                </div>
            `).join('');
        }

        function toggleNotificationDropdown() {
            document.getElementById('notifDropdown').classList.toggle('hidden');
        }

        async function markAllNotificationsRead() {
            await mySupabase.from('system_notifications').update({ is_read: true }).or('role_target.eq.teacher,role_target.eq.all');
            fetchNotifications();
        }

        async function fetchCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            allCategories = data || [];
        }

        async function fetchExams() {
            const { data } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false });
            allExams = data || [];
            renderExams();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const allBtn = document.getElementById('viewAllBtn');
            const catBtn = document.getElementById('viewCatBtn');
            if (mode === 'all') {
                allBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm";
                catBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary";
            } else {
                catBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm";
                allBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary";
            }
            renderExams();
        }

        function renderExams() {
            const search = document.getElementById('searchExam').value.toLowerCase();
            const filtered = allExams.filter(e => e.title.toLowerCase().includes(search) || e.code.toLowerCase().includes(search));
            const container = document.getElementById('examsDisplayContainer');

            if (currentViewMode === 'all') {
                if (filtered.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">ไม่พบชุดข้อสอบในระบบ</div>`;
                    return;
                }
                container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${filtered.map(e => createExamCardHtml(e)).join('')}</div>`;
            } else {
                let catGroupsHtml = '';
                allCategories.forEach(cat => {
                    const catExams = filtered.filter(e => e.category_id === cat.id);
                    if (catExams.length > 0) {
                        catGroupsHtml += `
                            <div class="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-700 first:border-t-0">
                                <h4 class="font-bold text-base text-indigo-600 dark:text-indigo-400 flex items-center gap-2"><i class="fas fa-folder-open"></i> หมวดหมู่: ${cat.name} (${catExams.length} ชุด)</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${catExams.map(e => createExamCardHtml(e)).join('')}</div>
                            </div>
                        `;
                    }
                });

                const uncategorized = filtered.filter(e => !e.category_id);
                if (uncategorized.length > 0) {
                    catGroupsHtml += `
                        <div class="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                            <h4 class="font-bold text-base text-slate-500 flex items-center gap-2"><i class="fas fa-folder"></i> ไม่ได้ระบุหมวดหมู่ (${uncategorized.length} ชุด)</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${uncategorized.map(e => createExamCardHtml(e)).join('')}</div>
                        </div>
                    `;
                }

                container.innerHTML = catGroupsHtml || `<div class="text-center py-12 text-slate-400 text-sm">ไม่มีข้อมูลข้อสอบในหมวดหมู่</div>`;
            }
        }

        function createExamCardHtml(exam) {
            const typeBadge = exam.exam_type === 'pdf' ? '<span class="bg-red-100 text-red-700 dark:bg-red-950/80 dark:text-red-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">PDF Answer Sheet</span>' : '<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">พิมพ์ลงระบบ</span>';
            const statusBadge = exam.status === 'public' ? '<span class="bg-blue-100 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 px-2 py-0.5 rounded text-[10px] font-bold">Publish</span>' : (exam.status === 'countdown' ? '<span class="bg-amber-100 text-amber-700 dark:bg-amber-950/80 dark:text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">Countdown</span>' : '<span class="bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300 px-2 py-0.5 rounded text-[10px] font-bold">Draft</span>');

            return `
                <div class="glossy-card p-6 rounded-3xl relative flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex flex-wrap gap-1.5">${typeBadge} ${statusBadge}</div>
                            <span class="text-xs font-mono font-bold text-slate-400">#${exam.code}</span>
                        </div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white mb-2 truncate">${exam.title}</h4>
                        
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/90 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs text-slate-700 dark:text-slate-200 space-y-1 mb-4">
                            <div class="font-bold text-primary flex items-center gap-1"><i class="fas fa-info-circle"></i> คำแนะนำนักเรียน:</div>
                            <div class="line-clamp-2">${exam.student_preview_info || 'ปฏิบัติตามกติการะบบสอบอย่างเคร่งครัด'}</div>
                        </div>

                        <div class="space-y-1 text-[11px] text-slate-500 dark:text-slate-400 mb-6">
                            <div><i class="far fa-clock mr-1 text-primary"></i> เวลาทำสอบ: ${exam.time_limit} นาที (โควต้า: ${exam.attempts_allowed} ครั้ง)</div>
                            <div><i class="fas fa-calendar-alt mr-1 text-indigo-500"></i> กำหนดส่ง: ${exam.end_time ? new Date(exam.end_time).toLocaleString('th-TH') : 'ไม่มีกำหนดส่ง'}</div>
                        </div>
                    </div>

                    <!-- ลบปุ่มตรวจอัตนัยออกตามคำขอ -->
                    <div class="space-y-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.location.href='admin_exam_editor.html?id=${exam.id}'" class="py-2.5 bg-blue-50 text-primary dark:bg-blue-950/60 dark:text-blue-300 rounded-xl font-bold text-xs hover:bg-blue-100 transition-colors"><i class="fas fa-edit mr-1"></i> จัดการโจทย์</button>
                            <button onclick="openEditExamModal('${exam.id}')" class="py-2.5 bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors"><i class="fas fa-cog mr-1"></i> ตั้งค่าชุด</button>
                        </div>
                        <button onclick="openAnalyticsModal('${exam.id}', '${exam.title}')" class="w-full py-2 bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-300 rounded-xl font-bold text-xs hover:bg-indigo-100 transition-colors"><i class="fas fa-chart-line mr-1"></i> สถิติ & AI ประเมินผล</button>
                    </div>
                </div>
            `;
        }

        async function openCreateExamModal() {
            await fetchCategories();
            let categoryOptions = allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-plus text-primary"></i> เพิ่มชุดข้อสอบใหม่',
                width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs text-slate-900 dark:text-slate-100">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">ชื่อชุดข้อสอบ *</label>
                            <input id="exTitle" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100" placeholder="เช่น สรุปฟิสิกส์ ม.3">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">รหัสวิชา/ข้อสอบ *</label>
                            <input id="exCode" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100" placeholder="เช่น PHY301">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หมวดหมู่หลัก</label>
                            <select id="exCat" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100"><option value="">-- ไม่เลือก --</option>${categoryOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ประเภทข้อสอบ *</label>
                            <select id="exType" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                                <option value="online_form">พิมพ์ลงระบบ (Web-based)</option>
                                <option value="pdf">PDF + กระดาษคำตอบจำลอง</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">สถานะข้อสอบ *</label>
                            <select id="exStatus" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                                <option value="public">Publish (เปิดสอบทันที)</option>
                                <option value="countdown">Countdown (ตั้งเวลาเปิด)</option>
                                <option value="draft">Draft (แบบร่าง)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">เวลาทำสอบ (นาที)</label>
                            <input type="number" id="exTime" value="60" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างชุดข้อสอบ',
                preConfirm: () => {
                    const title = document.getElementById('exTitle').value;
                    const code = document.getElementById('exCode').value;
                    if (!title || !code) { showTopToast('กรุณากรอกชื่อและรหัสข้อสอบให้ครบถ้วน'); return false; }
                    return {
                        title, code,
                        category_id: document.getElementById('exCat').value || null,
                        exam_type: document.getElementById('exType').value,
                        status: document.getElementById('exStatus').value,
                        time_limit: parseInt(document.getElementById('exTime').value) || 60
                    }
                }
            });

            if (form) {
                const { data } = await mySupabase.from('exams').insert([form]).select().single();
                if (data && form.status === 'public') {
                    // ส่งแจ้งเตือนหานักเรียนเมื่อเปิดข้อสอบใหม่
                    await mySupabase.from('system_notifications').insert([{
                        role_target: 'student',
                        title: '📢 มีชุดข้อสอบใหม่เปิดให้ทำแล้ว!',
                        message: `ชุดข้อสอบ: ${form.title} (${form.code}) พร้อมให้เข้าทำสอบแล้ว`,
                        link_url: 'student_exams.html'
                    }]);
                }
                fetchExams();
            }
        }

        // นำปุ่มลบข้อสอบกลับมาไว้ใน "ตั้งค่าชุด" ตามที่ร้องขอ
        async function openEditExamModal(examId) {
            const exam = allExams.find(e => e.id === examId);
            if (!exam) return;
            await fetchCategories();

            let categoryOptions = allCategories.map(c => `<option value="${c.id}" ${exam.category_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-cog text-primary"></i> ตั้งค่าชุดข้อสอบ',
                width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs text-slate-900 dark:text-slate-100">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">ชื่อชุดข้อสอบ *</label>
                            <input id="editTitle" value="${exam.title || ''}" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">รหัสวิชา/ข้อสอบ *</label>
                            <input id="editCode" value="${exam.code || ''}" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หมวดหมู่หลัก</label>
                            <select id="editCat" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100"><option value="">-- ไม่เลือก --</option>${categoryOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">สถานะข้อสอบ</label>
                            <select id="editStatus" class="w-full px-3 py-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-slate-100">
                                <option value="public" ${exam.status === 'public' ? 'selected' : ''}>Publish</option>
                                <option value="countdown" ${exam.status === 'countdown' ? 'selected' : ''}>Countdown</option>
                                <option value="draft" ${exam.status === 'draft' ? 'selected' : ''}>Draft</option>
                            </select>
                        </div>
                        <div class="col-span-2 pt-2 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center">
                            <span class="text-xs text-slate-400">การลบชุดข้อสอบจะไม่สามารถย้อนกลับได้</span>
                            <button type="button" onclick="deleteExamSet('${exam.id}', '${exam.title}')" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs"><i class="fas fa-trash mr-1"></i> ลบชุดข้อสอบนี้</button>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกการแก้ไข',
                preConfirm: () => ({
                    title: document.getElementById('editTitle').value,
                    code: document.getElementById('editCode').value,
                    category_id: document.getElementById('editCat').value || null,
                    status: document.getElementById('editStatus').value
                })
            });

            if (form) {
                await mySupabase.from('exams').update(form).eq('id', examId);
                fetchExams();
            }
        }

        async function deleteExamSet(examId, title) {
            Swal.close();
            const res = await Swal.fire({ title: 'ยืนยันลบชุดข้อสอบ?', text: `ต้องการลบ "${title}" ใช่หรือไม่?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' });
            if (res.isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', examId);
                fetchExams();
            }
        }

        async function openCategoryModal() {
            let catOptions = allCategories.map(c => `<div class="p-3 bg-white dark:bg-slate-800 rounded-2xl border flex justify-between items-center"><span class="font-bold text-xs">${c.name}</span><button onclick="deleteCategory('${c.id}')" class="text-red-500 text-xs"><i class="fas fa-trash"></i></button></div>`).join('');
            await Swal.fire({
                title: 'จัดการหมวดหมู่หลัก',
                html: `<div class="space-y-3 text-xs"><div class="flex gap-2"><input id="newCatInput" class="flex-1 px-3 py-2 border rounded-xl" placeholder="หมวดใหม่..."><button onclick="addNewCategory()" class="px-3 py-2 bg-indigo-600 text-white rounded-xl">เพิ่ม</button></div><div class="space-y-2">${catOptions}</div></div>`,
                showConfirmButton: false, showCloseButton: true
            });
        }

        async function addNewCategory() {
            const name = document.getElementById('newCatInput').value;
            if (name) { await mySupabase.from('exam_categories').insert([{ name }]); fetchCategories(); openCategoryModal(); }
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            fetchCategories(); openCategoryModal();
        }

        initPage();
    </script>
</body>
</html>
