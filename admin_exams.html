<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0284c7', navy: '#0f172a', darkbg: '#090d16' } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #0f172a !important; color: #f8fafc !important; border: 1px solid #1e293b !important; border-radius: 1.5rem !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
        .dark .swal2-input, .dark .swal2-select { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideDown 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <!-- Top Toast Widget 7 sec -->
    <div id="topToastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] w-11/12 max-w-md hidden toast-animate">
        <div class="p-4 rounded-2xl shadow-2xl border bg-red-600 text-white border-red-500 flex justify-between items-center text-xs font-bold">
            <span id="topToastText"><i class="fas fa-exclamation-circle mr-2"></i> ข้อผิดพลาด</span>
            <button onclick="hideTopToast()"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Slide Menu Hamburger -->
    <div id="sideMenuOverlay" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm" onclick="toggleHamburger()"></div>
    <aside id="sideMenuNav" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-slate-900 z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl border-r p-6">
        <div class="flex items-center justify-between border-b pb-4 mb-6">
            <span class="font-extrabold"><i class="fas fa-bars text-sky-600 mr-2"></i> เมนูผู้ดูแล</span>
            <button onclick="toggleHamburger()" class="text-slate-400"><i class="fas fa-times"></i></button>
        </div>
        <nav class="space-y-2 text-xs font-bold">
            <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fas fa-home w-5 text-slate-400"></i> แผงควบคุม</a>
            <a href="admin_exams.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-sky-50 dark:bg-sky-950 text-sky-600"><i class="fas fa-file-signature w-5"></i> ศูนย์จัดการชุดข้อสอบ</a>
            <a href="admin_consult.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fas fa-comments w-5 text-indigo-500"></i> จัดการคิว Consult</a>
        </nav>
    </aside>

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="toggleHamburger()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border shadow-sm"><i class="fas fa-bars text-lg text-sky-600"></i></button>
                <h1 class="font-extrabold text-xl flex items-center gap-2"><i class="fas fa-file-signature text-sky-600"></i> ศูนย์จัดการชุดข้อสอบ</h1>
            </div>
            <div class="flex items-center gap-3">
                
                <!-- Notification Bell แยก Topics -->
                <div class="relative">
                    <button onclick="document.getElementById('notifDropdown').classList.toggle('hidden')" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border relative">
                        <i class="fas fa-bell"></i><span id="notifBadge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] font-bold flex items-center justify-center">0</span>
                    </button>
                    <div id="notifDropdown" class="hidden absolute right-0 mt-3 w-80 bg-white dark:bg-slate-800 border rounded-2xl shadow-2xl z-50 overflow-hidden">
                        <div class="p-3 border-b text-xs font-bold flex justify-between"><span>การแจ้งเตือน</span><button onclick="markAllNotifRead()" class="text-sky-500">อ่านทั้งหมด</button></div>
                        <div id="notifList" class="max-h-64 overflow-y-auto divide-y"></div>
                    </div>
                </div>

                <button onclick="openCategoryModal()" class="px-4 py-2.5 bg-slate-200 dark:bg-slate-700 rounded-2xl font-bold text-xs"><i class="fas fa-folder text-indigo-500"></i> หมวดหมู่</button>
                <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-sky-600 text-white rounded-2xl font-bold text-xs shadow-md"><i class="fas fa-plus"></i> เพิ่มชุดข้อสอบ</button>
                <button id="themeToggle" class="w-11 h-11 rounded-2xl bg-white dark:bg-slate-800 border"><i class="fas fa-moon" id="themeIcon"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 pb-20 space-y-8">
        
        <!-- ข้อสอบที่กำลังจะเปิดใน 24 ชม -->
        <div id="upcomingSection" class="hidden space-y-4">
            <h3 class="font-extrabold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-hourglass-half animate-spin"></i> ชุดข้อสอบที่กำลังจะเปิดใน 24 ชั่วโมง</h3>
            <div id="upcomingGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div class="glossy-card p-6 rounded-3xl space-y-6">
            <div class="flex justify-between items-center pb-4 border-b">
                <div class="flex bg-slate-200 dark:bg-slate-800 p-1.5 rounded-2xl gap-1">
                    <button id="viewAllBtn" onclick="switchView('all')" class="px-5 py-2 rounded-xl text-xs font-bold bg-white text-sky-600 shadow-sm">ทั้งหมด</button>
                    <button id="viewCatBtn" onclick="switchView('category')" class="px-5 py-2 rounded-xl text-xs font-bold text-slate-500">แยกหมวดหมู่</button>
                </div>
                <input type="text" id="searchExam" oninput="renderExams()" placeholder="ค้นหาตามชื่อ/รหัส..." class="px-4 py-2 border rounded-xl text-xs w-64 bg-transparent outline-none focus:border-sky-500">
            </div>
            <div id="examsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allExams = []; let allCategories = []; let currentView = 'all'; let toastTimer;

        // Theme & UI Utils
        const html = document.documentElement; const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { html.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.replace(html.classList.contains('dark') ? 'fa-moon' : 'fa-sun', html.classList.contains('dark') ? 'fa-sun' : 'fa-moon');
        });

        function toggleHamburger() {
            const side = document.getElementById('sideMenuNav'); const over = document.getElementById('sideMenuOverlay');
            side.classList.toggle('-translate-x-full'); over.classList.toggle('hidden');
        }

        function showTopToast(msg) {
            document.getElementById('topToastText').innerHTML = `<i class="fas fa-exclamation-circle mr-2"></i> ${msg}`;
            document.getElementById('topToastContainer').classList.remove('hidden');
            clearTimeout(toastTimer); toastTimer = setTimeout(() => hideTopToast(), 7000);
        }
        function hideTopToast() { document.getElementById('topToastContainer').classList.add('hidden'); }

        async function initPage() {
            await Promise.all([fetchCategories(), fetchExams(), fetchNotifications()]);
        }

        // Notification Logic
        async function fetchNotifications() {
            const { data } = await mySupabase.from('system_notifications').select('*').or('role_target.eq.teacher,role_target.eq.all').order('created_at', { ascending: false }).limit(10);
            const badge = document.getElementById('notifBadge'); const list = document.getElementById('notifList');
            const unread = (data || []).filter(n => !n.is_read).length;
            if (unread > 0) { badge.textContent = unread; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }
            
            list.innerHTML = (data || []).length === 0 ? `<div class="p-4 text-center text-slate-400 text-xs">ไม่มีแจ้งเตือน</div>` : data.map(n => {
                let tag = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[9px]">ทั่วไป</span>';
                if (n.title.includes('ส่งข้อสอบ')) tag = '<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[9px]">ส่งงาน</span>';
                if (n.title.includes('อัตนัย')) tag = '<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[9px]">ตรวจอัตนัย</span>';
                return `<div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer ${n.is_read ? 'opacity-60' : 'font-bold'}" onclick="handleNotif('${n.id}', '${n.link_url}')"><div class="flex justify-between items-center mb-1">${tag}<span class="text-[9px] text-slate-400">${new Date(n.created_at).toLocaleTimeString('th-TH')}</span></div><div class="text-xs">${n.title}</div><div class="text-[10px] text-slate-500">${n.message}</div></div>`;
            }).join('');
        }
        async function handleNotif(id, url) { await mySupabase.from('system_notifications').update({is_read: true}).eq('id', id); if(url && url!=='#') window.location.href = url; }
        async function markAllNotifRead() { await mySupabase.from('system_notifications').update({is_read: true}).or('role_target.eq.teacher,role_target.eq.all'); fetchNotifications(); }

        async function fetchCategories() { const { data } = await mySupabase.from('exam_categories').select('*'); allCategories = data || []; }
        async function fetchExams() { const { data } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false }); allExams = data || []; renderExams(); }

        function switchView(mode) { currentView = mode; 
            document.getElementById('viewAllBtn').className = mode === 'all' ? "px-5 py-2 rounded-xl text-xs font-bold bg-white text-sky-600 shadow-sm" : "px-5 py-2 rounded-xl text-xs font-bold text-slate-500";
            document.getElementById('viewCatBtn').className = mode === 'category' ? "px-5 py-2 rounded-xl text-xs font-bold bg-white text-sky-600 shadow-sm" : "px-5 py-2 rounded-xl text-xs font-bold text-slate-500";
            renderExams();
        }

        function renderExams() {
            const search = document.getElementById('searchExam').value.toLowerCase();
            const now = new Date(); const oneDay = new Date(now.getTime() + 24*60*60*1000);
            
            const filtered = allExams.filter(e => e.title.toLowerCase().includes(search) || e.code.toLowerCase().includes(search));
            const upcoming = filtered.filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDay);
            const regular = filtered.filter(e => !upcoming.includes(e));

            const upcomingSec = document.getElementById('upcomingSection'); const upcomingGrid = document.getElementById('upcomingGrid');
            if (upcoming.length > 0) { upcomingSec.classList.remove('hidden'); upcomingGrid.innerHTML = upcoming.map(e => createExamCard(e, true)).join(''); } 
            else { upcomingSec.classList.add('hidden'); }

            const container = document.getElementById('examsContainer');
            if (currentView === 'all') {
                container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
                container.innerHTML = regular.map(e => createExamCard(e)).join('');
            } else {
                container.className = "space-y-6";
                container.innerHTML = allCategories.map(cat => {
                    const ex = regular.filter(e => e.category_id === cat.id);
                    if(ex.length===0) return '';
                    return `<div><h4 class="font-bold text-indigo-500 mb-3"><i class="fas fa-folder"></i> ${cat.name}</h4><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${ex.map(e => createExamCard(e)).join('')}</div></div>`;
                }).join('');
            }
        }

        function createExamCard(exam, isUpcoming=false) {
            const stBadge = exam.status === 'public' ? '<span class="bg-sky-100 text-sky-700 px-2 rounded">Publish</span>' : (exam.status === 'countdown' ? '<span class="bg-amber-100 text-amber-700 px-2 rounded">Countdown</span>' : '<span class="bg-slate-200 text-slate-600 px-2 rounded">Draft</span>');
            return `
                <div class="glossy-card p-6 rounded-3xl relative flex flex-col justify-between ${isUpcoming ? 'border-2 border-amber-400 opacity-90' : ''}">
                    <div>
                        <div class="flex justify-between items-start mb-2"><div class="flex gap-1 text-[10px] font-bold">${stBadge}</div><span class="text-xs font-mono font-bold text-slate-400">#${exam.code}</span></div>
                        <h4 class="font-bold text-base mb-2 truncate">${exam.title}</h4>
                        <div class="space-y-1 text-[11px] text-slate-500 mb-4">
                            <div><i class="far fa-clock text-sky-500"></i> ทำสอบ: ${exam.time_limit} นาที</div>
                            <div><i class="fas fa-calendar-alt text-indigo-500"></i> ${exam.start_time ? `เปิด: ${new Date(exam.start_time).toLocaleString('th-TH')}` : 'ไม่มีเวลาเปิด'}</div>
                        </div>
                    </div>
                    <div class="space-y-2 pt-4 border-t">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.location.href='admin_exam_editor.html?id=${exam.id}'" class="py-2 bg-sky-50 text-sky-600 rounded-xl font-bold text-xs hover:bg-sky-100"><i class="fas fa-edit mr-1"></i> จัดการโจทย์</button>
                            <button onclick="openEditModal('${exam.id}')" class="py-2 bg-slate-100 text-slate-700 rounded-xl font-bold text-xs"><i class="fas fa-cog mr-1"></i> ตั้งค่าชุด</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.location.href='admin_exam_grading.html?exam_id=${exam.id}'" class="py-2 bg-purple-50 text-purple-600 rounded-xl font-bold text-xs hover:bg-purple-100"><i class="fas fa-user-check mr-1"></i> ตรวจอัตนัย</button>
                            <button onclick="Swal.fire('Analytics', 'ระบบประเมินผล', 'info')" class="py-2 bg-indigo-50 text-indigo-600 rounded-xl font-bold text-xs hover:bg-indigo-100"><i class="fas fa-chart-line mr-1"></i> สถิติ & AI</button>
                        </div>
                    </div>
                </div>`;
        }

        function toggleStatus(prefix) {
            const st = document.getElementById(`${prefix}Status`).value;
            const cnt = document.getElementById(`cdTime_${prefix}`);
            if (st === 'countdown') cnt.classList.remove('hidden'); else cnt.classList.add('hidden');
        }
        function toggleDue(prefix) {
            if(document.getElementById(`hasDue_${prefix}`).checked) document.getElementById(`dueTime_${prefix}`).classList.remove('hidden');
            else document.getElementById(`dueTime_${prefix}`).classList.add('hidden');
        }

        async function openCreateExamModal() {
            const opts = allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            const { value: form } = await Swal.fire({
                title: 'สร้างชุดข้อสอบ', width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs">
                        <input id="cTitle" class="col-span-2 sm:col-span-1 px-3 py-2 border rounded-xl" placeholder="ชื่อชุดข้อสอบ *">
                        <input id="cCode" class="col-span-2 sm:col-span-1 px-3 py-2 border rounded-xl" placeholder="รหัสวิชา *">
                        <select id="cCat" class="px-3 py-2 border rounded-xl"><option value="">-- หมวดหมู่ --</option>${opts}</select>
                        <select id="cType" class="px-3 py-2 border rounded-xl"><option value="online_form">พิมพ์ระบบ</option><option value="pdf">PDF</option></select>
                        <select id="createStatus" onchange="toggleStatus('create')" class="px-3 py-2 border rounded-xl"><option value="public">Publish</option><option value="countdown">Countdown</option><option value="draft">Draft</option></select>
                        <div id="cdTime_create" class="hidden"><input type="datetime-local" id="cStart" class="w-full px-3 py-2 border rounded-xl text-amber-600"></div>
                        <div class="col-span-2 pt-2 border-t"><label><input type="checkbox" id="hasDue_create" onchange="toggleDue('create')"> มีกำหนดส่ง (Due Date)</label></div>
                        <div id="dueTime_create" class="hidden col-span-2"><input type="datetime-local" id="cEnd" class="w-full px-3 py-2 border rounded-xl text-red-500"></div>
                        <input type="number" id="cTime" value="60" class="px-3 py-2 border rounded-xl" placeholder="เวลาทำ (นาที)">
                    </div>
                `,
                preConfirm: () => {
                    const title = document.getElementById('cTitle').value; const code = document.getElementById('cCode').value;
                    const st = document.getElementById('createStatus').value; const start = document.getElementById('cStart').value;
                    if (!title || !code) { showTopToast('กรุณากรอกชื่อและรหัส'); return false; }
                    if (st === 'countdown' && !start) { showTopToast('กรุณาระบุเวลา Countdown'); return false; }
                    return {
                        title, code, status: st, category_id: document.getElementById('cCat').value || null, exam_type: document.getElementById('cType').value,
                        start_time: st==='countdown' && start ? new Date(start).toISOString() : null,
                        end_time: document.getElementById('hasDue_create').checked && document.getElementById('cEnd').value ? new Date(document.getElementById('cEnd').value).toISOString() : null,
                        time_limit: parseInt(document.getElementById('cTime').value) || 60
                    }
                }
            });
            if (form) { await mySupabase.from('exams').insert([form]); fetchExams(); }
        }

        async function openEditModal(id) {
            const ex = allExams.find(e => e.id === id); if(!ex) return;
            const opts = allCategories.map(c => `<option value="${c.id}" ${ex.category_id===c.id?'selected':''}>${c.name}</option>`).join('');
            const fd = (d) => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : '';
            
            const { value: form } = await Swal.fire({
                title: 'ตั้งค่าชุดข้อสอบ', width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs">
                        <input id="eTitle" value="${ex.title}" class="px-3 py-2 border rounded-xl">
                        <input id="eCode" value="${ex.code}" class="px-3 py-2 border rounded-xl">
                        <select id="editStatus" onchange="toggleStatus('edit')" class="px-3 py-2 border rounded-xl"><option value="public" ${ex.status==='public'?'selected':''}>Publish</option><option value="countdown" ${ex.status==='countdown'?'selected':''}>Countdown</option><option value="draft" ${ex.status==='draft'?'selected':''}>Draft</option></select>
                        <select id="eCat" class="px-3 py-2 border rounded-xl"><option value="">-- หมวดหมู่ --</option>${opts}</select>
                        <div id="cdTime_edit" class="${ex.status==='countdown'?'':'hidden'}"><input type="datetime-local" id="eStart" value="${fd(ex.start_time)}" class="w-full px-3 py-2 border rounded-xl"></div>
                        <div class="col-span-2 pt-2 border-t"><label><input type="checkbox" id="hasDue_edit" onchange="toggleDue('edit')" ${ex.end_time?'checked':''}> มีกำหนดส่ง</label></div>
                        <div id="dueTime_edit" class="${ex.end_time?'':'hidden'} col-span-2"><input type="datetime-local" id="eEnd" value="${fd(ex.end_time)}" class="w-full px-3 py-2 border rounded-xl"></div>
                        <div class="col-span-2 flex justify-between pt-2 border-t"><button onclick="delExam('${ex.id}')" class="px-3 py-2 bg-red-600 text-white rounded-xl">ลบชุดข้อสอบนี้</button></div>
                    </div>
                `,
                preConfirm: () => {
                    const st = document.getElementById('editStatus').value; const start = document.getElementById('eStart').value;
                    if (st === 'countdown' && !start) { showTopToast('กรุณาระบุเวลา Countdown'); return false; }
                    return {
                        title: document.getElementById('eTitle').value, code: document.getElementById('eCode').value,
                        status: st, category_id: document.getElementById('eCat').value || null,
                        start_time: st==='countdown' && start ? new Date(start).toISOString() : null,
                        end_time: document.getElementById('hasDue_edit').checked && document.getElementById('eEnd').value ? new Date(document.getElementById('eEnd').value).toISOString() : null
                    }
                }
            });
            if(form) { await mySupabase.from('exams').update(form).eq('id', id); fetchExams(); }
        }

        async function delExam(id) { if(confirm('ยืนยันลบข้อสอบ?')) { await mySupabase.from('exams').delete().eq('id', id); fetchExams(); Swal.close(); } }
        async function openCategoryModal() { Swal.fire('หมวดหมู่', 'ระบบจัดการหมวดหมู่', 'info'); } // Simplified for space

        initPage();
    </script>
</body>
