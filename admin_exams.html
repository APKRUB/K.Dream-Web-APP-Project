<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', navy: '#0f172a', darkbg: '#090d16' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <!-- Slide Menu Hamburger Navigation -->
    <div id="sideMenuOverlay" class="fixed inset-0 bg-black/50 z-50 hidden backdrop-blur-sm" onclick="toggleHamburger()"></div>
    <aside id="sideMenuNav" class="fixed top-0 left-0 h-full w-72 bg-white dark:bg-slate-900 z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl border-r border-slate-200 dark:border-slate-800 p-6 flex flex-col justify-between">
        <div class="space-y-6">
            <div class="flex items-center justify-between border-b dark:border-slate-800 pb-4">
                <span class="font-extrabold text-base text-slate-900 dark:text-white"><i class="fas fa-bars text-sky-600 mr-2"></i> เมนูลัดผู้ดูแล</span>
                <button onclick="toggleHamburger()" class="text-slate-400"><i class="fas fa-times text-lg"></i></button>
            </div>
            <nav class="space-y-2 text-xs font-bold">
                <a href="admin.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fas fa-home w-5"></i> หน้าหลักแผงควบคุม</a>
                <a href="admin_exams.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-sky-50 dark:bg-sky-950/80 text-sky-600 dark:text-sky-300"><i class="fas fa-file-signature w-5"></i> ศูนย์จัดการชุดข้อสอบ</a>
                <a href="student.html" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fas fa-user-graduate w-5 text-emerald-500"></i> มุมมองนักเรียน</a>
            </nav>
        </div>
    </aside>

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="toggleHamburger()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-sky-50 transition-all shadow-sm">
                        <i class="fas fa-bars text-lg text-sky-600"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-sky-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง ตั้งค่ากำหนดส่ง และวิเคราะห์สถิติประเมินผล</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-2xl font-bold text-xs shadow-lg shadow-sky-500/30 transition-all flex items-center gap-2">
                        <i class="fas fa-plus"></i> เพิ่มชุดข้อสอบ
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- ข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง (เอาไว้บนสุดเด่นชัดเหมือนเดิม) -->
        <div id="upcomingExamsSection" class="hidden space-y-4">
            <h3 class="font-extrabold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-hourglass-half animate-spin"></i> ชุดข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง</h3>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div class="glossy-card p-6 rounded-3xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-200 dark:border-slate-700">
                <input type="text" id="searchExam" oninput="renderExams()" placeholder="ค้นหาตามชื่อหรือรหัสวิชา..." class="px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-2xl text-xs w-full sm:w-64 text-slate-900 dark:text-slate-100 outline-none">
            </div>

            <div id="examsDisplayContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allExams = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function toggleHamburger() {
            const side = document.getElementById('sideMenuNav');
            const over = document.getElementById('sideMenuOverlay');
            if (side.classList.contains('-translate-x-full')) {
                side.classList.remove('-translate-x-full'); over.classList.remove('hidden');
            } else {
                side.classList.add('-translate-x-full'); over.classList.add('hidden');
            }
        }

        async function initPage() {
            const { data } = await mySupabase.from('exams').select('*').order('created_at', { ascending: false });
            allExams = data || [];
            renderExams();
        }

        function renderExams() {
            const search = document.getElementById('searchExam').value.toLowerCase();
            const now = new Date();
            const oneDayLater = new Date(now.getTime() + 24 * 60 * 60 * 1000);

            const filtered = allExams.filter(e => e.title.toLowerCase().includes(search) || e.code.toLowerCase().includes(search));
            const upcoming = filtered.filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDayLater);
            const regular = filtered.filter(e => !upcoming.includes(e));

            const upcomingSection = document.getElementById('upcomingExamsSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');
            if (upcoming.length > 0) {
                upcomingSection.classList.remove('hidden');
                upcomingGrid.innerHTML = upcoming.map(e => createExamCardHtml(e, true)).join('');
            } else { upcomingSection.classList.add('hidden'); }

            const container = document.getElementById('examsDisplayContainer');
            container.innerHTML = regular.map(e => createExamCardHtml(e, false)).join('');
        }

        function createExamCardHtml(exam, isFaded) {
            return `
                <div class="glossy-card p-6 rounded-3xl relative flex flex-col justify-between ${isFaded ? 'opacity-75 border-2 border-dashed border-amber-400' : ''}">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">${exam.exam_type}</span>
                            <span class="text-xs font-mono font-bold text-slate-400">#${exam.code}</span>
                        </div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white mb-2 truncate">${exam.title}</h4>
                        <div class="space-y-1 text-[11px] text-slate-500 mb-4">
                            <div><i class="far fa-clock text-sky-600"></i> เวลาทำสอบ: ${exam.time_limit} นาที</div>
                            <div><i class="fas fa-calendar-alt text-indigo-500"></i> กำหนดส่ง: ${exam.end_time ? new Date(exam.end_time).toLocaleString('th-TH') : 'ไม่มี'}</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-4 border-t border-slate-200 dark:border-slate-800">
                        <button onclick="window.location.href='admin_exam_editor.html?id=${exam.id}'" class="py-2.5 bg-sky-50 text-sky-600 rounded-xl font-bold text-xs"><i class="fas fa-edit mr-1"></i> จัดการโจทย์</button>
                        <button onclick="window.location.href='admin_exam_grading.html?exam_id=${exam.id}'" class="py-2.5 bg-purple-50 text-purple-600 rounded-xl font-bold text-xs"><i class="fas fa-user-check mr-1"></i> ตรวจอัตนัย</button>
                    </div>
                </div>
            `;
        }

        async function openCreateExamModal() {
            const { value: form } = await Swal.fire({
                title: 'เพิ่มชุดข้อสอบใหม่',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <input id="exTitle" class="w-full px-3 py-2 border rounded-xl" placeholder="ชื่อชุดข้อสอบ">
                        <input id="exCode" class="w-full px-3 py-2 border rounded-xl" placeholder="รหัสวิชา">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้าง'
            });
            if (form) { initPage(); }
        }

        initPage();
    </script>
</body>
</html>
