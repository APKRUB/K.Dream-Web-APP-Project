<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b', darkinput: '#334155' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.8); }
        .glossy-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(51, 65, 85, 1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 hover:bg-primary hover:text-white transition-all text-slate-700 dark:text-slate-200 shadow-sm"><i class="fas fa-arrow-left text-lg"></i></button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง แก้ไข กำหนดประเภทข้อสอบ และสถิติประเมินผล</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openCategoryModal()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-darkinput dark:hover:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-2xl font-bold text-xs transition-all flex items-center gap-2 border border-slate-300 dark:border-slate-600">
                        <i class="fas fa-tags text-indigo-500"></i> จัดการหมวดหมู่
                    </button>
                    <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-2xl font-bold text-xs shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                        <i class="fas fa-plus"></i> เพิ่มชุดข้อสอบ
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- ข้อสอบกำลังจะเปิดภายใน 24 ชม. (Countdown Banner) -->
        <div id="upcomingExamsSection" class="hidden space-y-4">
            <h3 class="font-bold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-hourglass-half animate-spin"></i> ชุดข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง</h3>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- แท็บสลับมุมมองแบบ Google Classroom -->
        <div class="glossy-card p-6 rounded-3xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-200 dark:border-slate-700">
                <div class="flex bg-slate-200 dark:bg-darkinput p-1.5 rounded-2xl gap-1">
                    <button id="viewAllBtn" onclick="switchViewMode('all')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm"><i class="fas fa-th-large mr-1.5"></i> ชุดข้อสอบทั้งหมด</button>
                    <button id="viewCatBtn" onclick="switchViewMode('category')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary"><i class="fas fa-folder mr-1.5"></i> มุมมองตามหมวดหมู่ (Classroom)</button>
                </div>
                <input type="text" id="searchExam" oninput="renderExams()" placeholder="ค้นหาตามชื่อหรือรหัสวิชา..." class="px-4 py-2.5 bg-slate-50 dark:bg-darkinput border border-slate-200 dark:border-slate-700 rounded-2xl text-xs w-full sm:w-64 text-slate-900 dark:text-white outline-none focus:border-primary">
            </div>

            <!-- คอนเทนเนอร์แสดงผลข้อสอบ -->
            <div id="examsDisplayContainer"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allExams = [];
        let allCategories = [];
        let currentViewMode = 'all'; // 'all' หรือ 'category'

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await fetchCategories();
            await fetchExams();
            setInterval(updateCountdowns, 1000);
        }

        async function fetchCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            allCategories = data || [];
        }

        async function fetchExams() {
            const { data } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false });
            allExams = data || [];
            renderExams();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const allBtn = document.getElementById('viewAllBtn');
            const catBtn = document.getElementById('viewCatBtn');

            if (mode === 'all') {
                allBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm";
                catBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary";
            } else {
                catBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-800 text-primary shadow-sm";
                allBtn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-600 dark:text-slate-300 hover:text-primary";
            }
            renderExams();
        }

        function renderExams() {
            const search = document.getElementById('searchExam').value.toLowerCase();
            const now = new Date();
            const oneDayLater = new Date(now.getTime() + 24 * 60 * 60 * 1000);

            const filtered = allExams.filter(e => e.title.toLowerCase().includes(search) || e.code.toLowerCase().includes(search));
            const upcoming = filtered.filter(e => e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDayLater);
            const regular = filtered.filter(e => !upcoming.includes(e));

            // Render Upcoming Banner
            const upcomingSection = document.getElementById('upcomingExamsSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');
            if (upcoming.length > 0) {
                upcomingSection.classList.remove('hidden');
                upcomingGrid.innerHTML = upcoming.map(e => createExamCardHtml(e, true)).join('');
            } else {
                upcomingSection.classList.add('hidden');
            }

            const container = document.getElementById('examsDisplayContainer');

            if (currentViewMode === 'all') {
                if (regular.length === 0 && upcoming.length === 0) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">ไม่พบชุดข้อสอบในระบบ</div>`;
                    return;
                }
                container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${regular.map(e => createExamCardHtml(e, false)).join('')}</div>`;
            } else {
                // มุมมองแยกตามหมวดหมู่ (Classroom Style)
                let catGroupsHtml = '';
                allCategories.forEach(cat => {
                    const catExams = regular.filter(e => e.category_id === cat.id);
                    if (catExams.length > 0) {
                        catGroupsHtml += `
                            <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-800 first:border-t-0">
                                <h4 class="font-bold text-base text-indigo-600 dark:text-indigo-400 flex items-center gap-2"><i class="fas fa-folder-open"></i> หมวดหมู่: ${cat.name} (${catExams.length} ชุด)</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${catExams.map(e => createExamCardHtml(e, false)).join('')}</div>
                            </div>
                        `;
                    }
                });

                const uncategorizedExams = regular.filter(e => !e.category_id);
                if (uncategorizedExams.length > 0) {
                    catGroupsHtml += `
                        <div class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                            <h4 class="font-bold text-base text-slate-500 flex items-center gap-2"><i class="fas fa-folder"></i> ไม่ได้ระบุหมวดหมู่ (${uncategorizedExams.length} ชุด)</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${uncategorizedExams.map(e => createExamCardHtml(e, false)).join('')}</div>
                        </div>
                    `;
                }

                container.innerHTML = catGroupsHtml || `<div class="text-center py-12 text-slate-400 text-sm">ไม่มีข้อมูลข้อสอบในหมวดหมู่</div>`;
            }
        }

        function createExamCardHtml(exam, isFaded) {
            const typeBadge = exam.exam_type === 'pdf' ? '<span class="bg-red-100 text-red-600 dark:bg-red-950/60 dark:text-red-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">PDF Simulator</span>' : '<span class="bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">พิมพ์ลงระบบ</span>';
            const categoryBadge = exam.exam_categories?.name ? `<span class="bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">${exam.exam_categories.name}</span>` : '';

            return `
                <div class="glossy-card p-6 rounded-3xl relative flex flex-col justify-between ${isFaded ? 'opacity-60 border-2 border-dashed border-amber-400' : ''}">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex flex-wrap gap-1.5">${typeBadge} ${categoryBadge}</div>
                            <span class="text-xs font-mono font-bold text-slate-400">#${exam.code}</span>
                        </div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white mb-2 truncate">${exam.title}</h4>
                        
                        <!-- สรุปข้อมูลสำคัญให้นักเรียนเห็น -->
                        <div class="p-3 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700 text-xs text-slate-600 dark:text-slate-300 space-y-1 mb-4">
                            <div class="font-bold text-primary flex items-center gap-1"><i class="fas fa-info-circle"></i> ข้อมูลสำคัญสำหรับนักเรียน:</div>
                            <div class="line-clamp-2">${exam.student_preview_info || 'ปฏิบัติตามกติการะบบสอบออนไลน์อย่างเคร่งครัด'}</div>
                        </div>

                        ${isFaded ? `<div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200 dark:border-amber-900 text-center text-xs font-bold text-amber-600 dark:text-amber-300 mb-4" id="cd-${exam.id}">⏳ เปิดใน: คำนวณเวลา...</div>` : ''}

                        <div class="space-y-1 text-[11px] text-slate-500 dark:text-slate-400 mb-6">
                            <div><i class="far fa-clock mr-1 text-primary"></i> เวลาทำสอบ: ${exam.time_limit} นาที (โควต้า: ${exam.attempts_allowed} ครั้ง)</div>
                            <div><i class="fas fa-trophy mr-1 text-amber-500"></i> ลีดเดอร์บอร์ด: ${exam.ranking_mode === 'immediate' ? 'แสดงทันที' : 'ดีเลย์ ' + exam.ranking_delay_days + ' วัน'}</div>
                        </div>
                    </div>

                    <div class="space-y-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.location.href='admin_exam_editor.html?id=${exam.id}'" class="py-2.5 bg-blue-50 text-primary dark:bg-blue-950/40 dark:text-blue-300 rounded-xl font-bold text-xs hover:bg-blue-100 transition-colors"><i class="fas fa-edit mr-1"></i> แก้ไขโจทย์</button>
                            <button onclick="openEditExamModal('${exam.id}')" class="py-2.5 bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors"><i class="fas fa-cog mr-1"></i> ตั้งค่าชุด</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="openAnalyticsModal('${exam.id}', '${exam.title}')" class="py-2 bg-indigo-50 text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-300 rounded-xl font-bold text-xs hover:bg-indigo-100 transition-colors"><i class="fas fa-chart-line mr-1"></i> สถิติ & AI</button>
                            <button onclick="deleteExamSet('${exam.id}', '${exam.title}')" class="py-2 bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400 rounded-xl font-bold text-xs hover:bg-red-100 transition-colors"><i class="fas fa-trash mr-1"></i> ลบชุดสอบ</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateCountdowns() {
            const now = new Date();
            allExams.forEach(e => {
                const cdElem = document.getElementById(`cd-${e.id}`);
                if (cdElem && e.start_time) {
                    const diff = new Date(e.start_time) - now;
                    if (diff <= 0) {
                        cdElem.textContent = 'ถึงเวลาเปิดข้อสอบแล้ว!';
                    } else {
                        const h = Math.floor(diff / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        cdElem.textContent = `⏳ เปิดใน: ${h} ชม. ${m} นาที ${s} วินาที`;
                    }
                }
            });
        }

        // Modal แก้ไขข้อมูลชุดข้อสอบ
        async function openEditExamModal(examId) {
            const exam = allExams.find(e => e.id === examId);
            if (!exam) return;

            let categoryOptions = allCategories.map(c => `<option value="${c.id}" ${exam.category_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-cog text-primary"></i> แก้ไขข้อมูลชุดข้อสอบ',
                width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs text-slate-800 dark:text-slate-100">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">ชื่อชุดข้อสอบ *</label>
                            <input id="editTitle" value="${exam.title || ''}" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">รหัสวิชา/ข้อสอบ *</label>
                            <input id="editCode" value="${exam.code || ''}" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หมวดหมู่หลัก</label>
                            <select id="editCat" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl"><option value="">-- ไม่เลือก --</option>${categoryOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ประเภทข้อสอบ</label>
                            <select id="editType" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                                <option value="online_form" ${exam.exam_type === 'online_form' ? 'selected' : ''}>พิมพ์ลงระบบ (1 ข้อ/หน้า)</option>
                                <option value="pdf" ${exam.exam_type === 'pdf' ? 'selected' : ''}>PDF + กระดาษคำตอบจำลอง</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">เวลาทำสอบ (นาที)</label>
                            <input type="number" id="editTime" value="${exam.time_limit || 60}" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">จำนวนครั้งที่ทำได้ (Attempt)</label>
                            <input type="number" id="editAttempts" value="${exam.attempts_allowed || 1}" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div class="col-span-2">
                            <label class="block font-bold mb-1">รายละเอียดเบื้องต้นที่ให้นักเรียนเห็น</label>
                            <textarea id="editStudentInfo" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl h-16">${exam.student_preview_info || ''}</textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกการแก้ไข',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const catVal = document.getElementById('editCat').value;
                    const payload = {
                        title: document.getElementById('editTitle').value,
                        code: document.getElementById('editCode').value,
                        exam_type: document.getElementById('editType').value,
                        time_limit: parseInt(document.getElementById('editTime').value) || 60,
                        attempts_allowed: parseInt(document.getElementById('editAttempts').value) || 1,
                        student_preview_info: document.getElementById('editStudentInfo').value
                    };
                    if (catVal && catVal.trim() !== '') payload.category_id = catVal;
                    else payload.category_id = null;
                    return payload;
                }
            });

            if (form) {
                await mySupabase.from('exams').update(form).eq('id', examId);
                await mySupabase.from('exam_audit_logs').insert([{ exam_id: examId, action_description: 'แก้ไขข้อมูลการตั้งค่าชุดข้อสอบ' }]);
                Swal.fire({ icon: 'success', title: 'อัปเดตข้อมูลสำเร็จ!', timer: 1200, showConfirmButton: false });
                fetchExams();
            }
        }

        async function deleteExamSet(examId, title) {
            const res = await Swal.fire({
                title: 'ยืนยันลบชุดข้อสอบ?',
                text: `คุณต้องการลบ "${title}" และข้อมูลคำตอบทั้งหมดใช่หรือไม่?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ใช่, ลบทันที'
            });

            if (res.isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', examId);
                Swal.fire({ icon: 'success', title: 'ลบชุดข้อสอบสำเร็จ', timer: 1200, showConfirmButton: false });
                fetchExams();
            }
        }

        // Modal สร้างหมวดหมู่
        async function openCategoryModal() {
            let catOptions = allCategories.map(c => `
                <div class="flex justify-between items-center p-2.5 bg-slate-50 dark:bg-darkinput rounded-xl border border-slate-200 dark:border-slate-700 text-xs">
                    <span class="font-bold">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:underline"><i class="fas fa-trash"></i> ลบ</button>
                </div>
            `).join('');

            await Swal.fire({
                title: 'จัดการหมวดหมู่หลัก',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div>
                            <label class="block font-bold text-slate-500 mb-1">เพิ่มหมวดหมู่ใหม่</label>
                            <div class="flex gap-2">
                                <input id="newCatInput" class="flex-1 px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl text-xs" placeholder="เช่น ฟิสิกส์ ม.ปลาย">
                                <button onclick="addNewCategory()" class="px-4 py-2 bg-primary text-white font-bold rounded-xl text-xs">เพิ่ม</button>
                            </div>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto">${catOptions || '<div class="text-center py-4 text-slate-400">ยังไม่มีหมวดหมู่</div>'}</div>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        async function addNewCategory() {
            const name = document.getElementById('newCatInput').value;
            if (!name) return;
            await mySupabase.from('exam_categories').insert([{ name }]);
            await fetchCategories();
            openCategoryModal();
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await fetchCategories();
            openCategoryModal();
        }

        // Modal เพิ่มชุดข้อสอบใหม่
        async function openCreateExamModal() {
            await fetchCategories();
            let categoryOptions = allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-plus text-primary"></i> เพิ่มชุดข้อสอบใหม่',
                width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs text-slate-800 dark:text-slate-100">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">ชื่อชุดข้อสอบ *</label>
                            <input id="exTitle" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl" placeholder="เช่น สรุปชีววิทยา ม.3">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">รหัสวิชา/ข้อสอบ *</label>
                            <input id="exCode" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl" placeholder="เช่น BIO301">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หมวดหมู่หลัก</label>
                            <select id="exCat" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl"><option value="">-- ไม่เลือก --</option>${categoryOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ประเภทข้อสอบ *</label>
                            <select id="exType" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                                <option value="online_form">พิมพ์ลงระบบ (1 ข้อ/หน้า)</option>
                                <option value="pdf">PDF + กระดาษคำตอบจำลอง</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">เวลาทำสอบ (นาที)</label>
                            <input type="number" id="exTime" value="60" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">จำนวนครั้งที่ทำได้ (Attempt)</label>
                            <input type="number" id="exAttempts" value="1" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div class="col-span-2">
                            <label class="block font-bold mb-1">ข้อมูลเบื้องต้นที่ให้นักเรียนเห็น</label>
                            <textarea id="exStudentInfo" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl h-16" placeholder="คำแนะนำการทำข้อสอบสำหรับนักเรียน..."></textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างชุดข้อสอบ',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('exTitle').value;
                    const code = document.getElementById('exCode').value;
                    const catVal = document.getElementById('exCat').value;

                    if (!title || !code) { Swal.showValidationMessage('กรุณากรอกชื่อและรหัสข้อสอบ'); return false; }

                    const payload = {
                        title: title,
                        code: code,
                        exam_type: document.getElementById('exType').value,
                        time_limit: parseInt(document.getElementById('exTime').value) || 60,
                        attempts_allowed: parseInt(document.getElementById('exAttempts').value) || 1,
                        student_preview_info: document.getElementById('exStudentInfo').value
                    };
                    if (catVal && catVal.trim() !== '') payload.category_id = catVal;
                    return payload;
                }
            });

            if (form) {
                const { data, error } = await mySupabase.from('exams').insert([form]).select().single();
                if (!error) {
                    await mySupabase.from('exam_audit_logs').insert([{ exam_id: data.id, action_description: 'สร้างชุดข้อสอบใหม่' }]);
                    Swal.fire({ icon: 'success', title: 'สร้างชุดข้อสอบสำเร็จ!', timer: 1200, showConfirmButton: false });
                    fetchExams();
                } else { Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'); }
            }
        }

        async function openAnalyticsModal(examId, title) {
            Swal.fire({ title: 'กำลังประมวลผลสถิติ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const { data: attempts } = await mySupabase.from('exam_attempts').select('*, profiles(full_name)').eq('exam_id', examId).eq('status', 'submitted');

            if (!attempts || attempts.length === 0) { Swal.fire('ยังไม่มีข้อมูลการสอบ', 'ยังไม่มีนักเรียนส่งข้อสอบชุดนี้', 'info'); return; }

            const scores = attempts.map(a => a.score);
            const mean = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2);
            const max = Math.max(...scores);
            const min = Math.min(...scores);

            Swal.fire({
                title: `<i class="fas fa-chart-line text-indigo-600"></i> วิเคราะห์ผลสอบ: ${title}`,
                width: '650px',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="p-3 bg-blue-50 dark:bg-slate-800 rounded-2xl"><div class="text-slate-400">ผู้ส่งสอบ</div><div class="text-lg font-bold text-primary">${scores.length} คน</div></div>
                            <div class="p-3 bg-emerald-50 dark:bg-slate-800 rounded-2xl"><div class="text-slate-400">คะแนนเฉลี่ย</div><div class="text-lg font-bold text-emerald-600">${mean}</div></div>
                            <div class="p-3 bg-purple-50 dark:bg-slate-800 rounded-2xl"><div class="text-slate-400">สูงสุด / ต่ำสุด</div><div class="text-lg font-bold text-purple-600">${max} / ${min}</div></div>
                        </div>
                        <button onclick="exportScoresToExcel('${title}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-file-excel"></i> ดาวน์โหลดผลคะแนนเป็น Excel (.xlsx)
                        </button>
                    </div>
                `,
                confirmButtonText: 'ปิดหน้าต่าง'
            });
            window.currentAttemptsForExport = attempts;
        }

        function exportScoresToExcel(title) {
            const data = window.currentAttemptsForExport.map((a, i) => ({
                "ลำดับ": i + 1,
                "ชื่อ-นามสกุล": a.profiles?.full_name || 'นักเรียน',
                "คะแนนที่ได้": a.score,
                "เวลาที่ส่ง": new Date(a.submit_time).toLocaleString('th-TH')
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ผลการสอบ");
            XLSX.writeFile(wb, `ผลการสอบ_${title}.xlsx`);
        }

        initPage();
    </script>
</body>
</html>
