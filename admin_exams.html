<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { 
                        primary: '#0284c7', 
                        darkbg: '#020617',    /* Deep Midnight Dark Mode */
                        darkbox: '#090d16',   /* Dark Slate Box */
                        darkinput: '#0f172a'  /* Dark Slate Input */
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.92); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.05); }
        .dark .glossy-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        .dark .swal2-title, .dark .swal2-html-container { color: #f8fafc !important; }
        .dark select option { background-color: #090d16 !important; color: #f8fafc !important; }
        .upcoming-card { background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(217, 119, 6, 0.03) 100%); border: 1px dashed rgba(245, 158, 11, 0.4); opacity: 0.88; }
        .dark .upcoming-card { background: linear-gradient(135deg, rgba(245, 158, 11, 0.12) 0%, rgba(9, 13, 22, 0.8) 100%); border: 1px dashed rgba(245, 158, 11, 0.5); opacity: 0.85; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-primary hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <div>
                        <h1 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-sky-600 text-white flex items-center justify-center text-sm shadow-md"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">สร้าง รหัสข้อสอบ UNIQUE จัดกลุ่มสไตล์ Classroom และตรวจข้อสอบอัตนัย</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="openCategoryManagerModal()" class="px-4 py-2.5 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-300 rounded-2xl font-bold text-xs border border-indigo-200 dark:border-indigo-900 hover:bg-indigo-100 transition-all shadow-sm flex items-center gap-2">
                        <i class="fas fa-tags text-indigo-500"></i> จัดการหมวดหมู่
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- Section: ข้อสอบที่จะเปิดใน 24 ชั่วโมง (Upcoming) สไตล์จางๆ -->
        <div id="upcomingExamSection" class="hidden space-y-4">
            <h3 class="font-extrabold text-sm text-amber-500 uppercase tracking-wider flex items-center gap-2">
                <i class="fas fa-hourglass-start animate-spin"></i> ข้อสอบตั้งเวลาเปิดบริการ (ภายใน 24 ชั่วโมง)
            </h3>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Section หลัก: จัดกลุ่มข้อสอบสไตล์ Google Classroom -->
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 glossy-card p-6 rounded-3xl">
                <div>
                    <h2 class="font-bold text-lg text-slate-900 dark:text-white">คลังข้อสอบแบ่งตามหมวดหมู่ (Classroom Style)</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">คลังข้อสอบแยกตามรายวิชา/หมวดหมู่ พร้อมระบบตรวจข้อสอบอัตนัย</p>
                </div>
                <button onclick="openExamModal()" class="px-5 py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-sky-500/20 transition-all flex items-center gap-2">
                    <i class="fas fa-plus"></i> สร้างชุดข้อสอบใหม่
                </button>
            </div>

            <div id="classroomExamsContainer" class="space-y-8">
                <div class="text-center py-12 text-slate-400 text-sm">กำลังโหลดคลังข้อสอบ...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriesList = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await loadCategories();
            await loadExams();
        }

        async function loadCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            categoriesList = data || [];
        }

        async function loadExams() {
            const { data: exams, error } = await mySupabase.from('exams').select('*, exam_categories(id, name)').order('created_at', { ascending: false });
            
            if (error || !exams || exams.length === 0) {
                document.getElementById('classroomExamsContainer').innerHTML = `<div class="glossy-card p-12 rounded-3xl text-center text-slate-400 text-sm">ยังไม่มีชุดข้อสอบในระบบ</div>`;
                return;
            }

            const now = new Date();
            const in24Hours = new Date(now.getTime() + 24*60*60*1000);
            const upcomingExams = exams.filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= in24Hours);

            const upcomingSec = document.getElementById('upcomingExamSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');

            if (upcomingExams.length > 0) {
                upcomingSec.classList.remove('hidden');
                upcomingGrid.innerHTML = upcomingExams.map(e => `
                    <div class="upcoming-card p-6 rounded-3xl space-y-3 relative overflow-hidden backdrop-blur-md">
                        <div class="flex justify-between items-start">
                            <span class="px-2.5 py-1 rounded-xl bg-amber-500/20 text-amber-600 dark:text-amber-300 font-bold text-[10px]"><i class="fas fa-clock mr-1"></i> เตรียมเปิดอัตโนมัติ</span>
                            <span class="font-mono text-xs text-amber-600 dark:text-amber-400 font-bold">${e.exam_code || 'NO-CODE'}</span>
                        </div>
                        <h4 class="font-bold text-slate-900 dark:text-white text-base">${e.title}</h4>
                        <div class="text-xs text-slate-500 dark:text-slate-400">
                            <div><i class="far fa-calendar-alt mr-1"></i> เปิด: ${new Date(e.start_time).toLocaleString('th-TH')}</div>
                        </div>
                    </div>
                `).join('');
            } else {
                upcomingSec.classList.add('hidden');
            }

            // จัดกลุ่มตามหมวดหมู่แบบ Google Classroom
            const grouped = {};
            exams.forEach(e => {
                const catName = e.exam_categories?.name || 'ข้อสอบทั่วไป / ไม่ระบุหมวดหมู่';
                if (!grouped[catName]) grouped[catName] = [];
                grouped[catName].push(e);
            });

            const container = document.getElementById('classroomExamsContainer');
            container.innerHTML = Object.keys(grouped).map(catName => {
                const catExams = grouped[catName];
                const cardsHtml = catExams.map(e => {
                    const statusBadge = e.status === 'public' 
                        ? '<span class="px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 font-bold text-[11px] border border-emerald-200 dark:border-emerald-800">เปิดให้ทำ</span>' 
                        : (e.status === 'countdown' 
                            ? '<span class="px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-bold text-[11px] border border-amber-200 dark:border-amber-800">ตั้งเวลา</span>' 
                            : '<span class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-[11px]">ซ่อนอยู่</span>');

                    return `
                        <div class="glossy-card p-6 rounded-3xl flex flex-col justify-between space-y-4">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="font-mono text-xs font-bold text-sky-600 dark:text-sky-300 bg-sky-50 dark:bg-sky-950/50 px-2.5 py-1 rounded-lg">CODE: ${e.exam_code || 'ไม่ระบุ'}</span>
                                    ${statusBadge}
                                </div>
                                <h3 class="font-bold text-base text-slate-900 dark:text-white leading-snug mb-2">${e.title}</h3>
                                <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1">
                                    <div><i class="far fa-clock mr-1 text-sky-500"></i> เวลาทำ: ${e.time_limit || 60} นาที</div>
                                    ${e.start_time ? `<div><i class="far fa-calendar-alt mr-1 text-indigo-500"></i> เปิด: ${new Date(e.start_time).toLocaleString('th-TH')}</div>` : ''}
                                </div>
                            </div>

                            <div class="pt-3 border-t border-slate-100 dark:border-slate-800/80 space-y-2">
                                <button onclick="window.location.href='admin_exam_editor.html?id=${e.id}'" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                    <i class="fas fa-list-check"></i> จัดการโจทย์ & กระดาษคำตอบ
                                </button>
                                
                                <!-- ปุ่มตรวจข้อสอบอัตนัย (นำกลับมาตามคำขอ) -->
                                <button onclick="window.location.href='admin_grading.html?exam_id=${e.id}'" class="w-full py-2.5 bg-amber-500/10 hover:bg-amber-500 hover:text-white text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2">
                                    <i class="fas fa-pen-nib"></i> ตรวจข้อสอบอัตนัย / ให้คะแนน
                                </button>

                                <div class="flex gap-2">
                                    <button onclick='openExamModal(${JSON.stringify(e)})' class="flex-1 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-colors">
                                        <i class="fas fa-pen mr-1"></i> แก้ไข
                                    </button>
                                    <button onclick="deleteExam('${e.id}')" class="px-3 py-2 bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 rounded-xl text-xs font-bold hover:bg-red-100 transition-colors">
                                        <i class="fas fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="space-y-4">
                        <div class="flex items-center gap-3 border-b-2 border-sky-500/20 pb-2">
                            <span class="w-3 h-8 bg-sky-600 rounded-full"></span>
                            <h3 class="font-extrabold text-lg text-slate-900 dark:text-white">${catName}</h3>
                            <span class="px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-bold">${catExams.length} ชุด</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cardsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        async function openExamModal(examData = null) {
            const isEdit = !!examData;
            const categoryOptions = categoriesList.map(c => `<option value="${c.id}" ${examData?.category_id === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

            const { value: formValues } = await Swal.fire({
                title: isEdit ? 'แก้ไขชุดข้อสอบ' : 'สร้างชุดข้อสอบใหม่',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="grid grid-cols-3 gap-3">
                            <div class="col-span-2">
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">ชื่อชุดข้อสอบ <span class="text-red-500">*</span></label>
                                <input id="swalTitle" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.title || ''}" placeholder="ระบุชื่อชุดข้อสอบ...">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">รหัสชุดข้อสอบ (Code)</label>
                                <input id="swalExamCode" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white font-mono uppercase outline-none" value="${examData?.exam_code || ''}" placeholder="EXAM-01">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">หมวดหมู่</label>
                                <select id="swalCategory" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none">
                                    <option value="">-- ไม่ระบุ --</option>
                                    ${categoryOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">เวลาทำ (นาที) <span class="text-red-500">*</span></label>
                                <input type="number" id="swalTimeLimit" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.time_limit || 60}">
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">สถานะเปิดข้อสอบ <span class="text-red-500">*</span></label>
                            <select id="swalStatus" onchange="toggleDateFields(this.value)" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none">
                                <option value="draft" ${examData?.status === 'draft' ? 'selected' : ''}>ซ่อนอยู่ (Draft)</option>
                                <option value="public" ${examData?.status === 'public' ? 'selected' : ''}>เปิดให้ทำทันที (Public)</option>
                                <option value="countdown" ${examData?.status === 'countdown' ? 'selected' : ''}>ตั้งเวลาเปิดอัตโนมัติ (Countdown)</option>
                            </select>
                        </div>
                        <div id="dateFieldsSection" class="${['public','countdown'].includes(examData?.status) ? '' : 'hidden'} grid grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">เวลาเริ่มเปิด (Start Time)</label>
                                <input type="datetime-local" id="swalStartTime" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.start_time ? new Date(new Date(examData.start_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">เวลาปิดรับ (End Time)</label>
                                <input type="datetime-local" id="swalEndTime" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none" value="${examData?.end_time ? new Date(new Date(examData.end_time).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : ''}">
                            </div>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึกข้อมูล',
                cancelButtonText: 'ยกเลิก',
                preConfirm: async () => {
                    const title = document.getElementById('swalTitle').value;
                    const exam_code = document.getElementById('swalExamCode').value.trim().toUpperCase();
                    const timeLimit = document.getElementById('swalTimeLimit').value;
                    const status = document.getElementById('swalStatus').value;

                    if (!title) { Swal.showValidationMessage('กรุณากรอกชื่อชุดข้อสอบ'); return false; }
                    if (!timeLimit) { Swal.showValidationMessage('กรุณากรอกเวลาทำข้อสอบ'); return false; }

                    if (exam_code) {
                        let query = mySupabase.from('exams').select('id').eq('exam_code', exam_code);
                        if (isEdit) query = query.neq('id', examData.id);
                        const { data: dup } = await query;
                        if (dup && dup.length > 0) {
                            Swal.showValidationMessage('รหัสชุดข้อสอบ (Exam Code) นี้ถูกใช้งานแล้ว');
                            return false;
                        }
                    }

                    return {
                        title,
                        exam_code: exam_code || `EXAM-${Math.floor(Math.random()*9000+1000)}`,
                        category_id: document.getElementById('swalCategory').value || null,
                        time_limit: parseInt(timeLimit) || 60,
                        status,
                        start_time: ['public','countdown'].includes(status) && document.getElementById('swalStartTime').value ? new Date(document.getElementById('swalStartTime').value).toISOString() : null,
                        end_time: ['public','countdown'].includes(status) && document.getElementById('swalEndTime').value ? new Date(document.getElementById('swalEndTime').value).toISOString() : null
                    }
                }
            });

            if (formValues) {
                if (isEdit) {
                    await mySupabase.from('exams').update(formValues).eq('id', examData.id);
                } else {
                    await mySupabase.from('exams').insert([formValues]);
                }
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1200, showConfirmButton: false });
                loadExams();
            }
        }

        window.toggleDateFields = function(statusVal) {
            const sec = document.getElementById('dateFieldsSection');
            if (['public', 'countdown'].includes(statusVal)) sec.classList.remove('hidden');
            else sec.classList.add('hidden');
        }

        async function openCategoryManagerModal() {
            let catHtml = categoriesList.map(c => `
                <div class="flex justify-between items-center p-2.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs">
                    <span class="font-bold text-slate-800 dark:text-slate-200">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:text-red-700 px-2 py-1"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            const { value: newCatName } = await Swal.fire({
                title: 'จัดการหมวดหมู่ชุดข้อสอบ',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            ${catHtml || '<div class="text-center text-slate-400">ยังไม่มีหมวดหมู่</div>'}
                        </div>
                        <div class="pt-3 border-t border-slate-200 dark:border-slate-700">
                            <label class="block font-bold text-slate-800 dark:text-slate-100 mb-1">เพิ่มหมวดหมู่ใหม่</label>
                            <input id="newCatInput" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white outline-none" placeholder="พิมพ์ชื่อหมวดหมู่...">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'เพิ่มหมวดหมู่',
                cancelButtonText: 'ปิดหน้าต่าง',
                preConfirm: () => document.getElementById('newCatInput').value
            });

            if (newCatName) {
                await mySupabase.from('exam_categories').insert([{ name: newCatName }]);
                Swal.fire({ icon: 'success', title: 'เพิ่มหมวดหมู่สำเร็จ', timer: 1200, showConfirmButton: false });
                await loadCategories();
                openCategoryManagerModal();
            }
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await loadCategories();
            openCategoryManagerModal();
        }

        async function deleteExam(id) {
            const res = await Swal.fire({
                title: 'ยืนยันลบชุดข้อสอบนี้?',
                text: 'การกระทำนี้จะไม่สามารถกู้คืนได้',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบข้อมูล'
            });

            if (res.isConfirmed) {
                await mySupabase.from('exams').delete().eq('id', id);
                Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย', timer: 1200, showConfirmButton: false });
                loadExams();
            }
        }

        initPage();
    </script>
</body>
</html>
