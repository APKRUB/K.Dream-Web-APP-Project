<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#2563eb', darkbg: '#030712', darkbox: '#111827', darkinput: '#1f2937' } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(31, 41, 55, 0.8); }
        .glossy-card { background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.8) 100%); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05); }
        .dark .glossy-card { background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(15, 23, 42, 0.8) 100%); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-gray-800 dark:text-gray-100">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-gray-200 dark:border-gray-700 hover:bg-primary hover:text-white transition-all"><i class="fas fa-arrow-left text-lg"></i></button>
                    <div>
                        <h1 class="font-extrabold text-xl text-gray-900 dark:text-white flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center text-sm"><i class="fas fa-file-signature"></i></span>
                            ศูนย์จัดการชุดข้อสอบ
                        </h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400">สร้าง กำหนดประเภทข้อสอบ และติดตามสถิติการสอบ</p>
                    </div>
                </div>

                <!-- ปุ่มเพิ่มชุดข้อสอบ และ เพิ่มหมวดหมู่ ไว้มุมขวา -->
                <div class="flex items-center gap-3">
                    <button onclick="openCategoryModal()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-darkinput dark:hover:bg-slate-800 text-gray-700 dark:text-gray-200 rounded-2xl font-bold text-xs transition-all flex items-center gap-2 border border-gray-300 dark:border-gray-700">
                        <i class="fas fa-tags text-indigo-500"></i> เพิ่ม/จัดการหมวดหมู่
                    </button>
                    <button onclick="openCreateExamModal()" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-2xl font-bold text-xs shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                        <i class="fas fa-plus"></i> เพิ่มชุดข้อสอบ
                    </button>
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput border border-gray-200 dark:border-gray-700"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        <!-- รายการข้อสอบกำลังจะเปิดภายใน 1 วัน (จางๆ + Countdown) -->
        <div id="upcomingExamsSection" class="hidden space-y-4">
            <h3 class="font-bold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-hourglass-half animate-spin"></i> ชุดข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง</h3>
            <div id="upcomingExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- รายการข้อสอบทั้งหมด -->
        <div class="glossy-card p-8 rounded-3xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-2"><i class="fas fa-layer-group text-primary"></i> รายการชุดข้อสอบในระบบ</h3>
                <input type="text" id="searchExam" oninput="renderExams()" placeholder="ค้นหาตามชื่อหรือรหัสวิชา..." class="px-4 py-2 bg-slate-50 dark:bg-darkinput border border-gray-200 dark:border-gray-700 rounded-xl text-xs w-64">
            </div>
            <div id="examsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i><p class="mt-2 text-xs">กำลังโหลดชุดข้อสอบ...</p></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allExams = [];
        let allCategories = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await fetchCategories();
            await fetchExams();
            setInterval(updateCountdowns, 1000);
        }

        async function fetchCategories() {
            const { data } = await mySupabase.from('exam_categories').select('*').order('name');
            allCategories = data || [];
        }

        async function fetchExams() {
            const { data } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false });
            allExams = data || [];
            renderExams();
        }

        function renderExams() {
            const search = document.getElementById('searchExam').value.toLowerCase();
            const now = new Date();
            const oneDayLater = new Date(now.getTime() + 24 * 60 * 60 * 1000);

            const filtered = allExams.filter(e => e.title.toLowerCase().includes(search) || e.code.toLowerCase().includes(search));
            const upcoming = filtered.filter(e => e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDayLater);
            const regular = filtered.filter(e => !upcoming.includes(e));

            // Render Upcoming (Faded card + Countdown)
            const upcomingSection = document.getElementById('upcomingExamsSection');
            const upcomingGrid = document.getElementById('upcomingExamsGrid');
            if (upcoming.length > 0) {
                upcomingSection.classList.remove('hidden');
                upcomingGrid.innerHTML = upcoming.map(e => createExamCardHtml(e, true)).join('');
            } else {
                upcomingSection.classList.add('hidden');
            }

            // Render Regular
            const examsList = document.getElementById('examsList');
            if (regular.length === 0 && upcoming.length === 0) {
                examsList.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-sm">ไม่พบชุดข้อสอบในระบบ</div>`;
                return;
            }
            examsList.innerHTML = regular.map(e => createExamCardHtml(e, false)).join('');
        }

        function createExamCardHtml(exam, isFaded) {
            const typeBadge = exam.exam_type === 'pdf' ? '<span class="bg-red-100 text-red-600 dark:bg-red-950/50 dark:text-red-400 px-2.5 py-1 rounded-lg font-bold text-[10px]">PDF Simulator</span>' : '<span class="bg-emerald-100 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400 px-2.5 py-1 rounded-lg font-bold text-[10px]">พิมพ์ลงระบบ</span>';
            const categoryBadge = exam.exam_categories?.name ? `<span class="bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-300 px-2.5 py-1 rounded-lg font-bold text-[10px]">${exam.exam_categories.name}</span>` : '';

            return `
                <div class="glossy-card p-6 rounded-3xl relative flex flex-col justify-between ${isFaded ? 'opacity-60 border-2 border-dashed border-amber-400' : ''}">
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex flex-wrap gap-1.5">${typeBadge} ${categoryBadge}</div>
                            <span class="text-xs font-mono font-bold text-gray-400">#${exam.code}</span>
                        </div>
                        <h4 class="font-bold text-base text-gray-900 dark:text-white mb-2 truncate">${exam.title}</h4>
                        <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2 mb-4">${exam.description || 'ไม่มีรายละเอียดเพิ่มเติม'}</p>
                        
                        ${isFaded ? `<div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-2xl border border-amber-200 dark:border-amber-900 text-center text-xs font-bold text-amber-600 dark:text-amber-300 mb-4" id="cd-${exam.id}">⏳ เปิดใน: คำนวณเวลา...</div>` : ''}

                        <div class="space-y-1 text-[11px] text-gray-500 dark:text-gray-400 mb-6">
                            <div><i class="far fa-clock mr-1 text-primary"></i> เวลาทำ: ${exam.time_limit} นาที (โควต้า: ${exam.attempts_allowed} ครั้ง)</div>
                            <div><i class="fas fa-trophy mr-1 text-amber-500"></i> ลีดเดอร์บอร์ด: ${exam.ranking_mode === 'immediate' ? 'ทันที' : 'ดีเลย์ ' + exam.ranking_delay_days + ' วัน'}</div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-4 border-t border-gray-100 dark:border-gray-800">
                        <button onclick="window.location.href='admin_exam_editor.html?id=${exam.id}'" class="py-2.5 bg-blue-50 text-primary dark:bg-blue-950/40 dark:text-blue-300 rounded-xl font-bold text-xs hover:bg-blue-100 transition-colors"><i class="fas fa-edit mr-1"></i> แก้ไขโจทย์</button>
                        <button onclick="openAnalyticsModal('${exam.id}', '${exam.title}')" class="py-2.5 bg-indigo-50 text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-300 rounded-xl font-bold text-xs hover:bg-indigo-100 transition-colors"><i class="fas fa-chart-line mr-1"></i> สถิติ & AI</button>
                        <button onclick="openAuditLogsModal('${exam.id}')" class="col-span-2 py-2 bg-slate-100 text-gray-600 dark:bg-darkinput dark:text-gray-300 rounded-xl font-semibold text-[11px] hover:bg-slate-200 transition-colors"><i class="fas fa-history mr-1"></i> ดู Audit Log ประวัติแก้ไข</button>
                    </div>
                </div>
            `;
        }

        function updateCountdowns() {
            const now = new Date();
            allExams.forEach(e => {
                const cdElem = document.getElementById(`cd-${e.id}`);
                if (cdElem && e.start_time) {
                    const diff = new Date(e.start_time) - now;
                    if (diff <= 0) {
                        cdElem.textContent = 'ถึงเวลาเปิดข้อสอบแล้ว!';
                    } else {
                        const h = Math.floor(diff / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        cdElem.textContent = `⏳ เปิดใน: ${h} ชม. ${m} นาที ${s} วินาที`;
                    }
                }
            });
        }

        // Modal สร้าง/จัดการหมวดหมู่
        async function openCategoryModal() {
            let catOptions = allCategories.map(c => `
                <div class="flex justify-between items-center p-2.5 bg-slate-50 dark:bg-darkinput rounded-xl border dark:border-gray-700 text-xs">
                    <span class="font-bold">${c.name}</span>
                    <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:underline"><i class="fas fa-trash"></i> ลบ</button>
                </div>
            `).join('');

            const { value: formValues } = await Swal.fire({
                title: 'จัดการหมวดหมู่หลัก',
                html: `
                    <div class="space-y-4 text-left">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">เพิ่มหมวดหมู่ใหม่</label>
                            <div class="flex gap-2">
                                <input id="newCatInput" class="flex-1 px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl text-xs" placeholder="เช่น ฟิสิกส์ ม.ปลาย">
                                <button onclick="addNewCategory()" class="px-4 py-2 bg-primary text-white font-bold rounded-xl text-xs">เพิ่ม</button>
                            </div>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto">${catOptions || '<div class="text-center py-4 text-gray-400 text-xs">ยังไม่มีหมวดหมู่</div>'}</div>
                    </div>
                `,
                showConfirmButton: false,
                showCloseButton: true
            });
        }

        async function addNewCategory() {
            const name = document.getElementById('newCatInput').value;
            if (!name) return;
            await mySupabase.from('exam_categories').insert([{ name }]);
            await fetchCategories();
            openCategoryModal();
        }

        async function deleteCategory(id) {
            await mySupabase.from('exam_categories').delete().eq('id', id);
            await fetchCategories();
            openCategoryModal();
        }

        // Modal เพิ่มชุดข้อสอบใหม่
        async function openCreateExamModal() {
            let categoryOptions = allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-plus text-primary"></i> เพิ่มชุดข้อสอบใหม่',
                width: '700px',
                html: `
                    <div class="grid grid-cols-2 gap-3 text-left text-xs">
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">ชื่อชุดข้อสอบ *</label>
                            <input id="exTitle" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl" placeholder="เช่น สรุปชีววิทยา ม.3">
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <label class="block font-bold mb-1">รหัสวิชา/ข้อสอบ *</label>
                            <input id="exCode" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl" placeholder="เช่น BIO301">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หมวดหมู่หลัก</label>
                            <select id="exCat" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl"><option value="">-- ไม่เลือก --</option>${categoryOptions}</select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ประเภทข้อสอบ *</label>
                            <select id="exType" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                                <option value="online_form">พิมพ์ลงระบบ (1 ข้อ/หน้า)</option>
                                <option value="pdf">PDF + กระดาษคำตอบจำลอง</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">วัน/เวลาเปิดรับงาน</label>
                            <input type="datetime-local" id="exStart" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">วัน/เวลากำหนดส่ง (ระบุหรือไม่ก็ได้)</label>
                            <input type="datetime-local" id="exEnd" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">เวลาทำสอบ (นาที)</label>
                            <input type="number" id="exTime" value="60" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">จำนวนครั้งที่ทำได้ (Attempt)</label>
                            <input type="number" id="exAttempts" value="1" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">สถานะ</label>
                            <select id="exStatus" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                                <option value="draft">Draft (ร่าง)</option>
                                <option value="public">Public (เปิดสอบทันที)</option>
                                <option value="countdown">Countdown (นับถอยหลัง)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">การแสดง Ranking / คะแนน</label>
                            <select id="exRankMode" class="w-full px-3 py-2.5 bg-slate-50 dark:bg-darkinput border rounded-xl">
                                <option value="immediate">แสดงทันทีหลังทำเสร็จ</option>
                                <option value="delay">รอกำหนดเวลา (วัน)</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block font-bold mb-1">รายละเอียดทั่วไป</label>
                            <textarea id="exDesc" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl h-16" placeholder="คำอธิบายสำหรับครู..."></textarea>
                        </div>
                        <div class="col-span-2">
                            <label class="block font-bold mb-1">ข้อมูลเบื้องต้นที่ให้นักเรียนเห็น</label>
                            <textarea id="exStudentInfo" class="w-full px-3 py-2 bg-slate-50 dark:bg-darkinput border rounded-xl h-16" placeholder="คำแนะนำการทำข้อสอบสำหรับนักเรียน..."></textarea>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'สร้างชุดข้อสอบ',
                cancelButtonText: 'ยกเลิก',
                // ค้นหาฟังก์ชัน openCreateExamModal() แล้วแก้ตรง preConfirm:
preConfirm: () => {
    const catInput = document.getElementById('exCat').value;
    
    // ตรวจสอบอย่างละเอียด: ถ้าเป็นค่าว่าง, "null", หรือไม่มีเลือก ให้ส่งเป็น null เท่านั้น
    const cleanCategoryId = (catInput && catInput.trim() !== '' && catInput !== 'null') ? catInput : null;

    return {
        title: document.getElementById('exTitle').value,
        code: document.getElementById('exCode').value,
        category_id: cleanCategoryId, // ส่งค่าที่เคลียร์แล้ว
        exam_type: document.getElementById('exType').value,
        start_time: document.getElementById('exStart').value ? new Date(document.getElementById('exStart').value).toISOString() : null,
        end_time: document.getElementById('exEnd').value ? new Date(document.getElementById('exEnd').value).toISOString() : null,
        time_limit: parseInt(document.getElementById('exTime').value),
        attempts_allowed: parseInt(document.getElementById('exAttempts').value),
        status: document.getElementById('exStatus').value,
        ranking_mode: document.getElementById('exRankMode').value,
        description: document.getElementById('exDesc').value,
        student_preview_info: document.getElementById('exStudentInfo').value
    }
}
            });

            if (form) {
                if (!form.title || !form.code) { Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อและรหัสข้อสอบ', 'warning'); return; }
                const { data, error } = await mySupabase.from('exams').insert([form]).select().single();
                if (!error) {
                    await mySupabase.from('exam_audit_logs').insert([{ exam_id: data.id, action_description: 'สร้างชุดข้อสอบใหม่' }]);
                    Swal.fire({ icon: 'success', title: 'สร้างชุดข้อสอบสำเร็จ!', timer: 1200, showConfirmButton: false });
                    fetchExams();
                } else { Swal.fire('เกิดข้อผิดพลาด', error.message, 'error'); }
            }
        }

        // Modal สถิติและ AI วิเคราะห์ผลประเมิน + ดาวน์โหลด Excel
        async function openAnalyticsModal(examId, title) {
            Swal.fire({ title: 'กำลังประมวลผลสถิติ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { data: attempts } = await mySupabase.from('exam_attempts').select('*, profiles(full_name)').eq('exam_id', examId).eq('status', 'submitted');

            if (!attempts || attempts.length === 0) {
                Swal.fire('ยังไม่มีข้อมูลการสอบ', 'ยังไม่มีนักเรียนส่งข้อสอบชุดนี้', 'info');
                return;
            }

            const scores = attempts.map(a => a.score);
            const mean = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(2);
            const max = Math.max(...scores);
            const min = Math.min(...scores);

            // AI Evaluation Analysis Simulation based on score statistics
            let aiAnalysisText = "";
            if (mean > (max * 0.75)) {
                aiAnalysisText = "นักเรียนส่วนใหญ่ทำคะแนนอยู่ในเกณฑ์ดีเยี่ยม เข้าใจเนื้อหาหลักเป็นอย่างดี ควรเพิ่มโจทย์ท้าทายระดับสูงขึ้น";
            } else if (mean >= (max * 0.5)) {
                aiAnalysisText = "นักเรียนทำคะแนนระดับปานกลาง ควรเน้นทบทวน Section ที่มีข้อสอบอัตนัยหรือโจทย์ประยุกต์เพิ่มเติม";
            } else {
                aiAnalysisText = "คะแนนเฉลี่ยค่อนข้างต่ำ ควรจัดสอนซ่อมเสริมเนื้อหาพื้นฐานและทบทวนความเข้าใจรายบุคคล";
            }

            Swal.fire({
                title: `<i class="fas fa-chart-line text-indigo-600"></i> วิเคราะห์ผลสอบ: ${title}`,
                width: '650px',
                html: `
                    <div class="space-y-4 text-left text-xs">
                        <div class="grid grid-cols-3 gap-3 text-center">
                            <div class="p-3 bg-blue-50 dark:bg-blue-950/40 rounded-2xl"><div class="text-gray-400">ผู้ส่งสอบ</div><div class="text-lg font-bold text-primary">${scores.length} คน</div></div>
                            <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl"><div class="text-gray-400">คะแนนเฉลี่ย</div><div class="text-lg font-bold text-emerald-600">${mean}</div></div>
                            <div class="p-3 bg-purple-50 dark:bg-purple-950/40 rounded-2xl"><div class="text-gray-400">สูงสุด / ต่ำสุด</div><div class="text-lg font-bold text-purple-600">${max} / ${min}</div></div>
                        </div>

                        <div class="p-4 bg-indigo-50 dark:bg-indigo-950/40 rounded-2xl border border-indigo-200 dark:border-indigo-900">
                            <div class="font-bold text-indigo-600 dark:text-indigo-300 mb-1 flex items-center gap-1.5"><i class="fas fa-robot"></i> AI สรุปผลประเมินภาพรวม:</div>
                            <p class="text-gray-700 dark:text-gray-300 leading-relaxed">${aiAnalysisText}</p>
                        </div>

                        <button onclick="exportScoresToExcel('${title}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-file-excel"></i> ดาวน์โหลดผลคะแนนเป็น Excel (.xlsx)
                        </button>
                    </div>
                `,
                showConfirmButton: true,
                confirmButtonText: 'ปิดหน้าต่าง'
            });

            window.currentAttemptsForExport = attempts;
        }

        function exportScoresToExcel(title) {
            const data = window.currentAttemptsForExport.map((a, i) => ({
                "ลำดับ": i + 1,
                "ชื่อ-นามสกุล": a.profiles?.full_name || 'นักเรียน',
                "รอบที่": a.attempt_number,
                "คะแนนที่ได้": a.score,
                "คะแนนเต็ม": a.max_score,
                "จำนวนครั้งที่สลับหน้าจอ": a.tab_switches,
                "เวลาที่ส่ง": new Date(a.submit_time).toLocaleString('th-TH')
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ผลการสอบ");
            XLSX.writeFile(wb, `ผลการสอบ_${title}.xlsx`);
        }

        async function openAuditLogsModal(examId) {
            const { data: logs } = await mySupabase.from('exam_audit_logs').select('*').eq('exam_id', examId).order('created_at', { ascending: false });
            let logsHtml = (logs || []).map(l => `
                <div class="py-2 border-b dark:border-gray-800 text-left text-xs">
                    <div class="font-bold"><i class="fas fa-history text-primary mr-1"></i> ${l.action_description}</div>
                    <div class="text-gray-400 text-[10px]">${new Date(l.created_at).toLocaleString('th-TH')}</div>
                </div>
            `).join('');

            Swal.fire({
                title: 'Audit Log ประวัติการแก้ไข',
                html: `<div class="max-h-64 overflow-y-auto">${logsHtml || '<div class="text-gray-400 py-4 text-xs">ไม่มีประวัติการแก้ไข</div>'}</div>`,
                confirmButtonText: 'ปิด'
            });
        }

        initPage();
    </script>
</body>
</html>
