<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | พื้นที่ของนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#2563eb', primaryHover: '#1d4ed8', lightbg: '#f8fafc', darkbg: '#030712', darkbox: '#111827', darkinput: '#1f2937' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(31, 41, 55, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .glossy-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.8) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glossy-card {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
        }
        #leftDrawer {
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(-100%);
        }
        #leftDrawer.open { transform: translateX(0); }
        #drawerOverlay {
            transition: opacity 0.35s ease;
            opacity: 0;
            pointer-events: none;
        }
        #drawerOverlay.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300 text-gray-800 dark:text-gray-100 selection:bg-blue-500 selection:text-white">

    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="toggleLeftDrawer()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-primary text-white hover:bg-primaryHover transition-all shadow-lg shadow-blue-500/30 cursor-pointer" title="เปิดเมนูด่วน"><i class="fas fa-bars text-lg"></i></button>
                    <div class="flex items-center gap-3 ml-1">
                        <div class="w-11 h-11 bg-gradient-to-br from-blue-600 to-indigo-600 text-white rounded-2xl flex items-center justify-center font-bold shadow-lg shadow-blue-500/30 text-lg"><i class="fas fa-graduation-cap"></i></div>
                        <div class="hidden sm:block">
                            <span class="font-extrabold text-xl text-gray-900 dark:text-white tracking-tight block">Student Portal</span>
                            <span class="text-xs text-gray-500 dark:text-gray-400 font-medium">ระบบการเรียนการสอนออนไลน์</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <button onclick="toggleNotifications()" class="relative w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all shadow-sm border border-gray-200 dark:border-gray-700">
                            <i class="fas fa-bell text-lg"></i>
                            <span id="notifBadge" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white dark:border-darkbox"></span>
                        </button>
                        <div id="notifDropdown" class="hidden absolute right-0 mt-3 w-80 bg-white dark:bg-darkbox rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden z-50">
                            <div class="p-4 border-b border-gray-100 dark:border-gray-800 font-bold text-gray-900 dark:text-white flex justify-between items-center text-sm">
                                <span>การแจ้งเตือน</span>
                                <button onclick="window.location.href='announcements.html'" class="text-xs text-primary font-semibold hover:underline">ดูประกาศทั้งหมด</button>
                            </div>
                            <div id="notifList" class="max-h-64 overflow-y-auto p-2 text-sm"></div>
                        </div>
                    </div>

                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800 transition-all shadow-sm border border-gray-200 dark:border-gray-700"><i class="fas fa-moon text-lg" id="themeIcon"></i></button>
                    <button id="logoutBtn" class="bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 px-4 py-2.5 rounded-2xl text-sm font-bold transition-all flex items-center gap-2 border border-red-200/50 dark:border-red-900/50"><i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">ออก</span></button>
                </div>
            </div>
        </div>
    </nav>

    <div id="drawerOverlay" onclick="toggleLeftDrawer()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[65]"></div>
    <div id="leftDrawer" class="fixed top-0 left-0 h-full w-80 sm:w-96 bg-white dark:bg-darkbox shadow-2xl z-[70] p-6 flex flex-col border-r border-gray-200 dark:border-gray-800">
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-950/80 text-primary flex items-center justify-center font-bold"><i class="fas fa-compass"></i></div>
                <div>
                    <h3 class="font-bold text-base text-gray-900 dark:text-white">เมนูด่วน (Student Menu)</h3>
                    <p class="text-xs text-gray-400">ทางลัดสำหรับนักเรียน</p>
                </div>
            </div>
            <button onclick="toggleLeftDrawer()" class="w-9 h-9 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-darkinput text-gray-500 hover:text-red-500 transition-colors"><i class="fas fa-times text-lg"></i></button>
        </div>

        <div class="space-y-3 flex-1 overflow-y-auto pr-1">
            <a href="announcements.html" class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-darkinput/60 hover:bg-sky-50 dark:hover:bg-sky-950/40 text-gray-700 dark:text-gray-200 hover:text-sky-500 transition-all border border-gray-100 dark:border-gray-800 group">
                <div class="w-10 h-10 rounded-xl bg-sky-100 dark:bg-sky-900/50 text-sky-500 flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fas fa-bullhorn"></i></div>
                <div><div class="font-bold text-sm">ศูนย์รวมประกาศข่าวสาร</div><div class="text-xs text-gray-400">ตรวจสอบประกาศและไฟล์แนบ</div></div>
            </a>
            <div onclick="openConsultModal(); toggleLeftDrawer();" class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50 dark:bg-darkinput/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 text-gray-700 dark:text-gray-200 hover:text-indigo-500 transition-all border border-gray-100 dark:border-gray-800 group cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-500 flex items-center justify-center group-hover:scale-110 transition-transform"><i class="fas fa-calendar-check"></i></div>
                <div><div class="font-bold text-sm">จองเวลา Consult</div><div class="text-xs text-gray-400">ลงทะเบียนขอรับคำปรึกษา</div></div>
            </div>
        </div>

        <div class="pt-4 border-t border-gray-100 dark:border-gray-800 mt-4">
            <button id="drawerLogoutBtn" class="w-full bg-red-50 dark:bg-red-950/50 text-red-600 dark:text-red-400 hover:bg-red-100 py-3 rounded-2xl font-bold text-sm transition-all flex items-center justify-center gap-2 border border-red-200/50 dark:border-red-900/50"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20">
        <div class="mb-10 glossy-card p-8 rounded-3xl border-l-4 border-l-primary flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-400/10 rounded-full blur-2xl pointer-events-none"></div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight" id="welcomeMsg">สวัสดี, นักเรียน</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 font-medium">เลือกชุดข้อสอบที่คุณต้องการทำเพื่อเริ่มต้นการทดสอบ</p>
            </div>
            <button onclick="openConsultModal()" class="px-6 py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-2xl font-bold text-xs shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2"><i class="fas fa-calendar-check text-sm"></i> จองเวลา Consult อาจารย์</button>
        </div>

        <div class="mb-6 flex justify-between items-center"><h3 class="font-bold text-lg text-gray-900 dark:text-white flex items-center gap-2"><i class="fas fa-book-open text-primary"></i> ชุดข้อสอบที่เปิดให้ทำ</h3></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="examList">
            <div class="col-span-full glossy-card p-12 rounded-3xl text-center text-gray-400"><i class="fas fa-spinner fa-spin text-3xl mb-3 text-primary"></i><p class="text-sm">กำลังโหลดข้อสอบ...</p></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function toggleLeftDrawer() {
            const drawer = document.getElementById('leftDrawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        async function initPage() {
            try {
                const { data: { session } } = await mySupabase.auth.getSession();
                if (!session) { window.location.href = 'index.html'; return; }
                const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
                if (!profile || profile.role !== 'student') { window.location.href = 'admin.html'; return; }
                currentUser = profile;
                document.getElementById('welcomeMsg').textContent = `สวัสดี, ${profile.full_name || 'นักเรียน'}`;
                loadExams();
                fetchNotifications();
                setupStudentConsultRealtime();
            } catch (err) { console.error("Init Error:", err); }
        }

        // True Realtime สำหรับนักเรียน (อัปเดต Modal จองอัตโนมัติ)
        function setupStudentConsultRealtime() {
            mySupabase
                .channel('student_consult_realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'consult_slots' }, payload => {
                    const swalContainer = document.querySelector('.swal2-container');
                    if (swalContainer) {
                        openConsultModal();
                    }
                })
                .subscribe();
        }

        async function loadExams() {
            const examList = document.getElementById('examList');
            const { data: exams, error } = await mySupabase.from('exams').select('*, categories(name)').eq('is_published', true).order('created_at', { ascending: false });
            if (error || !exams || exams.length === 0) {
                examList.innerHTML = `<div class="col-span-full glossy-card p-12 rounded-3xl text-center text-gray-400"><h3 class="text-lg font-bold text-gray-800 dark:text-white">ยังไม่มีชุดข้อสอบที่เปิดสอบในขณะนี้</h3></div>`;
                return;
            }
            examList.innerHTML = exams.map(ex => `
                <div class="glossy-card p-7 rounded-3xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3"><span class="text-xs bg-blue-50 dark:bg-blue-950/80 text-primary dark:text-blue-300 px-3.5 py-1.5 rounded-xl font-bold">${ex.categories?.name || 'ทั่วไป'}</span></div>
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2">${ex.title}</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-5"><i class="far fa-clock"></i> เวลาทำข้อสอบ: ${ex.time_limit} นาที</p>
                    </div>
                    <button onclick="startExam('${ex.id}')" class="w-full bg-primary hover:bg-blue-700 text-white py-3 rounded-2xl text-sm font-bold transition-all shadow-md">เริ่มทำข้อสอบ</button>
                </div>
            `).join('');
        }

        function startExam(examId) {
            Swal.fire({ title: 'พร้อมเริ่มทำข้อสอบ?', icon: 'question', showCancelButton: true, confirmButtonColor: '#2563eb' }).then((res) => {
                if(res.isConfirmed) window.location.href = `exam.html?id=${examId}`;
            });
        }

        async function openConsultModal() {
            if (!currentUser) return;
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const { data: setting } = await mySupabase.from('consult_settings').select('*').eq('id', 1).single();
                let { data: quota } = await mySupabase.from('consult_quotas').select('*').eq('student_id', currentUser.id).single();
                if (!quota) {
                    await mySupabase.from('consult_quotas').insert([{ student_id: currentUser.id, has_booked: false }]);
                    quota = { has_booked: false };
                }

                let htmlContent = '';
                if (!setting || !setting.is_open) {
                    let messageHtml = '<span class="text-amber-600 font-bold text-base">ระบบยังไม่เปิดในขณะนี้</span>';
                    if (setting && setting.open_at) {
                        const openTime = new Date(setting.open_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                        messageHtml = `<span class="text-amber-600 font-bold text-sm">⏳ ระบบจะเปิดให้จองในวันที่:<br>${openTime} น.</span>`;
                    }
                    htmlContent = `<div class="text-center py-8 space-y-3"><div>${messageHtml}</div></div>`;
                } else if (quota.has_booked) {
                    let slotText = 'ช่วงเวลาของคุณ';
                    if (quota.booked_slot_id) {
                        const { data: bookedSlot } = await mySupabase.from('consult_slots').select('*').eq('id', quota.booked_slot_id).single();
                        if (bookedSlot) { slotText = `${new Date(bookedSlot.start_time).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })} น.`; }
                    }
                    htmlContent = `<div class="text-center py-8 space-y-4"><h4 class="font-bold text-base text-gray-900 dark:text-white">คุณได้จองเวลา Consult แล้ว</h4><p class="text-sm font-semibold text-primary mt-1">${slotText}</p></div>`;
                } else {
                    const nowIso = new Date().toISOString();
                    const { data: slots } = await mySupabase.from('consult_slots').select('*').eq('status', 'available').gt('end_time', nowIso).order('start_time', { ascending: true });
                    
                    if (!slots || slots.length === 0) {
                        htmlContent = `<div class="text-center py-8 text-gray-400 text-sm">ขออภัย ไม่มีช่วงเวลาว่างให้จองในขณะนี้</div>`;
                    } else {
                        let slotsHtml = slots.map(s => {
                            const startStr = new Date(s.start_time).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                            const endStr = new Date(s.end_time).toLocaleTimeString('th-TH', { timeStyle: 'short' });
                            return `
                                <div class="flex justify-between items-center p-3.5 bg-slate-50 dark:bg-darkinput rounded-2xl border border-gray-200 dark:border-gray-700">
                                    <span class="font-bold text-xs text-gray-900 dark:text-white"><i class="far fa-clock mr-1.5 text-primary"></i> ${startStr} - ${endStr} น.</span>
                                    <button onclick="bookSlot('${s.id}')" class="px-4 py-2 bg-primary hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer">จองเวลานี้</button>
                                </div>
                            `;
                        }).join('');
                        htmlContent = `<div class="space-y-2.5 max-h-72 overflow-y-auto pr-1">${slotsHtml}</div>`;
                    }
                }

                Swal.fire({ title: '<i class="fas fa-calendar-check text-indigo-600"></i> จองเวลา Consult', html: htmlContent, width: '550px', showConfirmButton: false, showCloseButton: true });
            } catch (err) {
                console.error("Consult Modal Error:", err);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', 'error');
            }
        }

        async function bookSlot(slotId) {
            const res = await Swal.fire({ title: 'ยืนยันการจองเวลานี้?', icon: 'question', showCancelButton: true, confirmButtonColor: '#2563eb' });
            if (res.isConfirmed) {
                Swal.fire({ title: 'กำลังบันทึกการจอง...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await mySupabase.from('consult_slots').update({ status: 'booked', student_id: currentUser.id }).eq('id', slotId);
                await mySupabase.from('consult_quotas').upsert({ student_id: currentUser.id, has_booked: true, booked_slot_id: slotId });
                Swal.fire({ icon: 'success', title: 'จองเวลาสำเร็จ!', timer: 1500, showConfirmButton: false });
                setTimeout(() => openConsultModal(), 1600);
            }
        }

        function toggleNotifications() {
            const drop = document.getElementById('notifDropdown');
            drop.classList.toggle('hidden');
            if(!drop.classList.contains('hidden')) { document.getElementById('notifBadge').classList.add('hidden'); markNotificationsAsRead(); }
        }
        async function markNotificationsAsRead() { await mySupabase.from('notifications').update({ is_read: true }).eq('is_read', false); }
        async function fetchNotifications() {
            const { data } = await mySupabase.from('notifications').select('*').order('created_at', { ascending: false }).limit(5);
            const list = document.getElementById('notifList');
            if(!data || data.length === 0) { list.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs font-medium">ไม่มีการแจ้งเตือนใหม่</div>'; return; }
            if(data.some(n => !n.is_read)) document.getElementById('notifBadge').classList.remove('hidden');
            list.innerHTML = data.map(n => `<div onclick="window.location.href='announcements.html'" class="p-3.5 border-b dark:border-gray-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 cursor-pointer rounded-xl"><div class="font-bold text-primary text-xs">ประกาศใหม่</div><div class="mt-1 text-gray-700 dark:text-gray-300 text-xs truncate">${n.message}</div></div>`).join('');
        }

        async function handleLogout() {
            Swal.fire({ title: 'ออกจากระบบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then(async (res) => {
                if (res.isConfirmed) { await mySupabase.auth.signOut(); window.location.href = 'index.html'; }
            });
        }
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('drawerLogoutBtn').addEventListener('click', handleLogout);

        initPage();
    </script>
</body>
</html>
