<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์การเรียนรู้นักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#0284c7', navy: '#0f172a', darkbg: '#090d16' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .glossy-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.08); }
        .dark .glossy-card { background: #0f172a; border: 1px solid rgba(30, 41, 59, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-2xl bg-sky-600 text-white flex items-center justify-center font-bold text-lg"><i class="fas fa-graduation-cap"></i></span>
                <div>
                    <h1 class="font-extrabold text-xl text-slate-900 dark:text-white">Student Hub</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">ระบบเข้าทำสอบและนัด Consult</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- ปุ่มจองคิว Consult -->
                <button onclick="openBookingConsultModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xs shadow-md flex items-center gap-2">
                    <i class="fas fa-comments"></i> 📅 จองคิว Consult
                </button>

                <!-- ปุ่ม Log out สำหรับนักเรียน -->
                <button onclick="logoutStudent()" class="px-4 py-2.5 bg-red-50 text-red-600 dark:bg-red-950/60 dark:text-red-300 rounded-2xl font-bold text-xs border border-red-200 dark:border-red-900 flex items-center gap-1.5">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pt-32 pb-20 space-y-8">
        
        <!-- Welcome Banner -->
        <div class="p-8 rounded-3xl bg-gradient-to-r from-sky-600 via-blue-700 to-indigo-800 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <h2 class="text-2xl font-extrabold">ยินดีต้อนรับนักเรียน! 👋</h2>
                <p class="text-xs text-sky-100 mt-1">เลือกชุดข้อสอบ หรือกดนัดหมาย Consult ปรึกษาคุณครูเพิ่มเติมได้เลย</p>
            </div>
            <button onclick="window.location.href='student_exams.html'" class="px-6 py-3 bg-white text-sky-700 font-bold text-xs rounded-2xl shadow-lg">
                ดูคลังข้อสอบทั้งหมด
            </button>
        </div>

        <!-- ข้อสอบที่กำลังจะเปิดภายใน 24 ชั่วโมง -->
        <div id="upcomingSectionStudent" class="hidden space-y-4">
            <h3 class="font-extrabold text-base text-amber-600 dark:text-amber-400 flex items-center gap-2"><i class="fas fa-clock animate-bounce"></i> ข้อสอบที่กำลังจะเปิดใน 24 ชั่วโมง</h3>
            <div id="upcomingGridStudent" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- ข้อสอบสดพร้อมทำ -->
        <div class="glossy-card p-8 rounded-3xl space-y-6">
            <h3 class="font-extrabold text-lg text-slate-900 dark:text-white flex items-center gap-2"><i class="fas fa-pencil-alt text-sky-600"></i> ข้อสอบพร้อมเข้าทำสอบ</h3>
            <div id="studentExamsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initPage() {
            const { data: exams } = await mySupabase.from('exams').select('*').order('created_at', { ascending: false });
            const now = new Date();
            const oneDayLater = new Date(now.getTime() + 24 * 60 * 60 * 1000);

            const upcoming = (exams || []).filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDayLater);
            const active = (exams || []).filter(e => e.status === 'public');

            if (upcoming.length > 0) {
                document.getElementById('upcomingSectionStudent').classList.remove('hidden');
                document.getElementById('upcomingGridStudent').innerHTML = upcoming.map(e => `
                    <div class="p-5 bg-amber-50 dark:bg-slate-800 rounded-3xl border border-amber-300 dark:border-amber-700 space-y-2 text-xs">
                        <div class="font-bold text-amber-700 dark:text-amber-300">${e.title}</div>
                        <div class="text-[11px] text-slate-500">⏳ เปิดใน: ${new Date(e.start_time).toLocaleString('th-TH')}</div>
                    </div>
                `).join('');
            }

            document.getElementById('studentExamsGrid').innerHTML = active.map(e => `
                <div class="glossy-card p-6 rounded-3xl space-y-4 flex flex-col justify-between">
                    <div>
                        <div class="font-bold text-base text-slate-900 dark:text-white mb-2">${e.title}</div>
                        <div class="text-xs text-slate-500 mb-4">เวลาทำสอบ: ${e.time_limit} นาที</div>
                    </div>
                    <button onclick="window.location.href='exam_take.html?id=${e.id}'" class="w-full py-3 bg-sky-600 text-white font-bold text-xs rounded-2xl shadow-md">เริ่มทำข้อสอบ</button>
                </div>
            `).join('');
        }

        async function openBookingConsultModal() {
            const { value: form } = await Swal.fire({
                title: '<i class="fas fa-comments text-indigo-600"></i> จองคิว Consult ปรึกษาคุณครู',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <div>
                            <label class="block font-bold mb-1">ชื่อ-นามสกุล *</label>
                            <input id="csName" class="w-full px-3 py-2 border rounded-xl" placeholder="เช่น ด.ช. ปารย์ชวัล">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">หัวข้อที่ต้องการปรึกษา *</label>
                            <input id="csTopic" class="w-full px-3 py-2 border rounded-xl" placeholder="เช่น สอบถามเรื่องการคำนวณข้อสอบฟิสิกส์">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">วัน/เวลาที่สะดวกนัด *</label>
                            <input type="datetime-local" id="csTime" class="w-full px-3 py-2 border rounded-xl">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'ยืนยันส่งเรื่องจองคิว',
                preConfirm: () => ({
                    student_name: document.getElementById('csName').value,
                    topic: document.getElementById('csTopic').value,
                    appointment_time: document.getElementById('csTime').value
                })
            });

            if (form && form.student_name) {
                await mySupabase.from('consult_queues').insert([{
                    student_name: form.student_name,
                    topic: form.topic,
                    appointment_time: new Date(form.appointment_time).toISOString()
                }]);
                Swal.fire({ icon: 'success', title: 'ส่งเรื่องจองคิวเรียบร้อย!', timer: 1200, showConfirmButton: false });
            }
        }

        async function logoutStudent() {
            await mySupabase.auth.signOut();
            window.location.href = 'index.html';
        }

        initPage();
    </script>
</body>
</html>
