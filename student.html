<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | พื้นที่ของนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] }, 
                    colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc', darkbg: '#0f172a', darkbox: '#1e293b' } 
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 1); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(30, 41, 59, 1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary text-white rounded-xl flex items-center justify-center font-bold shadow-md">
                        <i class="fas fa-book-reader"></i>
                    </div>
                    <span class="font-bold text-xl text-gray-800 dark:text-white">LMS Student</span>
                </div>
                
                <div class="flex items-center gap-3">
                    <!-- Notification Bell & Dropdown -->
                    <div class="relative">
                        <button onclick="toggleNotifications()" class="relative w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm border border-gray-200 dark:border-gray-700">
                            <i class="fas fa-bell"></i>
                            <span id="notifBadge" class="hidden absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white dark:border-darkbox"></span>
                        </button>
                        <div id="notifDropdown" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-darkbox rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden z-50">
                            <div class="p-4 border-b border-gray-100 dark:border-gray-700 font-bold text-gray-800 dark:text-white flex justify-between items-center">
                                <span>การแจ้งเตือน</span>
                                <button onclick="window.location.href='announcements.html'" class="text-xs text-primary font-semibold hover:underline">ดูประกาศทั้งหมด</button>
                            </div>
                            <div id="notifList" class="max-h-64 overflow-y-auto p-2 text-sm">
                                <div class="text-center py-4 text-gray-400">กำลังโหลด...</div>
                            </div>
                            <div class="p-3 text-center border-t border-gray-100 dark:border-gray-700 bg-slate-50 dark:bg-slate-800/50">
                                <button onclick="window.location.href='announcements.html'" class="text-xs text-primary dark:text-blue-400 font-bold hover:underline">
                                    <i class="fas fa-bullhorn mr-1"></i> ไปที่ศูนย์รวมประกาศข่าวสาร
                                </button>
                            </div>
                        </div>
                    </div>

                    <span id="welcomeMsg" class="hidden md:inline text-sm font-medium text-gray-600 dark:text-gray-300">กำลังโหลด...</span>
                    
                    <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm border border-gray-200 dark:border-gray-700">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    
                    <button id="logoutBtn" class="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 px-4 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">ออก</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-12">
        <div class="mb-8 bg-white dark:bg-darkbox p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 border-l-4 border-l-primary flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">ชุดข้อสอบที่เปิดให้ทำ</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">เลือกชุดข้อสอบที่คุณต้องการทำเพื่อเริ่มต้นระบบทดสอบ</p>
            </div>
            <button onclick="window.location.href='announcements.html'" class="bg-blue-50 dark:bg-blue-900/30 text-primary dark:text-blue-300 px-4 py-2 rounded-xl text-sm font-semibold border border-blue-100 dark:border-blue-800 hover:bg-blue-100 transition-colors flex items-center gap-2">
                <i class="fas fa-bullhorn"></i> ดูประกาศทั้งหมด
            </button>
        </div>

        <!-- รายการข้อสอบ (Dynamic Fetch) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="examList">
            <div class="col-span-full text-center py-12 text-gray-400">
                <i class="fas fa-spinner fa-spin text-3xl mb-3 text-primary"></i>
                <p>กำลังโหลดข้อสอบ...</p>
            </div>
        </div>
    </main>

    <script>
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'student') { window.location.href = 'admin.html'; return; }

            document.getElementById('welcomeMsg').textContent = `สวัสดี, ${profile.full_name || 'นักเรียน'}`;
            loadExams();
            fetchNotifications();
        }

        async function loadExams() {
            const examList = document.getElementById('examList');
            const { data: exams, error } = await mySupabase.from('exams').select('*, categories(name)').eq('is_published', true).order('created_at', { ascending: false });

            if (error || !exams || exams.length === 0) {
                examList.innerHTML = `
                    <div class="col-span-full bg-white dark:bg-darkbox rounded-2xl p-12 text-center shadow-sm border border-gray-200 dark:border-gray-700">
                        <div class="w-16 h-16 bg-blue-50 dark:bg-slate-800 text-primary rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 dark:text-white">ยังไม่มีชุดข้อสอบที่เปิดสอบในขณะนี้</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">กรุณารอคุณครูประกาศเปิดให้ทำข้อสอบครับ</p>
                    </div>
                `;
                return;
            }

            examList.innerHTML = exams.map(ex => `
                <div class="bg-white dark:bg-darkbox rounded-2xl p-6 shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs bg-blue-50 dark:bg-blue-900/40 text-primary dark:text-blue-300 px-3 py-1 rounded-full font-semibold">${ex.categories?.name || 'ทั่วไป'}</span>
                            <span class="text-xs text-green-600 dark:text-green-400 font-semibold"><i class="fas fa-check-circle mr-1"></i>พร้อมสอบ</span>
                        </div>
                        <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-2">${ex.title}</h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4"><i class="far fa-clock mr-1"></i> เวลาทำข้อสอบ: ${ex.time_limit} นาที</p>
                    </div>
                    <button onclick="startExam('${ex.id}')" class="w-full bg-primary hover:bg-blue-800 text-white py-2.5 rounded-xl text-sm font-bold transition-colors shadow-sm">
                        เริ่มทำข้อสอบ <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            `).join('');
        }

        function startExam(examId) {
            Swal.fire({
                title: 'พร้อมเริ่มทำข้อสอบ?',
                text: "เมื่อกดเริ่มแล้ว ระบบจะเริ่มจับเวลาทันที",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#1d4ed8',
                confirmButtonText: 'เริ่มสอบเลย',
                cancelButtonText: 'ยกเลิก'
            }).then((res) => {
                if(res.isConfirmed) window.location.href = `exam.html?id=${examId}`;
            });
        }

        // Notifications Bell สำหรับนักเรียน (กดแล้วเปิด Dropdown หรือคลิกไปหน้าประกาศได้)
        function toggleNotifications() {
            const drop = document.getElementById('notifDropdown');
            drop.classList.toggle('hidden');
            if(!drop.classList.contains('hidden')) document.getElementById('notifBadge').classList.add('hidden');
        }

        async function fetchNotifications() {
            const { data } = await mySupabase.from('notifications').select('*').order('created_at', { ascending: false }).limit(5);
            const list = document.getElementById('notifList');
            if(!data || data.length === 0) { 
                list.innerHTML = '<div class="text-center py-4 text-gray-400 text-xs">ไม่มีการแจ้งเตือนใหม่</div>'; 
                return; 
            }
            document.getElementById('notifBadge').classList.remove('hidden');
            list.innerHTML = data.map(n => `
                <div onclick="window.location.href='announcements.html'" class="p-3 border-b dark:border-gray-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition-colors">
                    <div class="font-bold text-primary dark:text-blue-400 text-xs">${n.type === 'announcement' ? '<i class="fas fa-bullhorn"></i> ประกาศจากโรงเรียน' : '<i class="fas fa-bell"></i> แจ้งเตือน'}</div>
                    <div class="mt-1 text-gray-700 dark:text-gray-300 text-xs truncate">${n.message}</div>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            Swal.fire({ title: 'ออกจากระบบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then(async (res) => {
                if (res.isConfirmed) { await mySupabase.auth.signOut(); window.location.href = 'index.html'; }
            });
        });

        initPage();
    </script>
</body>
</html>
