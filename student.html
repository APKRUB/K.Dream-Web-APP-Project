<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | Student Portal Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#050811', darkbox: '#0f172a', darkinput: '#1e293b' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .tech-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.9);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px -5px rgba(2, 132, 199, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .tech-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 29, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }
        .tech-card:hover {
            transform: translateY(-4px);
            border-color: rgba(2, 132, 199, 0.4);
            box-shadow: 0 15px 35px -5px rgba(2, 132, 199, 0.15);
        }
        .neon-glow-btn {
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }
        .neon-glow-btn:hover {
            box-shadow: 0 0 30px rgba(2, 132, 199, 0.6);
            transform: translateY(-2px);
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #0f172a !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 selection:bg-sky-500 selection:text-white">

    <!-- High-Tech Glass Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center font-extrabold text-xl shadow-lg shadow-sky-500/30">
                        <i class="fas fa-atom animate-spin-slow"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-xl tracking-tight bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-300 bg-clip-text text-transparent">STUDENT HUB</h1>
                        <p class="text-[11px] font-bold text-slate-400 tracking-wider uppercase">High-Tech LMS Portal</p>
                    </div>
                </div>

                <!-- Navigation Controls + Theme Toggle -->
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='announcements.html'" class="px-4 py-2.5 bg-amber-500/10 text-amber-600 dark:text-amber-400 rounded-2xl font-bold text-xs border border-amber-500/20 hover:bg-amber-500 hover:text-white transition-all">
                        <i class="fas fa-bullhorn mr-1.5"></i> ประกาศ
                    </button>
                    <button onclick="openBookingConsultModal()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-2xl font-bold text-xs neon-glow-btn transition-all flex items-center gap-1.5">
                        <i class="fas fa-calendar-check"></i> จอง Consult
                    </button>
                    
                    <!-- Theme Switcher Button -->
                    <button id="themeToggle" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                        <i class="fas fa-moon text-lg" id="themeIcon"></i>
                    </button>

                    <button onclick="logoutStudent()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900/50 hover:bg-red-500 hover:text-white transition-all">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 space-y-8">
        
        <!-- Futuristic Banner -->
        <div class="p-8 md:p-10 rounded-3xl bg-gradient-to-r from-sky-600 via-indigo-700 to-slate-900 text-white relative overflow-hidden shadow-2xl shadow-sky-600/20 border border-sky-400/20">
            <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-sky-400/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md text-sky-200 text-xs font-bold mb-3 border border-white/20">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Academic Online System
                    </div>
                    <h2 class="text-3xl font-black tracking-tight">ยินดีต้อนรับนักเรียน! 🚀</h2>
                    <p class="text-xs text-sky-100/90 mt-1 max-w-xl">เข้าทำแบบทดสอบวัดผลการเรียนรู้ หรือเลือกจอง Slot เวลาปรึกษาคุณครูได้ทันทีตลอด 24 ชั่วโมง</p>
                </div>
            </div>
        </div>

        <!-- Section: ข้อสอบกำลังจะเปิดใน 24 ชม. -->
        <div id="upcomingSec" class="hidden space-y-4">
            <h3 class="font-extrabold text-base text-amber-500 flex items-center gap-2 tracking-wide uppercase">
                <i class="fas fa-bolt animate-bounce"></i> ข้อสอบกำลังจะเปิดใน 24 ชั่วโมง
            </h3>
            <div id="upcomingGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- Section: ศูนย์การทำข้อสอบ -->
        <div class="tech-card p-8 rounded-3xl space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-200/80 dark:border-slate-800">
                <div>
                    <h3 class="font-extrabold text-xl text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-layer-group text-sky-500"></i> คลังข้อสอบของคุณ
                    </h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">เลือกทำข้อสอบตามรายวิชาและตรวจสอบผลวิเคราะห์คะแนน</p>
                </div>
                
                <!-- Filter Tabs -->
                <div class="flex bg-slate-100 dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">
                    <button id="tabPending" onclick="switchTab('pending')" class="px-5 py-2 rounded-xl text-xs font-bold bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-400 shadow-sm transition-all">ยังไม่ได้ทำ</button>
                    <button id="tabDone" onclick="switchTab('done')" class="px-5 py-2 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400 transition-all">ทำเสร็จแล้ว</button>
                </div>
            </div>

            <!-- Exam Grid -->
            <div id="examGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-slate-400 text-sm">กำลังโหลดข้อมูลข้อสอบ...</div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeTab = 'pending';
        let allPublicExams = [];
        let doneExamIds = [];

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (session) {
                const { data: att } = await mySupabase.from('exam_attempts').select('exam_id').eq('student_id', session.user.id).eq('status', 'submitted');
                doneExamIds = (att || []).map(a => a.exam_id);
            }

            const { data } = await mySupabase.from('exams').select('*, exam_categories(name)').order('created_at', { ascending: false });
            
            const now = new Date();
            const oneDay = new Date(now.getTime() + 24*60*60*1000);
            const upcoming = (data || []).filter(e => e.status === 'countdown' && e.start_time && new Date(e.start_time) > now && new Date(e.start_time) <= oneDay);
            allPublicExams = (data || []).filter(e => e.status === 'public');

            if (upcoming.length > 0) {
                document.getElementById('upcomingSec').classList.remove('hidden');
                document.getElementById('upcomingGrid').innerHTML = upcoming.map(e => `
                    <div class="tech-card p-6 rounded-3xl border-l-4 border-l-amber-500 space-y-2">
                        <span class="px-2.5 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 font-bold text-[10px]">${e.exam_categories?.name || 'ทั่วไป'}</span>
                        <h4 class="font-bold text-slate-900 dark:text-white text-sm">${e.title}</h4>
                        <div class="text-xs text-slate-400 mt-2"><i class="far fa-clock text-amber-500 mr-1"></i> เปิด: ${new Date(e.start_time).toLocaleString('th-TH')}</div>
                    </div>
                `).join('');
            }

            renderExams();
        }

        function switchTab(t) {
            activeTab = t;
            document.getElementById('tabPending').className = t === 'pending' ? "px-5 py-2 rounded-xl text-xs font-bold bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-400 shadow-sm transition-all" : "px-5 py-2 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400 transition-all";
            document.getElementById('tabDone').className = t === 'done' ? "px-5 py-2 rounded-xl text-xs font-bold bg-white dark:bg-slate-800 text-sky-600 dark:text-sky-400 shadow-sm transition-all" : "px-5 py-2 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400 transition-all";
            renderExams();
        }

        function renderExams() {
            const isDone = activeTab === 'done';
            const ex = allPublicExams.filter(e => isDone ? doneExamIds.includes(e.id) : !doneExamIds.includes(e.id));
            const grid = document.getElementById('examGrid');

            if (ex.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">ไม่มีรายการข้อสอบในหมวดนี้</div>`;
                return;
            }

            grid.innerHTML = ex.map(e => `
                <div class="tech-card p-6 rounded-3xl flex flex-col justify-between space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-3 py-1 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-300 font-bold text-xs">${e.exam_categories?.name || 'ทั่วไป'}</span>
                            <span class="text-xs text-slate-400 font-semibold"><i class="far fa-clock text-sky-500 mr-1"></i> ${e.time_limit || 60} นาที</span>
                        </div>
                        <h4 class="font-bold text-slate-900 dark:text-white text-base leading-snug mb-2">${e.title}</h4>
                    </div>

                    <button onclick="window.location.href='${isDone ? `exam_result.html?exam_id=${e.id}` : `exam_take.html?id=${e.id}`}'" class="w-full py-3 ${isDone ? 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200' : 'bg-sky-600 hover:bg-sky-500 text-white neon-glow-btn'} font-bold text-xs rounded-2xl transition-all">
                        ${isDone ? '<i class="fas fa-chart-pie mr-1.5"></i> ดูผลวิเคราะห์ AI' : '<i class="fas fa-play mr-1.5"></i> เริ่มทำข้อสอบ'}
                    </button>
                </div>
            `).join('');
        }

        // Modal เลือกจอง Slot Consult
        async function openBookingConsultModal() {
            const { data: setting } = await mySupabase.from('consult_settings').select('*').eq('id', 1).single();
            const now = new Date();

            if (!setting?.is_open || (setting.close_at && new Date(setting.close_at) <= now)) {
                Swal.fire('ระบบปิดรับจอง', 'ขณะนี้ระบบ Consult ยังไม่เปิดรับจอง กรุณารอเวลาเปิดระบบจากคุณครู', 'info');
                return;
            }

            const nowIso = now.toISOString();
            const { data: availableSlots } = await mySupabase.from('consult_slots').select('*').eq('status', 'available').gt('end_time', nowIso).order('start_time', { ascending: true });

            if (!availableSlots || availableSlots.length === 0) {
                Swal.fire('ไม่มี Slot ว่าง', 'ขณะนี้ไม่มี Slot เวลาว่างให้เลือกจอง กรุณาติดต่อคุณครู', 'warning');
                return;
            }

            let optionsHtml = availableSlots.map(s => {
                const sStr = new Date(s.start_time).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
                const eStr = new Date(s.end_time).toLocaleTimeString('th-TH', { timeStyle: 'short' });
                return `<option value="${s.id}">${sStr} - ${eStr} น.</option>`;
            }).join('');

            const { value: slotId } = await Swal.fire({
                title: '📅 เลือกจอง Slot เวลา Consult',
                html: `
                    <div class="space-y-3 text-left text-xs">
                        <label class="block font-bold text-slate-700 dark:text-slate-200">เลือกช่วงเวลาที่คุณต้องการปรึกษา:</label>
                        <select id="slotSelect" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none">${optionsHtml}</select>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'ยืนยันการจอง',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => document.getElementById('slotSelect').value
            });

            if (slotId) {
                const { data: { session } } = await mySupabase.auth.getSession();
                if (!session) { Swal.fire('กรุณาเข้าสู่ระบบก่อนจอง', '', 'warning'); return; }

                await mySupabase.from('consult_slots').update({ status: 'booked', student_id: session.user.id }).eq('id', slotId);
                await mySupabase.from('consult_quotas').upsert({ student_id: session.user.id, has_booked: true, booked_slot_id: slotId });

                Swal.fire({ icon: 'success', title: 'จอง Slot เวลาสำเร็จ!', timer: 1500, showConfirmButton: false });
            }
        }

        async function logoutStudent() {
            await mySupabase.auth.signOut();
            window.location.href = 'index.html';
        }

        initPage();
    </script>
</body>
</html>
