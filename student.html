<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | พื้นที่ของนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#4f46e5', secondary: '#ec4899' } } }
        }
    </script>
    <style>
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass-nav { background: rgba(17, 24, 39, 0.8); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-primary text-white rounded-lg"><i class="fas fa-book-open"></i></div>
                    <span class="font-semibold text-xl dark:text-white">LMS Student</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="welcomeMsg" class="hidden sm:block text-gray-600 dark:text-gray-300">กำลังโหลด...</span>
                    <button id="themeToggle" class="text-gray-500 dark:text-gray-300 hover:text-primary transition-colors"><i class="fas fa-moon text-xl" id="themeIcon"></i></button>
                    <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition-colors shadow-sm"><i class="fas fa-sign-out-alt mr-2"></i>ออกจากระบบ</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">ข้อสอบของคุณ</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">เลือกชุดข้อสอบที่ต้องการทำได้เลย</p>
        </div>

        <!-- รายการข้อสอบ (จำลอง UI ไว้ก่อนเชื่อมต่อฐานข้อมูลในเฟส 3) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="examList">
            
            <!-- Card ข้อสอบที่ 1 -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 hover:shadow-lg transition-all transform hover:-translate-y-1">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 rounded-xl"><i class="fas fa-laptop-code text-xl"></i></div>
                    <span class="bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 text-xs px-2 py-1 rounded-full">พร้อมสอบ</span>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">สอบกลางภาค วิชาเทคโนโลยี</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4"><i class="far fa-clock mr-1"></i> เวลาทำข้อสอบ: 60 นาที</p>
                <button onclick="startExam('123')" class="w-full bg-primary hover:bg-indigo-600 text-white py-2 rounded-lg transition-colors">เริ่มทำข้อสอบ</button>
            </div>

            <!-- Card ข้อสอบที่ 2 (ตัวอย่างแบบทำเสร็จแล้ว) -->
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 opacity-75">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-3 bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 rounded-xl"><i class="fas fa-file-alt text-xl"></i></div>
                    <span class="bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 text-xs px-2 py-1 rounded-full">รอครูตรวจ</span>
                </div>
                <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-2">แบบทดสอบที่ 1: วิทยาศาสตร์</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4"><i class="fas fa-check-circle mr-1"></i> ส่งเมื่อ
