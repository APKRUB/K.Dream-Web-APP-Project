<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ห้องสอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc' }
                } 
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* สไตล์กระดาษคำตอบ PDF */
        .option-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #e2e8f0; font-weight: bold; color: #64748b; background: white; transition: all 0.2s; }
        .option-btn:hover { border-color: #3b82f6; color: #3b82f6; }
        .option-btn.selected { background-color: #1d4ed8; border-color: #1d4ed8; color: white; transform: scale(1.1); box-shadow: 0 4px 10px rgba(29, 78, 216, 0.3); }
        
        /* สไตล์ตารางคำถาม (Navigator) */
        .nav-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 600; color: #475569; transition: all 0.2s; }
        .nav-btn.answered { background-color: #dbeafe; border-color: #3b82f6; color: #1d4ed8; }
        .nav-btn.active { background-color: #1d4ed8; color: white; border-color: #1d4ed8; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Topbar (Header ห้องสอบ) -->
    <header class="bg-white border-b border-gray-200 shadow-sm h-16 flex justify-between items-center px-4 sm:px-6 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-50 text-primary rounded-xl flex items-center justify-center text-xl font-bold">
                <i class="fas fa-file-signature"></i>
            </div>
            <div>
                <h1 id="examTitle" class="font-bold text-gray-800 text-lg leading-tight">กำลังโหลดข้อสอบ...</h1>
                <p id="studentName" class="text-xs text-gray-500">รหัสนักเรียน: ...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4 sm:gap-6">
            <!-- ตัวจับเวลา -->
            <div class="flex items-center gap-2 bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                <i class="far fa-clock text-blue-600 animate-pulse"></i>
                <span id="timerDisplay" class="font-mono font-bold text-blue-700 text-lg">00:00:00</span>
            </div>
            <!-- ปุ่มส่งข้อสอบ -->
            <button onclick="submitExam()" class="bg-primary hover:bg-blue-800 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-colors flex items-center gap-2">
                <i class="fas fa-paper-plane"></i> <span class="hidden sm:inline">ส่งคำตอบ</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="examContainer" class="flex-1 flex overflow-hidden w-full relative">
        <!-- เนื้อหาจะถูกสร้างด้วย JavaScript ขึ้นอยู่กับประเภทข้อสอบ -->
        <div class="flex-1 flex items-center justify-center">
            <div class="text-center text-gray-400"><i class="fas fa-spinner fa-spin text-4xl mb-3 text-primary"></i><br>กำลังเตรียมระบบห้องสอบ...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // State Variables
        let currentUser = null;
        let examData = null;
        let answerKeys = [];
        let attemptData = null;
        
        let studentAnswers = {}; // เก็บคำตอบ { 1: "ก", 2: "text..." }
        let currentQuestionIndex = 0; // สำหรับแบบ Dynamic Text
        
        let timeLeft = 0;
        let timerInterval;

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');

        async function initExam() {
            if (!examId) {
                Swal.fire('ข้อผิดพลาด', 'ไม่พบรหัสข้อสอบ', 'error').then(() => window.location.href='student.html');
                return;
            }

            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await mySupabase.from('profiles').select('*').eq('id', session.user.id).single();
            currentUser = profile;
            document.getElementById('studentName').textContent = profile.full_name;

            // โหลดข้อมูลข้อสอบและเฉลย (เอาโครงสร้างมาสร้าง UI)
            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            const { data: keys } = await mySupabase.from('answer_keys').select('*').eq('exam_id', examId).order('question_number');
            
            if(!exam) { Swal.fire('ข้อผิดพลาด', 'ข้อสอบถูกลบหรือไม่มีอยู่', 'error'); return; }
            
            examData = exam;
            answerKeys = keys || [];
            document.getElementById('examTitle').textContent = exam.title;

            // ตรวจสอบ Attempt (เคยเริ่มทำหรือยัง)
            const { data: attempts } = await mySupabase.from('exam_attempts')
                .select('*').eq('exam_id', examId).eq('student_id', currentUser.id).eq('status', 'in_progress');
            
            if (attempts && attempts.length > 0) {
                attemptData = attempts[0];
            } else {
                // สร้าง Attempt ใหม่
                const { data: newAttempt } = await mySupabase.from('exam_attempts').insert([{
                    exam_id: examId, student_id: currentUser.id
                }]).select().single();
                attemptData = newAttempt;
            }

            // คำนวณเวลา
            const startTime = new Date(attemptData.started_at).getTime();
            const timeLimitMs = examData.time_limit * 60 * 1000;
            const now = new Date().getTime();
            const timePassed = now - startTime;
            timeLeft = Math.floor((timeLimitMs - timePassed) / 1000);

            if (timeLeft <= 0) {
                Swal.fire('หมดเวลา', 'เวลาในการทำข้อสอบชุดนี้หมดแล้ว', 'warning').then(() => window.location.href='student.html');
                return;
            }

            startTimer();
            buildUI();
            
            // ดักจับการสลับแท็บเบราว์เซอร์
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    Swal.fire({
                        title: 'คำเตือน!',
                        text: 'ระบบตรวจพบการสลับแท็บออกจากหน้าข้อสอบ ข้อมูลนี้จะถูกบันทึกส่งให้คุณครู',
                        icon: 'warning',
                        confirmButtonColor: '#1d4ed8'
                    });
                }
            });
        }

        // ================== ระบบเวลา ==================
        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoSubmitExam();
                } else {
                    timeLeft--;
                    const h = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
                    const m = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                    const s = (timeLeft % 60).toString().padStart(2, '0');
                    document.getElementById('timerDisplay').textContent = `${h}:${m}:${s}`;
                    
                    if (timeLeft < 300) { // ต่ำกว่า 5 นาที สีแดงกะพริบ
                        document.getElementById('timerDisplay').classList.replace('text-blue-700', 'text-red-600');
                    }
                }
            }, 1000);
        }

        // ================== สร้าง Layout หน้าจอ ==================
        function buildUI() {
            const container = document.getElementById('examContainer');
            
            if (examData.exam_type === 'pdf_only') {
                // รูปแบบแยกซ้าย-ขวา
                container.innerHTML = `
                    <!-- ฝั่งซ้าย: PDF Viewer (60%) -->
                    <div class="w-full lg:w-3/5 h-full bg-gray-50 border-r border-gray-200">
                        <iframe src="${examData.pdf_url}#toolbar=0" class="w-full h-full" frameborder="0"></iframe>
                    </div>
                    
                    <!-- ฝั่งขวา: กระดาษคำตอบ (40%) -->
                    <div class="w-full lg:w-2/5 h-full bg-white flex flex-col shadow-[-4px_0_15px_rgba(0,0,0,0.02)]">
                        <div class="p-4 border-b border-gray-100 bg-blue-50/50">
                            <h2 class="font-bold text-primary"><i class="fas fa-list-ol mr-2"></i>กระดาษคำตอบ</h2>
                        </div>
                        <div class="flex-1 overflow-y-auto p-6 space-y-6" id="answerSheetArea">
                            ${generateAnswerSheetHTML()}
                        </div>
                    </div>
                `;
            } else {
                // รูปแบบพิมพ์โจทย์ (ทีละข้อ + Navigator ด้านล่าง)
                container.innerHTML = `
                    <div class="w-full max-w-4xl mx-auto flex flex-col h-full py-6 px-4">
                        <!-- บริเวณแสดงคำถาม -->
                        <div id="questionArea" class="flex-1 bg-white rounded-3xl shadow-sm border border-gray-200 p-8 overflow-y-auto mb-6 flex flex-col">
                            <!-- Render via JS -->
                        </div>
                        
                        <!-- Navigator & เปลี่ยนข้อ -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4">
                            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                                <button onclick="changeQuestion(-1)" class="px-6 py-2 bg-gray-100 hover:bg-gray-200 rounded-xl font-semibold text-gray-700 transition-colors"><i class="fas fa-chevron-left mr-2"></i>ก่อนหน้า</button>
                                <span class="font-bold text-primary" id="qCounter">ข้อที่ 1 / ${answerKeys.length}</span>
                                <button onclick="changeQuestion(1)" class="px-6 py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-xl font-semibold transition-colors">ถัดไป<i class="fas fa-chevron-right ml-2"></i></button>
                            </div>
                            <div class="flex flex-wrap gap-2 justify-center" id="navGrid">
                                ${generateNavGridHTML()}
                            </div>
                        </div>
                    </div>
                `;
                renderCurrentQuestion();
            }
        }

        // ================== ฟังก์ชันของ PDF (แยกซ้าย-ขวา) ==================
        function generateAnswerSheetHTML() {
            let html = '';
            
            const mcqs = answerKeys.filter(k => k.question_type === 'mcq');
            if(mcqs.length > 0) {
                html += '<h3 class="font-bold text-gray-700 border-b pb-2">ส่วนที่ 1: ปรนัย (เลือกตอบ)</h3><div class="space-y-3">';
                mcqs.forEach(q => {
                    const choices = q.options_count === 5 ? ['ก','ข','ค','ง','จ'] : ['ก','ข','ค','ง'];
                    let btns = choices.map(ch => `
                        <button id="opt_${q.question_number}_${ch}" onclick="selectAnswer(${q.question_number}, '${ch}', 'mcq')" class="option-btn ${studentAnswers[q.question_number] === ch ? 'selected' : ''}">${ch}</button>
                    `).join('');
                    html += `
                        <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-xl border border-gray-100">
                            <span class="w-10 font-bold text-gray-600 text-right">ข้อ ${q.question_number}.</span>
                            <div class="flex gap-2">${btns}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            const essays = answerKeys.filter(k => k.question_type === 'essay');
            if(essays.length > 0) {
                html += '<h3 class="font-bold text-gray-700 border-b pb-2 mt-6">ส่วนที่ 2: อัตนัย (เขียนตอบ)</h3><div class="space-y-4">';
                essays.forEach(q => {
                    html += `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <span class="font-bold text-gray-700 block mb-2">ข้อ ${q.question_number}.</span>
                            <textarea onkeyup="inputEssay(${q.question_number}, this.value)" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none resize-none" rows="4" placeholder="พิมพ์คำตอบของคุณที่นี่...">${studentAnswers[q.question_number] || ''}</textarea>
                        </div>
                    `;
                });
                html += '</div>';
            }
            return html;
        }

        // ================== ฟังก์ชันของ Dynamic Text (ทีละข้อ) ==================
        function generateNavGridHTML() {
            return answerKeys.map((q, idx) => `
                <button id="navBtn_${idx}" onclick="jumpToQuestion(${idx})" class="nav-btn ${studentAnswers[q.question_number] ? 'answered' : ''} ${idx === currentQuestionIndex ? 'active' : ''}">${q.question_number}</button>
            `).join('');
        }

        function renderCurrentQuestion() {
            if(answerKeys.length === 0) return;
            const q = answerKeys[currentQuestionIndex];
            const area = document.getElementById('questionArea');
            document.getElementById('qCounter').textContent = `ข้อที่ ${currentQuestionIndex + 1} / ${answerKeys.length}`;
            
            // อัปเดตสีปุ่ม Nav
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`navBtn_${currentQuestionIndex}`).classList.add('active');

            let html = `
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h2 class="text-xl font-bold text-primary">ข้อที่ ${q.question_number}</h2>
                    <span class="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-semibold">${q.question_type === 'mcq' ? 'เลือกคำตอบที่ถูกที่สุด' : 'เขียนคำตอบ'}</span>
                </div>
                <p class="text-lg text-gray-800 mb-8 whitespace-pre-line">${q.question_text || 'ยังไม่มีการพิมพ์โจทย์ (ถ้าเห็นข้อความนี้แสดงว่าครูยังไม่ได้เพิ่มโจทย์ในฐานข้อมูล)'}</p>
            `;

            if (q.question_type === 'mcq') {
                const choices = q.options_count === 5 ? ['ก','ข','ค','ง','จ'] : ['ก','ข','ค','ง'];
                // ดึง Option จาก Database (ถ้ามี) ถ้าไม่มีก็โชว์ A B C D ปล่าวๆ ไปก่อน
                const textOpts = [q.option_a, q.option_b, q.option_c, q.option_d, q.option_e];
                
                html += `<div class="space-y-3 mt-auto">`;
                choices.forEach((ch, idx) => {
                    const txt = textOpts[idx] || `ตัวเลือกที่ ${ch}`;
                    const isSel = studentAnswers[q.question_number] === ch;
                    html += `
                        <button onclick="selectAnswer(${q.question_number}, '${ch}', 'mcq'); renderCurrentQuestion();" 
                            class="w-full text-left p-4 rounded-xl border-2 transition-all flex items-center gap-4 ${isSel ? 'border-primary bg-blue-50/50 shadow-sm' : 'border-gray-200 hover:border-blue-300 bg-white'}">
                            <span class="w-10 h-10 rounded-full flex items-center justify-center font-bold ${isSel ? 'bg-primary text-white' : 'bg-gray-100 text-gray-500'}">${ch}</span>
                            <span class="text-base font-medium ${isSel ? 'text-primary' : 'text-gray-700'}">${txt}</span>
                        </button>
                    `;
                });
                html += `</div>`;
            } else {
                html += `
                    <div class="mt-auto h-1/2">
                        <textarea onkeyup="inputEssay(${q.question_number}, this.value)" class="w-full h-full p-4 border-2 border-gray-200 rounded-xl focus:border-primary focus:ring-0 outline-none resize-none text-base bg-gray-50 focus:bg-white transition-colors" placeholder="พิมพ์คำอธิบายหรือแสดงวิธีทำที่นี่...">${studentAnswers[q.question_number] || ''}</textarea>
                    </div>
                `;
            }
            area.innerHTML = html;
        }

        function changeQuestion(step) {
            let newIndex = currentQuestionIndex + step;
            if(newIndex >= 0 && newIndex < answerKeys.length) {
                currentQuestionIndex = newIndex;
                renderCurrentQuestion();
            }
        }
        function jumpToQuestion(idx) {
            currentQuestionIndex = idx;
            renderCurrentQuestion();
        }

        // ================== ระบบบันทึกคำตอบ ==================
        function selectAnswer(qNum, choice, type) {
            studentAnswers[qNum] = choice;
            
            // อัปเดต UI (PDF)
            if (examData.exam_type === 'pdf_only') {
                const choices = ['ก','ข','ค','ง','จ'];
                choices.forEach(ch => {
                    const btn = document.getElementById(`opt_${qNum}_${ch}`);
                    if(btn) btn.classList.remove('selected');
                });
                document.getElementById(`opt_${qNum}_${choice}`).classList.add('selected');
            } else {
                // อัปเดตสีปุ่ม Nav
                document.getElementById(`navBtn_${currentQuestionIndex}`).classList.add('answered');
            }
            // Auto-save
            saveAnswerToDB(qNum, choice, null);
        }

        function inputEssay(qNum, text) {
            studentAnswers[qNum] = text;
            if (examData.exam_type !== 'pdf_only') {
                const navBtn = document.getElementById(`navBtn_${currentQuestionIndex}`);
                if(text.trim() !== '') navBtn.classList.add('answered');
                else navBtn.classList.remove('answered');
            }
            // Debounce for text typing would be better, but direct save for simplicity here
            saveAnswerToDB(qNum, null, text); 
        }

        async function saveAnswerToDB(qNum, choice, essayText) {
            // ระบบ Upsert
            await mySupabase.from('student_answers').upsert({
                attempt_id: attemptData.id,
                question_number: qNum,
                selected_choice: choice,
                essay_answer: essayText
            }, { onConflict: 'attempt_id, question_number' });
        }

        // ================== ระบบส่งข้อสอบ ==================
        async function submitExam() {
            // เช็คว่าทำครบไหม
            let missing = [];
            answerKeys.forEach(q => {
                const ans = studentAnswers[q.question_number];
                if(!ans || (typeof ans === 'string' && ans.trim() === '')) missing.push(q.question_number);
            });

            if (missing.length > 0) {
                const res = await Swal.fire({
                    title: 'ยังทำไม่ครบ!',
                    html: `คุณยังไม่ได้ตอบคำถามข้อ: <b class="text-red-500">${missing.join(', ')}</b><br><br>ยืนยันที่จะส่งข้อสอบเลยหรือไม่?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#1d4ed8',
                    cancelButtonColor: '#94a3b8',
                    confirmButtonText: 'ยืนยันส่งข้อสอบ',
                    cancelButtonText: 'กลับไปทำต่อ'
                });
                if(!res.isConfirmed) return;
            } else {
                const res = await Swal.fire({
                    title: 'ยืนยันการส่งข้อสอบ',
                    text: 'ตรวจทานคำตอบเรียบร้อยแล้วใช่หรือไม่?',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#1d4ed8',
                    confirmButtonText: 'ส่งข้อสอบ',
                    cancelButtonText: 'ยกเลิก'
                });
                if(!res.isConfirmed) return;
            }

            processSubmission();
        }

        function autoSubmitExam() {
            Swal.fire({
                title: 'หมดเวลา!',
                text: 'ระบบกำลังส่งข้อสอบของคุณอัตโนมัติ',
                icon: 'info',
                showConfirmButton: false,
                timer: 3000
            });
            processSubmission();
        }

        async function processSubmission() {
            clearInterval(timerInterval);
            document.getElementById('examContainer').innerHTML = '<div class="w-full h-full flex flex-col items-center justify-center"><i class="fas fa-spinner fa-spin text-5xl text-primary mb-4"></i><h2 class="text-2xl font-bold">กำลังประมวลผลคำตอบ...</h2></div>';
            
            // อัปเดตสถานะ Attempt
            await mySupabase.from('exam_attempts').update({
                status: 'submitted',
                submitted_at: new Date().toISOString()
            }).eq('id', attemptData.id);

            // ส่งแจ้งเตือนหาครู
            await mySupabase.from('notifications').insert([{
                user_id: examData.author_id, // สมมติว่าครูคือคนสร้างข้อสอบ
                type: 'exam_submit',
                message: `นักเรียน ${currentUser.full_name} ส่งชุดข้อสอบ "${examData.title}" แล้ว`
            }]);

            Swal.fire({
                title: 'ส่งข้อสอบสำเร็จ!',
                text: 'ระบบได้บันทึกคำตอบของคุณเรียบร้อยแล้ว',
                icon: 'success',
                confirmButtonColor: '#1d4ed8'
            }).then(() => {
                window.location.href = 'student.html';
            });
        }

        initExam();
    </script>
</body>
</html>
