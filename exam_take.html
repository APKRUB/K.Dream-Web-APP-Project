<!DOCTYPE html>
<html lang="th" class="light selection:bg-none select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ระบบทำข้อสอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#2563eb', darkbg: '#0f172a', darkbox: '#1e293b', darkinput: '#334155' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; }
        .watermark { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.08; display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; font-size: 18px; font-weight: bold; color: #000; }
        .strikethrough { text-decoration: line-through; opacity: 0.4; }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-800 dark:text-slate-100 flex flex-col justify-between">

    <div id="watermarkOverlay" class="watermark"></div>

    <!-- Header / Time Bar -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 fixed w-full top-0 z-40 px-6 py-3 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
            <div>
                <h2 id="examTitle" class="font-extrabold text-base text-slate-900 dark:text-white">กำลังทำข้อสอบ...</h2>
                <div id="progressBarText" class="text-xs text-slate-500 dark:text-slate-400">ความคืบหน้า: 0% (0/0 ข้อ)</div>
            </div>

            <!-- สวิตช์สลับมุมมองสำหรับแบบพิมพ์ลงระบบ -->
            <div id="onlineViewToggleBtn" class="hidden flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl gap-1 text-xs">
                <button id="modeSliderBtn" onclick="toggleOnlineViewMode('slider')" class="px-3 py-1.5 rounded-lg font-bold bg-white dark:bg-slate-800 text-primary shadow-sm">ทีละข้อ (Slider)</button>
                <button id="modeScrollBtn" onclick="toggleOnlineViewMode('scroll')" class="px-3 py-1.5 rounded-lg font-bold text-slate-500 hover:text-primary">เลื่อนยาว (Scroll)</button>
            </div>

            <!-- Time Bar -->
            <div class="flex items-center gap-4 w-full md:w-auto">
                <div class="flex-1 md:w-64 bg-slate-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
                    <div id="timeProgressBar" class="bg-primary h-full w-full transition-all duration-1000"></div>
                </div>
                <div id="timeText" class="font-mono font-bold text-sm text-primary min-w-[80px] text-right">00:00</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full pt-28 pb-32 px-4 flex-1">
        
        <!-- Online Form Mode (1 ข้อ/หน้า หรือ หน้ายาว) -->
        <div id="onlineFormCard" class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl space-y-6 relative border border-slate-200 dark:border-slate-700">
            <!-- Single Slider View Container -->
            <div id="singleSliderContainer" class="space-y-6">
                <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-700">
                    <span id="qNumberBadge" class="px-4 py-1.5 bg-blue-50 text-primary dark:bg-blue-950/80 dark:text-blue-300 font-bold rounded-xl text-sm">ข้อที่ 1</span>
                    <button id="flagBtn" onclick="toggleFlagCurrentQuestion()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl text-xs font-bold hover:text-amber-500"><i class="fas fa-flag mr-1"></i> ปักธง</button>
                </div>
                <div id="qTextContent" class="text-base font-semibold leading-relaxed text-slate-900 dark:text-white">กำลังโหลดโจทย์...</div>
                <div id="qImageContent"></div>
                <div id="qOptionsContainer" class="space-y-3 pt-2"></div>
            </div>

            <!-- Scroll View Container -->
            <div id="scrollViewContainer" class="hidden space-y-8"></div>
        </div>

        <!-- PDF Mode Layout (สลับฝั่งเลย์เอาต์ได้) -->
        <div id="pdfCard" class="hidden space-y-4">
            <div class="flex justify-end">
                <button onclick="swapPdfLayout()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md"><i class="fas fa-exchange-alt mr-1"></i> สลับฝั่งเลย์เอาต์ (PDF / กระดาษคำตอบ)</button>
            </div>
            <div id="pdfLayoutGrid" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div id="pdfCol" class="lg:col-span-7 bg-white dark:bg-slate-800 p-4 rounded-3xl shadow-xl h-[650px] border border-slate-200 dark:border-slate-700">
                    <iframe id="pdfIframe" class="w-full h-full rounded-2xl"></iframe>
                </div>
                <div id="omrCol" class="lg:col-span-5 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl space-y-4 max-h-[650px] overflow-y-auto border border-slate-200 dark:border-slate-700">
                    <h3 class="font-bold text-sm text-slate-900 dark:text-white border-b dark:border-slate-700 pb-2">กระดาษฝนคำตอบ OMR</h3>
                    <div id="pdfQuestionsList" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer Nav -->
    <footer class="fixed bottom-0 w-full bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-6 py-4 z-40 shadow-2xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center gap-4">
            <button id="prevBtn" onclick="navigateQuestion(-1)" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs rounded-2xl transition-all"><i class="fas fa-chevron-left mr-1"></i> ย้อนกลับ</button>

            <div id="questionNavigator" class="flex gap-1.5 overflow-x-auto max-w-xs sm:max-w-md py-1"></div>

            <div class="flex gap-2">
                <button id="nextBtn" onclick="navigateQuestion(1)" class="px-5 py-2.5 bg-primary hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-md transition-all">ถัดไป <i class="fas fa-chevron-right ml-1"></i></button>
                <button onclick="confirmSubmitExam()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-2xl shadow-md transition-all"><i class="fas fa-paper-plane mr-1"></i> ส่งข้อสอบ</button>
            </div>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        let currentExam = null;
        let currentQuestions = [];
        let currentAttempt = null;
        let userAnswers = {};
        let currentIndex = 0;
        let timeRemainingSeconds = 0;
        let totalSecondsAllowed = 0;
        let tabSwitchCount = 0;
        let isPdfSwapped = false;
        let onlineViewMode = 'slider';

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            document.getElementById('watermarkOverlay').innerHTML = Array(30).fill(`<div>${session.user.email}</div>`).join('');

            window.addEventListener('blur', () => {
                tabSwitchCount++;
                if (currentAttempt) { mySupabase.from('exam_attempts').update({ tab_switches: tabSwitchCount }).eq('id', currentAttempt.id); }
                Swal.fire({ icon: 'warning', title: 'แจ้งเตือนระบบความปลอดภัย', text: 'ตรวจพบการสลับหน้าจอ!', timer: 2000, showConfirmButton: false });
            });

            await fetchExamAndQuestions();
            await startOrResumeAttempt(session.user.id);
            startTimer();
        }

        async function fetchExamAndQuestions() {
            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            const { data: questions } = await mySupabase.from('exam_questions').select('*, exam_options(*)').eq('exam_id', examId).order('question_number');
            currentExam = exam;
            currentQuestions = questions || [];
            document.getElementById('examTitle').textContent = exam.title;

            if (exam.exam_type === 'pdf') {
                document.getElementById('onlineFormCard').classList.add('hidden');
                document.getElementById('pdfCard').classList.remove('hidden');
                document.getElementById('pdfIframe').src = exam.pdf_url || '';
                renderPdfAnswerSheet();
            } else {
                document.getElementById('onlineViewToggleBtn').classList.remove('hidden');
                renderQuestion(0);
            }
        }

        async function startOrResumeAttempt(userId) {
            const { data: existing } = await mySupabase.from('exam_attempts').select('*').eq('exam_id', examId).eq('student_id', userId).eq('status', 'in_progress').single();

            if (existing) {
                currentAttempt = existing;
                const { data: answers } = await mySupabase.from('exam_answers').select('*').eq('attempt_id', existing.id);
                (answers || []).forEach(a => {
                    userAnswers[a.question_id] = {
                        selected_option_index: a.selected_option_index,
                        subjective_answer: a.subjective_answer,
                        is_flagged: a.is_flagged
                    };
                });
            } else {
                const { data: newAtt } = await mySupabase.from('exam_attempts').insert([{ exam_id: examId, student_id: userId, status: 'in_progress' }]).select().single();
                currentAttempt = newAtt;
            }

            const startTime = new Date(currentAttempt.start_time).getTime();
            totalSecondsAllowed = currentExam.time_limit * 60;
            const elapsedSeconds = Math.floor((new Date().getTime() - startTime) / 1000);
            timeRemainingSeconds = Math.max(0, totalSecondsAllowed - elapsedSeconds);
            updateNavigator();
        }

        function startTimer() {
            const timerInterval = setInterval(() => {
                timeRemainingSeconds--;
                if (timeRemainingSeconds <= 0) { clearInterval(timerInterval); submitExam(); }
                const mins = Math.floor(timeRemainingSeconds / 60);
                const secs = timeRemainingSeconds % 60;
                document.getElementById('timeText').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                document.getElementById('timeProgressBar').style.width = `${(timeRemainingSeconds / totalSecondsAllowed) * 100}%`;
            }, 1000);
        }

        function toggleOnlineViewMode(mode) {
            onlineViewMode = mode;
            const sliderBtn = document.getElementById('modeSliderBtn');
            const scrollBtn = document.getElementById('modeScrollBtn');
            const sliderCont = document.getElementById('singleSliderContainer');
            const scrollCont = document.getElementById('scrollViewContainer');

            if (mode === 'slider') {
                sliderBtn.className = "px-3 py-1.5 rounded-lg font-bold bg-white dark:bg-slate-800 text-primary shadow-sm";
                scrollBtn.className = "px-3 py-1.5 rounded-lg font-bold text-slate-500 hover:text-primary";
                sliderCont.classList.remove('hidden');
                scrollCont.classList.add('hidden');
                renderQuestion(currentIndex);
            } else {
                scrollBtn.className = "px-3 py-1.5 rounded-lg font-bold bg-white dark:bg-slate-800 text-primary shadow-sm";
                sliderBtn.className = "px-3 py-1.5 rounded-lg font-bold text-slate-500 hover:text-primary";
                sliderCont.classList.add('hidden');
                scrollCont.classList.remove('hidden');
                renderScrollView();
            }
        }

        function renderQuestion(idx) {
            currentIndex = idx;
            const q = currentQuestions[idx];
            if (!q) return;

            document.getElementById('qNumberBadge').textContent = `ข้อที่ ${q.question_number} จาก ${currentQuestions.length}`;
            document.getElementById('qTextContent').textContent = q.question_text || '';
            document.getElementById('qImageContent').innerHTML = q.question_image ? `<img src="${q.question_image}" class="max-h-60 rounded-2xl border my-2">` : '';

            const ans = userAnswers[q.id] || {};

            if (q.question_type === 'mcq') {
                const optionsHtml = (q.exam_options || []).map((opt, i) => `
                    <div class="flex flex-col p-4 rounded-2xl border cursor-pointer transition-all ${ans.selected_option_index === i ? 'bg-blue-50 border-primary font-bold text-primary dark:bg-blue-950/60 dark:text-blue-300' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100'}" onclick="selectOption('${q.id}', ${i})">
                        <div class="flex items-center gap-3">
                            <span class="w-7 h-7 rounded-full border flex items-center justify-center text-xs font-bold ${ans.selected_option_index === i ? 'bg-primary text-white' : ''}">${String.fromCharCode(65 + i)}</span>
                            <span class="flex-1 text-sm">${opt.option_text || ''}</span>
                        </div>
                        ${opt.option_image ? `<img src="${opt.option_image}" class="max-h-32 rounded-xl mt-2">` : ''}
                    </div>
                `).join('');
                document.getElementById('qOptionsContainer').innerHTML = optionsHtml;
            } else {
                document.getElementById('qOptionsContainer').innerHTML = `
                    <textarea oninput="saveSubjectiveAnswer('${q.id}', this.value)" class="w-full p-4 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-2xl text-sm text-slate-900 dark:text-slate-100 h-32" placeholder="พิมพ์คำตอบเขียนตอบที่นี่...">${ans.subjective_answer || ''}</textarea>
                `;
            }
            updateNavigator();
        }

        function renderScrollView() {
            const container = document.getElementById('scrollViewContainer');
            container.innerHTML = currentQuestions.map(q => {
                const ans = userAnswers[q.id] || {};
                return `
                    <div class="p-6 bg-slate-50 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                        <div class="font-bold text-sm text-slate-900 dark:text-white">ข้อที่ ${q.question_number}. ${q.question_text || ''}</div>
                        ${q.question_image ? `<img src="${q.question_image}" class="max-h-48 rounded-xl">` : ''}
                        ${q.question_type === 'mcq' ? `
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2">
                                ${(q.exam_options || []).map((opt, i) => `
                                    <div onclick="selectOption('${q.id}', ${i})" class="p-3 rounded-xl border cursor-pointer ${ans.selected_option_index === i ? 'bg-blue-50 border-primary font-bold text-primary dark:bg-blue-950/60 dark:text-blue-300' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200'}">
                                        <div>${String.fromCharCode(65 + i)}. ${opt.option_text || ''}</div>
                                        ${opt.option_image ? `<img src="${opt.option_image}" class="max-h-24 rounded mt-1">` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        ` : `<textarea oninput="saveSubjectiveAnswer('${q.id}', this.value)" class="w-full p-3 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl text-xs h-24 text-slate-900 dark:text-slate-100" placeholder="พิมพ์ตอบ...">${ans.subjective_answer || ''}</textarea>`}
                    </div>
                `;
            }).join('');
        }

        function renderPdfAnswerSheet() {
            const container = document.getElementById('pdfQuestionsList');
            container.innerHTML = currentQuestions.map(q => {
                const ans = userAnswers[q.id] || {};
                if (q.question_type === 'mcq') {
                    const bubbles = (q.exam_options || []).map((opt, i) => `
                        <button onclick="selectOption('${q.id}', ${i})" class="w-7 h-7 rounded-full text-xs font-bold border ${ans.selected_option_index === i ? 'bg-primary text-white border-primary' : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-600'}">
                            ${String.fromCharCode(65 + i)}
                        </button>
                    `).join('');
                    return `<div class="flex justify-between items-center p-2.5 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs"><span class="font-bold text-slate-900 dark:text-white">ข้อ ${q.question_number}</span><div class="flex gap-1.5">${bubbles}</div></div>`;
                } else {
                    return `<div class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 space-y-1"><div class="font-bold text-xs text-slate-900 dark:text-white">ข้อ ${q.question_number} (อัตนัย)</div><textarea oninput="saveSubjectiveAnswer('${q.id}', this.value)" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-xs h-16 text-slate-900 dark:text-slate-100">${ans.subjective_answer || ''}</textarea></div>`;
                }
            }).join('');
        }

        function swapPdfLayout() {
            isPdfSwapped = !isPdfSwapped;
            const grid = document.getElementById('pdfLayoutGrid');
            const pdfCol = document.getElementById('pdfCol');
            const omrCol = document.getElementById('omrCol');

            if (isPdfSwapped) {
                grid.insertBefore(omrCol, pdfCol);
            } else {
                grid.insertBefore(pdfCol, omrCol);
            }
        }

        async function selectOption(qId, optIdx) {
            if (!userAnswers[qId]) userAnswers[qId] = {};
            userAnswers[qId].selected_option_index = optIdx;
            if (currentExam.exam_type === 'pdf') renderPdfAnswerSheet();
            else if (onlineViewMode === 'slider') renderQuestion(currentIndex);
            else renderScrollView();
            autoSaveAnswer(qId);
        }

        async function saveSubjectiveAnswer(qId, text) {
            if (!userAnswers[qId]) userAnswers[qId] = {};
            userAnswers[qId].subjective_answer = text;
            autoSaveAnswer(qId);
        }

        async function autoSaveAnswer(qId) {
            const ans = userAnswers[qId];
            await mySupabase.from('exam_answers').upsert({
                attempt_id: currentAttempt.id,
                question_id: qId,
                selected_option_index: ans.selected_option_index,
                subjective_answer: ans.subjective_answer
            });
            updateProgress();
        }

        function updateNavigator() {
            const nav = document.getElementById('questionNavigator');
            nav.innerHTML = currentQuestions.map((q, i) => {
                const ans = userAnswers[q.id];
                const isDone = ans && (ans.selected_option_index !== undefined || ans.subjective_answer);
                return `<button onclick="renderQuestion(${i})" class="min-w-[32px] h-8 rounded-xl text-xs font-bold ${i === currentIndex ? 'ring-2 ring-primary scale-110' : ''} ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-500 dark:text-slate-300'}">${q.question_number}</button>`;
            }).join('');
            updateProgress();
        }

        function updateProgress() {
            const doneCount = Object.keys(userAnswers).filter(k => userAnswers[k].selected_option_index !== undefined || userAnswers[k].subjective_answer).length;
            const percent = Math.round((doneCount / currentQuestions.length) * 100);
            document.getElementById('progressBarText').textContent = `ความคืบหน้า: ${percent}% (${doneCount}/${currentQuestions.length} ข้อ)`;
        }

        function navigateQuestion(step) {
            const newIdx = currentIndex + step;
            if (newIdx >= 0 && newIdx < currentQuestions.length) renderQuestion(newIdx);
        }

        async function confirmSubmitExam() {
            const unanswered = currentQuestions.filter(q => {
                const a = userAnswers[q.id];
                return !a || (a.selected_option_index === undefined && !a.subjective_answer);
            });

            if (unanswered.length > 0) {
                const nums = unanswered.map(q => `<span class="inline-block bg-red-100 text-red-600 px-2 py-0.5 rounded text-xs font-bold mr-1">ข้อ ${q.question_number}</span>`).join(' ');
                const { isConfirmed } = await Swal.fire({
                    title: 'ยังทำข้อสอบไม่ครบ!',
                    html: `<div class="text-left text-xs space-y-2 text-slate-800 dark:text-slate-100"><p>คุณยังมีข้อสอบที่ยังไม่ได้ทำอีก ${unanswered.length} ข้อ:</p><div class="py-2">${nums}</div><p class="font-bold text-red-500">ยืนยันส่งข้อสอบทันทีหรือไม่?</p></div>`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#ef4444',
                    confirmButtonText: 'ส่งข้อสอบเลย'
                });
                if (isConfirmed) submitExam();
            } else {
                const { isConfirmed } = await Swal.fire({
                    title: 'ยืนยันการส่งข้อสอบ?',
                    text: 'เมื่อส่งแล้ว จะไม่สามารถแก้ไขได้อีก',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    confirmButtonText: 'ยืนยันส่ง'
                });
                if (isConfirmed) submitExam();
            }
        }

        async function submitExam() {
            Swal.fire({ title: 'กำลังบันทึกคะแนน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let totalScore = 0, maxScore = 0;
            currentQuestions.forEach(q => {
                maxScore += q.points;
                const ans = userAnswers[q.id];
                if (q.question_type === 'mcq' && ans && ans.selected_option_index === q.correct_option_index) {
                    totalScore += q.points;
                }
            });

            await mySupabase.from('exam_attempts').update({ score: totalScore, max_score: maxScore, submit_time: new Date().toISOString(), status: 'submitted' }).eq('id', currentAttempt.id);
            Swal.fire({ icon: 'success', title: 'ส่งข้อสอบสำเร็จ!', timer: 1500, showConfirmButton: false });
            setTimeout(() => { window.location.href = `exam_result.html?attempt_id=${currentAttempt.id}`; }, 1600);
        }

        initPage();
    </script>
</body>
</html>
