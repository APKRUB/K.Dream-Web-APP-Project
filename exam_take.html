<!DOCTYPE html>
<html lang="th" class="light select-none">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์สอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }

        .omr-bubble {
            width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.15s ease; border: 2px solid #cbd5e1;
            background-color: #ffffff; color: #334155;
        }
        .dark .omr-bubble { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .omr-bubble.active {
            background-color: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-32" oncontextmenu="return false;">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
                    <i class="fas fa-file-lines"></i>
                </div>
                <div>
                    <h1 id="examTitleNav" class="font-extrabold text-sm text-slate-900 dark:text-white">กำลังโหลดข้อสอบ...</h1>
                    <p id="examSubNav" class="text-[11px] text-slate-500">กรุณารอสักครู่...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="px-4 py-1.5 bg-amber-500/10 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-xl font-mono font-bold text-xs flex items-center gap-1.5">
                    <i class="fas fa-clock animate-pulse"></i>
                    <span id="timerDisplay">--:--</span>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 pt-24 space-y-6">
        
        <div id="previewBanner" class="hidden p-4 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex justify-between items-center text-xs font-bold text-indigo-600 dark:text-indigo-400">
            <span><i class="fas fa-eye mr-1.5"></i> โหมดดูตัวอย่างข้อสอบ (Preview Mode - คะแนนจะไม่ถูกบันทึก)</span>
            <button onclick="window.close()" class="px-3 py-1 bg-indigo-600 text-white rounded-lg">ปิดหน้าต่างนี้</button>
        </div>

        <div id="pdfViewerCard" class="hidden hitech-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-red-600 flex items-center gap-1.5"><i class="fas fa-file-pdf"></i> เอกสารข้อสอบ PDF</h3>
                <a id="downloadPdfLink" href="#" target="_blank" class="px-3 py-1 bg-red-600 text-white rounded-xl text-xs font-bold shadow-sm"><i class="fas fa-external-link-alt mr-1"></i> เปิดไฟล์เต็มจอ</a>
            </div>
            <div class="w-full h-[500px] bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border">
                <iframe id="pdfFrame" src="" class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <div class="hitech-card p-6 rounded-3xl space-y-6">
            <div class="flex justify-between items-center pb-4 border-b border-slate-200 dark:border-slate-800">
                <div>
                    <h2 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fas fa-list-check text-sky-500"></i> กระดาษคำตอบข้อสอบ
                    </h2>
                    <p class="text-xs text-slate-400 mt-0.5">ฝนตัวเลือก OMR หรือพิมพ์คำตอบอัตนัยให้ครบถ้วนก่อนกดส่ง</p>
                </div>
                <button onclick="confirmSubmitExam()" class="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/25 transition-all flex items-center gap-2">
                    <i class="fas fa-paper-plane"></i> ส่งข้อสอบ
                </button>
            </div>

            <div id="questionsListContainer" class="space-y-4">
                <div class="text-center py-10 text-slate-400 text-xs">กำลังโหลดรายการคำถาม...</div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        const isPreview = urlParams.get('preview') === 'true';

        let currentExam = null;
        let currentQuestions = [];
        let studentAnswers = {};
        let timerInterval = null;
        let attemptId = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        function checkStudentAuth() {
            if (isPreview) return true;
            const studentId = localStorage.getItem('student_id') || 
                              localStorage.getItem('user_id') || 
                              localStorage.getItem('user') || 
                              localStorage.getItem('id') ||
                              localStorage.getItem('userId');

            if (!studentId) {
                Swal.fire({
                    icon: 'error',
                    title: 'ยังไม่ได้เข้าสู่ระบบ',
                    text: 'กรุณาเข้าสู่ระบบนักเรียนก่อนทำข้อสอบ',
                    confirmButtonText: 'ไปหน้าเข้าสู่ระบบ',
                    allowOutsideClick: false
                }).then(() => { window.location.href = 'index.html'; });
                return false;
            }
            return true;
        }

        async function initPage() {
            if (!checkStudentAuth()) return;
            if (!examId) {
                Swal.fire('ไม่พบ ID ข้อสอบ', '', 'warning').then(() => window.location.href = 'student.html');
                return;
            }

            if (isPreview) {
                document.getElementById('previewBanner').classList.remove('hidden');
            }

            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (!exam) {
                Swal.fire('ไม่พบชุดข้อสอบนี้', '', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            currentExam = exam;
            document.getElementById('examTitleNav').textContent = exam.title;
            document.getElementById('examSubNav').textContent = `รหัส: ${exam.exam_code || 'ไม่มี'} | เวลาทำ: ${exam.time_limit || 60} นาที`;

            if (exam.pdf_url) {
                const pdfCard = document.getElementById('pdfViewerCard');
                const pdfFrame = document.getElementById('pdfFrame');
                const pdfLink = document.getElementById('downloadPdfLink');
                if (pdfCard && pdfFrame) {
                    pdfCard.classList.remove('hidden');
                    pdfFrame.src = exam.pdf_url;
                    if (pdfLink) pdfLink.href = exam.pdf_url;
                }
            }

            await loadQuestions();

            if (!isPreview) {
                await setupAttempt();
            } else {
                startTimer((exam.time_limit || 60) * 60);
            }
        }

        async function loadQuestions() {
            const { data: qs } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            currentQuestions = qs || [];

            const container = document.getElementById('questionsListContainer');
            if (currentQuestions.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">ยังไม่มีรายการโจทย์ในชุดข้อสอบนี้</div>`;
                return;
            }

            container.innerHTML = currentQuestions.map((q, idx) => {
                const isEssay = q.question_type === 'essay';
                const opts = q.options || ['ก', 'ข', 'ค', 'ง'];

                if (isEssay) {
                    return `
                        <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-extrabold text-sm text-amber-600 dark:text-amber-400">ข้อที่ ${q.question_number || (idx+1)} (อัตนัย)</span>
                                <span class="px-2 py-0.5 bg-amber-500 text-white font-bold text-[10px] rounded-md">เขียนตอบ</span>
                            </div>
                            <div class="text-xs font-semibold text-slate-800 dark:text-slate-200">${q.question_text || q.content || '-'}</div>
                            <textarea oninput="saveEssayAnswer('${q.id}', this.value)" rows="3" class="w-full p-3 bg-white dark:bg-slate-800 border rounded-xl text-xs outline-none" placeholder="พิมพ์คำตอบของคุณที่นี่..."></textarea>
                        </div>
                    `;
                }

                const bubblesHtml = opts.map((cLabel, cIdx) => {
                    const isSelected = studentAnswers[q.id] === String(cIdx) || studentAnswers[q.id] === cLabel;
                    return `
                        <div onclick="selectAnswer('${q.id}', '${cIdx}')" id="bubble-${q.id}-${cIdx}" class="omr-bubble ${isSelected ? 'active' : ''}">
                            ${cLabel}
                        </div>
                    `;
                }).join('');

                return `
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-sm text-sky-600 dark:text-sky-400">ข้อที่ ${q.question_number || (idx+1)}</span>
                            ${q.category_tag ? `<span class="px-2 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-600 font-bold text-[10px]">${q.category_tag}</span>` : ''}
                        </div>
                        ${q.image_url ? `<div><img src="${q.image_url}" class="max-h-40 rounded-xl border"></div>` : ''}
                        <div class="text-xs font-semibold text-slate-800 dark:text-slate-200">${q.question_text || q.content || 'ฝนคำตอบ OMR ด้านล่าง'}</div>
                        <div class="flex flex-wrap gap-3 pt-1">${bubblesHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function selectAnswer(qId, cIdx) {
            studentAnswers[qId] = String(cIdx);
            
            // อัปเดต UI วงกลม OMR ทันที
            const qObj = currentQuestions.find(q => q.id === qId);
            if (qObj && qObj.options) {
                qObj.options.forEach((_, i) => {
                    const bubble = document.getElementById(`bubble-${qId}-${i}`);
                    if (bubble) {
                        if (String(i) === String(cIdx)) {
                            bubble.classList.add('active');
                        } else {
                            bubble.classList.remove('active');
                        }
                    }
                });
            }
        }

        function saveEssayAnswer(qId, val) {
            studentAnswers[qId] = val;
        }

        async function setupAttempt() {
            const studentId = localStorage.getItem('student_id') || 
                              localStorage.getItem('user_id') || 
                              localStorage.getItem('user') || 
                              localStorage.getItem('id') ||
                              localStorage.getItem('userId');

            // สร้าง Record ใน exam_attempts
            const { data, error } = await mySupabase.from('exam_attempts').insert([{
                exam_id: examId,
                student_id: studentId,
                status: 'in_progress',
                max_score: currentQuestions.length
            }]).select().single();

            if (error || !data) {
                Swal.fire('เริ่มต้นทำข้อสอบไม่สำเร็จ', error?.message || '', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            attemptId = data.id;
            startTimer((currentExam.time_limit || 60) * 60);
        }

        function startTimer(durationInSeconds) {
            let timer = durationInSeconds;
            const display = document.getElementById('timerDisplay');

            timerInterval = setInterval(() => {
                const minutes = parseInt(timer / 60, 10);
                const seconds = parseInt(timer % 60, 10);

                display.textContent = `${minutes < 10 ? '0' + minutes : minutes}:${seconds < 10 ? '0' + seconds : seconds}`;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    Swal.fire({
                        icon: 'warning',
                        title: 'หมดเวลาทำข้อสอบ!',
                        text: 'ระบบกำลังส่งคำตอบของคุณโดยอัตโนมัติ',
                        allowOutsideClick: false,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => submitExam(true));
                }
            }, 1000);
        }

        async function confirmSubmitExam() {
            const res = await Swal.fire({
                title: 'ยืนยันการส่งข้อสอบ?',
                text: 'เมื่อส่งแล้วจะไม่สามารถกลับมาแก้ไขคำตอบได้อีก',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันส่งข้อสอบ',
                cancelButtonText: 'ตรวจสอบอีกครั้ง'
            });

            if (res.isConfirmed) {
                submitExam(false);
            }
        }

        async function submitExam(isTimeout = false) {
            if (timerInterval) clearInterval(timerInterval);

            if (isPreview) {
                Swal.fire('ส่งข้อสอบจำลองสำเร็จ', 'นี่คือโหมด Preview คะแนนไม่ถูกบันทึก', 'success').then(() => window.close());
                return;
            }

            Swal.fire({
                title: 'กำลังประมวลผลคำตอบ...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            let totalScore = 0;

            for (const q of currentQuestions) {
                const studentAns = studentAnswers[q.id];
                const isEssay = q.question_type === 'essay';
                let isCorrect = false;
                let qScore = 0;

                if (!isEssay) {
                    if (String(studentAns) === String(q.correct_answer)) {
                        isCorrect = true;
                        qScore = 1;
                        totalScore += 1;
                    }
                }

                await mySupabase.from('exam_answers').insert([{
                    attempt_id: attemptId,
                    question_id: q.id,
                    selected_option_index: !isEssay ? (studentAns !== undefined ? parseInt(studentAns) : null) : null,
                    subjective_answer: isEssay ? (studentAns || '') : null,
                    score: qScore
                }]);
            }

            await mySupabase.from('exam_attempts').update({
                status: 'submitted',
                score: totalScore,
                submit_time: new Date().toISOString()
            }).eq('id', attemptId);

            Swal.fire({
                icon: 'success',
                title: 'ส่งข้อสอบสำเร็จ!',
                text: `คะแนนของคุณ: ${totalScore} / ${currentQuestions.length}`,
                confirmButtonText: 'ดูผลการสอบและเฉลย',
                allowOutsideClick: false
            }).then(() => {
                window.location.href = `exam_result.html?attempt_id=${attemptId}`;
            });
        }

        initPage();
    </script>
</body>
</html>
