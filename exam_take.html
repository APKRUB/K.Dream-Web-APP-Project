<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ทำข้อสอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .omr-bubble-student {
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; cursor: pointer; transition: all 0.15s ease; border: 2px solid #cbd5e1;
            background-color: #ffffff; color: #334155;
        }
        .dark .omr-bubble-student { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .omr-bubble-student.selected {
            background-color: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-24">

    <!-- Sticky Header พร้อม Timer ถอยหลัง -->
    <header class="fixed top-0 left-0 w-full z-40 bg-white/90 dark:bg-darkbox/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 id="examTitle" class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">กำลังโหลดชุดข้อสอบ...</h1>
                <p id="examCodeSub" class="text-[11px] text-slate-400 font-mono">CODE: -</p>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- ตัวจับเวลา -->
                <div class="px-4 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 font-bold text-xs flex items-center gap-2">
                    <i class="fas fa-hourglass-half animate-spin"></i>
                    <span>เวลาที่เหลือ: <strong id="timerDisplay" class="font-mono text-sm">--:--</strong></span>
                </div>
                
                <button onclick="confirmSubmitExam()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                    ส่งข้อสอบ
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-24 space-y-6">
        
        <!-- แจ้งเตือน Anti-Cheat Tab Switch -->
        <div id="cheatWarningBox" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-xs text-red-600 dark:text-red-400 font-bold flex items-center gap-2">
            <i class="fas fa-triangle-exclamation"></i>
            <span>ตรวจพบการสลับหน้าจอ / ออกนอกแท็บ (<span id="cheatCount">0</span> ครั้ง)! กรุณาโฟกัสหน้าข้อสอบ</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- ส่วนแสดงโจทย์ PDF หรือออนไลน์ -->
            <div id="questionArea" class="lg:col-span-7 space-y-4">
                <div class="p-5 bg-white dark:bg-darkbox rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                    <h3 class="font-bold text-sm text-sky-600 dark:text-sky-400"><i class="fas fa-file-pdf mr-1"></i> โจทย์ข้อสอบ (PDF / Online)</h3>
                    <div id="pdfViewerContainer" class="w-full h-[550px] bg-slate-100 dark:bg-slate-900 rounded-xl flex items-center justify-center text-slate-400 text-xs">
                        กำลังโหลดไฟล์โจทย์...
                    </div>
                </div>
            </div>

            <!-- ส่วนกระดาษคำตอบ OMR / ตอบคำถาม -->
            <div class="lg:col-span-5 space-y-4">
                <div class="p-5 bg-white dark:bg-darkbox rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
                    <div class="flex justify-between items-center border-b pb-2 dark:border-slate-800">
                        <h3 class="font-bold text-sm flex items-center gap-2"><i class="fas fa-check-double text-sky-500"></i> กระดาษคำตอบ OMR</h3>
                        <span id="answeredCount" class="text-xs text-slate-400 font-semibold">ตอบแล้ว 0/0 ข้อ</span>
                    </div>

                    <div id="studentOmrContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                        <div class="text-center py-10 text-slate-400 text-xs">กำลังโหลดชุดคำถาม...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        const isPreview = urlParams.get('preview') === 'true';

        let examData = null;
        let questionsData = [];
        let studentAnswers = {}; // เก็บคำตอบ { question_id: choice_index }
        let timerInterval = null;
        let timeRemainingSeconds = 0;
        let tabSwitchCount = 0;

        async function initExamTake() {
            if (!examId) {
                Swal.fire('ไม่พบ ID ข้อสอบ', '', 'error').then(() => window.location.href = 'index.html');
                return;
            }

            // โหลดข้อมูลข้อสอบ
            const { data: exam, error } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (error || !exam) {
                Swal.fire('ไม่พบชุดข้อสอบนี้ในระบบ', '', 'error');
                return;
            }
            examData = exam;

            document.getElementById('examTitle').textContent = exam.title;
            document.getElementById('examCodeSub').textContent = `CODE: ${exam.exam_code || 'EXAM'} | เวลาทำ: ${exam.time_limit || 60} นาที`;

            // เช็กสถานะ Due Date / Countdown (ถ้าไม่ใช่โหมด Preview)
            if (!isPreview) {
                const now = new Date();
                if (exam.status === 'countdown' && exam.start_time && new Date(exam.start_time) > now) {
                    Swal.fire('ยังไม่ถึงเวลาเปิดสอบ', `ข้อสอบจะเปิดให้ทำในวันที่ ${new Date(exam.start_time).toLocaleString('th-TH')}`, 'warning')
                        .then(() => window.close());
                    return;
                }
                if (exam.due_date && new Date(exam.due_date) < now && exam.due_date_policy === 'strict') {
                    Swal.fire('หมดเวลาทำข้อสอบแล้ว (Due Date)', 'เลยกำหนดเวลาส่งข้อสอบแบบเข้มงวด', 'error')
                        .then(() => window.close());
                    return;
                }
            }

            // โหลดคำถาม
            const { data: qList } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            questionsData = qList || [];

            // โหลดคำตอบเดิมจาก LocalStorage (Auto-Save Recovery)
            const savedAns = localStorage.getItem(`exam_ans_${examId}`);
            if (savedAns) {
                try { studentAnswers = JSON.parse(savedAns); } catch(e) {}
            }

            // แสดง PDF หรือโจทย์ออนไลน์
            const pdfContainer = document.getElementById('pdfViewerContainer');
            if (exam.pdf_url) {
                pdfContainer.innerHTML = `<iframe src="${exam.pdf_url}" class="w-full h-full rounded-xl border-0"></iframe>`;
            } else {
                pdfContainer.innerHTML = `<div class="text-xs text-slate-400">ชุดข้อสอบนี้ใช้รูปแบบโจทย์ออนไลน์ (ดูโจทย์จากระบบ)</div>`;
            }

            renderStudentOmr();
            startExamTimer((exam.time_limit || 60) * 60);
            initAntiCheatListener();
        }

        // ระบบจับเวลาถอยหลัง & Auto Submit
        function startExamTimer(totalSeconds) {
            timeRemainingSeconds = totalSeconds;
            timerInterval = setInterval(() => {
                timeRemainingSeconds--;
                if (timeRemainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    autoSubmitExamTimeUp();
                    return;
                }
                const m = Math.floor(timeRemainingSeconds / 60);
                const s = timeRemainingSeconds % 60;
                document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function renderStudentOmr() {
            const container = document.getElementById('studentOmrContainer');
            if (questionsData.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">ยังไม่มีรายการโจทย์ในชุดนี้</div>`;
                return;
            }

            container.innerHTML = questionsData.map((q, idx) => {
                const isEssay = q.question_type === 'essay';
                const opts = q.options || ['ก', 'ข', 'ค', 'ง'];
                const qNum = q.question_number || (idx + 1);

                if (isEssay) {
                    const currentEssayVal = studentAnswers[q.id] || '';
                    return `
                        <div class="p-3 bg-amber-500/10 rounded-xl space-y-2 border border-amber-500/30">
                            <div class="flex justify-between items-center text-xs font-bold text-amber-600">
                                <span>ข้อที่ ${qNum} (อัตนัย)</span>
                            </div>
                            <textarea rows="3" oninput="saveStudentAnswer('${q.id}', this.value)" class="w-full p-2.5 bg-white dark:bg-slate-900 border rounded-lg text-xs outline-none" placeholder="พิมพ์คำตอบข้อเขียนของคุณที่นี่...">${currentEssayVal}</textarea>
                        </div>
                    `;
                }

                const bubblesHtml = opts.map((optLabel, optIdx) => {
                    const isSelected = String(studentAnswers[q.id]) === String(optIdx);
                    return `<div onclick="selectStudentChoice('${q.id}', '${optIdx}')" class="omr-bubble-student ${isSelected ? 'selected' : ''}">${optLabel}</div>`;
                }).join('');

                return `
                    <div class="p-3 bg-slate-100 dark:bg-slate-900/80 rounded-xl flex items-center justify-between gap-2 border border-slate-200 dark:border-slate-800">
                        <span class="font-extrabold text-xs text-slate-800 dark:text-slate-200 w-12">ข้อ ${qNum}</span>
                        <div class="flex gap-2">${bubblesHtml}</div>
                    </div>
                `;
            }).join('');

            updateAnsweredStats();
        }

        // บันทึกคำตอบลง LocalStorage (Auto-Save)
        function selectStudentChoice(qId, choiceIdx) {
            studentAnswers[qId] = choiceIdx;
            localStorage.setItem(`exam_ans_${examId}`, JSON.stringify(studentAnswers));
            renderStudentOmr();
        }

        function saveStudentAnswer(qId, textVal) {
            studentAnswers[qId] = textVal;
            localStorage.setItem(`exam_ans_${examId}`, JSON.stringify(studentAnswers));
            updateAnsweredStats();
        }

        function updateAnsweredStats() {
            const answeredCount = Object.keys(studentAnswers).filter(k => studentAnswers[k] !== undefined && studentAnswers[k] !== '').length;
            document.getElementById('answeredCount').textContent = `ตอบแล้ว ${answeredCount}/${questionsData.length} ข้อ`;
        }

        // ระบบป้องกันการโกง: นับจำนวนครั้งการสลับแท็บ
        function initAntiCheatListener() {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && !isPreview) {
                    tabSwitchCount++;
                    document.getElementById('cheatCount').textContent = tabSwitchCount;
                    document.getElementById('cheatWarningBox').classList.remove('hidden');
                }
            });
        }

        function confirmSubmitExam() {
            Swal.fire({
                title: 'ยืนยันการส่งข้อสอบ?',
                text: 'เมื่อส่งแล้วจะไม่สามารถกลับมาแก้ไขคำตอบได้อีก',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันส่งข้อสอบ',
                cancelButtonText: 'ตรวจสอบอีกครั้ง'
            }).then(res => {
                if (res.isConfirmed) submitExamProcess();
            });
        }

        function autoSubmitExamTimeUp() {
            Swal.fire({
                title: 'หมดเวลาทำข้อสอบ!',
                text: 'ระบบกำลังทำการส่งข้อสอบอัตโนมัติ',
                icon: 'warning',
                timer: 2000,
                showConfirmButton: false
            }).then(() => submitExamProcess());
        }

        async function submitExamProcess() {
            clearInterval(timerInterval);
            localStorage.removeItem(`exam_ans_${examId}`);
            Swal.fire({ title: 'ส่งข้อสอบสำเร็จ!', icon: 'success', text: 'บันทึกคะแนนและคำตอบลงระบบเรียบร้อยแล้ว' })
                .then(() => window.close());
        }

        initExamTake();
    </script>
</body>
</html>
