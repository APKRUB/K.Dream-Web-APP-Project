<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ทำแบบทดสอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.9); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-20">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='student.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all"><i class="fas fa-arrow-left text-sm"></i></button>
                <div>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white" id="examTitleNav">กำลังโหลดข้อสอบ...</h1>
                    <p class="text-[11px] text-slate-500">ระบบสอบออนไลน์ระบบปิด Hi-Tech</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="px-4 py-2 bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-900 rounded-2xl flex items-center gap-2 text-amber-600 dark:text-amber-400 font-mono font-bold text-sm shadow-sm">
                    <i class="far fa-clock"></i> <span id="timerDisplay">--:--</span>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput border border-slate-200 dark:border-slate-800"><i class="fas fa-moon text-sm" id="themeIcon"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pt-24 space-y-6">
        <div id="questionsContainer" class="space-y-6">
            <div class="text-center py-16 text-slate-400 text-xs">กำลังโหลดชุดข้อสอบ...</div>
        </div>

        <div class="flex justify-end pt-4">
            <button onclick="confirmSubmitExam()" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-emerald-500/25 transition-all flex items-center gap-2">
                <i class="fas fa-paper-plane"></i> ส่งคำตอบและสิ้นสุดการสอบ
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        // รองรับทั้งพารามิเตอร์ชื่อ exam_id และ id เพื่อความครอบคลุม
        const examId = urlParams.get('exam_id') || urlParams.get('id');
        let attemptId = null;
        let questionsData = [];
        let timerInterval = null;
        let timeLeftSeconds = 0;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initExam() {
            if (!examId) {
                Swal.fire('ไม่พบรหัสข้อสอบ', 'กรุณากลับไปเลือกชุดข้อสอบใหม่อีกครั้ง', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            const studentId = localStorage.getItem('id') || localStorage.getItem('user_id') || 'guest_student';

            // ดึงข้อมูลชุดข้อสอบ
            const { data: exam, error: examErr } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (examErr || !exam) {
                Swal.fire('ไม่พบข้อมูลชุดข้อสอบ', 'ชุดข้อสอบนี้อาจถูกลบหรือไม่มีอยู่ในระบบ', 'error').then(() => window.location.href = 'student.html');
                return;
            }

            document.getElementById('examTitleNav').textContent = exam.title;
            timeLeftSeconds = (exam.time_limit || 60) * 60;

            // ตรวจสอบว่ามี Attempt ที่ค้างอยู่ (in_progress) หรือไม่
            let { data: existingAttempt } = await mySupabase.from('exam_attempts').select('*').eq('exam_id', examId).eq('student_id', studentId).eq('status', 'in_progress').single();

            // หากไม่มี ให้สร้าง Attempt ใหม่ทันที
            if (!existingAttempt) {
                const { data: newAtt, error } = await mySupabase.from('exam_attempts').insert([{
                    exam_id: examId,
                    student_id: studentId,
                    status: 'in_progress',
                    score: 0
                }]).select().single();

                if (error) {
                    Swal.fire('ไม่สามารถเริ่มทำข้อสอบได้', error.message, 'error').then(() => window.location.href = 'student.html');
                    return;
                }
                attemptId = newAtt.id;
            } else {
                attemptId = existingAttempt.id;
            }

            // โหลดคำถาม
            const { data: questions } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            questionsData = questions || [];

            renderQuestions();
            startTimer();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            if (questionsData.length === 0) {
                container.innerHTML = `<div class="hitech-card p-8 rounded-3xl text-center text-slate-400 text-xs">ชุดข้อสอบนี้ยังไม่มีคำถามในระบบ</div>`;
                return;
            }

            container.innerHTML = questionsData.map((q, idx) => {
                const qNum = q.question_number || (idx + 1);
                const opts = q.options || ['ตัวเลือก 1', 'ตัวเลือก 2', 'ตัวเลือก 3', 'ตัวเลือก 4'];

                return `
                    <div class="hitech-card p-6 rounded-3xl space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="px-3 py-1 bg-sky-100 dark:bg-sky-950 text-sky-600 dark:text-sky-300 font-bold text-xs rounded-full">ข้อที่ ${qNum} (${q.category_tag || 'ทั่วไป'})</span>
                            <span class="text-xs text-slate-400 font-semibold">คะแนน: 1 คะแนน</span>
                        </div>

                        ${q.image_url ? `<div><img src="${q.image_url}" class="max-h-60 rounded-2xl border"></div>` : ''}

                        <div class="text-sm font-semibold text-slate-800 dark:text-slate-200 leading-relaxed">
                            ${q.question_text || q.content || ''}
                        </div>

                        <div class="grid grid-cols-1 gap-2 pt-2">
                            ${opts.map((opt, optIdx) => `
                                <label class="p-3.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-sky-500 transition-all">
                                    <input type="radio" name="q_${q.id}" value="${optIdx}" onchange="saveAnswer('${q.id}',${optIdx})" class="w-4 h-4 text-sky-600">
                                    <span class="font-bold text-xs text-slate-600 dark:text-slate-300">${String.fromCharCode(65 + optIdx)}.</span>
                                    <span class="text-xs text-slate-700 dark:text-slate-200">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function saveAnswer(questionId, optionIndex) {
            if (!attemptId) return;
            await mySupabase.from('exam_answers').upsert({
                attempt_id: attemptId,
                question_id: questionId,
                selected_option_index: optionIndex,
                selected_answer: String(optionIndex)
            }, { onConflict: 'attempt_id,question_id' });
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeftSeconds <= 0) {
                    clearInterval(timerInterval);
                    Swal.fire({ title: 'หมดเวลาสอบ!', text: 'ระบบกำลังส่งคำตอบอัตโนมัติ', icon: 'warning', timer: 2000, showConfirmButton: false }).then(() => submitExamFinal());
                    return;
                }
                timeLeftSeconds--;
                const m = Math.floor(timeLeftSeconds / 60);
                const s = timeLeftSeconds % 60;
                document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function confirmSubmitExam() {
            Swal.fire({
                title: 'ยืนยันการส่งข้อสอบ?',
                text: 'เมื่อส่งแล้วจะไม่สามารถกลับมาแก้ไขคำตอบได้อีก',
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันส่งข้อสอบ',
                cancelButtonText: 'ตรวจสอบอีกครั้ง'
            }).then((res) => {
                if (res.isConfirmed) submitExamFinal();
            });
        }

        async function submitExamFinal() {
            clearInterval(timerInterval);
            Swal.fire({ title: 'กำลังประมวลผลคะแนน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { data: answers } = await mySupabase.from('exam_answers').select('*').eq('attempt_id', attemptId);
            
            let totalScore = 0;
            questionsData.forEach(q => {
                const ans = (answers || []).find(a => a.question_id === q.id);
                if (ans && String(ans.selected_option_index) === String(q.correct_answer)) {
                    totalScore += 1;
                }
            });

            const submitPayload = {
                status: 'submitted',
                score: totalScore,
                submission_time: new Date().toISOString()
            };

            const { error } = await mySupabase.from('exam_attempts').update(submitPayload).eq('id', attemptId);

            if (error) {
                Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                return;
            }

            Swal.fire({
                icon: 'success',
                title: 'ส่งข้อสอบสำเร็จ!',
                text: `คุณทำคะแนนได้ ${totalScore} คะแนน`,
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = `student_results.html?attempt_id=${attemptId}`;
            });
        }

        initExam();
    </script>
</body>
</html>
