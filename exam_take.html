<!DOCTYPE html>
<html lang="th" class="light select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์สอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- INSTANT AUTH GUARD -->
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('student_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; -webkit-user-select: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.95); border-bottom: 1px solid rgba(30, 41, 59, 0.8); }
        .hitech-card { background: rgba(255, 255, 255, 0.98); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .dark .hitech-card { background: #090d16; border: 1px solid rgba(30, 41, 59, 0.8); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
        .omr-bubble-compact { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; cursor: pointer; border: 2px solid #cbd5e1; background-color: #ffffff; color: #334155; }
        .dark .omr-bubble-compact { border-color: #334155; background-color: #0f172a; color: #94a3b8; }
        .omr-bubble-compact.active { background-color: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-16" oncontextmenu="return false;">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-sm shadow-md"><i class="fas fa-file-lines"></i></div>
                <div>
                    <h1 id="examTitleNav" class="font-extrabold text-sm text-slate-900 dark:text-white">กำลังโหลดข้อสอบ...</h1>
                    <p id="examSubNav" class="text-[11px] text-slate-500">กรุณารอสักครู่...</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="px-4 py-1.5 bg-amber-500/10 text-amber-600 border border-amber-500/30 rounded-xl font-mono font-bold text-xs flex items-center gap-1.5"><i class="fas fa-clock animate-pulse"></i><span id="timerDisplay">--:--</span></div>
            </div>
        </div>
    </nav>

    <main class="max-w-[96rem] mx-auto px-4 pt-24 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <div id="pdfViewerCard" class="hidden lg:col-span-8 hitech-card p-4 rounded-3xl space-y-3 sticky top-24">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs text-red-600 flex items-center gap-1.5"><i class="fas fa-file-pdf"></i> เอกสารข้อสอบ (ห้ามดาวน์โหลด)</h3>
                </div>
                <div id="pdfContainer" class="w-full h-[78vh] bg-slate-100 dark:bg-slate-900 rounded-2xl overflow-y-auto border p-4 flex flex-col items-center gap-4"></div>
            </div>

            <div id="rightAnswerCard" class="lg:col-span-4 hitech-card p-5 rounded-3xl space-y-5">
                <div class="flex justify-between items-center pb-3 border-b border-slate-200 dark:border-slate-800">
                    <h2 class="font-bold text-sm flex items-center gap-1.5"><i class="fas fa-list-check text-sky-500"></i> กระดาษคำตอบ</h2>
                    <button onclick="confirmSubmitExam()" class="px-4 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-md"><i class="fas fa-paper-plane mr-1"></i> ส่งข้อสอบ</button>
                </div>
                <div id="questionsListContainer" class="space-y-3"><div class="text-center py-10 text-slate-400 text-xs">กำลังโหลดข้อสอบ...</div></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        let currentExam = null, currentQuestions = [], studentAnswers = {}, flaggedQuestions = {}, timerInterval = null, currentRemainingSeconds = 0;

        async function getValidatedStudentId() {
            let studentId = localStorage.getItem('id') || localStorage.getItem('student_id') || localStorage.getItem('user_id');
            if (!studentId || studentId === '00000000-0000-0000-0000-000000000000') {
                try {
                    const { data: { session } } = await mySupabase.auth.getSession();
                    if (session && session.user) studentId = session.user.id;
                } catch(e) {}
            }
            return studentId;
        }

        async function initPage() {
            const studentId = await getValidatedStudentId();
            if (!studentId) { window.location.replace('index.html'); return; }
            if (!examId) { window.location.href = 'student.html'; return; }

            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (!exam) { window.location.href = 'student.html'; return; }

            currentExam = exam;
            document.getElementById('examTitleNav').textContent = exam.title;
            document.getElementById('examSubNav').textContent = `รหัส: ${exam.exam_code || 'ไม่มี'} | เวลา: ${exam.time_limit || 60} นาที`;

            if (exam.pdf_url) {
                document.getElementById('pdfViewerCard').classList.remove('hidden');
                document.getElementById('rightAnswerCard').className = 'lg:col-span-4 hitech-card p-5 rounded-3xl space-y-5';
                renderSecurePDF(exam.pdf_url);
            }
            await loadQuestions();

            const timerKey = `exam_start_time_${examId}`;
            let startTime = localStorage.getItem(timerKey);
            if (!startTime) { startTime = Date.now(); localStorage.setItem(timerKey, startTime); }
            startPersistentTimer(parseInt(startTime, 10), (exam.time_limit || 60) * 60);
        }

        async function renderSecurePDF(url) {
            const container = document.getElementById('pdfContainer');
            try {
                const pdfDoc = await pdfjsLib.getDocument(url).promise;
                container.innerHTML = '';
                for (let p = 1; p <= pdfDoc.numPages; p++) {
                    const page = await pdfDoc.getPage(p);
                    const viewport = page.getViewport({ scale: 2.5 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    canvas.style.width = '100%'; canvas.className = 'shadow rounded bg-white mb-4';
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    container.appendChild(canvas);
                }
            } catch(e) { container.innerHTML = `<div class="text-red-500 text-xs">โหลด PDF ไม่สำเร็จ</div>`; }
        }

        async function loadQuestions() {
            const { data } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number');
            currentQuestions = data || [];
            renderQuestionsContainer();
        }

        function renderQuestionsContainer() {
            const container = document.getElementById('questionsListContainer');
            if (!currentQuestions.length) { container.innerHTML = `<div class="text-center text-xs text-slate-400">ไม่มีข้อสอบ</div>`; return; }
            container.innerHTML = currentQuestions.map((q, idx) => {
                const qNum = q.question_number || (idx + 1);
                const opts = q.options || ['ก', 'ข', 'ค', 'ง'];
                const isSelected = studentAnswers[q.id];
                if (q.question_type === 'essay') {
                    return `<div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl space-y-2"><div class="font-bold text-xs text-amber-600">ข้อ ${qNum} (อัตนัย)</div><div class="text-xs">${q.question_text || ''}</div><textarea oninput="studentAnswers['${q.id}'] = this.value" rows="2" class="w-full p-2 border rounded text-xs">${studentAnswers[q.id] || ''}</textarea></div>`;
                }
                return `<div id="q-box-${q.id}" class="p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl flex items-center justify-between"><span class="font-bold text-xs text-sky-600">ข้อ ${qNum}</span><div class="flex gap-1.5">${opts.map((lbl, i) => `<div onclick="selectAnswer('${q.id}', '${i}')" id="bubble-${q.id}-${i}" class="omr-bubble-compact ${isSelected === String(i) ? 'active' : ''}">${lbl}</div>`).join('')}</div></div>`;
            }).join('');
        }

        function selectAnswer(qId, cIdx) {
            studentAnswers[qId] = String(cIdx);
            currentQuestions.find(q => q.id === qId)?.options?.forEach((_, i) => {
                document.getElementById(`bubble-${qId}-${i}`)?.classList.toggle('active', i === parseInt(cIdx));
            });
        }

        function startPersistentTimer(startTime, duration) {
            const display = document.getElementById('timerDisplay');
            timerInterval = setInterval(() => {
                const remaining = duration - Math.floor((Date.now() - startTime) / 1000);
                currentRemainingSeconds = remaining > 0 ? remaining : 0;
                if (remaining <= 0) { clearInterval(timerInterval); submitExam(true); return; }
                display.textContent = `${Math.floor(remaining / 60).toString().padStart(2,'0')}:${(remaining % 60).toString().padStart(2,'0')}`;
            }, 1000);
        }

        async function confirmSubmitExam() {
            const res = await Swal.fire({ title: 'ยืนยันการส่งข้อสอบ?', icon: 'question', showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ทำต่อ' });
            if (res.isConfirmed) submitExam(false);
        }

        async function submitExam(isTimeout) {
            if (timerInterval) clearInterval(timerInterval);
            localStorage.removeItem(`exam_start_time_${examId}`);
            const studentId = await getValidatedStudentId();
            if (!studentId) { window.location.replace('index.html'); return; }

            Swal.fire({ title: 'กำลังบันทึกคะแนน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let totalScore = 0;
            currentQuestions.forEach(q => { if (q.question_type !== 'essay' && String(studentAnswers[q.id]) === String(q.correct_answer)) totalScore++; });

            const { data: attempt, error } = await mySupabase.from('exam_attempts').insert([{ exam_id: examId, student_id: studentId, status: 'submitted', total_score: totalScore, remaining_time: currentRemainingSeconds }]).select().single();
            if (error || !attempt) { Swal.fire('เกิดข้อผิดพลาด', error?.message || '', 'error'); return; }

            for (const q of currentQuestions) {
                await mySupabase.from('exam_answers').insert([{ attempt_id: attempt.id, question_id: q.id, score: q.question_type !== 'essay' && String(studentAnswers[q.id]) === String(q.correct_answer) ? 1 : 0, selected_option_index: q.question_type !== 'essay' ? parseInt(studentAnswers[q.id]) || null : null, subjective_answer: q.question_type === 'essay' ? studentAnswers[q.id] || '' : null }]);
            }

            Swal.fire({ icon: 'success', title: 'ส่งข้อสอบสำเร็จ!', text: `คะแนนของคุณ: ${totalScore} / ${currentQuestions.length}`, confirmButtonText: 'ดูผลสอบ' }).then(() => { window.location.href = `student_result.html?attempt_id=${attempt.id}`; });
        }

        initPage();
    </script>
</body>
</html>
