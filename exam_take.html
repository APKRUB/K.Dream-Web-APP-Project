<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ห้องสอบออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#0284c7', darkbg: '#050811', darkbox: '#0f172a' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; user-select: none; }
        .cut-through { text-decoration: line-through; opacity: 0.4; }
        .glass-top { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #0f172a !important; color: #f8fafc !important; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">

    <!-- Sticky Exam Topbar (Time Bar & Progress Bar) -->
    <header class="glass-top fixed top-0 left-0 right-0 z-50 text-white shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 id="examTitle" class="font-black text-sm md:text-base leading-tight">ห้องสอบออนไลน์</h1>
                <p id="examSub" class="text-[10px] text-sky-300">กำลังโหลดโจทย์...</p>
            </div>

            <!-- Time Bar & Progress Bar Indicator -->
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block">
                    <div class="text-[10px] text-slate-400 font-bold uppercase">ความคืบหน้า</div>
                    <div id="progressText" class="text-xs font-black text-emerald-400">0 / 0 ข้อ (0%)</div>
                </div>
                <div class="flex items-center gap-2 bg-slate-800/80 px-3.5 py-1.5 rounded-2xl border border-sky-500/30">
                    <i class="fas fa-clock text-amber-400 animate-pulse text-sm"></i>
                    <span id="timerDisplay" class="font-mono font-extrabold text-sm text-amber-300">00:00:00</span>
                </div>
                <button onclick="confirmSubmitExam()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl shadow-lg transition-all">
                    <i class="fas fa-paper-plane mr-1"></i> ส่งข้อสอบ
                </button>
            </div>
        </div>

        <!-- Visual Progress Bar Line -->
        <div class="w-full bg-slate-800 h-1.5">
            <div id="progressBarLine" class="bg-gradient-to-r from-sky-500 to-emerald-400 h-1.5 w-0 transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Exam Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 pt-24 pb-12 flex flex-col gap-4">
        
        <!-- Controls: Layout Switcher & View Modes -->
        <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-3 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 text-xs">
            <div class="flex gap-2">
                <button id="btnViewSplit" onclick="switchExamView('split')" class="px-3 py-1.5 rounded-xl font-bold bg-sky-600 text-white"><i class="fas fa-columns mr-1"></i> PDF + ตอบคำตอบ</button>
                <button id="btnViewSingle" onclick="switchExamView('single')" class="px-3 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-list-ul mr-1"></i> เลื่อนทำทีละข้อ</button>
                <button id="btnViewStep" onclick="switchExamView('step')" class="px-3 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200"><i class="fas fa-forward-step mr-1"></i> ทำทีละข้อ (One-by-One)</button>
            </div>
            <div class="text-[11px] text-slate-400 hidden sm:block"><i class="fas fa-info-circle mr-1"></i> คลิกขวาหรือกดไอคอนตา <i class="fas fa-eye-slash"></i> เพื่อตัดช้อยส์</div>
        </div>

        <!-- Exam Content Layout Area -->
        <div id="examBodyLayout" class="grid grid-cols-1 md:grid-cols-12 gap-6 min-h-[70vh]">
            
            <!-- ฝั่งขวา (หรือซ้าย): PDF Viewer -->
            <div id="pdfViewerCol" class="md:col-span-7 bg-slate-800 rounded-3xl overflow-hidden shadow-inner border border-slate-700 flex flex-col">
                <div class="p-3 bg-slate-900 text-xs text-slate-300 font-bold flex justify-between items-center">
                    <span><i class="fas fa-file-pdf text-red-500 mr-1.5"></i> เอกสารโจทย์ข้อสอบ PDF</span>
                    <a id="pdfOpenExternal" href="#" target="_blank" class="text-sky-400 hover:underline text-[11px]"><i class="fas fa-external-link-alt"></i> เปิดหน้าต่างใหม่</a>
                </div>
                <iframe id="pdfFrame" class="w-full flex-1 min-h-[500px]" src="about:blank"></iframe>
            </div>

            <!-- ฝั่งกระดาษคำตอบ / โจทย์รายข้อ -->
            <div id="answerSheetCol" class="md:col-span-5 bg-white dark:bg-slate-800/90 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl flex flex-col justify-between space-y-6">
                <div id="questionsContainer" class="space-y-6 overflow-y-auto max-h-[65vh] pr-2"></div>

                <!-- Navigation Controls for Step Mode -->
                <div id="stepNavControls" class="hidden justify-between items-center pt-4 border-t border-slate-200 dark:border-slate-700">
                    <button onclick="prevStepQuestion()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 font-bold text-xs rounded-xl"><i class="fas fa-chevron-left mr-1"></i> ข้อก่อนหน้า</button>
                    <span id="stepQuestionIndicator" class="font-bold text-xs text-sky-500">ข้อ 1 / 20</span>
                    <button onclick="nextStepQuestion()" class="px-4 py-2 bg-sky-600 text-white font-bold text-xs rounded-xl">ข้อถัดไป <i class="fas fa-chevron-right ml-1"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        const isPreview = urlParams.get('preview') === 'true';

        let examData = null;
        let questionsList = [];
        let answersMap = {}; // { qId: choiceIdx }
        let flagsMap = {};   // { qId: boolean }
        let cutsMap = {};    // { qId_choiceIdx: boolean }

        let timerInterval = null;
        let totalSecondsLeft = 3600;
        let currentStepIdx = 0;
        let currentLayoutView = 'split';

        const storageKey = `exam_state_${examId}`;

        async function initExamPage() {
            // โหลด State เดิมจาก LocalStorage (ป้องกัน F5 ข้อมูลหาย)
            const savedState = localStorage.getItem(storageKey);
            if (savedState) {
                try {
                    const parsed = JSON.parse(savedState);
                    answersMap = parsed.answersMap || {};
                    flagsMap = parsed.flagsMap || {};
                    cutsMap = parsed.cutsMap || {};
                } catch(e) {}
            }

            const { data: exam } = await mySupabase.from('exams').select('*').eq('id', examId).single();
            if (!exam) { Swal.fire('ไม่พบข้อสอบ', '', 'error'); return; }
            examData = exam;

            document.getElementById('examTitle').textContent = exam.title;
            document.getElementById('examSub').textContent = `CODE: ${exam.exam_code || 'N/A'} | เวลา: ${exam.time_limit} นาที`;

            if (exam.pdf_url) {
                document.getElementById('pdfFrame').src = exam.pdf_url;
                document.getElementById('pdfOpenExternal').href = exam.pdf_url;
            } else {
                switchExamView('single'); // ถ้าไม่มี PDF บังคับสลับไปโจทย์ปกติ
            }

            const { data: questions } = await mySupabase.from('questions').select('*').eq('exam_id', examId).order('question_number', { ascending: true });
            questionsList = questions || [];

            totalSecondsLeft = (exam.time_limit || 60) * 60;
            startTimer();
            renderQuestions();
            updateProgress();
        }

        function saveStateToLocalStorage() {
            localStorage.setItem(storageKey, JSON.stringify({
                answersMap, flagsMap, cutsMap
            }));
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (totalSecondsLeft <= 0) {
                    clearInterval(timerInterval);
                    Swal.fire('หมดเวลาทำข้อสอบ!', 'ระบบจะทำการส่งคำตอบให้อัตโนมัติ', 'warning').then(() => submitExamData());
                    return;
                }
                totalSecondsLeft--;
                const h = Math.floor(totalSecondsLeft / 3600).toString().padStart(2, '0');
                const m = Math.floor((totalSecondsLeft % 3600) / 60).toString().padStart(2, '0');
                const s = (totalSecondsLeft % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `${h}:${m}:${s}`;
            }, 1000);
        }

        function switchExamView(view) {
            currentLayoutView = view;
            const pdfCol = document.getElementById('pdfViewerCol');
            const ansCol = document.getElementById('answerSheetCol');
            const stepNav = document.getElementById('stepNavControls');

            document.getElementById('btnViewSplit').className = view === 'split' ? 'px-3 py-1.5 rounded-xl font-bold bg-sky-600 text-white' : 'px-3 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200';
            document.getElementById('btnViewSingle').className = view === 'single' ? 'px-3 py-1.5 rounded-xl font-bold bg-sky-600 text-white' : 'px-3 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200';
            document.getElementById('btnViewStep').className = view === 'step' ? 'px-3 py-1.5 rounded-xl font-bold bg-sky-600 text-white' : 'px-3 py-1.5 rounded-xl font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200';

            if (view === 'split') {
                pdfCol.classList.remove('hidden');
                pdfCol.className = 'md:col-span-7 bg-slate-800 rounded-3xl overflow-hidden shadow-inner border border-slate-700 flex flex-col';
                ansCol.className = 'md:col-span-5 bg-white dark:bg-slate-800/90 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl flex flex-col justify-between space-y-6';
                stepNav.classList.add('hidden');
            } else if (view === 'single') {
                pdfCol.classList.add('hidden');
                ansCol.className = 'col-span-12 max-w-4xl mx-auto w-full bg-white dark:bg-slate-800/90 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-6';
                stepNav.classList.add('hidden');
            } else if (view === 'step') {
                pdfCol.classList.add('hidden');
                ansCol.className = 'col-span-12 max-w-3xl mx-auto w-full bg-white dark:bg-slate-800/90 p-8 rounded-3xl border border-slate-200 dark:border-slate-700 shadow-xl space-y-6';
                stepNav.classList.remove('hidden');
                stepNav.classList.add('flex');
            }

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            
            const listToRender = currentLayoutView === 'step' 
                ? [questionsList[currentStepIdx]] 
                : questionsList;

            if (currentLayoutView === 'step') {
                document.getElementById('stepQuestionIndicator').textContent = `ข้อ ${currentStepIdx + 1} / ${questionsList.length}`;
            }

            container.innerHTML = listToRender.map((q, idx) => {
                if (!q) return '';
                const qNum = q.question_number || (idx + 1);
                const isFlagged = flagsMap[q.id];
                const selectedChoice = answersMap[q.id];

                const choicesHtml = (q.options || []).map((opt, cIdx) => {
                    const isCut = cutsMap[`${q.id}_${cIdx}`];
                    const isSelected = String(selectedChoice) === String(cIdx);

                    return `
                        <div class="flex items-center justify-between p-3 rounded-2xl border transition-all ${isSelected ? 'bg-sky-50 dark:bg-sky-950/60 border-sky-500 font-bold' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'} ${isCut ? 'cut-through' : ''}">
                            <label class="flex items-center gap-3 cursor-pointer flex-1">
                                <input type="radio" name="q_${q.id}" value="${cIdx}" ${isSelected ? 'checked' : ''} onchange="selectAnswer('${q.id}', ${cIdx})" class="w-4 h-4 text-sky-600">
                                <span class="text-xs ${isCut ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200'}">${String.fromCharCode(65+cIdx)}. ${opt}</span>
                            </label>
                            <button onclick="toggleCutChoice('${q.id}', ${cIdx})" class="text-slate-400 hover:text-red-500 p-1 text-xs" title="ตัดช้อยส์">
                                <i class="fas ${isCut ? 'fa-eye text-sky-500' : 'fa-eye-slash'}"></i>
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <div id="q_card_${q.id}" class="p-5 rounded-2xl bg-white dark:bg-slate-800 border ${isFlagged ? 'border-amber-400 dark:border-amber-500 bg-amber-50/20' : 'border-slate-200 dark:border-slate-700'} space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-sm text-slate-900 dark:text-white">ข้อที่ ${qNum}: ${q.question_text || ''}</span>
                            <button onclick="toggleFlagQuestion('${q.id}')" class="px-2.5 py-1 rounded-xl text-xs font-bold ${isFlagged ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400 hover:text-amber-500'} transition-all">
                                <i class="fas fa-flag mr-1"></i> ${isFlagged ? 'ปักธงแล้ว' : 'ปักธง'}
                            </button>
                        </div>
                        <div class="space-y-2">${choicesHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function selectAnswer(qId, choiceIdx) {
            answersMap[qId] = choiceIdx;
            saveStateToLocalStorage();
            updateProgress();
        }

        function toggleFlagQuestion(qId) {
            flagsMap[qId] = !flagsMap[qId];
            saveStateToLocalStorage();
            renderQuestions();
        }

        function toggleCutChoice(qId, cIdx) {
            const key = `${qId}_${cIdx}`;
            cutsMap[key] = !cutsMap[key];
            saveStateToLocalStorage();
            renderQuestions();
        }

        function prevStepQuestion() {
            if (currentStepIdx > 0) { currentStepIdx--; renderQuestions(); }
        }

        function nextStepQuestion() {
            if (currentStepIdx < questionsList.length - 1) { currentStepIdx++; renderQuestions(); }
        }

        function updateProgress() {
            const doneCount = Object.keys(answersMap).length;
            const total = questionsList.length;
            const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

            document.getElementById('progressText').textContent = `${doneCount} / ${total} ข้อ (${pct}%)`;
            document.getElementById('progressBarLine').style.width = `${pct}%`;
        }

        // ระบบแจ้งเตือนตรวจสอบรอบแรกก่อนส่งข้อสอบจริง (พร้อมสรุปข้อที่ยังไม่ได้ทำและข้อที่ปักธงไว้)
        async function confirmSubmitExam() {
            const totalCount = questionsList.length;
            const unanswered = questionsList.filter(q => answersMap[q.id] === undefined);
            const flagged = questionsList.filter(q => flagsMap[q.id]);

            let alertHtml = '';

            if (unanswered.length > 0) {
                const unNumList = unanswered.map(q => `ข้อ ${q.question_number}`).join(', ');
                alertHtml += `
                    <div class="p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-xl text-left text-xs text-red-600 dark:text-red-300 space-y-1 mb-3">
                        <div class="font-bold"><i class="fas fa-exclamation-triangle mr-1"></i> คุณยังไม่ได้ตอบอีก ${unanswered.length} ข้อ:</div>
                        <div class="font-mono">${unNumList}</div>
                    </div>
                `;
            }

            if (flagged.length > 0) {
                const flagNumList = flagged.map(q => `ข้อ ${q.question_number}`).join(', ');
                alertHtml += `
                    <div class="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/50 rounded-xl text-left text-xs text-amber-600 dark:text-amber-300 space-y-1">
                        <div class="font-bold"><i class="fas fa-flag mr-1"></i> มีข้อที่ปักธงไว้ ${flagged.length} ข้อ:</div>
                        <div class="font-mono">${flagNumList}</div>
                    </div>
                `;
            }

            if (!alertHtml) {
                alertHtml = '<div class="text-emerald-500 font-bold text-sm py-2"><i class="fas fa-check-circle mr-1"></i> คุณทำข้อสอบครบถ้วนทุกข้อแล้ว!</div>';
            }

            const { isConfirmed } = await Swal.fire({
                title: 'ยืนยันการส่งข้อสอบ?',
                html: alertHtml,
                icon: unanswered.length > 0 ? 'warning' : 'question',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันส่งข้อสอบ',
                cancelButtonText: 'กลับไปตรวจทาน'
            });

            if (isConfirmed) {
                submitExamData();
            }
        }

        async function submitExamData() {
            clearInterval(timerInterval);
            if (isPreview) {
                Swal.fire('การ Preview เสร็จสมบูรณ์', 'ระบบทำงานเรียบร้อยแล้ว', 'success').then(() => window.close());
                return;
            }

            Swal.fire({ title: 'กำลังบันทึกและส่งข้อสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const { data: { session } } = await mySupabase.auth.getSession();
            if (session) {
                // คำนวณคะแนน
                let score = 0;
                questionsList.forEach(q => {
                    if (String(answersMap[q.id]) === String(q.correct_answer)) score++;
                });

                await mySupabase.from('exam_attempts').insert([{
                    exam_id: examId,
                    student_id: session.user.id,
                    score: score,
                    total_questions: questionsList.length,
                    answers: answersMap,
                    status: 'submitted'
                }]);

                // แจ้งเตือนครูหมวด ส่งข้อสอบ
                await mySupabase.from('notifications').insert([{
                    category: 'submission',
                    message: `นักเรียนส่งข้อสอบชุด "${examData.title}" คะแนนที่ได้: ${score}/${questionsList.length}`,
                    is_read: false
                }]);
            }

            // ล้าง LocalStorage หลังส่งสำเร็จ
            localStorage.removeItem(storageKey);

            Swal.fire({ icon: 'success', title: 'ส่งข้อสอบเรียบร้อยแล้ว!', timer: 1500, showConfirmButton: false }).then(() => {
                window.location.href = `exam_result.html?exam_id=${examId}`;
            });
        }

        initExamPage();
    </script>
</body>
</html>
