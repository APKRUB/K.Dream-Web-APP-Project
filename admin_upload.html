<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | จัดการชุดข้อสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#1d4ed8', secondary: '#3b82f6', lightbg: '#f8fafc', darkbg: '#0f172a', darkbox: '#1e293b' } } } }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 1); }
        .dark .glass-nav { background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid rgba(30, 41, 59, 1); }
        .kanban-col { min-height: 200px; transition: background 0.2s; }
        .kanban-col.drag-over { background: rgba(59, 130, 246, 0.05); border: 2px dashed #3b82f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-lightbg dark:bg-darkbg min-h-screen transition-colors duration-300">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-primary hover:text-white transition-all shadow-sm"><i class="fas fa-arrow-left"></i></button>
                    <span class="font-bold text-xl text-gray-800 dark:text-white"><i class="fas fa-layer-group text-primary mr-2"></i>จัดการชุดข้อสอบ</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-darkbox text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors shadow-sm"><i class="fas fa-moon" id="themeIcon"></i></button>
                    <button onclick="openManageCategoriesModal()" class="bg-white dark:bg-darkbox text-gray-700 dark:text-gray-200 border border-gray-200 dark:border-gray-700 px-4 py-2 rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2"><i class="fas fa-folder"></i> <span class="hidden md:inline">หมวดหมู่</span></button>
                    <button onclick="openCreateExamModal()" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md flex items-center gap-2"><i class="fas fa-plus"></i> <span class="hidden md:inline">สร้างข้อสอบ</span></button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16">
        <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white dark:bg-darkbox p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 border-l-4 border-l-primary">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">โครงสร้างและกระดาษคำตอบ</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">กำหนดโครงสร้าง พิมพ์โจทย์ และระบุเฉลย</p>
            </div>
            <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-gray-200 dark:border-gray-700">
                <button onclick="switchView('table')" id="btnViewTable" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-white dark:bg-slate-600 shadow-sm text-gray-800 dark:text-white"><i class="fas fa-list mr-1"></i> ตาราง</button>
                <button onclick="switchView('board')" id="btnViewBoard" class="px-4 py-1.5 rounded-md text-sm font-semibold text-gray-500 hover:text-gray-800 dark:text-gray-400"><i class="fas fa-columns mr-1"></i> บอร์ด</button>
            </div>
        </div>

        <div id="tableView" class="bg-white dark:bg-darkbox rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-50 dark:bg-slate-800/50 border-b border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 uppercase tracking-wider">
                            <th class="py-4 px-6">ID</th>
                            <th class="py-4 px-6">ชื่อชุดข้อสอบ</th>
                            <th class="py-4 px-6">รูปแบบ</th>
                            <th class="py-4 px-6 text-center">ปรนัย/อัตนัย</th>
                            <th class="py-4 px-6 text-center">สถานะ</th>
                            <th class="py-4 px-6 text-center">จัดการโจทย์/เฉลย</th>
                        </tr>
                    </thead>
                    <tbody id="examTableBody" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm"></tbody>
                </table>
            </div>
        </div>
        <div id="boardView" class="hidden flex gap-6 overflow-x-auto pb-4 items-start"></div>
    </main>

    <!-- Custom Modal: สร้าง/แก้ไข ชุดข้อสอบ -->
    <div id="customModalOverlay" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkbox rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-slate-50 dark:bg-slate-800/50 flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white"><i class="fas fa-file-alt text-primary mr-2"></i> ข้อมูลชุดข้อสอบ</h3>
                <button onclick="closeCustomModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto space-y-5">
                <input type="hidden" id="formExamId">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">ชื่อชุดข้อสอบ <span class="text-red-500">*</span></label>
                    <input type="text" id="formTitle" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">หมวดหมู่ <span class="text-red-500">*</span></label>
                        <select id="formCategory" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">เวลาทำ (นาที)</label>
                        <input type="number" id="formTime" value="60" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300">รูปแบบข้อสอบ <span class="text-red-500">*</span></label>
                    <select id="formType" onchange="toggleFormType()" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none font-semibold text-primary">
                        <option value="dynamic_text">✍️ พิมพ์โจทย์เองบนระบบ (สร้างคำถามทีละข้อ)</option>
                        <option value="pdf_only">📄 อัปโหลดไฟล์ PDF (ใช้ไฟล์เดียวสอบทั้งชุด)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300 text-blue-600 dark:text-blue-400">จำนวนข้อ ปรนัย</label>
                        <input type="number" id="formMcq" value="20" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700 dark:text-gray-300 text-sky-600 dark:text-sky-400">จำนวนข้อ อัตนัย</label>
                        <input type="number" id="formEssay" value="0" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:ring-2 focus:ring-primary outline-none">
                    </div>
                </div>
                <div id="formPdfWrapper" class="hidden">
                    <label class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300">ไฟล์โจทย์ (PDF)</label>
                    <input type="file" id="formPdf" accept="application/pdf" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-blue-50 file:text-primary">
                </div>
                <div class="grid grid-cols-2 gap-4 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-gray-200 dark:border-gray-700">
                    <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer text-gray-700 dark:text-white"><input type="checkbox" id="formPublish" class="w-4 h-4 text-primary rounded"> เผยแพร่นักเรียน</label>
                    <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer text-gray-700 dark:text-white"><input type="checkbox" id="formRanking" class="w-4 h-4 text-primary rounded"> โชว์ Ranking</label>
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3">
                <button onclick="closeCustomModal()" class="px-6 py-2 rounded-xl font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700">ยกเลิก</button>
                <button onclick="saveExamData()" class="bg-primary hover:bg-blue-800 text-white px-6 py-2 rounded-xl font-bold shadow-md">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal: Answer Key & Question Editor (อัปเกรดให้พิมพ์โจทย์ได้) -->
    <div id="answerKeyModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkbox rounded-2xl w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-gray-100 dark:border-gray-700 bg-blue-50 dark:bg-slate-800/80 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-xl font-bold text-primary dark:text-blue-400" id="akTitle"><i class="fas fa-edit mr-2"></i> จัดการโจทย์และเฉลย</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-400 mt-1" id="akSubtitle">ชุดข้อสอบ: ...</p>
                </div>
                <button onclick="closeAnswerKeyModal()" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="px-6 py-3 bg-slate-50 dark:bg-slate-800 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center shrink-0">
                <span class="text-sm font-semibold text-gray-700 dark:text-gray-300" id="akTypeIndicator">ประเภท: ...</span>
                <select id="mcqOptionsCount" onchange="renderAnswerKeyEditor()" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-slate-700 dark:text-white text-sm focus:ring-2 focus:ring-primary outline-none">
                    <option value="4">4 ตัวเลือก (ก, ข, ค, ง)</option>
                    <option value="5">5 ตัวเลือก (ก, ข, ค, ง, จ)</option>
                </select>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 bg-white dark:bg-darkbox">
                <div id="akContainer" class="flex flex-col gap-6">
                    <!-- Rendered by JS -->
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3 shrink-0">
                <button onclick="closeAnswerKeyModal()" class="px-6 py-2 rounded-xl font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-slate-700">ยกเลิก</button>
                <button onclick="saveAnswerKeys()" class="bg-primary hover:bg-blue-800 text-white px-8 py-2 rounded-xl font-bold shadow-md"><i class="fas fa-save mr-2"></i> บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriesCache = [];
        let examsCache = [];
        let currentView = 'table';
        let currentEditExam = null;

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') { htmlElement.classList.add('dark'); themeIcon.classList.replace('fa-moon', 'fa-sun'); }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.setItem('theme', htmlElement.classList.contains('dark') ? 'dark' : 'light');
            themeIcon.classList.replace(htmlElement.classList.contains('dark') ? 'fa-moon' : 'fa-sun', htmlElement.classList.contains('dark') ? 'fa-sun' : 'fa-moon');
        });

        async function initPage() {
            await loadCategoriesCache();
            await loadExams();
        }

        async function loadCategoriesCache() {
            const { data } = await mySupabase.from('categories').select('*').order('name');
            categoriesCache = data || [];
            document.getElementById('formCategory').innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>' + categoriesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        async function loadExams() {
            const { data } = await mySupabase.from('exams').select('*, categories(name)').order('created_at', { ascending: false });
            examsCache = data || [];
            renderExams();
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
            document.getElementById('boardView').style.display = view === 'board' ? 'flex' : 'none';
            document.getElementById('btnViewTable').className = `px-4 py-1.5 rounded-md text-sm font-semibold ${view === 'table' ? 'bg-white dark:bg-slate-600 shadow-sm text-gray-800 dark:text-white' : 'text-gray-500'}`;
            document.getElementById('btnViewBoard').className = `px-4 py-1.5 rounded-md text-sm font-semibold ${view === 'board' ? 'bg-white dark:bg-slate-600 shadow-sm text-gray-800 dark:text-white' : 'text-gray-500'}`;
            renderExams();
        }

        function renderExams() {
            if(currentView === 'table') {
                const tbody = document.getElementById('examTableBody');
                tbody.innerHTML = examsCache.map(ex => `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors dark:text-gray-300">
                        <td class="py-3 px-6 font-mono text-xs text-primary font-semibold">${ex.id.substring(0,6)}</td>
                        <td class="py-3 px-6 font-semibold">${ex.title}</td>
                        <td class="py-3 px-6 text-xs">${ex.exam_type === 'dynamic_text' ? '✍️ พิมพ์โจทย์เอง' : '📄 ไฟล์ PDF'}</td>
                        <td class="py-3 px-6 text-center text-xs">ปรนัย: ${ex.mcq_count||0} | อัตนัย: ${ex.essay_count||0}</td>
                        <td class="py-3 px-6 text-center text-xs">${ex.time_limit} น.<br>${ex.is_published ? '<span class="text-green-500">เผยแพร่</span>' : '<span class="text-gray-400">แบบร่าง</span>'}</td>
                        <td class="py-3 px-6 text-center flex justify-center gap-2 items-center">
                            <button onclick="openAnswerKeyModal('${ex.id}')" class="px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 dark:bg-blue-900/40 dark:text-blue-300 rounded-md text-xs font-bold shadow-sm"><i class="fas fa-edit mr-1"></i> จัดการโจทย์/เฉลย</button>
                            <button onclick="editExam('${ex.id}')" class="p-1.5 text-gray-400 hover:text-primary" title="ตั้งค่า"><i class="fas fa-cog"></i></button>
                            <button onclick="deleteExam('${ex.id}')" class="p-1.5 text-gray-400 hover:text-red-500" title="ลบ"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } else {
                const board = document.getElementById('boardView');
                const cols = [{id: null, name: 'ไม่ได้จัดหมวดหมู่'}, ...categoriesCache];
                board.innerHTML = cols.map(cat => {
                    const colExams = examsCache.filter(e => e.category_id === cat.id);
                    let cards = colExams.map(ex => `
                        <div class="bg-white dark:bg-darkbox p-4 rounded-xl shadow border border-gray-200 dark:border-gray-700 mb-3" draggable="true" ondragstart="drag(event, '${ex.id}')">
                            <h4 class="font-bold text-gray-800 dark:text-white text-sm mb-2">${ex.title}</h4>
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-xs text-gray-500"><i class="far fa-clock"></i> ${ex.time_limit} น.</span>
                                <button onclick="openAnswerKeyModal('${ex.id}')" class="text-primary font-semibold text-xs"><i class="fas fa-edit"></i> จัดการโจทย์</button>
                            </div>
                        </div>
                    `).join('');
                    return `<div class="kanban-col min-w-[280px] w-72 bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col" ondrop="drop(event, '${cat.id}')" ondragover="allowDrop(event)">
                        <h3 class="font-bold text-gray-700 dark:text-gray-200 text-sm mb-4">${cat.name} (${colExams.length})</h3>
                        <div class="flex-1">${cards}</div>
                    </div>`;
                }).join('');
            }
        }

        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
        function drag(ev, id) { ev.dataTransfer.setData("examId", id); }
        async function drop(ev, newCatId) {
            ev.preventDefault();
            document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
            const examId = ev.dataTransfer.getData("examId");
            const catValue = newCatId === 'null' ? null : newCatId;
            const exam = examsCache.find(e => e.id === examId);
            if(exam && exam.category_id !== catValue) {
                exam.category_id = catValue;
                renderExams();
                await mySupabase.from('exams').update({ category_id: catValue }).eq('id', examId);
            }
        }

        // ================= Form & Setup =================
        function toggleFormType() {
            document.getElementById('formPdfWrapper').style.display = document.getElementById('formType').value === 'pdf_only' ? 'block' : 'none';
        }
        function openCreateExamModal() {
            document.getElementById('formExamId').value = '';
            document.getElementById('formTitle').value = '';
            document.getElementById('formCategory').value = '';
            document.getElementById('formType').value = 'dynamic_text';
            toggleFormType();
            document.getElementById('customModalOverlay').classList.remove('hidden');
        }
        function editExam(id) {
            const ex = examsCache.find(e => e.id === id);
            document.getElementById('formExamId').value = ex.id;
            document.getElementById('formTitle').value = ex.title;
            document.getElementById('formCategory').value = ex.category_id || '';
            document.getElementById('formType').value = ex.exam_type || 'dynamic_text';
            document.getElementById('formMcq').value = ex.mcq_count || 0;
            document.getElementById('formEssay').value = ex.essay_count || 0;
            document.getElementById('formTime').value = ex.time_limit || 60;
            document.getElementById('formPublish').checked = ex.is_published;
            toggleFormType();
            document.getElementById('customModalOverlay').classList.remove('hidden');
        }
        function closeCustomModal() { document.getElementById('customModalOverlay').classList.add('hidden'); }
        
        async function saveExamData() {
            const id = document.getElementById('formExamId').value;
            const data = {
                title: document.getElementById('formTitle').value,
                category_id: document.getElementById('formCategory').value || null,
                exam_type: document.getElementById('formType').value,
                mcq_count: parseInt(document.getElementById('formMcq').value) || 0,
                essay_count: parseInt(document.getElementById('formEssay').value) || 0,
                time_limit: parseInt(document.getElementById('formTime').value) || 60,
                is_published: document.getElementById('formPublish').checked
            };
            if(!data.title) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาใส่ชื่อชุดข้อสอบ', 'warning');
            Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            if(data.exam_type === 'pdf_only') {
                const file = document.getElementById('formPdf').files[0];
                if(file) {
                    const fileName = `exam_${Date.now()}.pdf`;
                    await mySupabase.storage.from('lms_files').upload(fileName, file);
                    data.pdf_url = mySupabase.storage.from('lms_files').getPublicUrl(fileName).data.publicUrl;
                }
            }
            if(id) await mySupabase.from('exams').update(data).eq('id', id);
            else await mySupabase.from('exams').insert([data]);
            Swal.close(); closeCustomModal(); loadExams();
        }

        async function deleteExam(id) {
            const res = await Swal.fire({ title: 'ลบชุดข้อสอบนี้?', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) { await mySupabase.from('exams').delete().eq('id', id); loadExams(); }
        }

        // ================= Question Editor (ใหม่ล่าสุด พิมพ์โจทย์ได้) =================
        let tempAnswerKeys = [];
        
        async function openAnswerKeyModal(examId) {
            currentEditExam = examsCache.find(e => e.id === examId);
            document.getElementById('akSubtitle').innerText = `ชุด: ${currentEditExam.title}`;
            document.getElementById('akTypeIndicator').innerHTML = currentEditExam.exam_type === 'dynamic_text' ? '<i class="fas fa-keyboard text-primary mr-2"></i> โหมดสร้างโจทย์และคำตอบ' : '<i class="fas fa-file-pdf text-red-500 mr-2"></i> โหมดกระดาษคำตอบ PDF';
            
            const { data } = await mySupabase.from('answer_keys').select('*').eq('exam_id', examId).order('question_number');
            tempAnswerKeys = data || [];
            
            if(tempAnswerKeys.length === 0) {
                for(let i=1; i<=currentEditExam.mcq_count; i++) tempAnswerKeys.push({ exam_id: examId, question_number: i, question_type: 'mcq', correct_answer: '' });
                for(let i=1; i<=currentEditExam.essay_count; i++) tempAnswerKeys.push({ exam_id: examId, question_number: i, question_type: 'essay', requires_manual_grading: true });
            }
            
            renderAnswerKeyEditor();
            document.getElementById('answerKeyModal').classList.remove('hidden');
        }

        function closeAnswerKeyModal() { document.getElementById('answerKeyModal').classList.add('hidden'); }

        function updateKeyData(qNum, type, field, value) {
            let item = tempAnswerKeys.find(k => k.question_type === type && k.question_number === qNum);
            if(item) item[field] = value;
        }

        function renderAnswerKeyEditor() {
            const container = document.getElementById('akContainer');
            const optCount = parseInt(document.getElementById('mcqOptionsCount').value);
            const isDynamic = currentEditExam.exam_type === 'dynamic_text';
            let html = '';
            
            const mcqs = tempAnswerKeys.filter(k => k.question_type === 'mcq');
            if(mcqs.length > 0) {
                html += `<div class="mb-8"><h4 class="font-bold text-lg mb-4 text-primary border-b border-gray-200 pb-2">ปรนัย (MCQ)</h4><div class="grid grid-cols-1 ${isDynamic ? '' : 'lg:grid-cols-2'} gap-4">`;
                
                mcqs.forEach(m => {
                    if(isDynamic) {
                        // โหมดพิมพ์โจทย์
                        html += `
                        <div class="bg-gray-50 dark:bg-slate-800 border border-gray-200 dark:border-gray-700 p-5 rounded-xl">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-primary">ข้อที่ ${m.question_number}</span>
                                <span class="text-sm font-semibold text-gray-500">เฉลย: 
                                    <select onchange="updateKeyData(${m.question_number}, 'mcq', 'correct_answer', this.value)" class="ml-2 border rounded px-2 py-1 bg-white dark:bg-slate-700 outline-none text-primary font-bold">
                                        <option value="">เลือก</option>
                                        <option value="ก" ${m.correct_answer==='ก'?'selected':''}>ก</option>
                                        <option value="ข" ${m.correct_answer==='ข'?'selected':''}>ข</option>
                                        <option value="ค" ${m.correct_answer==='ค'?'selected':''}>ค</option>
                                        <option value="ง" ${m.correct_answer==='ง'?'selected':''}>ง</option>
                                        ${optCount===5 ? `<option value="จ" ${m.correct_answer==='จ'?'selected':''}>จ</option>` : ''}
                                    </select>
                                </span>
                            </div>
                            <textarea onchange="updateKeyData(${m.question_number}, 'mcq', 'question_text', this.value)" class="w-full p-3 border rounded-lg mb-3 dark:bg-slate-700 dark:border-gray-600 dark:text-white outline-none" rows="2" placeholder="พิมพ์โจทย์คำถาม...">${m.question_text||''}</textarea>
                            <div class="grid grid-cols-2 gap-2">
                                <div class="flex items-center gap-2"><span class="w-6 text-center font-bold text-gray-500">ก.</span> <input onchange="updateKeyData(${m.question_number}, 'mcq', 'option_a', this.value)" type="text" class="w-full p-2 border rounded outline-none dark:bg-slate-700" value="${m.option_a||''}"></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center font-bold text-gray-500">ข.</span> <input onchange="updateKeyData(${m.question_number}, 'mcq', 'option_b', this.value)" type="text" class="w-full p-2 border rounded outline-none dark:bg-slate-700" value="${m.option_b||''}"></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center font-bold text-gray-500">ค.</span> <input onchange="updateKeyData(${m.question_number}, 'mcq', 'option_c', this.value)" type="text" class="w-full p-2 border rounded outline-none dark:bg-slate-700" value="${m.option_c||''}"></div>
                                <div class="flex items-center gap-2"><span class="w-6 text-center font-bold text-gray-500">ง.</span> <input onchange="updateKeyData(${m.question_number}, 'mcq', 'option_d', this.value)" type="text" class="w-full p-2 border rounded outline-none dark:bg-slate-700" value="${m.option_d||''}"></div>
                                ${optCount === 5 ? `<div class="flex items-center gap-2"><span class="w-6 text-center font-bold text-gray-500">จ.</span> <input onchange="updateKeyData(${m.question_number}, 'mcq', 'option_e', this.value)" type="text" class="w-full p-2 border rounded outline-none dark:bg-slate-700" value="${m.option_e||''}"></div>` : ''}
                            </div>
                        </div>`;
                    } else {
                        // โหมด PDF (แบบเก่า)
                        const choices = optCount === 5 ? ['ก','ข','ค','ง','จ'] : ['ก','ข','ค','ง'];
                        let btnHtml = choices.map(ch => `
                            <button onclick="updateKeyData(${m.question_number}, 'mcq', 'correct_answer', '${ch}'); renderAnswerKeyEditor();" class="w-9 h-9 rounded-full border-2 text-sm font-bold transition-all shadow-sm ${m.correct_answer === ch ? 'bg-primary border-primary text-white scale-110' : 'bg-white border-gray-200 text-gray-500 hover:border-primary'}">${ch}</button>
                        `).join('');
                        html += `<div class="flex items-center gap-4 p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-gray-100 dark:border-gray-700"><span class="w-10 text-sm font-bold text-gray-700 dark:text-gray-200 text-right">ข้อ ${m.question_number}</span><div class="flex gap-2">${btnHtml}</div></div>`;
                    }
                });
                html += `</div></div>`;
            }

            const essays = tempAnswerKeys.filter(k => k.question_type === 'essay');
            if(essays.length > 0) {
                html += `<div><h4 class="font-bold text-lg mb-4 text-sky-600 border-b border-gray-200 pb-2">อัตนัย (พิมพ์ตอบ)</h4><div class="space-y-4">`;
                essays.forEach(e => {
                    if(isDynamic) {
                        html += `
                        <div class="p-5 bg-sky-50 dark:bg-slate-800 border border-sky-100 dark:border-gray-700 rounded-xl">
                            <span class="font-bold text-sky-800 dark:text-sky-400 mb-2 block">ข้อ ${e.question_number}</span>
                            <textarea onchange="updateKeyData(${e.question_number}, 'essay', 'question_text', this.value)" class="w-full p-3 border rounded-lg mb-2 dark:bg-slate-700 dark:text-white outline-none" rows="2" placeholder="พิมพ์โจทย์อัตนัย...">${e.question_text||''}</textarea>
                            <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300"><input type="checkbox" onchange="updateKeyData(${e.question_number}, 'essay', 'requires_manual_grading', this.checked)" ${e.requires_manual_grading ? 'checked' : ''} class="w-4 h-4 text-primary"> รอครูตรวจและให้คะแนนเอง</label>
                        </div>`;
                    } else {
                        html += `
                        <div class="p-4 bg-sky-50 dark:bg-slate-800 border border-sky-100 dark:border-gray-700 rounded-xl">
                            <span class="text-sm font-bold text-sky-800 dark:text-sky-300 mb-2 block">ข้อ ${e.question_number}</span>
                            <label class="flex items-center gap-2 text-sm"><input type="checkbox" onchange="updateKeyData(${e.question_number}, 'essay', 'requires_manual_grading', this.checked)" ${e.requires_manual_grading ? 'checked' : ''} class="w-4 h-4 text-primary"> รอครูตรวจ</label>
                        </div>`;
                    }
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        async function saveAnswerKeys() {
            Swal.fire({ title: 'กำลังบันทึกโจทย์และเฉลย...', didOpen: () => Swal.showLoading() });
            
            // อัปเดต options_count ให้ทุกข้อปรนัยก่อนเซฟ
            const optCount = parseInt(document.getElementById('mcqOptionsCount').value);
            tempAnswerKeys.forEach(k => { if(k.question_type === 'mcq') k.options_count = optCount; });

            await mySupabase.from('answer_keys').delete().eq('exam_id', currentEditExam.id);
            await mySupabase.from('answer_keys').insert(tempAnswerKeys);
            
            Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', timer: 1500, showConfirmButton: false });
            closeAnswerKeyModal();
        }

        initPage();
    </script>
</body>
</html>
