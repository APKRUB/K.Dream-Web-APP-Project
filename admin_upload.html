<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | Advanced Exam Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] }, colors: { primary: '#4f46e5', secondary: '#ec4899' } } }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(229, 231, 235, 1); }
        .dark .glass-nav { background: rgba(17, 24, 39, 0.85); border-bottom: 1px solid rgba(55, 65, 81, 1); }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .theme-accent { background: var(--accent-color, #4f46e5); }
        .text-accent { color: var(--accent-color, #4f46e5); }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300" style="--accent-color: #4f46e5;">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='admin.html'" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 hover:bg-primary hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <span class="font-bold text-xl text-gray-800 dark:text-white"><i class="fas fa-sliders-h text-accent mr-2"></i>Exam Studio & Management</span>
                </div>
                
                <!-- ตัวเลือกเปลี่ยนธีมสีประจำหน้า + 3 ปุ่มหลัก -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- Color Picker สำหรับปรับธีมสี -->
                    <div class="hidden sm:flex items-center gap-1 bg-white dark:bg-gray-800 px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700">
                        <span class="text-xs text-gray-400">ธีมสี:</span>
                        <input type="color" id="accentColorPicker" value="#4f46e5" onchange="changeAccentColor(this.value)" class="w-6 h-6 rounded cursor-pointer border-0 bg-transparent">
                    </div>

                    <button onclick="openCreateExamModal()" class="theme-accent hover:opacity-90 text-white px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm flex items-center gap-2">
                        <i class="fas fa-plus"></i> <span class="hidden md:inline">สร้างชุดข้อสอบ</span>
                    </button>
                    <button onclick="openCreateCategoryModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm flex items-center gap-2">
                        <i class="fas fa-folder-plus"></i> <span class="hidden md:inline">เพิ่มหมวดหมู่</span>
                    </button>
                    <button onclick="openManageCategoriesModal()" class="bg-gray-700 hover:bg-gray-800 text-white px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-colors shadow-sm flex items-center gap-2">
                        <i class="fas fa-cog"></i> <span class="hidden md:inline">จัดการหมวดหมู่</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 pb-16">
        
        <div class="mb-6 flex justify-between items-center bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">รายการชุดข้อสอบและโครงสร้าง</h1>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">จัดการข้อสอบ ระบุจำนวนข้อ ปรนัย/อัตนัย และรูปแบบกระดาษคำตอบ</p>
            </div>
            <button onclick="loadExams()" class="text-accent hover:underline text-sm font-semibold"><i class="fas fa-sync-alt mr-1"></i> รีเฟรช</button>
        </div>

        <!-- ตารางแสดงรายการชุดข้อสอบ -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-gray-900/50 border-b border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 uppercase tracking-wider">
                            <th class="py-4 px-6">รหัส (ID)</th>
                            <th class="py-4 px-6">ชื่อชุดข้อสอบ</th>
                            <th class="py-4 px-6">หมวดหมู่</th>
                            <th class="py-4 px-6 text-center">โครงสร้างข้อสอบ</th>
                            <th class="py-4 px-6 text-center">เวลา / สถานะ</th>
                            <th class="py-4 px-6 text-center">จัดการภายใน</th>
                        </tr>
                    </thead>
                    <tbody id="examTableBody" class="divide-y divide-gray-200 dark:divide-gray-700 text-sm text-gray-700 dark:text-gray-300">
                        <tr>
                            <td colspan="6" class="text-center py-10 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i> กำลังโหลดข้อมูล...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let categoriesCache = [];

        async function initPage() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            await loadCategoriesCache();
            loadExams();
        }

        // ระบบเปลี่ยนธีมสีประจำหน้า
        function changeAccentColor(color) {
            document.documentElement.style.setProperty('--accent-color', color);
            localStorage.setItem('admin_accent_color', color);
        }
        window.addEventListener('DOMContentLoaded', () => {
            const savedColor = localStorage.getItem('admin_accent_color');
            if(savedColor) {
                document.documentElement.style.setProperty('--accent-color', savedColor);
                document.getElementById('accentColorPicker').value = savedColor;
            }
        });

        async function loadCategoriesCache() {
            const { data } = await mySupabase.from('categories').select('*').order('name');
            categoriesCache = data || [];
        }

        // โหลดรายการชุดข้อสอบ
        async function loadExams() {
            await loadCategoriesCache();
            const { data: exams, error } = await mySupabase.from('exams').select('*, categories(name)').order('created_at', { ascending: true });
            
            const tbody = document.getElementById('examTableBody');
            if (error || !exams || exams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-gray-400">ยังไม่มีชุดข้อสอบในระบบ กดปุ่ม "สร้างชุดข้อสอบ" มุมขวาบนได้เลย</td></tr>`;
                return;
            }

            let html = '';
            exams.forEach((ex) => {
                const shortId = ex.id.substring(0, 8) + '...';
                let catOptions = categoriesCache.map(c => `<option value="${c.id}" ${c.id === ex.category_id ? 'selected' : ''}>${c.name}</option>`).join('');

                // รายละเอียดโครงสร้าง (ปรนัย/อัตนัย)
                const mcq = ex.mcq_count || 0;
                const essay = ex.essay_count || 0;

                html += `
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                        <td class="py-4 px-6 font-mono text-xs text-accent font-semibold">${shortId}</td>
                        <td class="py-4 px-6 font-semibold text-gray-800 dark:text-white">${ex.title}</td>
                        <td class="py-4 px-6">
                            <select onchange="updateExamCategory('${ex.id}', this.value)" class="bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-lg px-2 py-1 text-xs dark:text-white">
                                <option value="">-- ไม่มีหมวดหมู่ --</option>
                                ${catOptions}
                            </select>
                        </td>
                        <td class="py-4 px-6 text-center">
                            <span class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-full text-xs font-medium">ปรนัย: ${mcq} ข้อ</span>
                            <span class="bg-pink-50 dark:bg-pink-900/30 text-pink-600 dark:text-pink-400 px-2.5 py-1 rounded-full text-xs font-medium ml-1">อัตนัย: ${essay} ข้อ</span>
                        </td>
                        <td class="py-4 px-6 text-center">
                            <span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2.5 py-1 rounded text-xs">${ex.time_limit} นาที</span>
                        </td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex justify-center items-center gap-2">
                                <button onclick="openEditExamModal('${ex.id}', '${ex.title}', ${mcq}, ${essay}, ${ex.time_limit}, '${ex.exam_type}')" class="p-2 bg-yellow-50 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded-lg hover:bg-yellow-100 transition-colors" title="แก้ไขโครงสร้างภายใน"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteExam('${ex.id}', '${ex.title}')" class="p-2 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-lg hover:bg-red-100 transition-colors" title="ลบชุดข้อสอบ"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // ================= 3 ปุ่มหลักมุมขวาบน =================

        // 1. สร้างชุดข้อสอบใหม่ (ระบุจำนวนข้อ ปรนัย อัตนัย)
        async function openCreateExamModal() {
            await loadCategoriesCache();
            if(categoriesCache.length === 0) {
                return Swal.fire({ icon: 'warning', title: 'กรุณาสร้างหมวดหมู่ก่อนสร้างชุดข้อสอบ', confirmButtonColor: '#4f46e5' });
            }

            let catOptions = categoriesCache.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const { value: form } = await Swal.fire({
                title: '✨ สร้างชุดข้อสอบและกำหนดโครงสร้าง',
                html: `
                    <input id="swal-title" class="swal2-input !m-0 !w-full !text-base" placeholder="ชื่อชุดข้อสอบ">
                    <select id="swal-category" class="swal2-input !m-0 !mt-3 !w-full !text-base bg-white dark:bg-gray-800"><option value="">-- เลือกหมวดหมู่ --</option>${catOptions}</select>
                    <select id="swal-type" class="swal2-input !m-0 !mt-3 !w-full !text-base bg-white dark:bg-gray-800">
                        <option value="dynamic_text">✍️ พิมพ์โจทย์เองบนระบบ</option>
                        <option value="pdf_only">📄 อัปโหลดไฟล์ PDF (ระบุจำนวนข้อด้านล่าง)</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <input id="swal-mcq" type="number" class="swal2-input !m-0 !w-full !text-base" placeholder="จำนวนข้อปรนัย" value="10">
                        <input id="swal-essay" type="number" class="swal2-input !m-0 !w-full !text-base" placeholder="จำนวนข้ออัตนัย" value="0">
                    </div>
                    <input id="swal-time" type="number" class="swal2-input !m-0 !mt-3 !w-full !text-base" placeholder="เวลาทำข้อสอบ (นาที)" value="60">
                    <input id="swal-file" type="file" class="swal2-file !m-0 !mt-3 !w-full !text-base" accept="application/pdf">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'บันทึกสร้างข้อสอบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#4f46e5',
                preConfirm: () => ({
                    title: document.getElementById('swal-title').value,
                    categoryId: document.getElementById('swal-category').value,
                    type: document.getElementById('swal-type').value,
                    mcq: parseInt(document.getElementById('swal-mcq').value) || 0,
                    essay: parseInt(document.getElementById('swal-essay').value) || 0,
                    time: parseInt(document.getElementById('swal-time').value) || 60,
                    file: document.getElementById('swal-file').files[0]
                })
            });

            if (form) {
                if(!form.title || !form.categoryId) return Swal.fire('กรอกข้อมูลไม่ครบ', '', 'error');
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                let pdfUrl = null;
                if(form.type === 'pdf_only' && form.file) {
                    const fileName = `exam_${Date.now()}.pdf`;
                    await mySupabase.storage.from('lms_files').upload(fileName, form.file);
                    const { data } = mySupabase.storage.from('lms_files').getPublicUrl(fileName);
                    pdfUrl = data.publicUrl;
                }

                const { error } = await mySupabase.from('exams').insert([{
                    title: form.title, category_id: form.categoryId, exam_type: form.type,
                    mcq_count: form.mcq, essay_count: form.essay, time_limit: form.time, pdf_url: pdfUrl
                }]);

                if(!error) {
                    Swal.fire('สำเร็จ', 'สร้างชุดข้อสอบเรียบร้อยแล้ว', 'success');
                    loadExams();
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
                }
            }
        }

        // 2. เพิ่มหมวดหมู่ใหม่
        async function openCreateCategoryModal() {
            const { value: catName } = await Swal.fire({
                title: '📁 เพิ่มหมวดหมู่ใหม่',
                input: 'text',
                inputPlaceholder: 'เช่น คณิตศาสตร์ ม.3...',
                showCancelButton: true,
                confirmButtonText: 'สร้างหมวดหมู่',
                confirmButtonColor: '#059669'
            });
            if (catName) {
                await mySupabase.from('categories').insert([{ name: catName }]);
                Swal.fire({ icon: 'success', title: 'สร้างหมวดหมู่สำเร็จ', timer: 1500, showConfirmButton: false });
            }
        }

        // 3. จัดการหมวดหมู่ทั้งหมด
        async function openManageCategoriesModal() {
            await loadCategoriesCache();
            let htmlList = categoriesCache.map(c => `
                <div class="flex justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl mb-2">
                    <span class="font-semibold">${c.name}</span>
                    <div class="flex gap-2">
                        <button onclick="editCategoryName('${c.id}', '${c.name}')" class="px-2.5 py-1 bg-yellow-500 text-white rounded text-xs">แก้ไข</button>
                        <button onclick="deleteCategoryAdmin('${c.id}')" class="px-2.5 py-1 bg-red-500 text-white rounded text-xs">ลบ</button>
                    </div>
                </div>
            `).join('');

            Swal.fire({
                title: '⚙️ จัดการหมวดหมู่ทั้งหมด',
                html: `<div class="max-h-60 overflow-y-auto text-left">${htmlList || '<p class="text-center text-gray-400">ยังไม่มีหมวดหมู่</p>'}</div>`,
                confirmButtonText: 'ปิด',
                confirmButtonColor: '#4f46e5'
            });
        }

        // ================= ฟังก์ชันแก้ไขภายในชุดข้อสอบ =================
        async function openEditExamModal(examId, title, mcq, essay, time, type) {
            const { value: form } = await Swal.fire({
                title: '✏️ แก้ไขโครงสร้างชุดข้อสอบ',
                html: `
                    <input id="edit-title" class="swal2-input !m-0 !w-full !text-base" value="${title}">
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <input id="edit-mcq" type="number" class="swal2-input !m-0 !w-full !text-base" placeholder="ปรนัย" value="${mcq}">
                        <input id="edit-essay" type="number" class="swal2-input !m-0 !w-full !text-base" placeholder="อัตนัย" value="${essay}">
                    </div>
                    <input id="edit-time" type="number" class="swal2-input !m-0 !mt-3 !w-full !text-base" placeholder="เวลา (นาที)" value="${time}">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'บันทึกการแก้ไข',
                confirmButtonColor: '#4f46e5',
                preConfirm: () => ({
                    title: document.getElementById('edit-title').value,
                    mcq: parseInt(document.getElementById('edit-mcq').value) || 0,
                    essay: parseInt(document.getElementById('edit-essay').value) || 0,
                    time: parseInt(document.getElementById('edit-time').value) || 60
                })
            });

            if(form) {
                await mySupabase.from('exams').update({
                    title: form.title, mcq_count: form.mcq, essay_count: form.essay, time_limit: form.time
                }).eq('id', examId);
                Swal.fire({ icon: 'success', title: 'อัปเดตเรียบร้อย', timer: 1500, showConfirmButton: false });
                loadExams();
            }
        }

        async function updateExamCategory(examId, newCatId) {
            await mySupabase.from('exams').update({ category_id: newCatId || null }).eq('id', examId);
            Swal.fire({ icon: 'success', title: 'เปลี่ยนหมวดหมู่แล้ว', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
        }

        async function deleteExam(examId, title) {
            Swal.fire({ title: `ลบ "${title}"?`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444' }).then(async (res) => {
                if(res.isConfirmed) {
                    await mySupabase.from('exams').delete().eq('id', examId);
                    loadExams();
                }
            });
        }

        async function editCategoryName(catId, oldName) {
            const { value: newName } = await Swal.fire({ title: 'แก้ไขชื่อหมวดหมู่', input: 'text', inputValue: oldName, showCancelButton: true });
            if(newName) {
                await mySupabase.from('categories').update({ name: newName }).eq('id', catId);
                Swal.close();
                openManageCategoriesModal();
            }
        }

        async function deleteCategoryAdmin(catId) {
            const res = await Swal.fire({ title: 'ลบหมวดหมู่นี้?', icon: 'warning', showCancelButton: true });
            if(res.isConfirmed) {
                await mySupabase.from('categories').delete().eq('id', catId);
                Swal.close();
                openManageCategoriesModal();
            }
        }

        initPage();
    </script>
</body>
</html>
