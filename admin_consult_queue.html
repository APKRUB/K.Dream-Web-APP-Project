<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ตรวจสอบคิว Consult ประจำวัน (Daily Consult Queue)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 🔒 Security Guard: ตรวจสอบสิทธิ์ Admin หรือ Teacher -->
    <script>
        const SUPABASE_URL_CHECK = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY_CHECK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        
        (async function() {
            const tempClient = window.supabase.createClient(SUPABASE_URL_CHECK, SUPABASE_KEY_CHECK);
            const { data: { session } } = await tempClient.auth.getSession();
            if (!session) { window.location.replace('index.html'); return; }

            const { data: profile } = await tempClient.from('profiles').select('*').eq('id', session.user.id).single();
            const role = String(profile?.role || '').toLowerCase();
            const email = String(profile?.email || '').toLowerCase();
            if (!['admin', 'teacher', 'instructor'].includes(role) && !email.includes('admin') && !email.includes('teacher')) {
                alert('⚠️ พื้นที่นี้สำหรับผู้ดูแลระบบหรือคุณครูเท่านั้น!');
                window.location.replace('index.html');
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { 
            background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.3s ease; 
        }
        .dark .hitech-card { 
            background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); 
        }
        div:where(.swal2-container) { font-family: 'Prompt', sans-serif; }
        .dark .swal2-popup { background-color: #090d16 !important; color: #f8fafc !important; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-20">

    <!-- Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-3 sm:px-6">
            <div class="flex justify-between h-16 items-center gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:border-sky-500 transition-all" title="กลับหน้าแผงควบคุมหลัก">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <div class="min-w-0">
                        <h1 class="font-extrabold text-xs sm:text-base text-slate-900 dark:text-white leading-tight truncate">Daily Consult Queue</h1>
                        <span class="text-[9px] sm:text-[10px] text-sky-600 dark:text-sky-400 font-bold tracking-wider uppercase block truncate">ระบบตรวจสอบคิวปรึกษา (Realtime)</span>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 flex-shrink-0">
                    <button onclick="window.location.href='admin_consult.html'" class="px-3 py-1.5 bg-purple-600 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-500/30 hover:bg-purple-700 transition-all flex items-center gap-1.5">
                        <i class="fas fa-comments"></i> <span class="hidden sm:inline">จัดการคิวหลักทั้งหมด</span>
                    </button>
                    <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:border-sky-500 transition-all" title="สลับธีม">
                        <i class="fas fa-moon text-sm" id="themeIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-3 sm:px-6 pt-20 sm:pt-24 space-y-4 sm:space-y-6">
        
        <!-- Header Banner -->
        <div class="p-5 sm:p-8 rounded-2xl sm:rounded-3xl bg-gradient-to-r from-sky-500/10 via-blue-500/5 to-purple-500/10 border border-sky-500/30 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="space-y-1">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-500/10 text-sky-600 dark:text-sky-400 font-bold text-xs border border-sky-500/20">
                    <span class="w-2 h-2 rounded-full bg-sky-500 animate-ping"></span> Realtime Queue Monitor
                </div>
                <h2 class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white">ตรวจสอบคิว Consult ประจำวัน</h2>
                <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400">แสดงตาราง Slot เวลา 30 นาที เฉพาะช่องที่มีนักเรียนจองเข้ามาแล้ว อัปเดตอัตโนมัติแบบเรียลไทม์</p>
            </div>
            <!-- Date Switcher Buttons -->
            <div class="flex items-center gap-2 bg-white dark:bg-darkbox p-1.5 rounded-2xl border border-sky-500/20 shadow-sm shrink-0">
                <button onclick="changeActiveDate('today')" id="btnTabToday" class="px-3 sm:px-4 py-2 bg-sky-600 text-white rounded-xl font-bold text-xs shadow-md transition-all">วันนี้ (<span id="labelDateToday">--</span>)</button>
                <button onclick="changeActiveDate('tomorrow')" id="btnTabTomorrow" class="px-3 py-2 bg-transparent text-slate-600 dark:text-slate-400 rounded-xl font-bold text-xs transition-all">พรุ่งนี้ (<span id="labelDateTomorrow">--</span>)</button>
            </div>
        </div>

        <!-- Slot Queue Cards Container -->
        <div class="space-y-3" id="queueListContainer">
            <div class="text-center py-16 text-slate-400 font-bold">กำลังโหลดข้อมูลคิว Consult...</div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allConsultBookings = [];
        let profilesMap = {};
        let activeDateMode = 'today'; // 'today' หรือ 'tomorrow'

        // 🌗 ธีมมืด/สว่าง
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        // คำนวณวันที่ วันนี้ และ พรุ่งนี้
        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTomorrowStr = () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            return d.toISOString().split('T')[0];
        };

        document.getElementById('labelDateToday').textContent = getTodayStr();
        document.getElementById('labelDateTomorrow').textContent = getTomorrowStr();

        async function loadConsultQueueData() {
            try {
                // 1. โหลดรายชื่อ profiles มาทำ Map ชื่อนักเรียน
                const { data: profData } = await supabaseClient.from('profiles').select('id, full_name, name, username, email');
                if (profData) {
                    profData.forEach(p => {
                        profilesMap[p.id] = p.full_name || p.name || p.username || p.email || 'นักเรียน';
                    });
                }

                // 2. โหลดรายการจอง Consult (รองรับตาราง consult_bookings หรือ consultations)
                let { data, error } = await supabaseClient.from('consult_bookings').select('*').order('date', { ascending: true });
                if (error || !data) {
                    const altRes = await supabaseClient.from('consultations').select('*');
                    data = altRes.data || [];
                }
                allConsultBookings = data || [];
                renderQueueList();

            } catch (err) {
                console.error(err);
            }
        }

        function changeActiveDate(mode) {
            activeDateMode = mode;
            const isToday = mode === 'today';
            document.getElementById('btnTabToday').className = isToday ? 'px-3 sm:px-4 py-2 bg-sky-600 text-white rounded-xl font-bold text-xs shadow-md transition-all' : 'px-3 py-2 bg-transparent text-slate-600 dark:text-slate-400 rounded-xl font-bold text-xs transition-all';
            document.getElementById('btnTabTomorrow').className = !isToday ? 'px-3 py-2 bg-sky-600 text-white rounded-xl font-bold text-xs shadow-md transition-all' : 'px-3 py-2 bg-transparent text-slate-600 dark:text-slate-400 rounded-xl font-bold text-xs transition-all';
            renderQueueList();
        }

        function renderQueueList() {
            const container = document.getElementById('queueListContainer');
            const targetDateStr = activeDateMode === 'today' ? getTodayStr() : getTomorrowStr();

            // กรองเฉพาะวันที่เลือก และเฉพาะช่องที่มีการจองแล้ว
            const matchedBookings = allConsultBookings.filter(b => {
                const bDate = b.date || b.booking_date || '';
                return bDate.startsWith(targetDateStr);
            });

            if (matchedBookings.length === 0) {
                container.innerHTML = `
                    <div class="hitech-card p-12 rounded-2xl text-center space-y-3">
                        <div class="w-16 h-16 bg-sky-500/10 text-sky-500 rounded-2xl flex items-center justify-center mx-auto text-2xl">
                            <i class="fas fa-calendar-check"></i>
                        </div>
                        <h3 class="font-bold text-base text-slate-800 dark:text-slate-200">ยังไม่มีคิวจอง Consult สำหรับวันนี้</h3>
                        <p class="text-xs text-slate-400">ทุก Slot เวลาว่าง สามารถรอรับการจองจากนักเรียนได้ทันที</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = matchedBookings.map(b => {
                const studentName = profilesMap[b.student_id || b.user_id] || b.student_name || 'นักเรียน (ไม่พบข้อมูล)';
                const timeSlot = b.time_slot || b.time || b.slot || '00:00 - 00:30';
                const topic = b.topic || b.title || b.question || 'ปรึกษาทั่วไป / การบ้าน';
                const status = b.status || 'confirmed';
                const bookingId = b.id;

                let statusBadge = '<span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 font-bold text-[10px]">✅ ยืนยันแล้ว</span>';
                if (status === 'pending') {
                    statusBadge = '<span class="px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-600 font-bold text-[10px]">⏳ รอดำเนินการ</span>';
                } else if (status === 'completed') {
                    statusBadge = '<span class="px-2.5 py-1 rounded-full bg-sky-500/10 text-sky-600 font-bold text-[10px]">🎉 เสร็จสิ้นแล้ว</span>';
                }

                return `
                    <div class="hitech-card p-4 sm:p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-start sm:items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 text-white flex items-center justify-center text-lg font-bold shrink-0 shadow-md">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">${timeSlot} น. (ช่องละ 30 นาที)</span>
                                    ${statusBadge}
                                </div>
                                <div class="text-xs text-slate-600 dark:text-slate-300">
                                    ผู้จอง: <span class="font-bold text-sky-600 dark:text-sky-400">${studentName}</span>
                                </div>
                                <div class="text-[11px] text-slate-400">
                                    หัวข้อ: <span class="text-slate-700 dark:text-slate-300 font-semibold">${topic}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <button onclick="window.location.href='admin_consult.html'" class="px-4 py-2 bg-sky-50 dark:bg-sky-950/40 text-sky-600 dark:text-sky-400 border border-sky-200 dark:border-sky-900 rounded-xl font-bold text-xs hover:bg-sky-100 transition-all">
                                <i class="fas fa-arrow-right"></i> ไปหน้าจัดการหลัก
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 🌟 ตั้งค่า Realtime Subscription ซิงค์อัตโนมัติ
        function setupRealtimeSubscriptions() {
            supabaseClient
                .channel('admin-consult-queue-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'consult_bookings' }, () => {
                    loadConsultQueueData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'consultations' }, () => {
                    loadConsultQueueData();
                })
                .subscribe();
        }

        loadConsultQueueData();
        setupRealtimeSubscriptions();
    </script>
</body>
</html>
