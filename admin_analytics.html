<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <script src="lms_core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS | ศูนย์วิเคราะห์ผลคะแนนภาพรวม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        (function() {
            let hasSession = false;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
                    const val = localStorage.getItem(key);
                    if (val && val.includes('access_token')) { hasSession = true; break; }
                }
            }
            const fallbackId = localStorage.getItem('id') || localStorage.getItem('admin_id') || localStorage.getItem('user_id');
            if (!hasSession && !fallbackId) { window.location.replace('index.html'); }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#0284c7', darkbg: '#020617', darkbox: '#090d16', darkinput: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(186, 230, 253, 0.5); }
        .dark .glass-nav { background: rgba(2, 6, 23, 0.88); border-bottom: 1px solid rgba(30, 58, 138, 0.4); }
        .hitech-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(186, 230, 253, 0.8); box-shadow: 0 10px 30px -10px rgba(2, 132, 199, 0.08); transition: all 0.25s ease; }
        .dark .hitech-card { background: rgba(9, 13, 22, 0.95); border: 1px solid rgba(30, 58, 138, 0.5); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
        .exam-card-hover:hover { transform: translateY(-3px); border-color: rgba(2, 132, 199, 0.6); box-shadow: 0 15px 35px -10px rgba(2, 132, 199, 0.15); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg min-h-screen text-slate-900 dark:text-slate-100 pb-20">

    <nav class="glass-nav fixed w-full top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <button onclick="window.location.href='admin.html'" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800 hover:bg-sky-600 hover:text-white transition-all shadow-sm">
                        <i class="fas fa-arrow-left text-sm"></i>
                    </button>
                    <h1 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                        <span class="w-7 h-7 rounded-lg bg-gradient-to-r from-indigo-500 to-sky-500 text-white flex items-center justify-center text-xs shadow-md"><i class="fas fa-chart-pie"></i></span>
                        ศูนย์วิเคราะห์ผลคะแนนภาพรวม (Admin Dashboard)
                    </h1>
                </div>
                <button id="themeToggle" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-darkinput text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-800">
                    <i class="fas fa-moon text-sm" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 space-y-8">
        
        <!-- ส่วนที่ 1: ภาพรวมระดับระบบทั้งหมด (System-wide KPIs) -->
        <div class="space-y-4">
            <h2 class="font-extrabold text-sm text-slate-500 uppercase tracking-wider"><i class="fas fa-globe text-sky-500 mr-1"></i> ภาพรวมระบบ LMS ทั้งหมด</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="hitech-card p-5 rounded-2xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-sky-500/10 text-sky-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-file-alt"></i></div>
                    <div>
                        <span class="text-xs text-slate-400 font-bold block">ชุดข้อสอบทั้งหมด</span>
                        <span id="globalTotalExams" class="text-2xl font-extrabold text-slate-900 dark:text-white">0 ชุด</span>
                    </div>
                </div>
                <div class="hitech-card p-5 rounded-2xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-users"></i></div>
                    <div>
                        <span class="text-xs text-slate-400 font-bold block">จำนวนการส่งข้อสอบรวม</span>
                        <span id="globalTotalSubmissions" class="text-2xl font-extrabold text-indigo-600 dark:text-indigo-400">0 ครั้ง</span>
                    </div>
                </div>
                <div class="hitech-card p-5 rounded-2xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold text-xl"><i class="fas fa-chart-line"></i></div>
                    <div>
                        <span class="text-xs text-slate-400 font-bold block">คะแนนเฉลี่ยภาพรวม</span>
                        <span id="globalAvgScore" class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ส่วนที่ 2: รายการชุดข้อสอบแยกตามหมวดหมู่ (คลิกเพื่อเข้าไปดูสถิติรายข้อสอบ) -->
        <div class="space-y-4 pt-2">
            <div class="flex justify-between items-center">
                <h2 class="font-extrabold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fas fa-folder-open text-sky-500"></i> เลือกชุดข้อสอบเพื่อดูสถิติเชิงลึกรายบุคคล
                </h2>
                <span id="examCountBadge" class="text-xs text-slate-400 font-bold">0 ชุดข้อสอบ</span>
            </div>

            <div id="examsCatalogGroupContainer" class="space-y-6">
                <div class="hitech-card p-12 rounded-2xl text-center text-slate-400 text-xs">
                    <i class="fas fa-spinner fa-spin mr-2"></i> กำลังโหลดรายการชุดข้อสอบ...
                </div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://fvsofdlmpnoeeqcpioeu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2c29mZGxtcG5vZWVxY3Bpb2V1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4NjMwMjEsImV4cCI6MjEwNzQzOTAyMX0.U5nHS_fNHFlgR2rTSu0TrXVn_iIrEkvouHHD0zD4zaw';
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allExams = [];
        let categoriesMap = {};

        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }
        document.getElementById('themeToggle').addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            const isDark = htmlElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeIcon.classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
        });

        async function initDashboard() {
            // โหลดหมวดหมู่
            const { data: cats } = await mySupabase.from('exam_categories').select('*').order('name');
            if (cats) {
                cats.forEach(c => categoriesMap[c.id] = c.name);
            }

            // โหลดชุดข้อสอบ
            const { data: exams } = await mySupabase.from('exams').select('*').order('created_at', { ascending: false });
            allExams = exams || [];
            document.getElementById('globalTotalExams').textContent = `${allExams.length} ชุด`;
            document.getElementById('examCountBadge').textContent = `${allExams.length} ชุดข้อสอบ`;

            // โหลดสถิติรวมทั้งหมดจาก exam_attempts
            const { data: attempts } = await mySupabase.from('exam_attempts').select('score, total_score');
            if (attempts && attempts.length > 0) {
                document.getElementById('globalTotalSubmissions').textContent = `${attempts.length} ครั้ง`;
                const scores = attempts.map(a => a.total_score !== undefined ? a.total_score : (a.score || 0));
                const avg = (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
                document.getElementById('globalAvgScore').textContent = `${avg} คะแนน`;
            } else {
                document.getElementById('globalTotalSubmissions').textContent = `0 ครั้ง`;
                document.getElementById('globalAvgScore').textContent = `0 คะแนน`;
            }

            renderExamsCatalogByCategories();
        }

        function renderExamsCatalogByCategories() {
            const container = document.getElementById('examsCatalogGroupContainer');
            if (allExams.length === 0) {
                container.innerHTML = `<div class="hitech-card p-12 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีชุดข้อสอบในระบบ</div>`;
                return;
            }

            let grouped = {};
            allExams.forEach(exam => {
                const catId = exam.category_id || 'uncategorized';
                if (!grouped[catId]) grouped[catId] = [];
                grouped[catId].push(exam);
            });

            let html = '';
            for (const [catId, examsList] of Object.entries(grouped)) {
                const catName = categoriesMap[catId] || 'หมวดหมู่ทั่วไป';
                html += `
                    <div class="hitech-card p-5 rounded-2xl space-y-4">
                        <h3 class="font-extrabold text-sm text-slate-800 dark:text-white flex items-center gap-2 border-b border-slate-100 dark:border-slate-800 pb-2">
                            <i class="fas fa-folder text-sky-500"></i> ${catName} <span class="text-xs text-slate-400 font-normal">(${examsList.length} ชุด)</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                examsList.forEach(exam => {
                    html += `
                        <div onclick="window.location.href='admin_analytics_detail.html?exam_id=${exam.id}'" class="hitech-card exam-card-hover p-4 rounded-xl cursor-pointer flex flex-col justify-between space-y-3 border border-slate-200 dark:border-slate-800">
                            <div class="space-y-1">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-bold px-2 py-0.5 bg-sky-500/10 text-sky-600 rounded-md">${exam.exam_code || 'EXAM'}</span>
                                    <span class="text-[11px] text-slate-400"><i class="fas fa-clock mr-1"></i> ${exam.duration || 'ไม่จำกัด'} นาที</span>
                                </div>
                                <h4 class="font-extrabold text-sm text-slate-900 dark:text-white line-clamp-1">${exam.title}</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${exam.description || 'ไม่มีคำอธิบาย'}</p>
                            </div>
                            <div class="pt-2 border-t border-slate-100 dark:border-slate-800 flex justify-between items-center text-xs font-bold text-sky-600 dark:text-sky-400">
                                <span><i class="fas fa-chart-line mr-1"></i> ดูสถิติและคะแนนรายบุคคล</span>
                                <i class="fas fa-arrow-right"></i>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        initDashboard();
    </script>
</body>
</html>
